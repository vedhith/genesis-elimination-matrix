<style>
:root{
  --bg:#0E1116; --stone:#161A20; --stone-2:#1D2229; --edge:#2A3038; --edge-2:#3A424C;
  --ink:#ECE7DC; --muted:#8A929C; --ember:#E2A749; --ember-soft:rgba(226,167,73,.14);
  --green:#5CBF92; --red:#E07A6E; --violet:#A98CDD; --blue:#71A9E4;
  --f0:#5CBF92; --f1:#71A9E4; --f2:#8A929C; --fg:#A98CDD; --f3:#E2A749; --f4:#ECE7DC; --focus:#71A9E4;
  --surface:var(--stone); --line:var(--edge); --lamp:var(--ember); --row-hover:var(--stone-2);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c.drag{cursor:grabbing}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font:400 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--ember);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--edge-2);padding:2px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
.tag.dim{color:var(--muted)}
.tag.apex{color:var(--ink);font:italic 400 13px "Spectral",Georgia,serif;border-color:var(--edge)}
#ui{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;pointer-events:none}
#ui[hidden]{display:none}
#ui>*{pointer-events:auto}
#ui .ask{pointer-events:none}
#ui .ask .people{pointer-events:none}
.top{display:flex;align-items:center;gap:14px;padding:16px 18px}
.back{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:50%;color:var(--muted);font-size:18px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.back:hover{color:var(--ink);border-color:var(--edge-2)}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.back[hidden]{display:none}
.axis{font-size:13px;color:var(--muted)}
.axis b{font-weight:500;color:var(--ink)}
.steps{margin-left:auto;display:flex;gap:6px}
.steps i{width:6px;height:6px;border-radius:50%;border:1px solid var(--edge-2);display:block}
.steps i.on{background:var(--ember);border-color:var(--ember)}
.steps i.silent{border-style:dashed}
.top .live{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--edge);padding:5px 9px;border-radius:4px;white-space:nowrap}
.top .live:empty{display:none}
@media (max-width:640px){.top .live{margin-left:auto;font-size:11px}}
.ask{align-self:start;justify-self:center;text-align:center;max-width:min(760px,92vw);margin-top:1vh;padding:14px 22px 16px;pointer-events:none;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ask .q{font:italic 400 clamp(22px,3.4vw,36px)/1.28 "Spectral",Georgia,serif;margin:0;text-wrap:balance;color:var(--ink)}
.ask .gate-t{font:500 clamp(20px,3vw,30px)/1.25 "Spectral",Georgia,serif;margin:0 0 6px}
.ask .gate-p{font-size:15px;color:var(--ink);max-width:56ch;margin:0 auto;opacity:.92;text-shadow:0 2px 18px color-mix(in srgb,var(--surface) 92%,transparent)}
.ask .chip{margin:8px 0 0}
.ask .plain{font-size:14px;line-height:1.5;color:var(--muted);max-width:60ch;margin:8px auto 0}
.ask .src{font-size:11.5px;color:var(--muted);margin:6px 0 0;opacity:.8}
.ask .plain[hidden]{display:none}
.people{margin:10px auto 0;max-width:620px;text-align:left}
.people .pl{font-size:13px;color:var(--muted);margin:0 0 6px}
.people .pl b{color:var(--ink);font-weight:500}
.people .segs{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--stone-2);border:1px solid var(--edge)}
.people .segs i{display:block;height:100%;background:var(--edge-2);transition:width .5s}
.people .segs i.me{background:var(--ember)}
.people .segs i+i{border-left:1px solid var(--surface)}
.people .lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:12px;color:var(--muted)}
.people .lg b{font-weight:500;color:var(--ink)}
.people .lg .me b{color:var(--ember)}
.people[hidden]{display:none}
.land .people{margin-top:12px;pointer-events:auto;text-align:left}
.land .people .pl{font-size:12.5px}
.land .people .segs{height:8px}
ul.opts .p{font-size:13px;line-height:1.4;color:var(--muted)}
ul.opts .k{font:500 11px "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;justify-self:start}
ul.opts .k.yes{color:var(--green)}ul.opts .k.no{color:var(--muted)}
.land .where{font:500 clamp(22px,3.4vw,34px)/1.2 "Spectral",Georgia,serif;margin:0 0 6px}
.land .where i{font-style:normal;color:var(--muted);padding:0 8px}
.land .plain{font-size:14.5px;color:var(--muted);max-width:60ch;margin:6px auto 0}

.bottom{padding:0 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;justify-items:center;max-height:66vh;overflow:auto}
ul.opts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:min(1100px,96vw)}
ul.opts li{display:contents}
ul.opts button{all:unset;cursor:pointer;display:grid;gap:5px;min-width:200px;max-width:280px;flex:1 1 200px;padding:14px 16px 13px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--edge);border-radius:6px;transition:border-color .15s,transform .15s,background .15s;text-align:left}
ul.opts button:hover,ul.opts button.hot{border-color:var(--ember);background:var(--stone-2);transform:translateY(-2px)}
ul.opts button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
ul.opts button[disabled]{cursor:not-allowed;border-style:dashed;opacity:.5;transform:none}
ul.opts button[aria-pressed="true"]{border-color:var(--ember);background:var(--ember-soft)}
ul.opts .t{font:500 17px/1.25 "Spectral",Georgia,serif;color:var(--ink);text-wrap:balance}
ul.opts .s{font-size:12.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
ul.opts button:hover .s,ul.opts button:focus-visible .s,body.help ul.opts .s{-webkit-line-clamp:12}
ul.opts .code{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);justify-self:start}
ul.opts button[aria-pressed="true"] .code,ul.opts button:hover .code{color:var(--ember)}
.aux{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 18px;align-items:center;font-size:13px;color:var(--muted)}
.aux button:not(.btn),.aux a{all:unset;cursor:pointer;color:var(--muted);border-bottom:1px solid var(--edge);padding-bottom:1px}
.aux button:not(.btn):hover,.aux a:hover{color:var(--ink);border-bottom-color:var(--ember)}
.aux button:focus-visible,.aux a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ember);padding:9px 16px;border:1px solid var(--ember);border-radius:999px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.btn:hover{background:var(--ember-soft)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.quiet{color:var(--muted);border-color:var(--edge)}
.btn.quiet:hover{color:var(--ink);border-color:var(--edge-2);background:var(--stone-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em;padding:6px 10px;border-radius:999px;border:1px solid var(--edge);white-space:nowrap;vertical-align:middle;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.chip b{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.F0{color:var(--f0)}.chip.F1{color:var(--f1)}.chip.F2{color:var(--f2)}.chip.FG{color:var(--fg)}.chip.F3{color:var(--f3)}.chip.F4{color:var(--f4)}
.chip.gate,.chip.L{color:var(--ink)}
.chip.L0{color:var(--green)}.chip.L1,.chip.L2{color:var(--ember)}.chip.L3{color:var(--violet)}.chip.L4{color:var(--red)}
.chip.inv{color:var(--red)}
#result{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;pointer-events:none}
#result[hidden]{display:none}
#result>*{pointer-events:auto}
.land{justify-self:center;text-align:center;margin-top:2vh;padding:14px 26px 16px;max-width:min(900px,94vw);max-height:56vh;overflow:auto;pointer-events:auto;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.land .eyebrow{font-size:13px;color:var(--muted);margin:0 0 8px}
.land .addr{font:clamp(20px,3.6vw,40px)/1.25 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink);text-shadow:0 2px 24px color-mix(in srgb,var(--surface) 92%,transparent);word-break:break-word;margin:0;background:none;border:0;padding:0}
.land .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 0;pointer-events:auto}
.names{align-self:end;justify-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:min(900px,94vw);max-height:34vh;overflow:auto;padding:0 18px 12px}
.names span{font:400 15px/1 "Spectral",Georgia,serif;color:var(--ink);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--edge);padding:9px 13px;border-radius:999px}
.names span.exact{border-color:var(--ember);color:var(--ember)}
.names span.diff{color:var(--muted)}
.names .lead{font:400 13px "IBM Plex Sans",sans-serif;color:var(--muted);background:color-mix(in srgb,var(--surface) 86%,transparent);border:0;border-radius:6px;padding:6px 10px;flex-basis:auto;width:100%;text-align:center}
.land-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
#drawer{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 97%,transparent);overflow:auto;z-index:20}
#drawer[hidden]{display:none}
#drawer .wrap{max-width:760px;margin:0 auto;padding:22px 20px 96px}
#drawer .bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:8px 0 12px;background:color-mix(in srgb,var(--bg) 97%,transparent);z-index:1}
#drawer .bar .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--edge)}
.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ember)}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:3px}
h1{font:500 clamp(24px,4vw,32px)/1.15 "Spectral",Georgia,serif;margin:14px 0 10px;text-wrap:balance}
h2{font:500 21px/1.2 "Spectral",Georgia,serif;margin:32px 0 10px;padding-top:14px;border-top:1px solid var(--edge)}
h3{font:500 17px/1.25 "Spectral",Georgia,serif;margin:18px 0 6px}
a{color:var(--ember);text-decoration:none;border-bottom:1px solid rgba(226,167,73,.4)}
a:hover{border-bottom-color:var(--ember)}
.d{max-width:64ch;margin:0 0 12px;line-height:1.6}
.muted{color:var(--muted)}.small{font-size:13.5px}
.addr{font:15px/1.5 "IBM Plex Mono",ui-monospace,monospace;color:var(--ink);background:var(--stone);border:1px solid var(--edge);padding:10px 12px;border-radius:4px}
.gate{border-left:2px solid var(--violet);padding:4px 0 4px 16px;margin:0 0 16px}
.gate .t{font:500 17px/1.25 "Spectral",Georgia,serif;margin:0 0 4px}
.gate .t .chip{margin-left:8px}
.gate p{margin:0 0 6px;max-width:60ch;font-size:14.5px;line-height:1.55}
.gate .src{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.gate .src a{color:inherit;border:0}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:10px 0;border-bottom:1px solid var(--edge);display:grid;grid-template-columns:1fr auto;gap:3px 14px;align-items:start}
ul.list li .n{font:500 16px/1.3 "Spectral",Georgia,serif}
ul.list li .m{font-size:13px;color:var(--muted);max-width:60ch;grid-column:1;line-height:1.5}
ul.list li .a{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);white-space:nowrap;grid-column:2;grid-row:1/3;align-self:center;text-align:right}
ul.list li .m .diff{color:var(--ember)}
ul.list button.link{all:unset;cursor:pointer;color:var(--ember);font-size:13px;border-bottom:1px solid transparent}
ul.list button.link:hover{border-bottom-color:var(--ember)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 8px}
th,td{text-align:left;vertical-align:top;padding:8px 10px 8px 0;border-bottom:1px solid var(--edge)}
th{font:500 12px "IBM Plex Sans",sans-serif;color:var(--muted)}
td.id{font:12.5px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.tscroll{overflow-x:auto}
details{border-top:1px solid var(--edge);padding:10px 0}
details summary{cursor:pointer;font:500 16px/1.3 "Spectral",Georgia,serif;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"+";color:var(--muted);font:400 20px "IBM Plex Sans",sans-serif}
details[open] summary::after{content:"−"}
details .body{padding:8px 0 4px;max-width:64ch;font-size:14.5px;line-height:1.55}
input[type=search],select{font:15px "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--stone);border:1px solid var(--edge);border-radius:6px;padding:9px 12px;width:100%;max-width:420px}
input[type=search]:focus,select:focus{outline:2px solid var(--focus);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
@media (max-width:640px){
  ul.opts{gap:8px}
  ul.opts button{min-width:0;flex:1 1 calc(50% - 8px);max-width:none;padding:10px 12px 9px}
  .ask{padding:10px 14px 12px}
  .ask .q{font-size:20px}
  body:not(.help) .ask .plain,body:not(.help) .ask .src,.ask .people{display:none}
  body:not(.help) ul.opts .s{-webkit-line-clamp:2;font-size:12px}
  ul.opts .t{font-size:15.5px}
  .ask{padding-top:1vh}
  .steps{display:none}
  ul.list li{grid-template-columns:1fr}ul.list li .a{grid-column:1;grid-row:auto;text-align:left;white-space:normal}
}
@media (prefers-reduced-motion:reduce){ul.opts button{transition:none}}
</style>

<script>
const MATRIX={"toNyn":"2026-09-04","axes":{"A":{"letter":"A","name":"Is there a terminal ground?","doc":"02-genesis.md","values":[{"code":"A1","value":"Terminal, necessary","meaning":"The chain stops at something that could not have failed to exist.","examples":"Classical theism (Aquinas); Spinoza's substance; Platonism about mathematics; Leibniz's principle of sufficient reason.","extra":{}},{"code":"A2","value":"Terminal, brute","meaning":"The chain stops at something that simply is, with no reason.","examples":"Russell (\"the universe is just there, and that's all\"); Hume; most default physicalism.","extra":{}},{"code":"A3","value":"No terminal","meaning":"The chain never stops: infinite regress, or a loop.","examples":"Infinite nested simulations (the owner's Infinite Box Cascade run forever); cyclic cosmologies; Buddhist dependent origination read cosmologically; Hegel's self-grounding Absolute read as a loop.","extra":{}}]},"B":{"letter":"B","name":"Is the ground graspable?","doc":"02-genesis.md","values":[{"code":"B1","value":"Graspable in principle","meaning":"Statable in mathematics, physics, or reasoning we have, whether or not we can test it yet.","examples":"Physicalism; mathematical universe; simulation hypothesis; most theisms that ascribe properties to God.","extra":{}},{"code":"B2a","value":"Graspable by some mind, not ours","meaning":"Describable in a logic that a differently built mind could hold, but closed to human cognition.","examples":"McGinn's cognitive closure; Chomsky's \"mysteries\"; the owner's Fog Front in its position-relative sense.","extra":{}},{"code":"B2b","value":"Ungraspable by any mind","meaning":"Not describable in any logic at all.","examples":"Apophatic theology (Pseudo-Dionysius); Neoplatonic One beyond being; Nirguna Brahman; the Dao that cannot be spoken; Kant's noumenon in its strongest reading; the owner's Un-Concept in its strongest sense.","extra":{}}]},"D":{"letter":"D","name":"Was our layer authored?","doc":"02-genesis.md","values":[{"code":"D1a","value":"Authored by an agent in a higher layer","meaning":"A being inside a larger physical reality made ours.","examples":"Simulation hypothesis (Bostrom); the owner's Sandbox / Architect; Gnostic demiurge; Plato's Timaeus craftsman.","extra":{}},{"code":"D1b","value":"Authored by an agent identical to the ground","meaning":"The terminal ground is itself a mind that willed our layer.","examples":"Classical theism; Berkeley's idealism; Kastrup's analytic idealism read theistically.","extra":{}},{"code":"D1c","value":"Authored by us","meaning":"The observers inside the layer are, collectively or ultimately, its authors.","examples":"Wheeler's participatory universe; some readings of Advaita (Brahman = Atman); self-simulation hypotheses.","extra":{}},{"code":"D2a","value":"Unauthored, necessary","meaning":"Our layer had to exist as it is.","examples":"Necessitarianism; Spinoza; some block-universe readings; Tegmark's mathematical universe (all consistent structures exist).","extra":{}},{"code":"D2b","value":"Unauthored, brute","meaning":"Our layer just exists, no reason.","examples":"Default physicalism; Russell.","extra":{}},{"code":"D2c","value":"Unauthored, selected","meaning":"Our layer is one of many, and we find ourselves in this one for anthropic or evolutionary reasons.","examples":"Multiverse plus anthropic principle; Smolin's cosmological natural selection; eternal inflation; the owner's \"multi-universal evolution.\"","extra":{}}]},"C":{"letter":"C","name":"What kind of thing is fundamental?","doc":"03-substrate.md","values":[{"code":"C1","value":"Experiential","meaning":"The ground is mind-like. Matter is what mind looks like from outside, or is a pattern in mind.","examples":"Idealism (Berkeley, Kastrup); cosmopsychism (Goff, Shani); Advaita Vedanta; Yogācāra Buddhism; the owner's \"feeling is the very thing from the start\" (Turn 7).","extra":{}},{"code":"C2","value":"Concrete non-experiential","meaning":"The ground is physical: particles, fields, spacetime, or whatever physics bottoms out in. Experience is derived or illusory.","examples":"Physicalism; materialism; the owner's Clutter / AI pillar.","extra":{}},{"code":"C3","value":"Abstract","meaning":"The ground is mathematical or informational structure. Physical stuff is what structure looks like when instantiated, or structure is all there is.","examples":"Tegmark's mathematical universe; Wheeler's \"it from bit\"; digital physics (Zuse, Fredkin); ontic structural realism (Ladyman); the owner's Universe Code pillar.","extra":{}},{"code":"C4","value":"Neutral","meaning":"The ground is neither mental nor physical but gives rise to both.","examples":"Neutral monism (Russell, James, Mach); dual-aspect monism (Spinoza on one reading; Pauli–Jung); Russellian monism (which is sometimes filed as C1).","extra":{}},{"code":"C5","value":"Plural","meaning":"More than one fundamental kind, irreducible to each other.","examples":"Substance dualism (Descartes); property dualism (Chalmers); Samkhya's Purusha and Prakriti; Cartesian interactionism.","extra":{}}]},"S":{"letter":"S","name":"What is the author's stance toward us?","doc":"05-authorship.md","values":[{"code":"S0","value":"Indifferent","meaning":"Has no attitude toward inhabitants; we are side effects or data.","examples":"Bostrom's ancestor simulations run for research; the owner's \"indifferent engineer watching data points\"; Epicurean gods; deism.","extra":{}},{"code":"S+","value":"Benevolent","meaning":"Wants inhabitants' good, as inhabitants would understand good.","examples":"Classical theism (omnibenevolence); Bahá'í; most Abrahamic mainstream.","extra":{}},{"code":"S−","value":"Malevolent","meaning":"Wants inhabitants' harm.","examples":"Gnostic demiurge (in some readings); Descartes' evil demon as hypothesis; \"dystheism.\"","extra":{}},{"code":"S±","value":"Mixed or alien values","meaning":"Has attitudes, but they do not map onto human good and evil.","examples":"The owner's Architect in Turn 12 (\"emotion or something similar ... not rooted in survival so don't see evil good ... the same way\"); Lovecraftian cosmicism; the Hebrew Bible's God on some critical readings; Hindu deities with both creative and destructive aspects.","extra":{}},{"code":"S?","value":"Unknown or unassertable","meaning":"We cannot determine the stance, or (under B2b) no stance can be asserted.","examples":"Negative theology; Job's conclusion; agnostic theism.","extra":{}}]},"M":{"letter":"M","name":"Are there moral facts?","doc":"06-morality.md","values":[{"code":"M1a","value":"Realism, ground-based","meaning":"Moral facts are grounded in the nature or will of the terminal ground.","examples":"Divine command theory; natural law (Aquinas); Platonic Form of the Good; Dharma as cosmic order.","extra":{}},{"code":"M1b","value":"Realism, naturalist","meaning":"Moral facts are natural facts (about welfare, flourishing, cooperation), discoverable empirically.","examples":"Cornell realism (Boyd, Sturgeon); Railton; Aristotle on one reading; Harris's Moral Landscape.","extra":{}},{"code":"M1c","value":"Realism, non-naturalist","meaning":"Moral facts are real, mind-independent, but not natural or supernatural; known by intuition or reason.","examples":"Moore; Parfit (On What Matters); Enoch; Huemer.","extra":{}},{"code":"M2a","value":"Anti-realism, error theory","meaning":"Moral claims aim at facts and all are false.","examples":"Mackie (1977); Joyce.","extra":{}},{"code":"M2b","value":"Anti-realism, expressivism","meaning":"Moral claims do not aim at facts; they express attitudes.","examples":"Ayer; Blackburn; Gibbard.","extra":{}},{"code":"M2c","value":"Anti-realism, constructivism","meaning":"Moral facts exist but are constructed by agents' rational or contractual activity.","examples":"Kant (on one reading); Rawls; Korsgaard; Scanlon.","extra":{}},{"code":"M2d","value":"Anti-realism, relativism","meaning":"Moral truth is relative to a culture or framework.","examples":"Harman; Wong; folk relativism.","extra":{}}]},"N":{"letter":"N","name":"What makes acts right?","doc":"06-morality.md","values":[{"code":"N1","value":"Consequentialist","meaning":"Outcomes.","examples":"Utilitarianism (Bentham, Mill, Singer); effective altruism; negative utilitarianism.","extra":{}},{"code":"N2","value":"Deontological","meaning":"Duties, rules, rights.","examples":"Kant; Ross; rights theories (Nozick).","extra":{}},{"code":"N3","value":"Virtue","meaning":"Character and flourishing.","examples":"Aristotle; Confucius; MacIntyre; Stoicism.","extra":{}},{"code":"N4","value":"Contractarian","meaning":"What rational agents would agree to.","examples":"Hobbes; Rawls; Gauthier; Scanlon.","extra":{}},{"code":"N5","value":"Care and particularist","meaning":"Relationships and situated response.","examples":"Noddings; Held; Dancy.","extra":{}},{"code":"N6","value":"Divine command","meaning":"The will of the author or ground.","examples":"Ockham; Adams; Ash'arite theology.","extra":{}}]},"R":{"letter":"R","name":"How does human morality relate to the apex?","doc":"15-morality-and-the-apex.md","values":[{"code":"R1","value":"Aligned","meaning":"H tracks G. Human good is real good.","examples":"Plotinus, Aquinas, Spinoza (convertibility); natural law; Confucian tian; Stoic logos; the owner's first reading","extra":{"What would favor it":"Cross-cultural convergence of moral intuitions; moral progress as discovery (Singer's expanding circle, Parfit's \"climbing the same mountain\")"},"favoredBy":"Cross-cultural convergence of moral intuitions; moral progress as discovery (Singer's expanding circle, Parfit's \"climbing the same mountain\")"},{"code":"R2","value":"Inverted","meaning":"H is anti-aligned. What we call evil is what the ground favors or is.","examples":"Gnosticism (the world-maker is evil, so worldly morality is his); Nietzsche's revaluation (slave morality inverts the noble); de Sade; dystheism; \"nature is red in tooth and claw, and nature is the truth\"","extra":{"What would favor it":"Systematic anti-correlation between what flourishes in reality and what we call good; a maker shown to prefer suffering"},"favoredBy":"Systematic anti-correlation between what flourishes in reality and what we call good; a maker shown to prefer suffering"},{"code":"R3","value":"Orthogonal","meaning":"G has no value dimension. H is local: evolved, constructed, or both.","examples":"Physicalism plus evolutionary debunking (Street, Joyce); Hume; expressivism; constructivism; Camus","extra":{"What would favor it":"A complete physics with no value term; moral sense fully explained by selection with no residue"},"favoredBy":"A complete physics with no value term; moral sense fully explained by selection with no residue"},{"code":"R4","value":"Partial","meaning":"H tracks G through a distorting lens. Some of our good is real, some is noise.","examples":"Plato's shadows; Christian \"fallen but capable\"; Kant's moral law within vs. inclination; Buddhist ignorance obscuring dharma; the owner's \"not rooted in survival\" Architect seen from below","extra":{"What would favor it":"Partial convergence plus stable disagreement; moral progress that revises earlier certainties"},"favoredBy":"Partial convergence plus stable disagreement; moral progress that revises earlier certainties"},{"code":"R5","value":"Unstatable","meaning":"Under B2b no relation can be asserted. H may be anything; the apex says nothing about it.","examples":"Apophatic traditions; Job; the matrix's own Gate 2","extra":{"What would favor it":"Follows directly from placing the ground at B2b"},"favoredBy":"Follows directly from placing the ground at B2b"}]},"F":{"letter":"F","name":"How knowable is the claim, from here?","doc":"07-fog-front.md","values":[{"code":"F0","value":"Settled","meaning":"Already tested, result in hand.","examples":"fMRI decodes gist, not verbatim; glia ≈ neurons; no Planck-scale pixelation found at current sensitivity.","extra":{}},{"code":"F1","value":"Testable with foreseeable technology","meaning":"Inside K(p_now), not yet in K_now.","examples":"Which correlates track reported experience (GWT vs IIT); whether whole-brain emulation reproduces behavior; lattice gauge theory on quantum computers.","extra":{}},{"code":"F2","value":"Knowable in principle, no known test","meaning":"Inside K(p_now) but no experiment designed.","examples":"Whether spacetime is emergent from entanglement in our (de Sitter) universe; whether there is a Layer 2 author.","extra":{}},{"code":"FG","value":"Provably undecidable within our formal systems","meaning":"Inside our logic, outside K(p) for any p using the same logic.","examples":"Gödel sentences; the halting problem; Chaitin's Ω digits beyond a point.","extra":{}},{"code":"F3","value":"Closed to our position, open to some possible position","meaning":"B2a.","examples":"Whether other systems have experience (Axiom 6), if a mind with direct access is coherent; the nature of Layer 3 and above.","extra":{}},{"code":"F4","value":"Closed to every position","meaning":"B2b.","examples":"The Un-Concept proper. By definition, nothing can be listed here except the label.","extra":{}}]}},"mindFamilies":[{"code":"C2-i","family":"Illusionism / eliminativism","experience":"There is no experience as introspection presents it; the appearance of it is a cognitive illusion.","weAre":"Physical systems that misrepresent their own processing.","hardProblem":"(c) not real","theories":"Dennett; Frankish; Graziano's attention schema theory (partly)."},{"code":"C2-f","family":"Functionalism / computationalism","experience":"Experience is a functional or computational property; anything with the right organization has it.","weAre":"Patterns of information processing, substrate-independent.","hardProblem":"(a) real, solvable","theories":"Global Workspace Theory (Baars, Dehaene); Higher-Order Thought (Rosenthal); Attention Schema (Graziano); predictive processing accounts (Seth, Clark); the owner's \"we are the information the neuron holds.\""},{"code":"C2-b","family":"Biological naturalism","experience":"Experience is a property of specific physical (biological or causal-structural) organization, not of computation as such.","weAre":"Particular physical systems with the right causal structure.","hardProblem":"(a) real, solvable","theories":"Integrated Information Theory (Tononi, Koch); Searle's biological naturalism; Block's biological view."},{"code":"C1","family":"Panpsychism / idealism","experience":"Experience is fundamental; brains organize or filter it.","weAre":"Local concentrations, or dissociated parts, of a fundamental experiential field.","hardProblem":"(a) dissolved by making experience basic; combination problem replaces it","theories":"Constitutive panpsychism (Goff, Strawson); cosmopsychism; analytic idealism (Kastrup); Russellian monism (C4-leaning)."},{"code":"C4","family":"Neutral / dual-aspect monism","experience":"Experience and physics are two aspects of one neutral base.","weAre":"Aspects of the neutral base.","hardProblem":"(a) partially dissolved","theories":"Russell; Spinoza; Chalmers's \"Type-F.\""},{"code":"C5","family":"Dualism","experience":"Experience is a distinct substance or a distinct fundamental property.","weAre":"Minds attached to bodies, or bodies with extra properties.","hardProblem":"(a) real, answered by positing a second kind","theories":"Descartes; Chalmers's naturalistic property dualism; Samkhya."},{"code":"B2a-m","family":"Mysterianism","experience":"Experience has a physical explanation but human minds cannot grasp it.","weAre":"Physical systems cognitively closed to their own nature.","hardProblem":"(b) real, unsolvable for us","theories":"McGinn; Pinker (sympathetic); Chomsky."}],"constraints":[{"constraint":"B2b ∧ D1b with any asserted stance (S ≠ S?)","reason":"If the ground is ungraspable, no property of it, including a will or a stance toward us, can be asserted. This is the owner's Gate 2. Positions in this cell must set S = S? or move to B1."},{"constraint":"B2b ∧ any asserted C value","reason":"Same reason: to say the ground is \"mind-like\" or \"matter-like\" is to grasp it. B2b forces C = ?"},{"constraint":"A3 ∧ D1b","reason":"If there is no terminal ground, there is no ground-identical author."},{"constraint":"D1c ∧ A1","reason":"If we are the authors and the ground is necessary, we are the necessary ground, which is a strong identity claim (Advaita accepts it; most positions do not). Not incoherent, but flagged."}],"pillars":[{"pillar":"Universe Code","region":"B1 ∧ C3 (abstract/informational substrate), any D","leftOut":"Did not distinguish authored code (D1) from self-existing mathematics (D2a). Tegmark and Bostrom are in the same pillar but opposite D values."},{"pillar":"Sandbox / Architect","region":"B1 ∧ D1a","leftOut":"Did not cover D1b (ground-identical author, classical theism) or D1c (participatory)."},{"pillar":"Clutter / AI","region":"B1 ∧ C2 ∧ D2","leftOut":"Correctly placed."},{"pillar":"Un-Concept","region":"B2b (and B2a when spoken of loosely)","leftOut":"Conflated B2a and B2b, which is why the Turn 14 self-refutation felt threatening."}],"pillarsMissed":["B1 ∧ C1 ∧ D2: unauthored experiential ground. Panpsychism, cosmopsychism, non-theistic idealism (Kastrup), Whitehead's process philosophy. A large, actively defended region with no pillar.","B1 ∧ C4: neutral monism (Russell, James, Mach). The ground is neither mental nor physical but yields both.","B1 ∧ C5: substance dualism (Descartes) and property dualism (Chalmers).","A3 anywhere: genuinely infinite regress with no terminal, treated as the answer rather than a problem.","D1b with S?: an author identical to the ground whose stance is unassertable. This is roughly Maimonides' or Aquinas's God described only negatively, and the owner's \"Un-Concept god\" if it is granted agency."],"cPredictions":[{"code":"C1","prediction":"None at the level of physics. Some idealists predict that a complete physics will still leave experience unexplained (the hard problem is permanent).","status":"Untestable directly; see 04-mind.md."},{"code":"C2","prediction":"A complete physics explains everything, including experience, or explains it away.","status":"Physics is incomplete; experience is unexplained. Not eliminated, not confirmed."},{"code":"C3","prediction":"Physical constants and laws are derivable from structural or computational principles; spacetime is emergent from information.","status":"Active research (holography, amplituhedron, emergent spacetime). No decisive result. See 09-tests.md."},{"code":"C4","prediction":"Same observable predictions as C2 plus permanence of the hard problem.","status":"Same as C1."},{"code":"C5","prediction":"Mental causation should leave a physical trace: energy non-conservation or law violation at the mind–matter interface.","status":"No such trace found. Interactionist C5 is under pressure; epiphenomenal C5 is untestable."}],"gate1Escapes":[{"escape":"Free will defense","relaxes":"\"gratuitous\": suffering is a necessary cost of free agents","defenders":"Plantinga (1974)"},{"escape":"Soul-making theodicy","relaxes":"\"gratuitous\": suffering is developmental","defenders":"Hick (1966); Irenaeus"},{"escape":"Skeptical theism","relaxes":"\"gratuitous\": we cannot judge what is gratuitous","defenders":"Wykstra; Bergmann"},{"escape":"Limited god","relaxes":"omnipotent","defenders":"Process theology (Hartshorne); open theism"},{"escape":"Non-human good","relaxes":"S+ (as inhabitants understand good) → S±","defenders":"The owner's move; also some readings of Job and of Isaiah 55:8"},{"escape":"Evil as privation","relaxes":"\"world contains suffering\" as a positive thing","defenders":"Augustine"}],"escapeRoutes":[{"route":"Exploit a bug","mechanism":"Find inconsistencies in the layer's laws and use them.","cells":"Any D1a with imperfect authorship.","status":"No confirmed physical \"bug.\" The observer effect in quantum mechanics is not one: it needs no conscious observer and is fully lawful."},{"route":"Overload the host","mechanism":"Force the host to expend resources it cannot spare.","cells":"D1a with finite host resources.","status":"Untestable from inside; we cannot see host resource usage."},{"route":"Persuade the author","mechanism":"Communicate with Layer 2.","cells":"D1a with S≠S0 (an indifferent author will not answer).","status":"No evidence of channel. Prayer, in this framing, is the historical attempt."},{"route":"Already outside","mechanism":"The observer's true locus is in a higher layer; the body is an avatar.","cells":"D1c, or C1 with a filtering brain, or Samkhya's Purusha.","status":"Untestable by third-person means (Axiom 6)."},{"route":"Cannot","mechanism":"The layer is closed.","cells":"Any well-built D1a; all D2 (there is no outside to escape to).","status":"Default."}],"moralityConstraints":[{"cell":"B2b (Un-Concept ground)","M1a":"✗ unassertable","M1b":"✓","M1c":"✓","M2":"✓","bridge":"Gate 2: no moral fact can be read off an ungraspable ground. Morality must come from nature, reason, or construction. This is the owner's \"if he is unconcept we can't know then if good or bad.\" Correct."},{"cell":"D1a S0 (indifferent Architect)","M1a":"✗","M1b":"✓","M1c":"✓","M2":"✓","bridge":"The author's indifference provides no norms. Simulated beings must build their own ethics exactly as unauthored ones would."},{"cell":"D1a S± (alien-valued Architect)","M1a":"✓ but unattractive","M1b":"✓","M1c":"✓","M2":"✓","bridge":"M1a would make \"good\" mean \"what the Architect values,\" which by hypothesis is not human good. Euthyphro bites: why follow it? Owner's conclusion \"don't see evil good the same way\" is right; the further step, that its values bind us, does not follow."},{"cell":"D1a S+ (benevolent Architect)","M1a":"✓","M1b":"✓","M1c":"✓","M2":"✓","bridge":"Gate 1 pressure (§5). Even if S+, Euthyphro still asks whether its goodness is prior to its will."},{"cell":"D1b S+ (classical theism)","M1a":"✓","M1b":"✓","M1c":"✓","M2":"✓","bridge":"The home cell of natural law and divine command. Gate 1 and Euthyphro both apply in full."},{"cell":"D1c (we are the authors)","M1a":"✓ collapses into M2c","M1b":"✓","M1c":"✓","M2":"✓","bridge":"If we authored the layer, ground-based realism and constructivism coincide."},{"cell":"D2 ∧ C2 (unauthored physical, the Clutter pillar)","M1a":"✗ no ground with a will","M1b":"✓","M1c":"✓ (contested)","M2":"✓","bridge":"The most populated cell in contemporary philosophy. Evolutionary debunking arguments (Street 2006; Joyce) push toward M2; naturalist realists resist."},{"cell":"D2 ∧ C3 (mathematical universe)","M1a":"✓ if there is a Form of the Good among the structures","M1b":"✓","M1c":"✓","M2":"✓","bridge":"Platonism about value becomes available: moral facts as abstract structures."},{"cell":"D2 ∧ C1 (unauthored mind-ground)","M1a":"✓ if the ground has a valenced character","M1b":"✓","M1c":"✓","M2":"✓","bridge":"Cosmopsychists sometimes argue suffering is intrinsically bad in the ground."},{"cell":"A3 (no terminal)","M1a":"✗","M1b":"✓","M1c":"✓","M2":"✓","bridge":"No ground, so nothing ground-based."}],"levels":[{"level":0,"meaning":"Consistent, live","example":"M1b under D2 ∧ C2"},{"level":1,"meaning":"Consistent, under evidential pressure","example":"D1b ∧ S+ ∧ omnipotence (evidential problem of evil)"},{"level":2,"meaning":"Consistent only with an added premise","example":"M1a under any D1 (needs a Euthyphro answer)"},{"level":3,"meaning":"Category error, reclassify","example":"asserted S value under B2b (Gate 2)"},{"level":4,"meaning":"Formally inconsistent","example":"S+ ∧ omnipotent ∧ omniscient ∧ gratuitous suffering with \"gratuitous\" held fixed"}],"principles":[{"principle":"Ascent principle","phrasing":"\"beneficial is moving up the genesis of truth chart\" (Turn 16)","cell":"M1b or M2c, N3 (a perfectionist virtue ethic: the good life is climbing levels of understanding)","assessment":"Coherent. Close to Aristotl // Cell-address notation (00-index.md): "A1 B2b C? D1a S± | M2c N3 | F4".
// Shared by the parser, the tests and (inlined) the game page.
const AXES = ['A', 'B', 'C', 'D', 'S', 'M', 'N', 'R', 'F'];

// Parse one address string into {A:[...], B:[...], ...}. Unknown or silent
// axes are absent. Braces give several values; "?" gives an empty list.
function parseAddress(str) {
  const out = {};
  if (!str) return out;
  let s = String(str).replace(/C\{3\(layer\)\/\?\(ground\)\}/g, 'C3'); // layer/ground split: file under the layer's C
  s = s.replace(/\([^)]*\)/g, ' ');                      // drop remarks like "(not omnipotent)"
  s = s.replace(/[|/]/g, ' ');
  for (const tok of s.split(/\s+/).filter(Boolean)) {
    const m = /^([ABCDSMNRF])(.*)$/.exec(tok);
    if (!m) continue;
    const axis = m[1];
    let rest = m[2];
    let vals;
    if (rest === '?' || rest === '') vals = [];
    else if (rest.includes('{')) {                          // B{1,2b}, B2{a,b}, C2-{i,f}
      const base = rest.slice(0, rest.indexOf('{'));
      const inner = rest.slice(rest.indexOf('{') + 1, rest.indexOf('}'));
      vals = inner.split(',').map(v => v.trim()).filter(v => v && v !== '?').map(v => axis + base + v);
    } else {
      rest = rest.replace(/[,.;]$/, '');
      vals = [axis + rest];
    }
    if (!out[axis]) out[axis] = [];
    for (const v of vals) if (!out[axis].includes(v)) out[axis].push(v);
  }
  return out;
}

// Does theory value `t` cover the player's value `p`? "M2" covers "M2c"; "C2" covers "C2-f".
function covers(t, p) {
  if (t === p) return true;
  if (t.length === 1) return p[0] === t && p.length > 1;   // a bare axis letter covers every value on it
  return p.startsWith(t) && (p.length > t.length) && /^[a-z-]/.test(p.slice(t.length));
}

// Render {A:[..]} back to a string in canonical axis order.
function formatAddress(addr, { silent = '?' } = {}) {
  const gen = [], mor = [], kn = [];
  for (const ax of AXES) {
    const vals = addr[ax];
    if (vals === undefined) continue;
    let s;
    if (!vals.length) s = ax + silent;
    else if (vals.length === 1) s = vals[0];
    else s = ax + '{' + vals.map(v => v.slice(1)).join(',') + '}';
    (ax === 'M' || ax === 'N' || ax === 'R' ? mor : ax === 'F' ? kn : gen).push(s);
  }
  return [gen.join(' '), mor.join(' '), kn.join(' ')].filter(Boolean).join(' | ');
}

// All axis-value codes that appear in a free-text "bears on" cell, e.g. "C3 Local Code, D1a".
function codesIn(text) {
  const out = [];
  const re = /(?:^|[\s(,/])([ABCDMNRS])(\d[a-c]?(?:-[ifb])?|[0+±−?]|(?<=[BCDSMNR]))(?=$|[\s),.;:/])/g;
  let m;
  while ((m = re.exec(' ' + text))) { const c = m[1] + m[2]; if (!out.includes(c)) out.push(c); }
  return out;
}

function score(theory){

    if(!mine||!mine.length||!theirs||!theirs.length) continue;

  h+=`<h2>Who lives here</h2>`;
  if(exact.length){ h+=`<ul class="list">`+exact.slice(0,10).map(x=>row(x.t,[],x.t.name)).join("")+`</ul>`; }
  else if(genesisOccupied){ h+=`<p class="d muted small">Nobody in the index matches you on every axis, but your genesis cell is occupied.</p>`; }
  else h+=`<div class="gate"><div class="t">No named occupant ${chip("gate","Rule 2")}</div><p>No theory in the index shares your cell. ${unocc.length?`The documents list it among the unconceived alternatives: ${unocc.map(u=>`<code>${esc(u.cell)}</code> — ${esc(u.note)}`).join("; ")}.`:"It is not on the documents' list of unconceived alternatives either: the index has a gap or you have found one."} Rule 2 says an elimination argument that ends with “therefore only X remains” must show cells like this one are excluded too.</p><p class="src">${docLink("12-named-theories-index.md")}</p></div>`;
  if(near.length) h+=`<h3>${exact.length?"Nearest neighbours":"Nearest named positions"}</h3><ul class="list">`+near.map(x=>row(x.t,x.diff,x.t.name)).join("")+`</ul>`;
  if(pillars.length) h+=`<h2>The status board at To Nyn</h2><ul class="list">`+pillars.map(p=>`<li><span class="n">${esc(p.cell)}</span><span class="m">${esc(p.status)}. ${esc(p.basis)}</span></li>`).join("")+`</ul>`;
  h+=`<h2>Tests that bear on your branch</h2>`;
  if(tests.length) h+=`<div class="tscroll"><table><thead><tr><th>ID</th><th>Test</th><th>Bears on</th><th>Status at To Nyn</th></tr></thead><tbody>`+tests.map(t=>`<tr><td class="id">${esc(t.id)}</td><td>${esc(t.test)}${t.invalid?" "+chip("inv","invalid or unsettleable"):""}</td><td class="small muted">${esc(t.bearsOn)}</td><td class="small">${esc(t.status)}</td></tr>`).join("")+`</tbody></table></div>`;
  else h+=`<p class="d muted">No registered test bears on any value you chose. That is the map reporting the fog.</p>`;
  h+=`<h3>Can any test move you?</h3><ul class="list">`+cov.map(r=>`<li><span class="n">Axis ${esc(r.axis)}</span><span class="m"><b>${esc(r.hasTest)}.</b> ${esc(r.best)}</span></li>`).join("")+`</ul>`;
  h+=`<h2>Knowable from here? ${chip(fv.f)}</h2><p class="d">${esc(fv.why)}${fv.tests.length?` Registry: ${fv.tests.map(id=>`<code>${id}</code>`).join(", ")}.`:""}</p>`;
  if(mor.length) h+=`<h2>Rights and wrongs under this origin</h2><p class="d muted small">Axiom 7: value never descends without a bridge. Which families survive your origin cell, per the constraint table.</p><div class="tscroll"><table><thead><tr><th>Cell</th><th>M1a</th><th>M1b</th><th>M1c</th><th>M2</th><th>Bridge</th></tr></thead><tbody>`+mor.map(r=>`<tr><td class="id">${esc(r.cell)}</td><td>${esc(r.M1a)}</td><td>${esc(r.M1b)}</td><td>${esc(r.M1c)}</td><td>${esc(r.M2)}</td><td class="small muted">${esc(r.bridge)}</td></tr>`).join("")+`</tbody></table></div>`;
  const moves=[];
  for(const c of (answers.R||[])){ const v=MATRIX.axes.R.values.find(x=>x.code===c); if(v&&v.favoredBy) moves.push([c+" · "+v.value, v.favoredBy]); }
  for(const c of (answers.C||[])){ const p=MATRIX.cPredictions.find(x=>c.startsWith(x.code)); if(p) moves.push([p.code+" prediction", p.prediction+" Status: "+p.status]); }
  if(moves.length) h+=`<h2>What would move you</h2><ul class="list">`+moves.map(([n,m])=>`<li><span class="n">${esc(n)}</span><span class="m">${esc(m)}</span></li>`).join("")+`</ul>`;
  h+=`<h2>Walk as someone else</h2><select id="walk-as"><option value="">Choose a named position…</option>`+MATRIX.theories.filter(t=>Object.keys(t.address).length).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("")+`</select>`;
  return h;
}
// place a named theory on the chart from its address
function walkAs(name){
  const t=MATRIX.theories.find(x=>x.name===name); if(!t) return;
  reset();
  const A=t.address; const hasA=(c)=>Object.values(A).some(vals=>vals.some(v=>covers(c,v)||v===c||covers(v,c)));
  picks.P=hasA("B2b")?"unconcept":hasA("D1a")?"sandbox":hasA("C3")?"code":"clutter";
  if(picks.P==="unconcept") picks.SUB="nondual";
  else if(picks.P==="sandbox") picks.SUB=hasA("D1c")?"avatar":"nextbox";
  else if(picks.P==="code") picks.SUB=hasA("D2c")?"meta":"local";
  else picks.SUB=hasA("C2-f")||hasA("C2-b")||hasA("C2-i")?"emergent":"physics";
  if(A.S&&A.S.length){ picks.S={S0:"nothing","S±":"alien","S+":"good","S−":"harm","S?":"unknown"}[A.S[0]]||"unknown"; }
  if(A.M&&A.M.length){ const m=A.M[0]; picks.M=m.startsWith("M1a")?"maker":m.startsWith("M1b")?"nature":m.startsWith("M1c")?"reason":m.startsWith("M2c")?"made":m.startsWith("M2b")?"feel":m.startsWith("M2a")?"none":"made"; }
  if(A.R&&A.R.length){ picks.R={R1:"aligned",R2:"inverted",R3:"unrelated",R4:"partly"}[A.R[0]]; }
  derive(); for(const ax of ["A","B","C","D","S","M","N","R"]) if(A[ax]&&A[ax].length&&!(ax==="C"&&has(answers,"B2b"))) answers[ax]=A[ax].slice();
  done=true; closeDrawer(); render(); history.replaceState(null,"","#"+encodeState());
}
function renderBoard(){
  let h=`<h1>Nothing on any main axis is crossed off</h1><p class="d">${esc(MATRIX.score)}</p><p class="d muted small">${esc(REGISTRY._about)}</p>`;
  h+=`<h2>The registry</h2><div class="tscroll"><table><thead><tr><th>Date</th><th>What</th><th>Test</th><th>Result</th><th>Level</th></tr></thead><tbody>`+REGISTRY.entries.map(e=>`<tr><td class="id">${esc(e.date)}</td><td><b>${esc(e.what)}</b><br><span class="small muted">${esc(e.cell)}. ${esc(e.note)}</span></td><td class="id">${esc(e.test)}</td><td class="small">${esc(e.result)}<br><span class="muted">${esc(e.rule)}</span></td><td>${lvl(e.level)}</td></tr>`).join("")+`</tbody></table></div>`;
  h+=`<h2>The conversation's claimed eliminations, scored</h2><div class="tscroll"><table><thead><tr><th>Claim</th><th>Rule violated</th><th>Corrected status</th></tr></thead><tbody>`+MATRIX.claimedEliminations.map(c=>`<tr><td>${esc(c.claim)}</td><td class="small">${esc(c.ruleViolated)}</td><td class="small">${esc(c.corrected)}</td></tr>`).join("")+`</tbody></table></div>`;
  h+=`<h2>Try to cross something off</h2><select id="try"><option value="">Choose an axis value…</option>`+Object.values(MATRIX.axes).filter(a=>a.letter!=="F").map(a=>`<optgroup label="${esc(a.letter)} · ${esc(a.name)}">`+a.values.map(v=>`<option value="${esc(v.code)}">${esc(v.code)} · ${esc(v.value)}</option>`).join("")+`</optgroup>`).join("")+`</select><div id="try-out" style="margin-top:16px"></div>`;
  h+=`<h2>The twelve rules</h2>`+MATRIX.rules.map(r=>`<details><summary>Rule ${r.n} — ${esc(r.title)}</summary><div class="body"><p>${esc(r.text)}</p>${r.why?`<p class="muted"><i>Why:</i> ${esc(r.why)}</p>`:""}</div></details>`).join("");
  h+=`<h2>Status at To Nyn</h2><ul class="list">`+MATRIX.pillarStatus.map(p=>`<li><span class="n">${esc(p.cell)}</span><span class="m"><b>${esc(p.status)}.</b> ${esc(p.basis)}</span></li>`).join("")+`</ul>`;
  h+=`<h2>To Nyn history</h2><div class="tscroll"><table><thead><tr><th>Date</th><th>Position</th><th>Changes</th></tr></thead><tbody>`+MATRIX.toNynHistory.map(r=>`<tr><td class="id">${esc(r.date)}</td><td>${esc(r.position)}</td><td>${esc(r.changes)}</td></tr>`).join("")+`</tbody></table></div>`;
  return h;
}
function renderTry(code){
  if(!code) return "";
  const v=valueOf(code); const ax=code[0];
  const tests=MATRIX.tests.filter(t=>t.codes.some(c=>covers(c,code)||covers(code,c)||c===code));
  const cov=MATRIX.testCoverage.find(r=>r.letter.includes(ax));
  const positive=tests.filter(t=>!t.invalid&&/F0/.test(t.status)&&!/null/i.test(t.status));
  const occupants=MATRIX.theories.filter(t=>(t.address[ax]||[]).some(c=>covers(c,code)||covers(code,c)||c===code));
  const reg=REGISTRY.entries.filter(e=>codesIn(e.cell).some(c=>covers(c,code)||covers(code,c)||c===code));
  let h=`<div class="gate"><div class="t">${esc(code)} · ${esc(v?v.value:"")} ${chip("L L0","not eliminable at To Nyn")}</div><p>${esc(v?v.meaning:"")}</p>`;
  h+=`<p><b>Rule 3.</b> A cell is eliminated by a positive result it forbids, or by a proof of inconsistency, never by the absence of a successful theory inside it. ${positive.length?`Settled results that touch it: ${positive.map(t=>t.id).join(", ")}. None is a positive result the whole cell forbids.`:"No settled positive result in the registry touches it."}</p>`;
  h+=`<p><b>Axis ${esc(ax)} coverage.</b> ${cov?esc(cov.hasTest)+". "+esc(cov.best):"—"}</p>`;
  if(reg.length) h+=`<p><b>Registry entries inside the cell:</b> ${reg.map(e=>`${e.test} (${e.what}, level ${e.level})`).join("; ")}. Sub-theory eliminations only; the cell stays on the map (Rule 12).</p>`;
  h+=`<p><b>Occupants:</b> ${occupants.length?occupants.slice(0,12).map(t=>esc(t.name)).join(", ")+(occupants.length>12?` and ${occupants.length-12} more`:""):"none named (an unconceived alternative)"}. Rule 1: names move; only cells are eliminated.</p></div>`;
  if(tests.length) h+=`<div class="tscroll"><table><thead><tr><th>ID</th><th>Test</th><th>Status</th><th>A positive result would</th><th>A null result would</th></tr></thead><tbody>`+tests.map(t=>`<tr><td class="id">${esc(t.id)}</td><td>${esc(t.test)}${t.invalid?" "+chip("inv","invalid or unsettleable"):""}</td><td class="small">${esc(t.status)}</td><td class="small">${esc(t.positive)}</td><td class="small">${esc(t.nullResult)}</td></tr>`).join("")+`</tbody></table></div>`;
  return h;
}
function renderWho(){
  let h=`<h1>Every named position has one address</h1><p class="d small muted">${MATRIX.theories.length} entries from ${docLink("12-named-theories-index.md","the named theories index")}. Search, then walk as any of them.</p>`;
  h+=`<input type="search" id="search" placeholder="Search a theory, tradition or name…" aria-label="Search">`;
  h+=`<ul class="list" style="margin-top:14px">`+MATRIX.theories.map(t=>row(t,[],t.name+" "+t.genesis+" "+t.morality)).join("")+`</ul>`;
  h+=`<h2>Cells with no named occupant</h2><p class="d muted small">Rule 2: any elimination argument that ends with “therefore only X remains” must show these are excluded too.</p><ul class="list">`+MATRIX.unoccupied.map(u=>`<li><span class="n"><code>${esc(u.cell)}</code></span><span class="m">${esc(u.note)}</span></li>`).join("")+`</ul>`;
  return h;
}

// ---------- link state ----------
function encodeState(){
  const p=ORDER.filter(st=>picks[st]!==undefined).map(st=>st+":"+picks[st]);
  const g=Object.entries(gates).map(([k,v])=>k+"="+v);
  return p.join(".")+(g.length?"|"+g.join(","):"");
}
function decodeState(hash){
  const s=decodeURIComponent(hash.replace(/^#/,"")); if(!s) return false;
  const [a,g]=s.split("|"); reset();
  for(const part of a.split(".")){ const [st,id]=part.split(":"); if(ORDER.includes(st)) picks[st]=id; }
  if(g) for(const kv of g.split(",")){ const [k,v]=kv.split("="); if(k==="gate1") gates.gate1=v==="all"?"all":Number(v); else if(k==="euth") gates.euth=Number(v); else gates[k]=v; }
  derive(); done=Object.keys(picks).length>0; return done;
}

// ---------- boot ----------
S("back").addEventListener("click",goBack);
S("close").addEventListener("click",closeDrawer);
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; renderDrawer(); }));
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="Escape"&&!S("drawer").hidden){ closeDrawer(); return; }
  if((e.key==="Escape"||e.key==="Backspace")&&!done){ e.preventDefault(); goBack(); }
});
S("legend").innerHTML=Object.keys(F).filter(k=>k!=="gate").map(k=>chip(k)).join("")+chip("gate","constraint");
S("tonyn").textContent=MATRIX.toNyn;
if(location.hash&&decodeState(location.hash)) render(); else begin();
loadCounts();
</script>
