<script>
const F = {F0:"settled",F1:"testable soon",F2:"knowable, no test yet",FG:"provably undecidable",F3:"closed to us, open to some mind",F4:"closed to all",gate:"constraint"};

const EVIL = [
  {t:"Suffering is the price of free agents",s:"Denies that the suffering is gratuitous.",who:["Plantinga, free will defense (1974)"],f:"gate",d:"Widely held to answer the strict logical form of the problem of evil. The cost is denying that any suffering is gratuitous."},
  {t:"Suffering builds souls",s:"Hardship is developmental.",who:["John Hick","Irenaeus"],f:"gate"},
  {t:"We cannot judge what is gratuitous",s:"Our view is too small to call any suffering pointless.",who:["Wykstra","Bergmann (skeptical theism)"],f:"gate"},
  {t:"The maker is not all-powerful",s:"Relaxes omnipotence instead.",who:["Process theology (Hartshorne)","Open theism"],f:"gate"},
  {t:"Evil is only the absence of good",s:"Not a thing that was made.",who:["Augustine"],f:"gate"},
  {t:"None of these work",s:"The amount and spread of suffering makes a good, all-powerful maker improbable.",who:["Rowe (1979), evidential problem of evil","Hume, Dialogues","Mackie (1955)","Epicurus"],f:"gate",d:"This is your Gate 1. Corrected status: strong evidential pressure on a good and all-powerful maker, not a mathematical impossibility. Every escape above costs exactly one attribute.",doc:"05-authorship.md §4"}
];

const EUTHYPHRO = {t:"Does it command good, or is good prior?",s:"The Euthyphro dilemma.",q:"Which way does it go?",f:"gate",doc:"06-morality.md §3",kids:[
  {t:"It commands things because they are good",s:"Then goodness is prior to the maker, and morality is grounded elsewhere.",f:"gate",d:"Move to natural facts or reason-based facts under What is right."},
  {t:"Things are good because it commands them",s:"Then saying the maker is good says nothing.",who:["Ockham","Ash’arite theology"],f:"gate"},
  {t:"Its nature, not its will, is the standard",s:"The usual escape.",who:["Aquinas","Robert Adams"],f:"gate"}
]};

const WALK = {t:"A sample walk, end to end",s:"One position followed from the top to the bottom of every pillar. Yours, from the conversation.",walk:[
  {path:[1],why:"Start with what is real."},
  {path:[1,0],why:"You assumed the cascade of boxes ends somewhere."},
  {path:[1,0,1],why:"You placed the end beyond our logic."},
  {path:[1,0,1,1],why:"Not merely beyond us: beyond any mind. The Un-Concept."},
  {path:[1,0,1,1,0],why:"So the only honest speech about it is negation. This is where your Gate 2 already lives."},
  {path:[2],why:"Now what we are."},
  {path:[2,1],why:"Experience is real as it seems."},
  {path:[2,1,2],why:"Your Turn 7: feeling is the very thing from the start."},
  {path:[3],why:"Now what is right."},
  {path:[3,1],why:"With an ungraspable ground, nothing moral can be read off it, so realism has to come from nature or reason, or morality is built."},
  {path:[3,1,2],why:"Built by agents. Your ascent principle sits here as a virtue ethic."},
  {path:[4],why:"Now what we can know."},
  {path:[4,5],why:"The Un-Concept is closed to all. It cannot be shown non-empty from anywhere, which is why it can be held but never proven."},
  {path:[5],why:"And where we stand today."},
  {path:[5,0],why:"Nothing on any main axis is eliminated. Your position is open, like every other."}
],end:"Your full address: A1 B2b C1 D? · M2c N3 · F4"};

const TREE = {t:"Everything",q:"Five questions. Each splits by either/or until it cannot split further.",kids:[
WALK,

{t:"What is real",s:"Where the ground of everything is, and whether we can reach it.",q:"Is there a bottom to reality?",doc:"02-genesis.md",kids:[
  {t:"There is a bottom",s:"The chain of explanations stops somewhere.",q:"Can that bottom be grasped?",kids:[
    {t:"Graspable",s:"Statable in some logic we already have, even if untested.",addr:"B1",q:"Was our world made by anyone?",kids:[
      {t:"Made",s:"An intention produced our layer.",addr:"B1 D1",q:"Made by what?",kids:[
        {t:"Something one layer up",s:"A being inside a bigger reality built ours. The Sandbox.",addr:"B1 D1a",d:"The maker is not the bottom. Whatever we learn about it answers nothing about the ground. As you put it: just another box. A sandbox is a limitation, not the code, so being inside one does not make the outside unknowable, only unreachable.",q:"What does the maker want from us?",doc:"05-authorship.md",kids:[
          {t:"Nothing",s:"We are a side effect or a data set.",who:["Bostrom’s ancestor simulations","Epicurean gods","Deism","Plato’s Timaeus craftsman, on one reading"],addr:"D1a S0",f:"F2",d:"An indifferent maker gives no norms and answers nothing. Ethics has to be built from inside exactly as if the world were unmade."},
          {t:"Something, but not our good or evil",s:"It has attitudes. They are not shaped by survival, so they do not map onto ours.",who:["Your Architect (Turn 12)","Cosmicism (Lovecraft)","Some readings of Job"],addr:"D1a S±",f:"F2",d:"Your deduction that the maker must feel emotion because it built emotion does not hold. Evolution built emotion with none of its own. So indifference stays open. But if it does have values, nothing says they track ours, and nothing says they bind us."},
          {t:"Our good",s:"It wants what we would call our good.",addr:"D1a S+",q:"Then why is there suffering?",kids:EVIL},
          {t:"Our harm",s:"It wants us to suffer.",who:["Gnostic demiurge","Marcion","Descartes’ demon, as a hypothesis"],addr:"D1a S−",f:"F2"},
          {t:"We cannot tell",s:"Its stance is beyond us.",who:["Job’s conclusion","Agnostic theism"],addr:"D1a S?",f:"F3"},
          {t:"Is the maker itself made?",s:"Same question, one layer up. The Infinite Box Cascade.",goto:[1]}
        ]},
        {t:"The bottom itself",s:"The ground is a mind that willed our world. The classical God.",addr:"B1 D1b",q:"What does it want?",kids:[
          {t:"Our good",s:"All-good, all-powerful, all-knowing.",who:["Classical Christianity","Sunni Islam (Ash’arite and Mu’tazilite)","Rabbinic Judaism","Sikhism","Bahá’í","Berkeley","Leibniz"],addr:"D1b S+",q:"Then why is there suffering?",kids:EVIL},
          {t:"Both creation and destruction",s:"Aspects that do not reduce to human good.",who:["Shaiva and Vaishnava Hinduism","Kashmir Shaivism"],addr:"D1b S±",f:"F2"},
          {t:"Two makers, one good, one evil",s:"The world is their battlefield.",who:["Zoroastrianism","Manichaeism"],addr:"D1b C5 S{+,−}",f:"F2"},
          {t:"Only what it is not",s:"Described by negation alone.",who:["Maimonides","Aquinas, in part"],addr:"D1b S?",f:"F3",d:"This edges toward the ungraspable branch. If the ground is truly beyond concepts, it belongs there, not here."},
          EUTHYPHRO
        ]},
        {t:"Us",s:"The observers are the authors.",who:["Wheeler’s participatory universe","Advaita: Brahman is Atman","Self-simulation hypotheses","Fichte’s absolute I"],addr:"B1 D1c",f:"F2"}
      ]},
      {t:"Not made",s:"No intention behind it.",addr:"B1 D2",q:"Then what is it made of?",doc:"03-substrate.md",kids:[
        {t:"Physical stuff",s:"Particles, fields, spacetime. Experience is derived or illusory. Clutter.",addr:"B1 C2 D2",q:"Then what is experience?",kids:[
          {t:"An illusion",s:"Introspection misreports what the brain does.",who:["Dennett","Frankish","Graziano"],addr:"C2-i",f:"F1"},
          {t:"A function",s:"Anything organized the right way has it. We are the information the neuron holds.",who:["Global Workspace (Baars, Dehaene)","Higher-order thought (Rosenthal)","Attention schema (Graziano)","Recurrent processing (Lamme)","Predictive processing (Seth, Clark)"],addr:"C2-f",f:"F0",d:"The Cogitate collaboration (2023 to 2025) tested Global Workspace against IIT. Both lost specific predictions. What it settles is which correlates track reports, never whether the correlates are the experience."},
          {t:"A property of specific structure",s:"Not computation as such, but the right causal organization.",who:["Integrated Information Theory (Tononi, Koch)","Searle","Electromagnetic field theory (McFadden, Pockett)","Orch-OR, quantum microtubules (Penrose, Hameroff)"],addr:"C2-b",f:"F0",d:"IIT’s Phi cannot be computed for anything the size of a brain."},
          {t:"Real, physical, and beyond us",s:"There is an explanation and we cannot hold it.",who:["McGinn","Pinker","Chomsky"],addr:"B2a-m",f:"F3"},
          {t:"What is the physical bottom?",s:"Fields, strings, loops, sets, or graphs.",q:"Which?",kids:[
            {t:"Quantum fields",s:"The Standard Model plus general relativity, unreconciled.",who:["Standard Model","General relativity"],f:"F0"},
            {t:"Strings and branes",who:["String theory","M-theory (Witten)"],f:"F2"},
            {t:"Loops of space",who:["Loop quantum gravity (Rovelli, Smolin)"],f:"F2"},
            {t:"Discrete events",who:["Causal set theory (Sorkin)","Causal dynamical triangulations"],f:"F2"},
            {t:"Rewriting graphs",who:["Wolfram’s hypergraph physics","Cellular automata (Zuse, Fredkin)"],f:"F2"},
            {t:"Gravity tamed, nothing new",who:["Asymptotic safety (Weinberg, Reuter)"],f:"F2"}
          ]},
          {t:"Why does the physical exist at all?",s:"Necessary, brute, or one of many.",q:"Which?",kids:[
            {t:"It had to",s:"Could not have failed to exist.",who:["Spinoza","Necessitarianism"],addr:"D2a",f:"F2"},
            {t:"It just does",s:"No reason. The default.",who:["Russell","Most physicalists"],addr:"D2b",f:"F2"},
            {t:"It is one of many and we are in this one",s:"Selection, not design.",who:["Eternal inflation plus anthropics (Guth, Vilenkin)","Smolin’s cosmological natural selection","Everett’s many worlds","Your multi-universal evolution"],addr:"D2c",f:"F2",d:"Searches for bubble-collision bruises in the cosmic microwave background: null so far."}
          ]}
        ]},
        {t:"Structure or information",s:"Mathematics or code. Physical stuff is structure instantiated. Universe Code.",addr:"B1 C3 D2",q:"Why this structure?",kids:[
          {t:"Every consistent structure exists",s:"Ours is one of them.",who:["Tegmark, mathematical universe"],addr:"C3 D2a",f:"F2"},
          {t:"Information is fundamental",s:"It from bit.",who:["Wheeler","Zuse","Fredkin","Lloyd, the universe as a quantum computer"],addr:"C3",f:"F2",d:"Searches for Planck-scale pixelation (photon dispersion, the Holometer): null at every sensitivity tested so far."},
          {t:"Spacetime is emergent",s:"From entanglement, error-correcting codes, or geometry outside spacetime.",who:["Almheiri, Dong, Harlow (holographic codes)","Preskill","Arkani-Hamed and Trnka (amplituhedron)"],addr:"C3",f:"F1",d:"Real and active. The amplituhedron lives in a toy theory (planar N=4 super Yang-Mills). Holographic codes live in anti-de Sitter space, and our universe is not that. Promising, not proven, and not a piece of anyone’s code. This is the one branch where quantum computers genuinely help.",doc:"09-tests.md T13, T14, T17"},
          {t:"Only relations are real",s:"No things, just structure.",who:["Ontic structural realism (Ladyman, Ross)","Eddington"],addr:"C3",f:"F2"},
          {t:"Is it code someone wrote?",s:"If yes, you are under Made, not here.",goto:[1,0,0,0]}
        ]},
        {t:"Mind",s:"Experience is fundamental. Brains organize or filter it. The pillar you had no name for.",addr:"B1 C1 D2",q:"One mind or many?",kids:[
          {t:"One cosmic subject",s:"We are its dissociated parts.",who:["Cosmopsychism (Goff, Shani)","Kastrup’s analytic idealism","Yogācāra Buddhism","Schopenhauer’s Will"],f:"F2"},
          {t:"Many tiny subjects",s:"Experience in every fundamental unit.",who:["Constitutive panpsychism (Strawson, Goff)","Leibniz’s monads","Chalmers, Type-F"],f:"F2",d:"The combination problem: how do micro-experiences add up to yours?"},
          {t:"Experience as process",s:"Events of feeling, not things.",who:["Whitehead","Hartshorne","Nagel, Mind and Cosmos"],f:"F2"}
        ]},
        {t:"Neither, but the source of both",s:"A neutral base that shows up as mind from one side and matter from the other.",who:["Russell","William James","Mach","Spinoza, on one reading","Pauli and Jung, dual-aspect","Stoic Logos"],addr:"B1 C4 D2",f:"F2"},
        {t:"More than one kind",s:"Mind and matter both fundamental.",addr:"B1 C5",q:"Do the kinds interact?",kids:[
          {t:"Yes",s:"Mind moves matter.",who:["Descartes"],f:"F0",d:"Interaction should leave a physical trace: energy not conserved, laws bent at the interface. None found. Under pressure."},
          {t:"No",s:"Mind rides along.",who:["Epiphenomenalism","Chalmers, property dualism"],f:"F2"},
          {t:"Witness and machinery",s:"Pure awareness tangled in active matter.",who:["Samkhya: Purusha and Prakriti"],f:"F2"}
        ]}
      ]}
    ]},
    {t:"Not graspable",s:"No logic we possess can state it.",addr:"B2",q:"Graspable by anyone?",kids:[
      {t:"By some mind, not ours",s:"Closed to human cognition the way calculus is closed to a dog.",who:["McGinn, cognitive closure","Kant’s noumenon, weak reading","Chomsky’s mysteries","Du Bois-Reymond’s ignorabimus"],addr:"B2a",f:"F3",q:"What happens if we move up a layer?",kids:[
        {t:"It becomes graspable",s:"Today’s Un-Concept is tomorrow’s Layer 2. The fog moves with you.",d:"Your Turn 14 point, made a theorem: what an observer can settle grows as the observer moves. So “unknowable” needs a position attached. What stays fixed is that a boundary always exists, wherever you stand.",f:"F3",doc:"07-fog-front.md §4",goto:[1,0,0]}
      ]},
      {t:"By no mind at all",s:"Not code, not a box, not a concept. The Un-Concept.",addr:"B2b",f:"F4",q:"Then what can be said?",kids:[
        {t:"Only what it is not",s:"Negation is the only honest speech.",who:["Pseudo-Dionysius","Maimonides","Eckhart","Plotinus’ One","Proclus","Ibn Arabi","Kabbalah’s Ein Sof","Nirguna Brahman","Dao De Jing, chapter 1","Zhuangzi"],f:"F4",d:"Apophatic. These traditions already accept your Gate 2 and have for two thousand years."},
        {t:"Only paradox",s:"Language used against itself.",who:["Zen","Nagarjuna","Kierkegaard’s paradox"],f:"F4"},
        {t:"Nothing",s:"Whereof one cannot speak.",who:["Wittgenstein, Tractatus 7"],f:"F4"},
        {t:"Something positive",s:"Any tradition that names what it wants or is.",f:"gate",d:"Gate 2: a category error. The tradition relocates to Graspable, where its claims can be tested. It is not thereby false. It is unassertable from here.",doc:"05-authorship.md §5"},
        {t:"Can this branch ever be proven?",s:"No, from any position.",f:"F4",d:"Proving that something lies beyond all positions would need a survey of all positions. Failure of every other branch raises this one’s credence a little and no more. Unexplained is not inexplicable."}
      ]}
    ]}
  ]},
  {t:"There is no bottom",s:"The chain never stops.",addr:"A3",q:"Line or loop?",kids:[
    {t:"An endless line",s:"Boxes inside boxes, forever.",who:["Infinite nested simulations"],f:"F3"},
    {t:"A loop",s:"It grounds itself.",who:["Penrose’s conformal cyclic cosmology","Bounce cosmologies","Stoic eternal return","Nietzsche’s eternal recurrence","Theravada dependent origination","Hegel’s Absolute"],f:"F3"}
  ]}
]},

{t:"What we are",s:"Neurons, information, a lens, or a witness.",q:"Is experience real as it seems?",doc:"04-mind.md",kids:[
  {t:"No",s:"Introspection misreports the brain’s processing. You are a physical system with a misleading self-model.",who:["Dennett","Frankish","Graziano"],addr:"C2-i",f:"F1"},
  {t:"Yes",s:"There is something it is like to be you.",q:"Is it built or basic?",kids:[
    {t:"Built from function",s:"The pattern matters; the neuron is one implementation.",who:["Global Workspace","Higher-order thought","Predictive processing"],addr:"C2-f",f:"F0",d:"Your Turn 6: we are the information the neuron holds."},
    {t:"Built from specific structure",s:"The right causal organization, not computation as such.",who:["IIT","Searle"],addr:"C2-b",f:"F0"},
    {t:"Basic, and everywhere",s:"Brains focus a feeling that was already there.",who:["Panpsychism","Cosmopsychism","Idealism"],addr:"C1",f:"F2",d:"Your Turn 7: feeling is the very thing from the start."},
    {t:"Basic, and an extra kind",s:"Mind alongside matter.",who:["Descartes","Chalmers","Samkhya"],addr:"C5",f:"F2"},
    {t:"Built, but we cannot see how",s:"The explanation exists and our minds are closed to it.",who:["McGinn"],addr:"B2a-m",f:"F3"}
  ]},
  {t:"Can we control it?",s:"Yes, in every branch.",f:"F0",d:"Under physical stuff, the prefrontal network modulates lower circuits. Under mind, mind organizes itself. Under two kinds, mind acts on matter. The brain running near a phase transition (criticality) is neutral between them. The question had the same answer everywhere, which is why it never discriminated.",doc:"04-mind.md §6"},
  {t:"What can machines tell us?",s:"Decoders, dishes, emulations, qubits.",q:"Which machine?",kids:[
    {t:"Brain decoders",s:"fMRI and MEG with AI. Gist, not verbatim. You can resist them.",f:"F0",d:"Which neural states carry which contents. Nothing about what experience is. The limits are physical: blood flow takes seconds, and reconstructing sources from surface fields has no unique answer."},
    {t:"Biocomputing",s:"Living neurons on chips.",f:"F1",d:"Tells you the learning efficiency of tissue and whether neuron-like dynamics matter for intelligence. A dish that plays Pong says nothing about whether it feels. Behavior is not experience. Silicon AI did not hit a wall that needed brain cells; that claim was false."},
    {t:"Whole-brain emulation",s:"Copy the wiring, run it.",f:"F1",d:"Settles whether behavior follows from structure. Cannot settle whether the copy experiences anything. So it cannot confirm Clutter, contrary to the conversation."},
    {t:"Quantum computers",s:"Nothing on this axis.",f:"F2",d:"Except possibly Penrose and Hameroff’s microtubule coherence claim, where results lean negative."}
  ]}
]},

{t:"What is right",s:"Whether there are moral facts, and whether the origin of things changes them.",q:"Are there moral facts independent of anyone’s attitudes?",doc:"06-morality.md",kids:[
  {t:"Yes",s:"Some things are wrong whatever anyone thinks.",q:"Grounded in what?",kids:[
    {t:"The will or nature of the ground",s:"God, the Good, the cosmic order.",who:["Divine command theory","Natural law (Aquinas)","Plato’s Form of the Good","Dharma"],addr:"M1a",f:"gate",q:"Commanded because good, or good because commanded?",kids:EUTHYPHRO.kids},
    {t:"Natural facts",s:"Welfare, flourishing, cooperation. Survives every origin.",who:["Cornell realism (Boyd, Sturgeon)","Railton","Foot","Aristotle","Harris"],addr:"M1b"},
    {t:"Facts known by reason, not nature",s:"Real, mind-independent, not physical.",who:["Moore","Parfit","Enoch","Huemer","Sidgwick"],addr:"M1c",d:"Under pressure from evolutionary debunking: if selection explains why we believe it, the belief needs no truth to explain it (Street, Joyce)."}
  ]},
  {t:"No",s:"Nothing is wrong independent of attitudes.",q:"Then what is moral talk doing?",kids:[
    {t:"Failing",s:"It aims at facts and there are none.",who:["Mackie","Joyce, fictionalism","Nietzsche, on one reading"],addr:"M2a"},
    {t:"Expressing",s:"It voices attitudes, not facts.",who:["Ayer","Blackburn","Gibbard"],addr:"M2b"},
    {t:"Constructing",s:"Agents build moral facts by reasoning or agreeing.",who:["Kant, on one reading","Rawls","Korsgaard","Scanlon"],addr:"M2c"},
    {t:"Indexing",s:"True relative to a culture.",who:["Harman","Wong","Westermarck"],addr:"M2d"}
  ]},
  {t:"What makes an act right?",s:"Six standards that mix.",q:"Which standard?",kids:[
    {t:"Outcomes",who:["Bentham","Mill","Sidgwick","Singer","Negative utilitarianism (Popper)","Effective altruism"],addr:"N1"},
    {t:"Duties and rights",who:["Kant","Ross","Nozick","Korsgaard"],addr:"N2"},
    {t:"Character",who:["Aristotle","Confucius","Mencius","Stoics","Aquinas","MacIntyre","Nussbaum"],addr:"N3"},
    {t:"Agreement",who:["Hobbes","Locke","Rousseau","Rawls","Gauthier","Scanlon"],addr:"N4"},
    {t:"Care and the particular case",who:["Gilligan","Noddings","Held","Dancy"],addr:"N5"},
    {t:"Command",who:["Ockham","Adams"],addr:"N6"}
  ]},
  {t:"Does the origin change the answer?",s:"Far less than it feels like it should.",f:"gate",d:"Natural-fact realism, reason-based realism, and every anti-realist option survive in every origin cell. Only “grounded in the maker’s will” depends on the origin, and it meets Euthyphro wherever it lands. If the ground is the Un-Concept, nothing moral can be read off it at all; that is your Gate 2. If the maker is indifferent or alien, its values do not bind you.",doc:"06-morality.md §4"},
  {t:"Your candidate: the ascent principle",s:"The good is moving up levels of understanding.",addr:"M2c N3",d:"Coherent as a perfectionist virtue ethic. Close to Aristotle’s contemplative life, Spinoza’s third kind of knowledge, Teilhard’s Omega. It needs a bridge from “cleaner description” to “better”. The anti-school corollary is empirically weak; the defensible core is Illich’s point that institutions can swap credentialing for learning.",doc:"06-morality.md §7"}
]},

{t:"What we can know",s:"The fog front, made precise.",q:"From where we stand, how far away is a claim?",doc:"07-fog-front.md",kids:[
  {t:"Settled",s:"Tested, result in hand.",f:"F0",d:"Decoders read gist, not verbatim. Glia roughly equal neurons. No Planck-scale pixelation at tested sensitivity. Courts reject fMRI lie detection. Interaction dualism leaves no trace."},
  {t:"Testable soon",s:"Inside our reach, instrument not yet built or finished.",f:"F1",d:"Which correlates track reported experience. Whether emulation reproduces behavior. Lattice gauge theory and holographic toys on quantum computers."},
  {t:"Knowable, no test yet",s:"Inside our logic, no experiment designed.",f:"F2",d:"Whether spacetime is emergent in our universe. Whether there is a Layer 2 maker. Which substrate is fundamental."},
  {t:"Provably undecidable",s:"Fog inside our own logic, proven.",f:"FG",d:"Gödel: any consistent system rich enough for arithmetic has truths it cannot prove. Turing: no general test for whether a program halts. This cuts through every level, including below us. It is the part of your intuition that a system cannot fully read itself that is actually a theorem.",who:["Gödel (1931)","Turing (1936)","Chaitin"]},
  {t:"Closed to us, open to some mind",s:"A differently built observer could settle it.",f:"F3",d:"Whether other systems experience anything. What Layer 3 and above are like."},
  {t:"Closed to all",s:"The Un-Concept. Cannot be shown non-empty from anywhere.",f:"F4"},
  {t:"Why the fog moves",s:"Knowability grows with position.",d:"Move to a higher layer or a stronger instrument and the set of claims you can settle grows. A claim closed to you today may be settled tomorrow. Three things do not move: Gödel’s fog, the fact that behavior never reveals experience, and the existence of some boundary at every position. Everything else about the fog is relative to where you stand.",f:"gate",doc:"07-fog-front.md §4"},
  {t:"Two fogs people confuse",s:"Reading thoughts versus knowing minds.",d:"Content fog: decoders only read what is active in working memory. Shallow; better instruments shrink it. Nature fog: no outside method settles whether a system experiences. Deep; possibly closed to all.",f:"gate",doc:"04-mind.md §7"}
]},
