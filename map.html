ance.","who":["Rideout & Sorkin (1999)","Sorkin (2003)"],"f":"F2"},{"t":"Quantum sequential growth","s":"The same, with a quantum measure in place of probabilities.","who":["Sorkin (2007)","Dowker, Johnston & Sorkin (2010)"],"f":"F2"},{"t":"Everpresent Lambda","s":"Fluctuations of the cosmological constant follow from discreteness.","who":["Sorkin (1990, 2007)","Ahmed, Dodelson, Greene & Sorkin (2004)"],"f":"F1"}]},{"t":"Causal dynamical triangulations","s":"Sum over triangulated spacetimes with a fixed time direction; four dimensions emerge.","who":["Ambjørn, Jurkiewicz & Loll (2004)","Loll (2019)"],"f":"F2"},{"t":"Quantum graphity","s":"Space is a graph whose connections switch on and off; geometry freezes out at low energy.","who":["Konopka, Markopoulou & Smolin (2006)","Hamma et al. (2010)"],"f":"F2"},{"t":"Regge calculus","s":"Curvature lives on the edges of a lattice of flat simplices.","who":["Regge (1961)","Williams & Tuckey (1992)"],"f":"F2"},{"t":"Energetic causal sets","s":"Events carry energy and momentum; spacetime is reconstructed from them.","who":["Cortês & Smolin (2014)","Cortês & Smolin (2018)"],"f":"F2"},{"t":"Quantum measure and anhomomorphic logic","s":"Reality is a set of histories with a quantum measure; classical logic fails at the bottom.","who":["Sorkin (1994, 2007)","Dowker (2014)"],"f":"F2"},{"t":"Space-time code","s":"Spacetime is a quantum computation of finite elements.","who":["Finkelstein (1969)","Finkelstein & Rodriguez (1986)"],"f":"F2"}]},{"t":"Rewriting graphs","who":["Wolfram’s hypergraph physics","Cellular automata (Zuse, Fredkin)"],"f":"F2","q":"Which rewriting model?","kids":[{"t":"Wolfram physics project","s":"The universe is a hypergraph updated by simple rewrite rules; space, time and quanta emerge.","who":["Wolfram (2020)","Gorard (2020)"],"f":"F2","q":"What follows?","kids":[{"t":"Ruliad","s":"Every possible rule runs; our physics is what observers like us sample from all rule-histories.","who":["Wolfram (2021)","Wolfram (2023)"],"f":"F2"},{"t":"Multiway causal graphs","s":"Quantum mechanics is the branching and merging of rewrite histories.","who":["Wolfram (2020)","Gorard (2020)"],"f":"F2"},{"t":"Computational irreducibility","s":"Most of what the rules do cannot be shortcut; prediction fails in principle.","who":["Wolfram (2002)","Israeli & Goldenfeld (2004), limits"],"f":"FG"}]},{"t":"Computing space","s":"The cosmos is a cellular automaton; physics is its program.","who":["Zuse (1969)","Fredkin (1990, 2003)"],"f":"F2"},{"t":"Algorithmic theories of everything","s":"Universes are outputs of programs; simple ones dominate the measure.","who":["Schmidhuber (1997, 2000)","Hutter (2010)"],"f":"F2"},{"t":"Universe as quantum computer","s":"The universe computes its own evolution; complexity is what it produces.","who":["Lloyd (2006)","Deutsch (1997)"],"f":"F2"},{"t":"Constructor theory","s":"Physics should be stated in terms of which transformations are possible and which impossible.","who":["Deutsch (2013)","Deutsch & Marletto (2015)"],"f":"F2"},{"t":"Combinatorial quantum gravity","s":"Spacetime emerges from random graphs with a Ricci-curvature action.","who":["Trugenberger (2017)","Kelly, Trugenberger & Biancalana (2019)"],"f":"F2"}]},{"t":"Gravity tamed, nothing new","who":["Asymptotic safety (Weinberg, Reuter)"],"f":"F2","q":"Which taming?","kids":[{"t":"Asymptotic safety","s":"Gravity’s couplings run to a fixed point at high energy; the theory is finite without new stuff.","who":["Weinberg (1979)","Reuter (1998)","Percacci (2017)","Eichhorn (2019)"],"f":"F2"},{"t":"Effective field theory of gravity","s":"Quantum gravity is fine as an effective theory below the Planck scale; nothing more is needed yet.","who":["Donoghue (1994)","Burgess (2004)"],"f":"F0"},{"t":"Semiclassical and stochastic gravity","s":"Classical spacetime sourced by quantum expectation values, with fluctuations added.","who":["Møller (1962)","Rosenfeld (1963)","Hu & Verdaguer (2008)"],"f":"F2"},{"t":"Postquantum classical gravity","s":"Spacetime stays classical but stochastic; quantum matter couples to it consistently.","who":["Oppenheim (2023)","Oppenheim, Sparaciari, Šoda & Weller-Davies (2023)"],"f":"F1"},{"t":"Hořava–Lifshitz gravity","s":"Give up Lorentz invariance at high energy; the theory becomes renormalisable.","who":["Hořava (2009)","Blas, Pujolàs & Sibiryakov (2010)"],"f":"F2"},{"t":"Induced gravity","s":"Gravity is not fundamental but a one-loop effect of matter fields on curved space.","who":["Sakharov (1967)","Visser (2002)"],"f":"F2"},{"t":"Infinite-derivative gravity","s":"Nonlocal higher-derivative terms cure singularities and ghosts.","who":["Biswas, Mazumdar & Siegel (2006)","Modesto (2012)"],"f":"F2"},{"t":"Gravity need not be quantised","s":"Gravitons are undetectable in principle; a classical-quantum world may be consistent.","who":["Dyson (2013)","Rothman & Boughn (2006)","Carlip (2008), critique"],"f":"F2"},{"t":"Unimodular gravity","s":"Fix the spacetime volume element; the cosmological constant becomes an integration constant.","who":["Einstein (1919)","Unruh (1989)","Ellis et al. (2011)"],"f":"F2"}]},{"t":"Is there more than the Standard Model before gravity?","s":"Candidates for physics between the known particles and the Planck scale.","who":["Wess & Zumino (1974)","Georgi & Glashow (1974)","Shaposhnikov"],"f":"F1","q":"What comes next?","kids":[{"t":"Supersymmetry","s":"Every particle has a partner of opposite spin-type; stabilises the Higgs and unifies couplings.","who":["Wess & Zumino (1974)","Dimopoulos & Georgi (1981)","Haber & Kane (1985)"],"f":"F1"},{"t":"Grand unification","s":"The three forces merge into one gauge group at high energy.","who":["Georgi & Glashow (1974)","Pati & Salam (1974)","Fritzsch & Minkowski (1975)"],"f":"F2"},{"t":"Composite quarks and leptons","s":"Quarks and leptons are made of smaller preons.","who":["Pati & Salam (1974)","Harari (1979)","Shupe (1979)"],"f":"F2"},{"t":"Large or warped extra dimensions","s":"Extra spatial dimensions explain gravity’s weakness.","who":["Kaluza (1921)","Klein (1926)","Arkani-Hamed, Dimopoulos & Dvali (1998)","Randall & Sundrum (1999)"],"f":"F1"},{"t":"Technicolor and composite Higgs","s":"The Higgs is a bound state of a new strong force.","who":["Weinberg (1976)","Susskind (1979)","Kaplan & Georgi (1984)"],"f":"F1"},{"t":"Nothing new until the Planck scale","s":"The Standard Model plus right-handed neutrinos is all there is up to gravity.","who":["Shaposhnikov & Wetterich (2010)","Asaka, Blanchet & Shaposhnikov (2005)"],"f":"F1"},{"t":"Dark sector","s":"A hidden set of particles interacts with us only through gravity or feeble portals.","who":["Holdom (1986)","Pospelov, Ritz & Voloshin (2008)","Zurek (2014)"],"f":"F1"}]},{"t":"What are fields made of?","s":"Whether particles, fields, or neither are the real things in quantum field theory.","who":["Weinberg","Haag","Fraser","Wallace"],"f":"F2","q":"Which?","kids":[{"t":"Fields are basic, particles are excitations","s":"There are no particles, only field quanta that look like particles far apart.","who":["Weinberg (1995)","Hobson (2013)","Fraser (2008)"],"f":"F2"},{"t":"Particles are basic","s":"Particles as irreducible representations of the Poincaré group are the objects.","who":["Wigner (1939)","Bain (2011), critique"],"f":"F2"},{"t":"Algebra of observables","s":"Neither fields nor particles; the net of local algebras is the reality.","who":["Haag (1992)","Halvorson & Müger (2007)"],"f":"F2"},{"t":"Wilsonian effective theories","s":"Every field theory is an approximation valid up to a scale; there may be no fundamental one.","who":["Wilson (1971)","Weinberg (1979)","Williams (2019)"],"f":"F2"},{"t":"Ontic structural realism about fields","s":"Only the structure the theories share across reformulations is real.","who":["French & Ladyman (2003)","Ladyman & Ross (2007)"],"f":"F2"}]},{"t":"Is time part of the bottom?","s":"Whether passage, or time itself, is real at the ground.","who":["McTaggart (1908)","Barbour (1999)","Rovelli (2018)","Smolin (2013)"],"f":"F2","q":"Is passage real?","kids":[{"t":"Presentism","s":"Only the present exists; past and future are not real.","who":["Prior (1970)","Craig (2000)","Zimmerman (2008)","Bourne (2006)"],"f":"F2"},{"t":"Eternalism","s":"Past, present and future are equally real; now is like here.","who":["Minkowski (1908)","Putnam (1967)","Sider (2001)","Mellor (1998)"],"f":"F2"},{"t":"Growing block","s":"The past and present exist; the future does not yet.","who":["Broad (1923)","Tooley (1997)","Correia & Rosenkranz (2018)"],"f":"F2"},{"t":"Moving spotlight","s":"All times exist but one is objectively present, and that changes.","who":["Skow (2015)","Cameron (2015)"],"f":"F2"},{"t":"Timeless physics","s":"Time is not fundamental; the universe is a heap of configurations, or thermal time emerges.","who":["Barbour (1999)","Rovelli (2018)","Connes & Rovelli (1994)"],"f":"F2"},{"t":"Unreality of time","s":"The passage series is contradictory, so time is unreal.","who":["McTaggart (1908)","Gödel (1949)"],"f":"F2"},{"t":"Time is real and laws evolve","s":"Time is the most fundamental thing; laws change over cosmic history.","who":["Smolin (2013)","Unger & Smolin (2014)"],"f":"F2"},{"t":"Is spacetime a thing?","s":"Whether space and time exist apart from what is in them.","who":["Newton","Leibniz","Earman","Maudlin"],"f":"F2","q":"Container, relations, or the only thing?","kids":[{"t":"Substantivalism","s":"Spacetime points exist independently of matter.","who":["Newton (1687)","Clarke (1716)","Earman (1989)","Maudlin (1993)"],"f":"F2"},{"t":"Relationalism","s":"Space and time are only relations among bodies.","who":["Leibniz (1716)","Mach (1883)","Barbour (1982)"],"f":"F2"},{"t":"Sophisticated substantivalism","s":"Spacetime exists, but diffeomorphic models describe one world.","who":["Pooley (2006)","Brighouse (1994)","Butterfield (1989)"],"f":"F2"},{"t":"Supersubstantivalism","s":"Material things just are regions of spacetime with properties.","who":["Wheeler (1962)","Sklar (1974)","Schaffer (2009)"],"f":"F2"}]}]},{"t":"What makes stuff physical?","s":"Answers to what the word ‘physical’ picks out.","who":["Hempel (1969)","Papineau","Stoljar","Lewis"],"f":"F2","q":"Which account?","kids":[{"t":"Current physics","s":"Physical means what today’s physics posits.","who":["Melnyk (1997)","Smart (1978)"],"f":"F2"},{"t":"Future ideal physics","s":"Physical means whatever a completed physics will posit.","who":["Poland (1994)","Dowell (2006)"],"f":"F2"},{"t":"Via negativa","s":"Physical means not fundamentally mental.","who":["Montero & Papineau (2005)","Wilson (2006)"],"f":"F2"},{"t":"Object-based","s":"Physical means the kind of thing paradigm objects like rocks are.","who":["Stoljar (2001, 2010)","Stoljar (2015)"],"f":"F2"},{"t":"How do the laws hold?","s":"What a law of nature is, once stuff is given.","who":["Lewis","Armstrong","Maudlin","Bird"],"f":"F2","q":"What is a law?","kids":[{"t":"Humean regularity","s":"Laws are the best summary of the mosaic of local facts; nothing governs.","who":["Hume (1748)","Lewis (1973, 1994)","Loewer (1996)","Cohen & Callender (2009)"],"f":"F2"},{"t":"Universals relation","s":"A law is a necessitation relation among universals.","who":["Armstrong (1983)","Dretske (1977)","Tooley (1977)"],"f":"F2"},{"t":"Primitive laws","s":"Laws are basic, ungrounded, and produce the history of the world.","who":["Maudlin (2007)","Carroll (1994)"],"f":"F2"},{"t":"Dispositional essentialism","s":"Laws follow from the powers essential to properties.","who":["Ellis (2001)","Bird (2007)","Mumford (2004)","Shoemaker (1980)"],"f":"F2"},{"t":"No laws, only patchwork","s":"Nature is dappled; models hold locally and no universal laws exist.","who":["Cartwright (1983, 1999)","van Fraassen (1989)","Giere (1999)"],"f":"F2"},{"t":"Laws evolve","s":"Laws are habits that formed and can change.","who":["Peirce (1891)","Sheldrake (1981)","Smolin (2013)"],"f":"F2"}]},{"t":"Atoms or continuum?","s":"The oldest question about stuff.","who":["Democritus","Aristotle","Boyle","Faraday"],"f":"F2","q":"Which?","kids":[{"t":"Atomism","s":"Indivisible bodies moving in void make everything.","who":["Leucippus & Democritus (c. 430 BC)","Epicurus (c. 300 BC)","Lucretius (c. 55 BC)","Dalton (1808)"],"f":"F0"},{"t":"Corpuscularianism","s":"Matter is minute particles whose shape and motion explain all qualities.","who":["Boyle (1666)","Locke (1690)","Gassendi (1649)"],"f":"F0"},{"t":"Plenum and continuum","s":"Matter is continuous; there is no void.","who":["Aristotle (c. 350 BC)","Descartes (1644)","Stoics"],"f":"F2"},{"t":"Field ontology","s":"Fields filling space are the real stuff; particles are knots in them.","who":["Faraday (1844)","Maxwell (1865)","Einstein (1936)"],"f":"F2"},{"t":"Humean supervenience","s":"Everything is a mosaic of local qualities at points; all else follows.","who":["Lewis (1986)","Loewer (1996)","Hall (2015)"],"f":"F2"},{"t":"Powers ontology","s":"The world is a web of dispositions, not inert qualities.","who":["Mumford & Anjum (2011)","Molnar (2003)","Heil (2012)"],"f":"F2"}]}]}]},{"t":"Why does the physical exist at all?","s":"Necessary, brute, or one of many.","q":"Which?","kids":[{"t":"It had to","s":"Could not have failed to exist.","who":["Spinoza","Necessitarianism"],"addr":"D2a","f":"F2","q":"Why did it have to?","kids":[{"t":"Necessary substance","s":"There is one substance that exists by its own nature; nothing else was possible.","who":["Spinoza (1677)","Della Rocca (2008)"],"f":"F3"},{"t":"Something is the only possibility","s":"Absolute nothing is impossible or incoherent; some existence is necessary.","who":["Rundle (2004)","Lowe (1998)","Bergson (1907)"],"f":"F3"},{"t":"Probability of nothing is zero","s":"There is one way for nothing to be and infinitely many for something; so something.","who":["van Inwagen (1996)","Lowe (1996), critique"],"f":"F2"},{"t":"Mathematical necessity","s":"All consistent mathematical structures exist, so a physical one does too.","who":["Tegmark (2008, 2014)","Jannes (2009), critique"],"f":"F2"},{"t":"Value makes it so","s":"The world exists because it is good that it should; value is creative.","who":["Leslie (1979, 1989)","Rescher (2010)","Plato, Republic VI"],"f":"F3"},{"t":"Logic unfolds into being","s":"Pure being develops by its own logic into nature and mind.","who":["Hegel (1812)","Fichte (1794)"],"f":"F3"},{"t":"Laws alone suffice","s":"A law like gravity or quantum mechanics makes a universe spontaneously; no cause is needed.","who":["Hawking & Mlodinow (2010)","Krauss (2012)","Vilenkin (1982)"],"f":"F2"},{"t":"Egalitarian principle","s":"Every possibility is realised so none is privileged; nothingness is just one possibility among many.","who":["Nozick (1981)","Parfit (1998), as selector"],"f":"F3"}]},{"t":"It just does","s":"No reason. The default.","who":["Russell","Most physicalists"],"addr":"D2b","f":"F2","q":"Brute how?","kids":[{"t":"Brute fact","s":"The universe is just there, and that is all; explanation must stop somewhere.","who":["Hume (1779)","Russell (1948)","Grünbaum (2004)","Carroll (2016)"],"f":"F3"},{"t":"It always was","s":"There was no beginning; each state follows the last.","who":["Aristotle","Bondi & Gold (1948)","Steinhardt & Turok (2002)","Penrose (2010)"],"f":"F2","q":"Which eternal history?","kids":[{"t":"Eternal steady state","s":"The universe always looked like this; matter is continuously created.","who":["Bondi & Gold (1948)","Hoyle (1948)","Hoyle, Burbidge & Narlikar (1993)"],"f":"F0"},{"t":"Oscillating universe","s":"Expansion and collapse repeat forever.","who":["Friedmann (1922)","Tolman (1934)","Dicke & Peebles"],"f":"F2"},{"t":"Big bounce","s":"A prior contracting phase bounced into our expansion.","who":["Bojowald (2001)","Ashtekar & Singh (2011)","Ijjas & Steinhardt (2019)"],"f":"F1"},{"t":"Ekpyrotic and cyclic","s":"Colliding branes or slow contraction reset the universe again and again.","who":["Khoury, Ovrut, Steinhardt & Turok (2001)","Steinhardt & Turok (2002, 2007)"],"f":"F1"},{"t":"Conformal cyclic cosmology","s":"The remote future of one aeon is the big bang of the next.","who":["Penrose (2010)","Gurzadyan & Penrose (2013)"],"f":"F1"},{"t":"Past-eternal inflation","s":"Inflation has no beginning if time runs both ways from a low-entropy middle.","who":["Aguirre & Gratton (2002)","Carroll & Chen (2004)"],"f":"F2"},{"t":"Eternal world of Aristotle","s":"The cosmos has always been and always will be; motion is eternal.","who":["Aristotle (c. 340 BC)","Averroes (1180)","Aquinas (1270), as undecidable by reason"],"f":"F3"},{"t":"Phantom bounce and Baum–Frampton","s":"Dark energy tears the universe into patches that each start fresh.","who":["Baum & Frampton (2007)","Frampton (2015)"],"f":"F2"}]},{"t":"It began without a cause","s":"There was a first moment, and it needs no prior cause.","who":["Hume (1779)","Grünbaum (1989)","Hartle & Hawking (1983)","Vilenkin (1982)"],"f":"F2","q":"How did it begin?","kids":[{"t":"No-boundary proposal","s":"Time becomes space near the origin; the universe has no edge and no before.","who":["Hartle & Hawking (1983)","Hawking (1988)","Hertog (2023)"],"f":"F2"},{"t":"Tunnelling from nothing","s":"The universe appeared by quantum tunnelling from a state with no space or time.","who":["Vilenkin (1982)","Tryon (1973)","Linde (1984)"],"f":"F2"},{"t":"Uncaused beginning is fine","s":"Nothing in logic says a first event needs a cause.","who":["Hume (1779)","Grünbaum (1989, 2004)","Mackie (1982)"],"f":"F3"},{"t":"Beginning needs a cause","s":"Whatever begins to exist has a cause; so the universe has one outside itself.","who":["al-Ghazālī (1095)","Craig (1979)","Bonaventure (1250s)"],"f":"gate"}]}]},{"t":"It is one of many and we are in this one","s":"Selection, not design.","who":["Eternal inflation plus anthropics (Guth, Vilenkin)","Smolin’s cosmological natural selection","Everett’s many worlds","Your multi-universal evolution"],"addr":"D2c","f":"F2","d":"Searches for bubble-collision bruises in the cosmic microwave background: null so far.","q":"Which many?","kids":[{"t":"Tegmark’s levels","s":"A ladder of ever-larger multiverses.","who":["Tegmark (2003, 2014)","Greene (2011)"],"f":"F2","q":"Which level?","kids":[{"t":"Level I","s":"Regions beyond our horizon with the same laws but different starting conditions.","who":["Tegmark (2003)","Garriga & Vilenkin (2001)"],"f":"F2"},{"t":"Level II","s":"Bubbles with different constants and effective laws from the same underlying physics.","who":["Linde (1986)","Vilenkin (1983)","Tegmark (2003)"],"f":"F2"},{"t":"Level III","s":"Everettian branches of the one wavefunction.","who":["Everett (1957)","Tegmark (2003)"],"f":"F2"},{"t":"Level IV","s":"Every mathematical structure exists as a physical universe.","who":["Tegmark (1998, 2008)","Schmidhuber (1997), computable variant"],"f":"F2"}]},{"t":"Eternal inflation","s":"Inflation never stops everywhere; bubbles like ours keep forming forever.","who":["Vilenkin (1983)","Linde (1986)","Guth (2007)"],"f":"F2","q":"What kind of inflation?","kids":[{"t":"Chaotic inflation","s":"Random initial field values inflate wherever they are large.","who":["Linde (1983, 1986)","Linde (1990)"],"f":"F2"},{"t":"False vacuum bubbles","s":"A metastable vacuum decays locally into bubble universes.","who":["Coleman & De Luccia (1980)","Guth & Weinberg (1983)","Vilenkin (1983)"],"f":"F2"},{"t":"Bubble collisions as evidence","s":"Another bubble hitting ours leaves a disc in the microwave sky.","who":["Aguirre, Johnson & Shomer (2007)","Feeney et al. (2011)"],"f":"F1"},{"t":"Measure problem","s":"Infinite bubbles make every prediction depend on how you count.","who":["Guth (2007)","Freivogel (2011)","Ijjas, Steinhardt & Loeb (2013), critique"],"f":"FG"}]},{"t":"Cosmological natural selection","s":"Universes reproduce through black holes; constants evolve to maximise black-hole production.","who":["Smolin (1992, 1997)","Smolin (2006)","Vidal (2014)"],"f":"F1"},{"t":"Baby universes","s":"New universes bud off from ours in black holes or wormholes.","who":["Coleman (1988)","Hawking (1988)","Frolov, Markov & Mukhanov (1989)","Pathria (1972)"],"f":"F2"},{"t":"Modal realism","s":"Every possible world is as real as ours; actuality is indexical.","who":["Lewis (1986)","Bricker (2001)","Yagisawa (2010), extended"],"f":"F3"},{"t":"Anthropic selection","s":"Of the many worlds, we can only find ourselves in one that permits observers.","who":["Carter (1974)","Barrow & Tipler (1986)","Weinberg (1987)","Bostrom (2002)"],"f":"F2"},{"t":"Fine-tuning points to design instead","s":"The constants are too special for chance; a multiverse is an evasion.","who":["Swinburne (1990)","Collins (2009)","Leslie (1989)"],"f":"gate"},{"t":"Brane multiverse","s":"Many branes float in a higher-dimensional bulk; each is a universe.","who":["Randall & Sundrum (1999)","Steinhardt & Turok (2002)"],"f":"F2"},{"t":"Cyclic multiverse in time","s":"Universes succeed each other rather than sit side by side.","who":["Tolman (1934)","Steinhardt & Turok (2007)","Penrose (2010)"],"f":"F2"}]}]}]},{"t":"Structure or information","s":"Mathematics or code. Physical stuff is structure instantiated. Universe Code.","addr":"B1 C3 D2","q":"Why this structure?","kids":[{"t":"Every consistent structure exists","s":"Ours is one of them.","who":["Tegmark, mathematical universe"],"addr":"C3 D2a","f":"F2","q":"Which plenitude?","kids":[{"t":"Mathematical universe hypothesis","s":"Our universe is a mathematical structure, and every such structure exists.","who":["Tegmark (1998, 2008, 2014)","Hut, Alford & Tegmark (2006)"],"f":"F2"},{"t":"Computable universe hypothesis","s":"Only computable structures exist; ours is one of them.","who":["Tegmark (2008)","Schmidhuber (1997)"],"f":"F2"},{"t":"Modal realism","s":"Every possible concrete world exists; ours is not special.","who":["Lewis (1986)","Bricker (2001)","Yagisawa (2010), extended"],"f":"F3"},{"t":"Plenitudinous platonism","s":"Every consistent mathematical theory describes real objects.","who":["Balaguer (1998)","Linsky & Zalta (1995)"],"f":"F3"},{"t":"Set-theoretic multiverse","s":"There are many universes of sets, each as real as the others.","who":["Hamkins (2012)","Woodin (2011), critique"],"f":"F3"},{"t":"Pythagoreanism","s":"All things are number; the cosmos is arithmetic made audible.","who":["Pythagoras (c. 530 BC)","Philolaus (c. 450 BC)","Kepler (1619)"],"f":"F3"},{"t":"Three worlds","s":"Mathematical, physical and mental worlds each exist and mysteriously map onto one another.","who":["Penrose (2004)","Popper (1972)","Frege (1918)","Gödel (1951)"],"f":"F3"},{"t":"Ontic structural realism","s":"There are no objects at bottom, only structure; relations without relata.","who":["Ladyman (1998)","French (2014)","Ladyman & Ross (2007)"],"f":"F2"}]},{"t":"Information is fundamental","s":"It from bit.","who":["Wheeler","Zuse","Fredkin","Lloyd, the universe as a quantum computer"],"addr":"C3","f":"F2","d":"Searches for Planck-scale pixelation (photon dispersion, the Holometer): null at every sensitivity tested so far.","q":"Information how?","kids":[{"t":"It from bit","s":"Every physical quantity derives its meaning from yes–no answers to questions asked of nature.","who":["Wheeler (1990)","Zurek (1990)"],"f":"F2"},{"t":"Information is physical","s":"Erasing a bit costs energy; information is a thermodynamic quantity, not an abstraction.","who":["Landauer (1961)","Bennett (1982)"],"f":"F0"},{"t":"Quantum theory from information axioms","s":"The quantum formalism follows from a few rules about what information can be copied or shared.","who":["Hardy (2001)","Chiribella, D’Ariano & Perinotti (2011)","Zeilinger (1999)","Brukner & Zeilinger (2003)"],"f":"F2"},{"t":"Holographic principle","s":"All the information in a region fits on its boundary, one bit per Planck area.","who":["’t Hooft (1993)","Susskind (1995)","Bekenstein (1981)","Bousso (2002)"],"f": :"F2"},{"t":"ER = EPR","s":"Entangled particles are joined by tiny wormholes; connectivity is entanglement.","who":["Maldacena & Susskind (2013)","Susskind (2016)"],"f":"F2"},{"t":"Tensor networks","s":"Spacetime is the geometry of a tensor network describing the boundary state.","who":["Swingle (2012)","Vidal (2008)","Pastawski, Yoshida, Harlow & Preskill (2015)"],"f":"F2"},{"t":"Quantum error correction","s":"Bulk spacetime is an error-correcting code on boundary data.","who":["Almheiri, Dong & Harlow (2015)","Harlow (2017)"],"f":"F2"},{"t":"Entropic gravity","s":"Gravity is an entropic force arising from information about positions of bodies.","who":["Jacobson (1995)","Verlinde (2010, 2016)","Padmanabhan (2010)"],"f":"F2"},{"t":"Amplituhedron","s":"Scattering amplitudes come from a geometric object with no reference to space or time.","who":["Arkani-Hamed & Trnka (2013)","Arkani-Hamed, Bai & Lam (2017)"],"f":"F2"},{"t":"Analogue gravity","s":"Curved spacetime emerges in fluids and condensates; ours may be like that.","who":["Unruh (1981)","Volovik (2003)","Barceló, Liberati & Visser (2005)"],"f":"F2"},{"t":"String-net condensation","s":"Light and electrons emerge from a condensed network of strings in a qubit lattice.","who":["Levin & Wen (2005)","Wen (2004)"],"f":"F2"},{"t":"Spacetime from quantum condensates","s":"Continuum geometry is a condensate phase of pre-geometric quanta.","who":["Oriti (2014)","Gielen, Oriti & Sindoni (2013)","Hu (2005)"],"f":"F2"},{"t":"Geometrogenesis","s":"A pre-geometric phase of the universe crystallised into space.","who":["Konopka, Markopoulou & Severini (2008)","Smolin"],"f":"F2"},{"t":"Philosophical emergence of spacetime","s":"How a non-spatiotemporal fundamental theory can be empirically coherent at all.","who":["Huggett & Wüthrich (2013)","Crowther (2016)","Lam & Wüthrich (2018)"],"f":"F2"}]},{"t":"Only relations are real","s":"No things, just structure.","who":["Ontic structural realism (Ladyman, Ross)","Eddington"],"addr":"C3","f":"F2","q":"Which relationalism?","kids":[{"t":"Ontic structural realism","s":"Objects are nodes in structure; the structure is what is real.","who":["Ladyman (1998)","French (2014)","Esfeld & Lam (2008), moderate"],"f":"F2"},{"t":"Epistemic structural realism","s":"We can know only the structure of the world, never its nature.","who":["Poincaré (1902)","Worrall (1989)","Russell (1927)"],"f":"F3"},{"t":"Relational quantum mechanics","s":"Properties exist only relative to other systems; no view from nowhere.","who":["Rovelli (1996, 2021)","Adlam & Rovelli (2023)"],"f":"F2"},{"t":"Leibnizian relationalism","s":"Space is the order of coexistences and time the order of successions; nothing more.","who":["Leibniz (1716)","Mach (1883)"],"f":"F2"},{"t":"Machian dynamics","s":"Only relative configurations and their change are real; inertia comes from the whole.","who":["Mach (1883)","Barbour & Bertotti (1982)","Barbour (1999)"],"f":"F2"},{"t":"Graph-theoretic world","s":"The world is a single large asymmetric graph; nodes have no intrinsic natures.","who":["Dipert (1997)","Shackel (2011), critique"],"f":"F2"},{"t":"Structure with relata","s":"Objects exist but their identity is fixed by relations; a moderate version.","who":["Esfeld (2004)","Esfeld & Lam (2008)","Saunders (2003)"],"f":"F2"},{"t":"Dependent origination","s":"Nothing exists on its own; everything arises depending on other things.","who":["Buddha (5th c. BC)","Nāgārjuna (c. 150)","Candrakīrti (7th c.)"],"f":"F3"},{"t":"Indra’s net","s":"Each thing reflects and contains every other; interpenetration all the way.","who":["Huayan school, Fazang (7th c.)","Avataṃsaka Sūtra"],"f":"F3"},{"t":"Bundle theory","s":"Objects are bundles of properties or relations; there is no bare substratum.","who":["Hume (1739)","Russell (1940)","Paul (2002)","O’Leary-Hawthorne (1995)"],"f":"F2"}]},{"t":"Is it code someone wrote?","s":"If yes, you are under Made, not here.","goto":[1,0,0,0]}]},{"t":"Mind","s":"Experience is fundamental. Brains organize or filter it. The pillar you had no name for.","addr":"B1 C1 D2","q":"One mind or many?","kids":[{"t":"One cosmic subject","s":"We are its dissociated parts.","who":["Cosmopsychism (Goff, Shani)","Kastrup’s analytic idealism","Yogācāra Buddhism","Schopenhauer’s Will"],"f":"F2","q":"Which one mind?","kids":[{"t":"Absolute idealism","s":"Reality is one Spirit or Experience coming to know itself; finite minds are its moments.","who":["Hegel (1807, 1812)","Bradley (1893)","Royce (1899)","Bosanquet (1912)"],"f":"F3","q":"How does the one include the many?","kids":[{"t":"Hegelian Spirit","s":"The Absolute unfolds through nature and history into full self-knowledge.","who":["Hegel (1807)","McTaggart (1896), reading","Pippin (1989)"],"f":"F3"},{"t":"Bradley’s Absolute","s":"One seamless experience; thought, relations and selves are appearances of it.","who":["Bradley (1893)","Sprigge (1983)"],"f":"F3"},{"t":"Royce’s absolute self","s":"One infinite self whose purpose includes each finite will.","who":["Royce (1899, 1901)","Marcel (1956), reading"],"f":"F3"},{"t":"Schelling’s identity philosophy","s":"Nature and mind are two poles of one absolute indifference.","who":["Schelling (1801)","Schelling (1809)"],"f":"F3"}]},{"t":"Advaita Vedānta","s":"Only Brahman, pure awareness, is real; the world and separate selves are misreadings of it.","who":["Gauḍapāda (c. 6th c.)","Śaṅkara (8th c.)","Vidyāraṇya (14th c.)"],"f":"F3","q":"How does the world appear?","kids":[{"t":"Vivarta","s":"The world is a false appearance on Brahman, as a snake on a rope.","who":["Śaṅkara (8th c.)","Padmapāda"],"f":"F3"},{"t":"Ajātivāda","s":"Nothing was ever born; the world never arose at all.","who":["Gauḍapāda (c. 6th c.)","Śaṅkara, commentary on Gauḍapāda"],"f":"F3"},{"t":"Dṛṣṭi-sṛṣṭi","s":"The world is created by being perceived; there is one perceiver.","who":["Prakāśānanda (16th c.)","Madhusūdana Sarasvatī (16th c.), partly"],"f":"F3"},{"t":"Bhāmatī school","s":"Ignorance sits in the individual self; many ignorances, one Brahman.","who":["Vācaspati Miśra (9th c.)","Amalānanda (13th c.)"],"f":"F3"},{"t":"Vivaraṇa school","s":"Ignorance sits in Brahman itself; one ignorance.","who":["Prakāśātman (10th c.)","Padmapāda"],"f":"F3"}]},{"t":"Kashmir Śaivism","s":"One consciousness, Śiva, freely appears as the world by its own power; everything is its play.","who":["Vasugupta (9th c.)","Somānanda","Utpaladeva (10th c.)","Abhinavagupta (c. 1000)"],"f":"F3","q":"Which school?","kids":[{"t":"Pratyabhijñā","s":"Liberation is recognising that one already is the one consciousness.","who":["Utpaladeva (10th c.)","Abhinavagupta"],"f":"F3"},{"t":"Spanda","s":"Reality is a vibration or pulse of awareness.","who":["Vasugupta","Kallaṭa (9th c.)"],"f":"F3"},{"t":"Krama","s":"Consciousness moves through ordered phases of emission and withdrawal.","who":["Śivānanda","Abhinavagupta"],"f":"F3"},{"t":"Trika","s":"Three: Śiva, energy, and individual, all one.","who":["Abhinavagupta, Tantrāloka (c. 1000)","Jayaratha (13th c.)"],"f":"F3"}]},{"t":"Cosmopsychism","s":"The universe as a whole is the one fundamental subject; our minds are derived from it.","who":["Goff (2017)","Shani (2015)","Nagasawa & Wager (2016)","Albahari (2019)"],"f":"F2","q":"How do we come out of it?","kids":[{"t":"Constitutive cosmopsychism","s":"Our experiences are grounded in the cosmic experience, as parts in a whole.","who":["Goff (2017)","Nagasawa & Wager (2016)"],"f":"F2"},{"t":"Priority cosmopsychism","s":"The cosmic mind is prior, but we are not literally its parts.","who":["Shani (2015)","Shani & Keppler (2018)"],"f":"F2"},{"t":"Perennialist cosmopsychism","s":"A universal awareness underlies all minds; the mystics were reporting it.","who":["Albahari (2019, 2022)","Forman (1990), as source"],"f":"F3"},{"t":"Decombination problem","s":"No account shows how one experience could split into ours; a mirror of the combination problem.","who":["Chalmers (2020)","Miller (2018)","Goff (2017), reply"],"f":"gate"}]},{"t":"Analytic idealism","s":"There is one universal mind; living beings are dissociated alters of it, and matter is how mental states look from outside.","who":["Kastrup (2019)","Kastrup (2014)"],"f":"F2","q":"How does dissociation work?","kids":[{"t":"Alters like dissociative identity","s":"Nature dissociates as some human minds do into separate personalities.","who":["Kastrup (2018, 2019)","Kastrup, Crabtree & Kelly (2018)"],"f":"F2"},{"t":"Matter as extrinsic appearance","s":"Physical properties are the outside view of experience, not a second substance.","who":["Kastrup (2019)","Schopenhauer (1818)"],"f":"F2"}]},{"t":"Berkeley’s immaterialism","s":"To be is to be perceived; things exist as ideas in finite minds and, always, in God’s.","who":["Berkeley (1710, 1713)","Edwards (1720s)"],"f":"F3"},{"t":"Schopenhauer’s Will","s":"One blind Will is the thing in itself; the world of objects is its appearance to knowing subjects.","who":["Schopenhauer (1818)","Mainländer (1876)","Janaway (1989)"],"f":"F3"},{"t":"Objective idealism","s":"Matter is effete mind, habit-bound; the universe is a growing mind.","who":["Peirce (1891)","Eddington (1928)","Jeans (1930)"],"f":"F3"},{"t":"Conscious realism","s":"Conscious agents are fundamental; physical objects are an interface, like desktop icons.","who":["Hoffman (2008, 2019)","Hoffman & Prakash (2014)"],"f":"F2"},{"t":"One-Mind doctrine","s":"There is only one mind, and each of us is it.","who":["Schrödinger (1944, 1958)","Upaniṣads"],"f":"F3"}]},{"t":"Many tiny subjects","s":"Experience in every fundamental unit.","who":["Constitutive panpsychism (Strawson, Goff)","Leibniz’s monads","Chalmers, Type-F"],"f":"F2","d":"The combination problem: how do micro-experiences add up to yours?","q":"Which many?","kids":[{"t":"Constitutive micropsychism","s":"Fundamental particles have experience; our minds are built from theirs.","who":["Strawson (2006)","Goff (2009)","Chalmers (2015)"],"f":"F2","q":"How do the small combine into us?","kids":[{"t":"Phenomenal bonding","s":"A special relation bonds micro-subjects into a macro-subject.","who":["Goff (2016)","Miller (2017), development"],"f":"F2"},{"t":"Fusion","s":"Micro-experiences merge and lose their identity in a new whole.","who":["Seager (2010)","Mørch (2014)"],"f":"F2"},{"t":"Quantum coherence as combination","s":"Entangled states are literal combination of experiential parts.","who":["Seager (2016)","Lockwood (1989)"],"f":"F2"},{"t":"Combining minds by co-consciousness","s":"Subjects overlap and share experiences; combination is not paradoxical.","who":["Roelofs (2019)","Roelofs (2014)"],"f":"F2"},{"t":"Combination problem","s":"Micro-subjects cannot sum to one subject; this defeats the view.","who":["James (1890)","Goff (2006)","Chalmers (2016)"],"f":"gate"},{"t":"Subject-summing","s":"No set of subjects entails a further subject.","who":["James (1890)","Goff (2006)","Coleman (2014)"],"f":"gate"},{"t":"Palette problem","s":"A few basic qualities cannot yield the range of ours.","who":["Chalmers (2016)","Roelofs (2019)"],"f":"gate"},{"t":"Structural mismatch","s":"Micro-structure and the structure of experience do not line up.","who":["Chalmers (2016)","Stoljar (2001)"],"f":"gate"}]},{"t":"Emergent panpsychism","s":"Micro-experience is basic, but macro-subjects are new, strongly emergent entities.","who":["Mørch (2014)","Brüntrup (2017)","Seager (2012)"],"f":"F2"},{"t":"Russellian monism","s":"Physics gives only structure; the intrinsic natures that fill the structure are, or ground, experience.","who":["Russell (1927)","Eddington (1928)","Chalmers (2015)","Alter & Nagasawa (2015)"],"f":"F2","q":"What fills the structure?","kids":[{"t":"Panqualityism","s":"Unexperienced qualities are basic; subjects arise later.","who":["Coleman (2015)","Feigl (1958), partly"],"f":"F2"},{"t":"Panprotopsychism","s":"Proto-experiential properties, not yet experience, are basic.","who":["Chalmers (1996, 2015)","Russell (1927)"],"f":"F2"},{"t":"Russellian physicalism","s":"The intrinsic natures are physical though unknown to physics.","who":["Stoljar (2001)","Montero (2015)","Pereboom (2011)"],"f":"F2"},{"t":"Real physicalism","s":"Physicalism, taken seriously, entails that the physical is experiential.","who":["Strawson (2006)","Strawson (2020)"],"f":"F2"}]},{"t":"Monadology","s":"Reality is infinitely many simple perceiving substances; matter is their appearance.","who":["Leibniz (1714)","Wolff (1720)","Rescher (1991), reading"],"f":"F3"},{"t":"Panexperientialism","s":"Every true individual has experience; aggregates like rocks do not.","who":["Griffin (1998)","Hartshorne (1937)","Whitehead (1929)"],"f":"F2"},{"t":"Mind-stuff","s":"Consciousness is built from elements of mind-stuff that accompany every atom.","who":["Clifford (1878)","Fechner (1848)","Haeckel (1899)"],"f":"F3"},{"t":"Nagel’s panpsychism","s":"Mental properties of basic matter are needed to explain how mind could have arisen at all.","who":["Nagel (1979)","Nagel (2012)"],"f":"F2"},{"t":"Yogācāra","s":"Only mind-streams exist; the seeming outer world is the ripening of stored impressions.","who":["Asaṅga (4th c.)","Vasubandhu (4th–5th c.)","Dharmakīrti (7th c.)","Xuanzang (7th c.)"],"f":"F3","q":"How many consciousnesses?","kids":[{"t":"Eight consciousnesses","s":"Five senses, thought, ego-mind, and a storehouse consciousness carrying seeds.","who":["Vasubandhu","Xuanzang, Cheng Weishi Lun (659)"],"f":"F3"},{"t":"Epistemic idealism reading","s":"The school denies only that we can know external objects, not that they exist.","who":["Lusthaus (2002)","Dan Arnold (2012), critique"],"f":"F3"},{"t":"Metaphysical idealism reading","s":"There truly is nothing outside consciousness.","who":["Vasubandhu, Viṃśatikā","Schmithausen (2005)"],"f":"F3"}]},{"t":"Personal idealism","s":"Reality is a society of many minds, each timeless and irreducible.","who":["McTaggart (1921)","Howison (1901)","Rashdall (1907)"],"f":"F3"},{"t":"Hylozoism","s":"All matter is alive and ensouled to a degree.","who":["Thales (c. 585 BC)","Bruno (1584)","Campanella (1620)","Cavendish (1666)"],"f":"F3"},{"t":"Jain jīva doctrine","s":"Every living body, down to earth and water bodies, houses a soul.","who":["Mahāvīra (c. 500 BC)","Umāsvāti (2nd c.)","Kundakunda"],"f":"F3"},{"t":"New animism","s":"Persons include non-humans; the world is a community of subjects to relate to, not objects to use.","who":["Hallowell (1960)","Harvey (2005)","Descola (2005)","Viveiros de Castro (1998)"],"f":"F3"}]},{"t":"Experience as process","s":"Events of feeling, not things.","who":["Whitehead","Hartshorne","Nagel, Mind and Cosmos"],"f":"F2","q":"Which process?","kids":[{"t":"Whitehead’s philosophy of organism","s":"Reality is made of momentary actual occasions that feel their predecessors and perish.","who":["Whitehead (1929)","Hartshorne (1948)","Cobb (1965)"],"f":"F2","q":"What are the occasions?","kids":[{"t":"Prehension","s":"Each occasion takes in the whole past from its own standpoint.","who":["Whitehead (1929)","Christian (1959), reading"],"f":"F2"},{"t":"Eternal objects","s":"Pure possibilities ingredient in occasions, ordered by God’s primordial nature.","who":["Whitehead (1929)","Sherburne (1966)"],"f":"F2"},{"t":"Creativity as ultimate","s":"Creativity, not God or matter, is the category of the ultimate.","who":["Whitehead (1929)","Neville (1980)"],"f":"F2"},{"t":"Societies and nexus","s":"Enduring things are strands of occasions inheriting from one another.","who":["Whitehead (1929)","Griffin (1998)"],"f":"F2"}]},{"t":"Duration","s":"Reality is continuous becoming; spatialised time and fixed things are the intellect’s cut.","who":["Bergson (1889, 1907)","Deleuze (1966)"],"f":"F3"},{"t":"Pure experience","s":"The stuff of the world is pure experience, neither mental nor physical until sorted.","who":["James (1904, 1912)","Nishida (1911)"],"f":"F2"},{"t":"Kyoto School place of nothingness","s":"Absolute nothingness is the place where self and world arise together.","who":["Nishida (1926)","Nishitani (1961)","Tanabe"],"f":"F3"},{"t":"Buddhist momentariness","s":"Everything is a stream of point-instants; nothing endures.","who":["Sautrāntika","Vasubandhu","Dharmakīrti (7th c.)","Ratnakīrti"],"f":"F3"},{"t":"Heraclitean flux","s":"Everything flows; the river is never the same.","who":["Heraclitus (c. 500 BC)","Cratylus"],"f":"F3"},{"t":"Emergent evolution","s":"New levels of being, including mind and deity, emerge from lower ones over time.","who":["Alexander (1920)","Lloyd Morgan (1923)","Broad (1925)"],"f":"F2"},{"t":"Noosphere and Omega","s":"Matter complexifies into mind and converges toward a final point.","who":["Teilhard de Chardin (1955)","Vernadsky (1945)","Tipler (1994), derivative"],"f":"F3"},{"t":"Implicate order","s":"Explicit things unfold from and enfold back into an undivided moving whole.","who":["Bohm (1980)","Bohm & Hiley (1993)"],"f":"F2"},{"t":"Difference and repetition","s":"Being is difference producing itself; identities are effects.","who":["Deleuze (1968)","Deleuze & Guattari (1980)"],"f":"F3"},{"t":"Process ontology today","s":"Processes, not things, are basic; things are stabilised processes.","who":["Rescher (1996)","Seibt (2004)","Nicholson & Dupré (2018)"],"f":"F2"}]}]},{"t":"Neither, but the source of both","s":"A neutral base that shows up as mind from one side and matter from the other.","who":["Russell","William James","Mach","Spinoza, on one reading","Pauli and Jung, dual-aspect","Stoic Logos"],"addr":"B1 C4 D2","f":"F2","q":"What is the neutral stuff?","kids":[{"t":"Spinoza’s substance","s":"One substance with infinitely many attributes; thought and extension are two we know.","who":["Spinoza (1677)","Della Rocca (2008)"],"f":"F3"},{"t":"Neutral monism","s":"The basic elements are neither mental nor physical; both are arrangements of them.","who":["Mach (1886)","James (1904)","Russell (1921, 1927)","Stubenberg (2005)"],"f":"F2","q":"Which version?","kids":[{"t":"Machian elements","s":"Sensations are the elements; mind and matter are groupings of them.","who":["Mach (1886)","Banks (2014)"],"f":"F2"},{"t":"Russell’s events","s":"Events, known only structurally in physics and directly in percepts, are the stuff.","who":["Russell (1921, 1927)","Lockwood (1989)"],"f":"F2","q":"Who carries it on?","kids":[{"t":"Grounding-based Russellian monism","s":"Categorical bases of dispositions ground both physical and phenomenal facts.","who":["Alter & Nagasawa (2015)","Chalmers (2015)"],"f":"F2"},{"t":"Neutral monism revived","s":"Sensory qualities are neutral events; both minds and brains are constructions from them.","who":["Stubenberg (2005, 2015)","Banks (2014)","Tully (2003)"],"f":"F2"}]},{"t":"Radical empiricism","s":"Pure experience precedes the split into knower and known.","who":["James (1904, 1912)","Nishida (1911)","Lamberth (1999)"],"f":"F2"}]},{"t":"Dual-aspect monism","s":"One underlying reality shows two faces, mental and physical, neither reducible.","who":["Spinoza","Fechner (1860)","Pauli & Jung (1952)","Velmans (2000)"],"f":"F2","q":"Which pairing?","kids":[{"t":"Pauli–Jung conjecture","s":"Mind and matter are complementary aspects of a psychophysically neutral reality; synchronicity is its trace.","who":["Pauli & Jung (1952)","Atmanspacher (2012)"],"f":"F2"},{"t":"Reflexive monism","s":"One world that knows itself through embedded observers; first- and third-person views are complementary.","who":["Velmans (2000, 2009)","Velmans (2021)"],"f":"F2"},{"t":"Double-aspect information","s":"Information has both a physical and a phenomenal aspect.","who":["Chalmers (1996)","Bateson (1972)"],"f":"F2"},{"t":"Nagel’s dual aspect","s":"A single reality that a future theory would see as neither mental nor physical.","who":["Nagel (1986, 2012)","Strawson (1994), kindred"],"f":"F3"}]},{"t":"The One","s":"Beyond being and mind; Intellect and Soul and matter flow from it.","who":["Plotinus (c. 270)","Proclus (5th c.)","Damascius"],"f":"F3"},{"t":"Dao","s":"The nameless source from which heaven and earth come; prior to things and words.","who":["Laozi (c. 4th c. BC)","Zhuangzi","Wang Bi (3rd c.)"],"f":"F3"},{"t":"Apeiron","s":"The boundless, from which opposites separate and to which they return.","who":["Anaximander (c. 550 BC)","Kahn (1960), reading"],"f":"F3"},{"t":"Ungrund","s":"A groundless ground before God and world, before light and dark.","who":["Böhme (1612)","Schelling (1809, 1815)","Berdyaev (1930s)"],"f":"F3"},{"t":"Being as such","s":"Being is neither a thing nor a mind; it is what lets both show up, and it has been forgotten.","who":["Heidegger (1927, 1957)","Marion","Sheehan (2015)"],"f":"F3"},{"t":"Hylē without form","s":"Prime matter, pure potential, underlies every actual thing.","who":["Aristotle (c. 350 BC)","Aquinas"],"f":"F3"},{"t":"Ein Sof as neutral","s":"Before emanation the infinite is neither mind nor thing.","who":["Azriel of Gerona (13th c.)","Cordovero (1548)"],"f":"F3"},{"t":"Sāṃkhya prakṛti","s":"Unmanifest nature contains the seeds of both matter and mental faculties.","who":["Kapila","Īśvarakṛṣṇa (c. 350)"],"f":"F3"}]},{"t":"More than one kind","s":"Mind and matter both fundamental.","addr":"B1 C5","q":"Do the kinds interact?","kids":[{"t":"Yes","s":"Mind moves matter.","who":["Descartes"],"f":"F0","d":"Interaction should leave a physical trace: energy not conserved, laws bent at the interface. None found. Under pressure.","q":"How do they interact?","kids":[{"t":"Cartesian interactionism","s":"Mind and body are distinct substances that act on each other.","who":["Descartes (1641)","Elisabeth of Bohemia (1643), objection","Foster (1991)"],"f":"F2"},{"t":"Quantum interactionism","s":"Mind acts on brain where quantum indeterminacy leaves room.","who":["Eccles & Popper (1977)","Beck & Eccles (1992)","Stapp (2007)"],"f":"F1"},{"t":"Emergent dualism","s":"The mind is a new substance that emerges from the brain and acts back on it.","who":["Hasker (1999)","Sperry (1980)","O’Connor (2000)"],"f":"F2"},{"t":"Non-Cartesian substance dualism","s":"The person is a simple substance distinct from the body but not separable from all matter.","who":["Lowe (1996, 2008)","Swinburne (1986, 2013)"],"f":"F2"},{"t":"Property dualism","s":"One substance with two kinds of property; phenomenal properties are basic.","who":["Chalmers (1996)","Jackson (1982)","Robinson (2018)"],"f":"F2"},{"t":"Thomist hylomorphic dualism","s":"The soul is the form of the body yet subsists on its own; one thing, two principles.","who":["Aquinas (1265–74)","Stump (2003)","Oderberg (2007)","Feser (2005)"],"f":"F2"},{"t":"Jain soul and karmic matter","s":"Souls are bound by subtle karmic matter that literally sticks to them.","who":["Umāsvāti (2nd c.)","Kundakunda"],"f":"F3"},{"t":"Nyāya–Vaiśeṣika self","s":"The self is an eternal substance in which cognitions inhere; it meets the world through senses.","who":["Gautama (c. 150)","Praśastapāda (6th c.)","Udayana (10th c.)"],"f":"F3"},{"t":"Downward causation","s":"Higher levels constrain lower ones; mind shapes matter without being a substance.","who":["Campbell (1974)","Sperry (1969)","Ellis (2016)"],"f":"F2"}]},{"t":"No","s":"Mind rides along.","who":["Epiphenomenalism","Chalmers, property dualism"],"f":"F2","q":"Then why do they line up?","kids":[{"t":"Pre-established harmony","s":"God set both clocks at creation; they agree without touching.","who":["Leibniz (1695, 1714)","Geulincx (1665)"],"f":"F3"},{"t":"Occasionalism","s":"God alone causes; on the occasion of a bodily event he produces the mental one.","who":["al-Ghazālī (1095)","Malebranche (1674)","al-Ash‘arī"],"f":"F3"},{"t":"Epiphenomenalism","s":"Brain causes mind; mind causes nothing.","who":["Huxley (1874)","Jackson (1982)","Robinson (2019)"],"f":"F2"},{"t":"Spinozist parallelism","s":"The order of ideas and the order of things are the same order under two attributes.","who":["Spinoza (1677)","Della Rocca (1996)"],"f":"F3"},{"t":"Psychophysical laws","s":"Brute laws link brain states to experiences, with no mechanism.","who":["Chalmers (1996)","Broad (1925)"],"f":"F2"}]},{"t":"Witness and machinery","s":"Pure awareness tangled in active matter.","who":["Samkhya: Purusha and Prakriti"],"f":"F2","q":"Who is the witness?","kids":[{"t":"Sāṃkhya puruṣa","s":"Pure consciousness only watches; nature does all the doing, including thinking.","who":["Kapila","Īśvarakṛṣṇa (c. 350)","Vācaspati Miśra"],"f":"F3"},{"t":"Yoga’s seer","s":"The seer is pure seeing; liberation is its standing alone.","who":["Patañjali (c. 400)","Vyāsa"],"f":"F3"},{"t":"Sākṣin","s":"The witness consciousness that lights up mental states without being one of them.","who":["Śaṅkara (8th c.)","Citsukha (13th c.)"],"f":"F3"},{"t":"Transcendental subject","s":"The I is a limit of the world, not a part of it.","who":["Kant (1781)","Wittgenstein (1921)","Husserl (1913)"],"f":"F3"},{"t":"Pure knowing subject","s":"The world-eye that sees but cannot be seen.","who":["Schopenhauer (1818)","Wittgenstein (1916 notebooks)"],"f":"F3"},{"t":"Cartesian theatre","s":"A single inner viewer watches a show; named as the target to be dismantled.","who":["Dennett (1991), critique","Descartes"],"f":"gate"},{"t":"Headless way","s":"There is no viewer at the centre; look and see the absence.","who":["Harding (1961)","Zen","Ramana Maharshi"],"f":"F3"},{"t":"Minimal self","s":"A thin first-person givenness comes with every experience, not a separate observer.","who":["Zahavi (2005)","Sartre (1943)","Gallagher (2000)"],"f":"F2"}]},{"t":"How many kinds?","s":"Counts of basic kinds of thing.","who":["Descartes","Popper","Kaṇāda","Umāsvāti"],"f":"F2","q":"Count them.","kids":[{"t":"Two","s":"Thinking and extended substance.","who":["Descartes (1641)","Sāṃkhya"],"f":"F2"},{"t":"Three","s":"Physical things, mental states, and abstract objects or products of mind.","who":["Frege (1918)","Popper (1972)","Penrose (1994)","Cottingham (1985), Cartesian trialism"],"f":"F2"},{"t":"Six","s":"Soul, matter, motion-medium, rest-medium, space and time.","who":["Umāsvāti (2nd c.)","Jain Tattvārtha Sūtra"],"f":"F3"},{"t":"Seven","s":"Substance, quality, action, universal, particularity, inherence and absence.","who":["Kaṇāda (c. 2nd c. BC)","Praśastapāda (6th c.)","Udayana"],"f":"F3"},{"t":"Ten categories","s":"Substance and nine kinds of accident.","who":["Aristotle, Categories (c. 350 BC)","Porphyry (c. 270)","Aquinas"],"f":"F2"},{"t":"Bodies and four incorporeals","s":"Only bodies exist, but void, place, time and sayables subsist.","who":["Zeno of Citium","Chrysippus (3rd c. BC)"],"f":"F3"},{"t":"Twenty-five","s":"Consciousness and twenty-four evolutes of nature.","who":["Sāṃkhyakārikā (c. 350)","Gauḍapāda’s Sāṃkhya commentary"],"f":"F3"},{"t":"Indefinitely many","s":"The universe is a loose federation with no fixed number of kinds.","who":["James (1909)","Dupré (1993)","Cartwright (1999)"],"f":"F2"}]}]},{"t":"One thing or many?","s":"How many things there are at bottom, and how parts and wholes depend.","who":["Parmenides","Democritus","Schaffer","Lewis"],"f":"F2","q":"Which?","kids":[{"t":"Monism","s":"The whole is prior; parts depend on it.","who":["Parmenides (c. 475 BC)","Spinoza (1677)","Bradley (1893)","Schaffer (2010)"],"f":"F2","q":"How strong?","kids":[{"t":"Existence monism","s":"There is exactly one concrete object, the cosmos; tables are ways it is.","who":["Parmenides","Horgan & Potrč (2008)","Spinoza (1677)"],"f":"F3"},{"t":"Priority monism","s":"Many things exist, but the whole grounds the parts.","who":["Schaffer (2010)","Ismael & Schaffer (2020)"],"f":"F2"},{"t":"Absolute monism","s":"Relations are contradictory; only the one Absolute experience is real.","who":["Bradley (1893)","Bosanquet (1912)"],"f":"F3"}]},{"t":"Pluralism","s":"Parts are prior; wholes are built from them.","who":["Democritus","Lewis (1986)","Sider (2013)"],"f":"F2","q":"Built how?","kids":[{"t":"Atomism about grounding","s":"Simples ground everything; there is a bottom layer of mereological atoms.","who":["Democritus","Lewis (1991)","Markosian (1998)"],"f":"F2"},{"t":"Mereological nihilism","s":"Only simples exist; composite objects are a manner of speaking.","who":["Unger (1979)","Rosen & Dorr (2002)","Sider (2013)"],"f":"F2"},{"t":"Organicism","s":"Only simples and living organisms exist; no tables.","who":["van Inwagen (1990)","Merricks (2001), kindred"],"f":"F2"},{"t":"Universalism","s":"Any collection of things composes a further thing.","who":["Lewis (1986, 1991)","Rea (1998)","Van Cleve (2008)"],"f":"F2"},{"t":"Humean mosaic","s":"The world is a spread of local point-qualities; everything else supervenes.","who":["Lewis (1986)","Loewer (1996)"],"f":"F2"}]},{"t":"Gunk","s":"Everything has proper parts; there are no atoms, but wholes still depend on parts.","who":["Anaxagoras (c. 450 BC)","Lewis (1991)","Zimmerman (1996)","Schaffer (2003)"],"f":"F2"},{"t":"Junk","s":"Everything is a proper part of something bigger; there is no top.","who":["Bohn (2009)","Schaffer (2010), critique"],"f":"F2"},{"t":"Tropes, universals, or neither?","s":"What properties are, if things have them.","who":["Plato","Armstrong","Williams","Quine"],"f":"F2","q":"Which?","kids":[{"t":"Realism about universals","s":"Properties are repeatable entities shared by their instances.","who":["Plato","Armstrong (1978)","Russell (1912)"],"f":"F3"},{"t":"Trope theory","s":"Properties are particular; this red is not that red.","who":["Williams (1953)","Campbell (1990)","Maurin (2002)"],"f":"F2"},{"t":"Nominalism","s":"Only particulars exist; talk of properties is talk of resemblance or class.","who":["Ockham (1320s)","Quine (1948)","Rodriguez-Pereyra (2002)"],"f":"F2"},{"t":"Hylomorphism","s":"Each thing is matter shaped by a form; both are real principles.","who":["Aristotle (c. 350 BC)","Aquinas","Koslicki (2008)","Fine (1999)"],"f":"F2"}]}]}]}]},{"t":"Not graspable","s":"No logic we possess can state it.","addr":"B2","q":"Graspable by anyone?","kids":[{"t":"By some mind, not ours","s":"Closed to human cognition the way calculus is closed to a dog.","who":["McGinn, cognitive closure","Kant’s noumenon, weak reading","Chomsky’s mysteries","Du Bois-Reymond’s ignorabimus"],"addr":"B2a","f":"F3","q":"What happens if we move up a layer?","kids":[{"t":"It becomes graspable","s":"Today’s Un-Concept is tomorrow’s Layer 2. The fog moves with you.","d":"Your Turn 14 point, made a theorem: what an observer can settle grows as the observer moves. So “unknowable” needs a position attached. What stays fixed is that a boundary always exists, wherever you stand.","f":"F3","doc":"07-fog-front.md §4","goto":[1,0,0]},{"t":"Why not ours?","s":"Accounts of why our minds in particular fall short.","who":["Kant","McGinn","Chomsky","Barth"],"f":"F3","q":"What is the wall?","kids":[{"t":"Cognitive closure","s":"Our concept-forming faculties are shaped for a niche; some truths lie outside their reach, as colour lies outside a bat’s.","who":["McGinn (1989, 1993)","Chomsky (1975)","Fodor (1983)"],"f":"F3"},{"t":"Noumena and intellectual intuition","s":"Things in themselves are closed to sensible minds like ours but would be open to an intuiting intellect.","who":["Kant (1781, 1787)","Allison (1983)"],"f":"F3"},{"t":"Unknown attributes","s":"Reality has infinitely many attributes and we grasp two; other minds might grasp others.","who":["Spinoza (1677)","Bennett (1984), reading"],"f":"F3"},{"t":"Cognitive limits as evolved","s":"Evolution built brains for survival, not for the ground of being; expect gaps.","who":["Pinker (1997)","Rescher (1984)","Kahane (2011), on debunking"],"f":"F3"},{"t":"Only self-disclosure crosses the gap","s":"The ground is knowable only if it chooses to make itself known.","who":["Barth (1932)","Kierkegaard (1844)","Bahá’u’lláh (1860s)"],"f":"F3"},{"t":"Grades of intellect","s":"Angelic or divine intellects know without discursive reasoning what we cannot piece together.","who":["Aquinas (ST I.54–58)","Avicenna (c. 1020)","Pseudo-Dionysius"],"f":"F3"},{"t":"Mysteries versus problems","s":"Some questions are problems we can solve; others are mysteries our kind of mind cannot pose properly.","who":["Chomsky (1975, 2009)","Flanagan (1991), on ‘new mysterians’"],"f":"F3"}]}]},{"t":"By no mind at all","s":"Not code, not a box, not a concept. The Un-Concept.","addr":"B2b","f":"F4","q":"Then what can be said?","kids":[{"t":"Only what it is not","s":"Negation is the only honest speech.","who":["Pseudo-Dionysius","Maimonides","Eckhart","Plotinus’ One","Proclus","Ibn Arabi","Kabbalah’s Ein Sof","Nirguna Brahman","Dao De Jing, chapter 1","Zhuangzi"],"f":"F4","d":"Apophatic. These traditions already accept your Gate 2 and have for two thousand years.","q":"Whose negative way?","kids":[{"t":"Beyond being","s":"The first principle is beyond being and beyond mind; it is known only by what it is not.","who":["Plotinus (c. 270)","Proclus (5th c.)","Damascius (6th c.)"],"f":"F4"},{"t":"Tetralemma","s":"Neither is, nor is not, nor both, nor neither: all four positions about the ultimate fail.","who":["Nāgārjuna (c. 150)","Candrakīrti (7th c.)"],"f":"F4"},{"t":"Unsaying","s":"Every name must be affirmed then denied then denied again; the ascent is an endless unsaying.","who":["Pseudo-Dionysius (c. 500)","Sells (1994)"],"f":"F4"},{"t":"Dao that cannot be told","s":"The Dao that can be spoken is not the constant Dao.","who":["Laozi (c. 4th c. BC)","Zhuangzi"],"f":"F4"},{"t":"Ein Sof","s":"The infinite is without end and without attribute; even ‘One’ is too much.","who":["Zohar (13th c.)","Azriel of Gerona","Luria (16th c.)"],"f":"F4"},{"t":"God above God","s":"The ground of being is beyond the God of theism and beyond existence itself.","who":["Tillich (1952)","Eckhart (c. 1300)"],"f":"F4"},{"t":"Not-being God","s":"The ultimate is a ‘not-being’ that made a not-being world from not-being seed.","who":["Basilides (c. 130)","Hippolytus, Refutatio (c. 225)"],"f":"F4"},{"t":"Hidden essence","s":"God’s essence is inaccessible to any created intellect, in this life or the next.","who":["Palamas (1340s)","Lossky (1944)","Ismaili al-Sijistānī (10th c.)"],"f":"F4"}]},{"t":"Only paradox","s":"Language used against itself.","who":["Zen","Nagarjuna","Kierkegaard’s paradox"],"f":"F4","q":"Which paradox?","kids":[{"t":"Dialetheism","s":"Some contradictions are true; the limits of thought are exactly where they live.","who":["Priest (1987, 1995, 2014)","Routley (1979)"],"f":"F4","q":"Which logic carries the contradictions?","kids":[{"t":"Logic of Paradox","s":"Three values: true, false, both; contradictions do not explode.","who":["Priest (1979)","Asenjo (1966)"],"f":"FG","q":"Which variant?","kids":[{"t":"Minimally inconsistent LP","s":"Reason classically wherever no contradiction is present.","who":["Priest (1991)","Crabbé (2011)"],"f":"FG"},{"t":"LP with detachment","s":"Add a conditional that supports modus ponens without explosion.","who":["Beall (2011, 2013)","Priest (2006)"],"f":"FG"}]},{"t":"Relevant logic","s":"A conclusion must share content with its premises; explosion fails for that reason.","who":["Anderson & Belnap (1975)","Routley & Meyer (1973)","Mares (2004)"],"f":"FG"},{"t":"Da Costa’s C-systems","s":"Negation is weakened so that inconsistency does not trivialise.","who":["da Costa (1963)","Carnielli & Coniglio (2016)"],"f":"FG"},{"t":"Discussive logic","s":"Contradictions arise from combining consistent participants’ views.","who":["Jaśkowski (1948)","Perzanowski (1975)"],"f":"FG"},{"t":"Glut versus gap","s":"Rejecting dialetheism, one may instead say the limit sentences are neither true nor false.","who":["Kripke (1975)","Field (2008)","Beall (2009), gluts"],"f":"FG"}]},{"t":"Inclosure schema","s":"Every attempt to draw the limit of the thinkable both stays inside and steps outside; contradiction is structural.","who":["Priest (1995)","Kant’s antinomies (1781), as ancestor"],"f":"FG"},{"t":"Absolute paradox","s":"The eternal entering time is a paradox to be believed, not resolved.","who":["Kierkegaard (1844)","Tertullian (c. 200)"],"f":"F4"},{"t":"Coincidence of opposites","s":"In the infinite, maximum and minimum coincide; contradiction is the doorway.","who":["Nicholas of Cusa (1440)","Bruno (1584)"],"f":"F4"},{"t":"Kōan","s":"Language is broken on purpose so that the mind stops asking.","who":["Hakuin (18th c.)","Dōgen (13th c.)","Mumon (1228)"],"f":"F4"},{"t":"Complementarity as metaphysics","s":"Mutually exclusive descriptions are both needed and never combined; that is how reality is.","who":["Bohr (1949)","Plotnitsky (2006)"],"f":"F4"},{"t":"Gluon","s":"The unity of any thing is an object that both is and is not one of its parts.","who":["Priest (2014)","Priest (2018)"],"f":"F4"},{"t":"Two truths","s":"Conventional and ultimate truth differ; the ultimate is that nothing has ultimate nature.","who":["Nāgārjuna (c. 150)","Tsongkhapa (14th c.)","Garfield (1995)"],"f":"F4"}]},{"t":"Nothing","s":"Whereof one cannot speak.","who":["Wittgenstein, Tractatus 7"],"f":"F4","q":"Silent how?","kids":[{"t":"Whereof one cannot speak","s":"The mystical shows itself; it cannot be said, and the ladder is thrown away.","who":["Wittgenstein (1921)","Engelmann (1967), reading","Diamond (1991)"],"f":"F4"},{"t":"Unanswered questions","s":"The Buddha set aside questions about the world’s extent and the self’s fate as not conducive to release.","who":["Buddha, Cūḷamālukya Sutta","Nāgārjuna"],"f":"F4"},{"t":"Suspension of judgement","s":"Appearances are all we have; about the underlying nature we suspend judgement and find peace.","who":["Pyrrho (c. 300 BC)","Sextus Empiricus (c. 200)","Montaigne (1580)"],"f":"F4"},{"t":"Elimination of metaphysics","s":"Metaphysical sentences are not false but meaningless; there is nothing to say.","who":["Carnap (1932)","Ayer (1936)","Neurath"],"f":"F4"},{"t":"Thunderous silence","s":"Asked about nonduality, the sage says nothing; that is the answer.","who":["Vimalakīrti Sūtra (c. 100)","Zen tradition"],"f":"F4"},{"t":"Quietism","s":"The right response to metaphysical questions is therapy, not theory.","who":["Wittgenstein (1953)","McDowell (1994)","Rorty (1979)"],"f":"F4"},{"t":"Who am I?","s":"Turn attention to the asker until the question dissolves.","who":["Ramana Maharshi (1902)","Nisargadatta (1973)"],"f":"F4"}]},{"t":"Something positive","s":"Any tradition that names what it wants or is.","f":"gate","d":"Gate 2: a category error. The tradition relocates to Graspable, where its claims can be tested. It is not thereby false. It is unassertable from here.","doc":"05-authorship.md §5","q":"How could something positive get through?","kids":[{"t":"Analogy","s":"Words apply to the ground neither in our sense nor in none, but proportionally.","who":["Aquinas (ST I.13)","Cajetan (1498)","Przywara (1932)"],"f":"gate"},{"t":"Univocity","s":"Being means the same for God and creatures; positive knowledge is possible in principle.","who":["Duns Scotus (c. 1300)","Deleuze (1968), secular reading"],"f":"gate"},{"t":"Mystical perception","s":"Experience of the ground is a kind of perception and can justify belief.","who":["James (1902)","Alston (1991)","Stace (1960)"],"f":"gate"},{"t":"Perennialism","s":"Mystics across traditions report the same ultimate under different names.","who":["Huxley (1945)","Schuon (1948)","Smith (1976)","Stace (1960)"],"f":"gate","q":"Is the experience the same?","kids":[{"t":"Common core","s":"A pure consciousness event without content is found everywhere.","who":["Forman (1990)","Stace (1960)"],"f":"gate"},{"t":"Constructivism about mysticism","s":"Every experience is shaped by tradition; there is no common core.","who":["Katz (1978)","Proudfoot (1985)"],"f":"gate"},{"t":"Neuroscience of the same state","s":"Brain signatures of ego-dissolution match across methods and cultures.","who":["Newberg & d’Aquili (2001)","Griffiths et al. (2006)","Letheby (2021)"],"f":"F1"}]},{"t":"Recognition","s":"The ground can be recognised as one’s own awareness, not described from outside.","who":["Utpaladeva (10th c.)","Abhinavagupta","Dzogchen, Longchenpa (14th c.)"],"f":"gate"},{"t":"Annihilation in the Real","s":"The self passes away and only the Real remains to know itself.","who":["al-Junayd (9th c.)","al-Ḥallāj (922)","Rūmī (13th c.)"],"f":"gate"},{"t":"Henosis","s":"Union with the One is possible for the soul that strips away everything else.","who":["Plotinus (c. 270)","Iamblichus"],"f":"gate"},{"t":"Intuition of being","s":"A direct intellectual intuition of existence itself is available and is the root of metaphysics.","who":["Maritain (1947)","Gilson (1948)"],"f":"gate"}]},{"t":"Can this branch ever be proven?","s":"No, from any position.","f":"F4","d":"Proving that something lies beyond all positions would need a survey of all positions. Failure of every other branch raises this one’s credence a little and no more. Unexplained is not inexplicable.","q":"Which limit theorem?","kids":[{"t":"Incompleteness","s":"Any consistent formal system rich enough for arithmetic has truths it cannot prove.","who":["Gödel (1931)","Rosser (1936)"],"f":"FG"},{"t":"Halting problem","s":"No procedure decides in general whether a program stops; some questions have no algorithm.","who":["Turing (1936)","Church (1936)"],"f":"FG"},{"t":"Undefinability of truth","s":"No language can define its own truth predicate.","who":["Tarski (1936)","Gödel (1931), implicit"],"f":"FG"},{"t":"Algorithmic randomness","s":"Most mathematical facts are true for no reason shorter than themselves.","who":["Chaitin (1974, 1987)","Kolmogorov (1965)","Solomonoff (1964)"],"f":"FG"},{"t":"Computational irreducibility","s":"Many systems cannot be predicted faster than by running them.","who":["Wolfram (2002)","Israeli & Goldenfeld (2004), limits"],"f":"FG"},{"t":"Knowability paradox","s":"If every truth is knowable, every truth is known; so there are unknowable truths.","who":["Fitch (1963)","Church (1945)","Williamson (2000)"],"f":"FG"},{"t":"Undecidability in physics","s":"Whether a material has an energy gap is undecidable in general.","who":["Cubitt, Perez-Garcia & Wolf (2015)","Lloyd (1993)"],"f":"FG"},{"t":"Antinomies of reason","s":"Whether the world has a beginning, a smallest part, freedom, or a necessary being cannot be settled by reason.","who":["Kant (1781)","Al-Azm (1972), reading"],"f":"FG"},{"t":"Fixed-point limits","s":"One diagonal argument underlies all self-reference limits.","who":["Lawvere (1969)","Yanofsky (2003)"],"f":"FG"},{"t":"Gödel applied to the mind","s":"Minds see truths machines cannot prove; or minds cannot know their own consistency.","who":["Lucas (1961)","Penrose (1989, 1994)","Gödel (1951)","Feferman (2009), critique"],"f":"FG"},{"t":"Limits of science","s":"Some questions science cannot in principle answer, about first causes and consciousness among them.","who":["Du Bois-Reymond (1872)","Rescher (1984)","Barrow (1998)"],"f":"F4"}]}]}]}]},{"t":"There is no bottom","s":"The chain never stops.","addr":"A3","q":"Line or loop?","kids":[{"t":"An endless line","s":"Boxes inside boxes, forever.","who":["Infinite nested simulations"],"f":"F3","q":"Endless in which direction?","kids":[{"t":"Metaphysical infinitism","s":"Every thing depends on something else, forever; there are no fundamental things.","who":["Morganti (2014, 2015)","Bliss (2013)","Tahko (2014)","Cameron (2008), critique"],"f":"F3","q":"Why is this not vicious?","kids":[{"t":"Dependence without foundation","s":"Explanation is complete at each step; no first step is needed.","who":["Morganti (2014)","Bliss (2013)"],"f":"F3"},{"t":"Infinite descent is coherent","s":"Boring infinite regresses are fine; only some are vicious.","who":["Bliss (2013)","Nolan (2001)"],"f":"F3"},{"t":"Foundation is required","s":"Being must be inherited from somewhere; infinite regress gives it to nothing.","who":["Aristotle","Aquinas","Cameron (2008)","Schaffer (2010)"],"f":"gate"}]},{"t":"Gunk without atoms","s":"Matter divides forever; every part has parts.","who":["Anaxagoras (c. 450 BC)","Leibniz, on bodies","Lewis (1991)","Zimmerman (1996)"],"f":"F2"},{"t":"Infinite causal chain","s":"Every event has a prior cause; there was no first.","who":["Hume (1779)","Aristotle, on motion","Averroes (1180)"],"f":"F3"},{"t":"Eternal past","s":"Time had no beginning; the past is actually infinite.","who":["Aristotle (c. 340 BC)","Aguirre & Gratton (2002)","Steinhardt & Turok (2002)","Craig (1979), critique"],"f":"F2"},{"t":"Simulators all the way up","s":"Each simulating world is itself simulated; there is no base reality.","who":["Bostrom (2003), noted","Chalmers (2022)","Hanson (2001)"],"f":"F3"},{"t":"Boxes inside boxes","s":"Every explanatory layer has a layer above; the cascade never closes.","who":["Kant (1781), first antinomy","Leibniz (1697), critique"],"f":"F3"},{"t":"Infinite regress of laws","s":"Every law needs a metalaw; there is no final law.","who":["Wheeler (1983), ‘law without law’","Unger & Smolin (2014)","Peirce (1891)"],"f":"F3"},{"t":"Emanation without end","s":"Being cascades down through ever more levels and never reaches a last.","who":["Proclus (5th c.), as read by some","Ibn ‘Arabī (c. 1230)"],"f":"F3"},{"t":"Synechism","s":"Continuity is the fundamental fact; there are no ultimate discrete elements.","who":["Peirce (1892)","Hausman (1993)"],"f":"F3"},{"t":"Differance","s":"No final signified stops the play of signs; meaning is deferred forever.","who":["Derrida (1967)","Derrida (1972)","Gasché (1986)"],"f":"F3"},{"t":"Will to power without substance","s":"No thing and no substratum, only forces interpreting forces.","who":["Nietzsche (1880s)","Deleuze (1962)"],"f":"F3"},{"t":"Infinite hierarchy of levels","s":"Reality is a hierarchy of levels with no lowest, each real in its own right.","who":["Bohm (1957)","Ladyman & Ross (2007), rainforest realism"],"f":"F2"}]},{"t":"A loop","s":"It grounds itself.","who":["Penrose’s conformal cyclic cosmology","Bounce cosmologies","Stoic eternal return","Nietzsche’s eternal recurrence","Theravada dependent origination","Hegel’s Absolute"],"f":"F3","q":"What kind of loop?","kids":[{"t":"Mutual grounding","s":"Things ground each other in a web; dependence runs in circles and that is fine.","who":["Thompson (2016)","Bliss (2014)","Barnes (2018)","Nāgārjuna (c. 150)"],"f":"F3","q":"What holds the web up?","kids":[{"t":"Metaphysical coherentism","s":"Reality is a coherent web of mutual dependence with no foundation.","who":["Thompson (2016, 2018)","Bliss (2014)"],"f":"F3"},{"t":"Symmetric dependence","s":"Some things depend on each other symmetrically.","who":["Barnes (2018)","Morganti (2018)"],"f":"F3"},{"t":"Emptiness","s":"Nothing has own-being; everything is because everything else is.","who":["Nāgārjuna (c. 150)","Candrakīrti (7th c.)","Tsongkhapa (14th c.)"],"f":"F3","q":"Which Madhyamaka?","kids":[{"t":"Prāsaṅgika","s":"Refute every position by drawing out its consequences; assert nothing of one’s own.","who":["Buddhapālita (5th c.)","Candrakīrti (7th c.)","Tsongkhapa (14th c.)"],"f":"F3","q":"Which Tibetan reading?","kids":[{"t":"Gelug reading","s":"Conventional things exist as dependently arisen; only own-being is denied.","who":["Tsongkhapa (14th c.)","Khedrup Je"],"f":"F3"},{"t":"Sakya and Nyingma reading","s":"Even conventional existence is not asserted; the ultimate is freedom from all four extremes.","who":["Gorampa (15th c.)","Mipham (19th c.)"],"f":"F3"}]},{"t":"Svātantrika","s":"Emptiness can be established by independent arguments with conventionally accepted premises.","who":["Bhāviveka (6th c.)","Jñānagarbha (8th c.)"],"f":"F3"},{"t":"Yogācāra-Madhyamaka","s":"Mind-only is true conventionally; emptiness is true ultimately.","who":["Śāntarakṣita (8th c.)","Kamalaśīla (8th c.)"],"f":"F3"},{"t":"Shentong","s":"The ultimate is empty of other things but not of its own luminous nature.","who":["Dölpopa (14th c.)","Jamgön Kongtrül (19th c.)","Tāranātha"],"f":"F3"},{"t":"Chinese Sanlun","s":"Emptiness taught through the two truths and the middle path, as a Chinese school.","who":["Jizang (7th c.)","Sengzhao (5th c.)"],"f":"F3"}]},{"t":"Indra’s net","s":"Each jewel reflects all others; part contains whole.","who":["Fazang (7th c.)","Avataṃsaka Sūtra","Cook (1977)"],"f":"F3"}]},{"t":"Eternal recurrence","s":"Everything that happens has happened and will happen again, exactly, forever.","who":["Nietzsche (1882, 1883)","Stoics, Chrysippus (3rd c. BC)","Löwith (1935)"],"f":"F3","q":"Literal or as a test?","kids":[{"t":"Cosmological recurrence","s":"Finite states and infinite time force every configuration to recur.","who":["Nietzsche, notebooks (1881–88)","Poincaré (1890), recurrence theorem","Boltzmann (1896)"],"f":"F2"},{"t":"Existential test","s":"Will it so that you could want it again: the thought’s weight is ethical.","who":["Nietzsche (1882)","Deleuze (1962)","Nehamas (1985)"],"f":"F3"},{"t":"Stoic conflagration","s":"The cosmos burns and is remade identically, cycle after cycle.","who":["Chrysippus","Zeno of Citium","Origen’s report"],"f":"F3"}]},{"t":"Cyclic cosmologies","s":"Worlds are born, die and are born again; there is no first world.","who":["Purāṇas","Tolman (1934)","Steinhardt & Turok (2002)","Penrose (2010)"],"f":"F2","q":"Which cycle?","kids":[{"t":"Kalpas","s":"Brahmā’s days and nights of billions of years, endlessly repeated.","who":["Purāṇas","Manusmṛti","Buddhist Aggañña Sutta"],"f":"F3"},{"t":"Jain time-wheel","s":"Ascending and descending half-cycles turn forever with no creator.","who":["Jain āgamas","Umāsvāti (2nd c.)"],"f":"F3"},{"t":"Oscillating universe","s":"Bang, crunch, bang.","who":["Friedmann (1922)","Tolman (1934)"],"f":"F2"},{"t":"Ekpyrotic cycles","s":"Branes collide again and again.","who":["Steinhardt & Turok (2002, 2007)","Ijjas & Steinhardt (2019)"],"f":"F1"},{"t":"Conformal cyclic cosmology","s":"Each aeon’s end is the next aeon’s beginning.","who":["Penrose (2010)","Gurzadyan & Penrose (2013)"],"f":"F1"},{"t":"Empedoclean cycle","s":"Love unites and Strife divides, in turns, forever.","who":["Empedocles (c. 450 BC)","O’Brien (1969)"],"f":"F3"},{"t":"Entropy reset","s":"Dark energy or bounce physics dilutes entropy so the cycle can repeat.","who":["Baum & Frampton (2007)","Steinhardt & Turok (2002)"],"f":"F2"}]},{"t":"Hegel’s circle","s":"The system returns to its beginning enriched; the true infinite is a circle, not a line.","who":["Hegel (1812, 1817)","Houlgate (2006)"],"f":"F3","q":"What closes it?","kids":[{"t":"Absolute knowing","s":"Spirit knows itself as the whole; end and beginning coincide.","who":["Hegel (1807)","Houlgate (2013)"],"f":"F3"},{"t":"Circle of circles","s":"Each science is a circle and the whole is a circle of them.","who":["Hegel (1817)","Inwood (1992)"],"f":"F3"}]},{"t":"Self-creation","s":"The universe or ground brings itself about.","who":["Wheeler (1983)","Gott & Li (1998)","Spinoza (1677), causa sui"],"f":"F2","q":"How?","kids":[{"t":"Self-excited circuit","s":"Observers late in the universe give reality to its early stages.","who":["Wheeler (1983, 1990)","Zurek (1990), sympathetic"],"f":"F2"},{"t":"Closed timelike curve at the origin","s":"The universe’s first moment is caused by its own later state.","who":["Gott & Li (1998)","Gott (2001)"],"f":"F2"},{"t":"Causa sui","s":"That which is the cause of itself; existence belongs to its essence.","who":["Spinoza (1677)","Descartes (1641), on God"],"f":"F3"},{"t":"Bootstrap","s":"No particle is elementary; each is made of the others and the whole is self-consistent.","who":["Chew (1961, 1968)","Capra (1975)"],"f":"F2"}]},{"t":"Process without ground","s":"Reality is creative advance that refers only to itself; there is no bottom entity, only becoming.","who":["Whitehead (1929)","Bergson (1907)","Heraclitus"],"f":"F2","q":"What keeps it going?","kids":[{"t":"Creativity","s":"The many become one and are increased by one, forever.","who":["Whitehead (1929)","Hartshorne (1970)","Neville (1980), critique"],"f":"F2"},{"t":"Élan vital","s":"An impulse of life drives ceaseless novelty.","who":["Bergson (1907)","Deleuze (1966)"],"f":"F3"},{"t":"Everlasting fire","s":"Kindling in measures and going out in measures.","who":["Heraclitus (c. 500 BC)","Kahn (1979)"],"f":"F3"}]},{"t":"Strange loop","s":"Levels of a hierarchy fold back so that the top is the bottom; the self is such a loop.","who":["Hofstadter (1979, 2007)","Hofstadter & Dennett (1981)"],"f":"F2"},{"t":"Ouroboros of levels","s":"Each level of reality explains the next, and the last explains the first.","who":["Wheeler (1983)","Whitehead","Hegel"],"f":"F3"},{"t":"Rebirth without beginning","s":"The wheel of becoming has no discoverable first point.","who":["Buddha, Saṃyutta Nikāya","Buddhaghosa (5th c.)"],"f":"F3"},{"t":"Time loops of history","s":"Ages recur in pattern, from gods to heroes to men and back.","who":["Vico (1725)","Ibn Khaldūn (1377)","Spengler (1918)"],"f":"F3"}]},{"t":"Neither line nor loop","s":"Dependence has no shape at all; the question presupposes a structure that does not exist.","who":["Priest (2014)","Wittgenstein (1921)","Zhuangzi"],"f":"F4"},{"t":"Well-founded but bottomless","s":"Chains are infinite yet every set of things has a minimal member; regress without a single base.","who":["Dixon (2016)","Rabin & Rabern (2016)"],"f":"F3"}]}]},{"t":"What we are","s":"Neurons, information, a lens, or a witness.","q":"Is experience real as it seems?","doc":"04-mind.md","kids":[{"t":"No","s":"Introspection misreports the brain’s processing. You are a physical system with a misleading self-model.","who":["Dennett","Frankish","Graziano"],"addr":"C2-i","f":"F1","kids":[{"t":"Strong illusionism","s":"Phenomenal consciousness does not exist at all; introspection represents ordinary brain states as if they had special felt qualities.","who":["Frankish (2016)","Dennett (1991, 2016)","Kammerer (2019)","Humphrey (2011)"],"f":"F2","q":"How does the illusion get made?","kids":[{"t":"Multiple drafts and fame in the brain","s":"There is no single place or moment where content becomes conscious; whatever wins wide influence in the brain counts as conscious, after the fact.","who":["Dennett (1991)","Dennett (2005)"],"f":"F2","q":"How do we study it?","kids":[{"t":"Heterophenomenology","s":"Treat people's reports as data about what they believe they experience, without assuming the beliefs are true.","who":["Dennett (1991, 2003)","Dennett (2007)"],"f":"F2","q":"What does this say about zombies?","kids":[{"t":"Zimboes","s":"A zombie that also has beliefs about its own states is behaviourally identical to us, so the idea of a zombie adds nothing.","who":["Dennett (1991, 1995)","Kirk (2005), recanting his own zombie argument"],"f":"F2"},{"t":"Cartesian theatre denied","s":"There is no inner stage where things are presented to a viewer; that picture is the mistake behind the hard problem.","who":["Dennett (1991)","Ryle (1949)"],"f":"F2"}]},{"t":"User illusion","s":"Consciousness is like a computer desktop: a simplified interface the brain presents to itself, useful and misleading.","who":["Dennett (2017)","Nørretranders (1991)"],"f":"F2"},{"t":"Intentional stance","s":"Minds are what we attribute to systems when predicting them as rational agents; there is no deeper fact of the matter.","who":["Dennett (1971, 1987)","Davidson (1973)"],"f":"F2"}]},{"t":"Attention schema theory","s":"The brain builds a simplified model of its own attention; that model describes attention as a non-physical inner experience, and we believe the model.","who":["Graziano (2013, 2019)","Webb and Graziano (2015)"],"f":"F1","q":"What is the model for?","kids":[{"t":"Control of attention","s":"The schema exists to control attention, the way the body schema controls movement; awareness is the content of that control model.","who":["Graziano and Kastner (2011)","Webb, Kean and Graziano (2016)"],"f":"F1"},{"t":"Social attribution first","s":"The same machinery that models others' attention models our own, so awareness is a social tool tu
