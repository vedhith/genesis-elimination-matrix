<style>
:root{--bg:#EDF0F3;--ink:#1B2430;--muted:#7A8592;--line:#CBD3DB;--lamp:#B27418;--node:#F7F8FA;
 --f0:#2C7A58;--f1:#2A67A8;--f2:#8A96A3;--fg:#6A4C9E;--f3:#B27418;--f4:#1B2430;--focus:#2A67A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11171E;--ink:#E7EBEF;--muted:#8B97A4;--line:#2B3540;--lamp:#E2A749;--node:#182028;
 --f0:#5CBF92;--f1:#71A9E4;--f2:#8B97A4;--fg:#A98CDD;--f3:#E2A749;--f4:#E7EBEF;--focus:#71A9E4}}
:root[data-theme="dark"]{--bg:#11171E;--ink:#E7EBEF;--muted:#8B97A4;--line:#2B3540;--lamp:#E2A749;--node:#182028;
 --f0:#5CBF92;--f1:#71A9E4;--f2:#8B97A4;--fg:#A98CDD;--f3:#E2A749;--f4:#E7EBEF;--focus:#71A9E4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg line{stroke:var(--line);stroke-width:1.2}
.node{position:absolute;transform:translate(-50%,-50%);max-width:150px;text-align:center;font:500 16px/1.2 "Spectral",Georgia,serif;color:var(--ink);background:var(--node);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;text-wrap:balance;transition:transform .15s,border-color .15s;animation:pop .25s ease-out both}
.node:hover{transform:translate(-50%,-50%) scale(1.05);border-color:var(--lamp)}
.node:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.node.center{font:500 clamp(20px,3.2vw,28px)/1.15 "Spectral",Georgia,serif;max-width:min(300px,70vw);padding:14px 22px;cursor:default;border-color:var(--ink);animation:none}
.node.center:hover{transform:translate(-50%,-50%);border-color:var(--ink)}
.node.holder{cursor:default;color:var(--muted);border-style:dashed;font-weight:400}
.node.holder:hover{transform:translate(-50%,-50%);border-color:var(--line)}
.node.loop::before{content:"↺ ";color:var(--lamp)}
.node .n{display:block;font:400 11px/1 "IBM Plex Sans",sans-serif;color:var(--muted);margin-top:5px;letter-spacing:.02em}
.node .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.F0{background:var(--f0)}.F1{background:var(--f1)}.F2{background:var(--f2)}.FG{background:var(--fg)}.F3{background:var(--f3)}.F4{background:var(--f4)}.gate{background:transparent;border:1.5px solid var(--muted)}
#path{position:fixed;top:14px;left:16px;right:16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;z-index:2}
#path span{cursor:pointer}
#path span:hover{color:var(--ink)}
#path i{color:var(--line);font-style:normal}
#hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;z-index:2}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.node{animation:none;transition:none}}
</style>

<script>
const F = {F0:"settled",F1:"testable soon",F2:"knowable, no test yet",FG:"provably undecidable",F3:"closed to us, open to some mind",F4:"closed to all",gate:"constraint"};
const TREE = {"t":"Everything","q":"Five questions. Each splits by either/or until it cannot split further.","kids":[{"t":"A sample walk, end to end","s":"One position followed from the top to the bottom of every pillar. Yours, from the conversation.","walk":[{"path":[1],"why":"Start with what is real."},{"path":[1,0],"why":"You assumed the cascade of boxes ends somewhere."},{"path":[1,0,1],"why":"You placed the end beyond our logic."},{"path":[1,0,1,1],"why":"Not merely beyond us: beyond any mind. The Un-Concept."},{"path":[1,0,1,1,0],"why":"So the only honest speech about it is negation. This is where your Gate 2 already lives."},{"path":[2],"why":"Now what we are."},{"path":[2,1],"why":"Experience is real as it seems."},{"path":[2,1,2],"why":"Your Turn 7: feeling is the very thing from the start."},{"path":[3],"why":"Now what is right."},{"path":[3,1],"why":"With an ungraspable ground, nothing moral can be read off it, so realism has to come from nature or reason, or morality is built."},{"path":[3,1,2],"why":"Built by agents. Your ascent principle sits here as a virtue ethic."},{"path":[4],"why":"Now what we can know."},{"path":[4,5],"why":"The Un-Concept is closed to all. It cannot be shown non-empty from anywhere, which is why it can be held but never proven."},{"path":[5],"why":"And where we stand today."},{"path":[5,0],"why":"Nothing on any main axis is eliminated. Your position is open, like every other."}],"end":"Your full address: A1 B2b C1 D? · M2c N3 · F4"},{"t":"What is real","s":"Where the ground of everything is, and whether we can reach it.","q":"Is there a bottom to reality?","doc":"02-genesis.md","kids":[{"t":"There is a bottom","s":"The chain of explanations stops somewhere.","q":"Can that bottom be grasped?","kids":[{"t":"Graspable","s":"Statable in some logic we already have, even if untested.","addr":"B1","q":"Was our world made by anyone?","kids":[{"t":"Made","s":"An intention produced our layer.","addr":"B1 D1","q":"Made by what?","kids":[{"t":"Something one layer up","s":"A being inside a bigger reality built ours. The Sandbox.","addr":"B1 D1a","d":"The maker is not the bottom. Whatever we learn about it answers nothing about the ground. As you put it: just another box. A sandbox is a limitation, not the code, so being inside one does not make the outside unknowable, only unreachable.","q":"What does the maker want from us?","doc":"05-authorship.md","kids":[{"t":"Nothing","s":"We are a side effect or a data set.","who":["Bostrom’s ancestor simulations","Epicurean gods","Deism","Plato’s Timaeus craftsman, on one reading"],"addr":"D1a S0","f":"F2","d":"An indifferent maker gives no norms and answers nothing. Ethics has to be built from inside exactly as if the world were unmade.","q":"What sort of maker leaves us alone?","kids":[{"t":"Ancestor simulation","s":"Our descendants run us to study their own past; we are the data set.","who":["Bostrom (2003)","Hanson (2001)","Moravec (1988)"],"f":"F2","q":"Which horn of the trilemma?","kids":[{"t":"Almost nobody reaches simulating power","s":"Civilisations die or stall before they could run such worlds, so nearly none are run.","who":["Bostrom, first horn (2003)","Rees (2003)","Ord (2020)"],"f":"F2"},{"t":"Those who could, choose not to","s":"Mature civilisations converge on not running ancestor worlds, from ethics, law or boredom.","who":["Bostrom, second horn (2003)","Hanson (2001)","Greene (2020)"],"f":"F2"},{"t":"We are almost certainly simulated","s":"If such worlds are cheap and run, simulated minds vastly outnumber real ones, so we are probably among them.","who":["Bostrom, third horn (2003)","Chalmers (2022)","Musk (2016)"],"f":"F2","q":"How would we know?","kids":[{"t":"Lattice signatures","s":"A grid at the smallest scale would break rotation symmetry in the highest-energy cosmic rays.","who":["Beane, Davoudi & Savage (2012)","Bostrom (2003), as possibility"],"f":"F1"},{"t":"Glitches and shortcuts","s":"Saving compute would show as rendering errors, unexplained limits, or laziness where nobody looks.","who":["Whitworth (2008)","Campbell, Owhadi, Sauvageau & Watkinson (2017)"],"f":"F2"},{"t":"Undetectable in principle","s":"A good simulation is indistinguishable from base reality, so no experiment settles it.","who":["Chalmers (2022)","Bostrom (2003)","Ringel & Kovrizhin (2017)"],"f":"F3","q":"Then what does the hypothesis change?","kids":[{"t":"Nothing changes","s":"If undetectable, the hypothesis is idle for science and ethics alike.","who":["Carroll (2016)","Hossenfelder (2021)"],"f":"F3"},{"t":"Structural equivalence","s":"Simulated and unsimulated worlds share all structure, so the difference is not a difference in reality.","who":["Chalmers (2022)","Dainton (2012)"],"f":"F3"},{"t":"Odds still matter for action","s":"Even undetectable, the probability should shape how we treat possible simulators.","who":["Hanson (2001)","Bostrom (2003)"],"f":"F3"}]},{"t":"Odds near even at best","s":"Given the unknowns, the chance we are simulated is at most about one half.","who":["Kipping (2020)","Carroll (2016), sceptical"],"f":"F2"},{"t":"Reveal by policy","s":"The simulators would announce themselves if it suited them; silence is itself a choice.","who":["Hanson (2001)","Bostrom (2003)"],"f":"F3"}]}]},{"t":"Simulation realism","s":"Even if simulated, our world is real and made of bits; the maker owes us nothing and changes nothing.","who":["Chalmers (2022)","Deutsch (1997)"],"f":"F2"},{"t":"Universe grown in a lab","s":"A civilisation inflates a small region into a new universe; the maker never looks inside.","who":["Farhi & Guth (1987)","Linde (1992)","Harrison (1995)","Fischler, Morgan & Polchinski (1990)"],"f":"F2"},{"t":"Epicurean gods","s":"Gods exist, blissful and indifferent; they made nothing on purpose and mind nothing.","who":["Epicurus (c. 300 BC)","Lucretius (c. 55 BC)"],"f":"F3"},{"t":"Deism","s":"A maker set the laws and left; it does not intervene or answer.","who":["Herbert of Cherbury (1624)","Toland (1696)","Tindal (1730)","Voltaire","Paine (1794)","Jefferson"],"f":"F2","q":"Does it still watch?","kids":[{"t":"Absent watchmaker","s":"Made the machine and departed; prayer reaches nobody.","who":["Voltaire","Toland (1696)","Franklin, early"],"f":"F3"},{"t":"Judges later, acts never","s":"Providence rewards and punishes after death but does not interfere now.","who":["Tindal (1730)","Jefferson (1813)","Paine (1794)"],"f":"F3"},{"t":"Pandeism","s":"The maker became the universe, so no separate maker is left to want anything.","who":["Lazarus (1859)","Weinstein (1910)","Mapson (2011)"],"f":"F2"}]},{"t":"Timaeus craftsman","s":"A divine craftsman shaped disorder by looking to eternal forms, then handed the world to lesser gods.","who":["Plato, Timaeus (c. 360 BC)","Numenius (2nd c.)","Philo of Alexandria"],"f":"F3"}]},{"t":"Something, but not our good or evil","s":"It has attitudes. They are not shaped by survival, so they do not map onto ours.","who":["Your Architect (Turn 12)","Cosmicism (Lovecraft)","Some readings of Job"],"addr":"D1a S±","f":"F2","d":"Your deduction that the maker must feel emotion because it built emotion does not hold. Evolution built emotion with none of its own. So indifference stays open. But if it does have values, nothing says they track ours, and nothing says they bind us.","q":"What does it care about instead?","kids":[{"t":"Cosmicism","s":"The makers are vast and alien; human values are a local accident they do not notice.","who":["Lovecraft (1927)","Ligotti (2010)","Joshi (1990)"],"f":"F3"},{"t":"The ignorant demiurge","s":"The maker believes it is the highest god; it is not, and its blindness, not malice, explains the world.","who":["Valentinus (c. 150)","Ptolemy the Gnostic","Basilides (c. 130)"],"f":"F3","q":"How did it get there?","kids":[{"t":"Fall of Sophia","s":"The maker was born from an aeon’s misstep outside the divine fullness.","who":["Ptolemy’s Valentinians","Gospel of Truth","Irenaeus’ report (c. 180)"],"f":"F3"},{"t":"Pleroma above the maker","s":"Beyond the maker is a fullness of aeons around an unknowable Father.","who":["Valentinus","Tripartite Tractate","Heracleon"],"f":"F3"},{"t":"Basilidean nonexistent God","s":"The ultimate is a ‘not-being God’ who sowed a world-seed; the ruler that grew from it thinks itself supreme.","who":["Basilides (c. 130)","Hippolytus’ report"],"f":"F3"}]},{"t":"The maker wants to become conscious through us","s":"We are the means by which the maker comes to know itself; our welfare is beside the point.","who":["Schelling (1815)","Hegel (1807)","Jung (1952)"],"f":"F3"},{"t":"The maker wants beauty or richness","s":"Worlds are made for the sake of variety, order or beauty, not for their inhabitants.","who":["Plato, Timaeus 29e","Plotinus (c. 270)","Leibniz (1686)"],"f":"F3"},{"t":"Research or entertainment","s":"Simulators pursue their own experiments or games; our suffering is a side effect of the run.","who":["Bostrom (2003)","Hanson (2001)","Greene (2020)","Chalmers (2022)"],"f":"F3"},{"t":"Hume’s alternative makers","s":"An infant god, a senile god, a committee, or a dead one all fit the world as well as a good one.","who":["Hume, Dialogues V (1779)","Philo, Hume’s spokesman"],"f":"F3"}]},{"t":"Our good","s":"It wants what we would call our good.","addr":"D1a S+","q":"Then why is there suffering?","kids":[{"t":"Suffering is the price of free agents","s":"Denies that the suffering is gratuitous.","who":["Plantinga, free will defense (1974)"],"f":"gate","d":"Widely held to answer the strict logical form of the problem of evil. The cost is denying that any suffering is gratuitous."},{"t":"Suffering builds souls","s":"Hardship is developmental.","who":["John Hick","Irenaeus"],"f":"gate"},{"t":"We cannot judge what is gratuitous","s":"Our view is too small to call any suffering pointless.","who":["Wykstra","Bergmann (skeptical theism)"],"f":"gate"},{"t":"The maker is not all-powerful","s":"Relaxes omnipotence instead.","who":["Process theology (Hartshorne)","Open theism"],"f":"gate"},{"t":"Evil is only the absence of good","s":"Not a thing that was made.","who":["Augustine"],"f":"gate"},{"t":"None of these work","s":"The amount and spread of suffering makes a good, all-powerful maker improbable.","who":["Rowe (1979), evidential problem of evil","Hume, Dialogues","Mackie (1955)","Epicurus"],"f":"gate","d":"This is your Gate 1. Corrected status: strong evidential pressure on a good and all-powerful maker, not a mathematical impossibility. Every escape above costs exactly one attribute.","doc":"05-authorship.md §4"},{"t":"Simulated pain is shallower than it feels","s":"If we are simulated, our suffering may be sparse, cheap, or not what the maker sees from outside.","who":["Chalmers (2022)","Bostrom (2003)"],"f":"gate"},{"t":"A school run from above","s":"A finite teacher uses hardship to educate; soul-making with a maker one layer up.","who":["Blavatsky (1888)","Kardec (1857)","Hick (1966), adapted"],"f":"gate"},{"t":"Budget, not malice","s":"A finite maker could not afford a better world; imperfection is cost.","who":["Mill (1874)","Plato, Timaeus on necessity"],"f":"gate"}]},{"t":"Our harm","s":"It wants us to suffer.","who":["Gnostic demiurge","Marcion","Descartes’ demon, as a hypothesis"],"addr":"D1a S−","f":"F2","q":"Which version of the hostile maker?","kids":[{"t":"Sethian demiurge","s":"Yaldabaoth, blind and arrogant, made the material world as a prison for sparks of light.","who":["Apocryphon of John (c. 180)","Hypostasis of the Archons","Trimorphic Protennoia"],"f":"F3","q":"How do we get out?","kids":[{"t":"Knowledge wakes the spark","s":"A call from above reminds the trapped spark what it is.","who":["Apocryphon of John","Gospel of Judas"],"f":"F3"},{"t":"Ascent past the rulers","s":"The soul climbs through hostile planetary rulers using passwords.","who":["Ophites (Origen’s report)","First Apocalypse of James"],"f":"F3"}]},{"t":"Marcion’s just but harsh creator","s":"The lawgiver god made this world and is legalistic and cruel; a stranger good God rescues us from him.","who":["Marcion (c. 144)","Apelles","Tertullian’s report"],"f":"F3"},{"t":"Manichaean captivity","s":"Light is trapped in matter shaped by darkness; the world is a machine for its slow release.","who":["Mani (240s)","Kephalaia","Augustine before 386"],"f":"F3"},{"t":"Cathar Rex Mundi","s":"The visible world is Satan’s work; the good God made only spirit.","who":["Cathars (12th–13th c.)","Bogomils (10th c.)","Book of the Two Principles (c. 1250)"],"f":"F3"},{"t":"Mandaean Ptahil","s":"A lesser being formed the material world in a botched act; the soul must return to the Lightworld.","who":["Ginza Rabba","Buckley (2002)"],"f":"F3"},{"t":"Descartes’ deceiver","s":"A being of highest power devotes itself to deceiving me; a hypothesis raised to be defeated.","who":["Descartes (1641)","Putnam, brain in a vat (1981)"],"f":"F3"},{"t":"Evil-god challenge","s":"An all-evil maker fits the evidence as well as an all-good one; whatever excuses one excuses the other.","who":["Cahn (1977)","Law (2010)","Millican"],"f":"gate"},{"t":"Malevolent simulators","s":"Our simulators may torture us for study or sport; nothing in the hypothesis rules it out.","who":["Bostrom (2003)","Dainton (2012)","Chalmers (2022)"],"f":"F3"}]},{"t":"We cannot tell","s":"Its stance is beyond us.","who":["Job’s conclusion","Agnostic theism"],"addr":"D1a S?","f":"F3","q":"Why is it hidden?","kids":[{"t":"Job’s whirlwind","s":"The maker answers only that its scale is beyond judgement.","who":["Job 38–42","Maimonides, Guide III.22–23 (1190)"],"f":"F3"},{"t":"Agnostic theism","s":"A maker exists, but its will is not for us to know.","who":["Huxley (1869)","Spencer (1862)","Hamilton (1829)"],"f":"F3"},{"t":"Simulation purpose is opaque","s":"Even if we are simulated, nothing inside the run says why it was run.","who":["Chalmers (2022)","Bostrom (2003)"],"f":"F3"},{"t":"Hiddenness as evidence","s":"A loving maker would make itself available; it does not; so either hidden for reasons or absent.","who":["Schellenberg (1993, 2015)","Pascal (1670)","Howard-Snyder & Moser (2002)"],"f":"gate"}]},{"t":"Is the maker itself made?","s":"Same question, one layer up. The Infinite Box Cascade.","goto":[1]}]},{"t":"The bottom itself","s":"The ground is a mind that willed our world. The classical God.","addr":"B1 D1b","q":"What does it want?","kids":[{"t":"Our good","s":"All-good, all-powerful, all-knowing.","who":["Classical Christianity","Sunni Islam (Ash’arite and Mu’tazilite)","Rabbinic Judaism","Sikhism","Bahá’í","Berkeley","Leibniz"],"addr":"D1b S+","q":"Then why is there suffering?","kids":[{"t":"Suffering is the price of free agents","s":"Denies that the suffering is gratuitous.","who":["Plantinga, free will defense (1974)"],"f":"gate","d":"Widely held to answer the strict logical form of the problem of evil. The cost is denying that any suffering is gratuitous.","q":"Which free-will story?","kids":[{"t":"Transworld depravity","s":"Maybe every possible free creature would go wrong somewhere, so God could not make free beings who never sin.","who":["Plantinga (1974)","Otte (2009), critique","Pruss (2012)"],"f":"gate"},{"t":"Natural evil from fallen spirits","s":"Earthquakes and disease trace to the misused freedom of non-human agents.","who":["Plantinga (1974)","C.S. Lewis (1940)","Boyd (2001)"],"f":"gate"},{"t":"Regular laws are needed for choice to matter","s":"A world stable enough to act in must sometimes hurt its agents.","who":["Reichenbach (1982)","Swinburne (1998)","Tennant (1930)"],"f":"gate"},{"t":"Freedom worth the cost","s":"Real freedom, including to do great harm, is worth more than a safe puppet world.","who":["Swinburne (1998)","Lewis (1940)","Hick (1966)"],"f":"gate"},{"t":"How God knows free choices","s":"How a maker could both know and leave free what creatures do.","who":["Molina","Bañez","Ockham","Pinnock"],"f":"F3","q":"How?","kids":[{"t":"Molinism","s":"God knows what each creature would freely do in every circumstance and picks a world accordingly.","who":["Molina (1588)","Suárez","Flint (1998)","Craig (1987)"],"f":"F3","q":"Does the grounding objection succeed?","kids":[{"t":"Grounding objection","s":"Nothing makes counterfactuals of freedom true before the creature exists, so God has nothing to know.","who":["R.M. Adams (1977)","Hasker (1989)","Perszyk (2011)"],"f":"gate","q":"Reply?","kids":[{"t":"Brute truths need no grounds","s":"Some truths are ungrounded; these are among them.","who":["Plantinga (1985)","Craig (2001)"],"f":"F3"},{"t":"Grounded in the creature’s nature","s":"The counterfactuals are true in virtue of what the creature would be.","who":["Flint (1998)","Freddoso (1988)"],"f":"F3"},{"t":"Objection stands","s":"Without truthmakers, middle knowledge is empty.","who":["Hasker (1989, 2011)","Adams (1977)"],"f":"gate"}]},{"t":"Congruism","s":"God arranges circumstances congruent with each will so that grace is efficacious yet free.","who":["Suárez (1600)","Bellarmine","Lessius"],"f":"F3"}]},{"t":"Bañezian premotion","s":"God moves the will infallibly and it stays free; God knows by causing.","who":["Bañez (1584)","Garrigou-Lagrange (1936)","Thomists"],"f":"F3"},{"t":"Simple foreknowledge","s":"God just sees the future; seeing does not fix it.","who":["Boethius (c. 524)","Ockham (1320s)","Arminius (1608)","Wesley"],"f":"F3"},{"t":"Open future","s":"God does not know undetermined future choices, since there is nothing yet to know.","who":["Hasker (1989)","Pinnock (1994)","Boyd (2000)","Sanders (1998)"],"f":"F3"},{"t":"Calvinist determination","s":"God ordains all things, including sin, for his ends; freedom is compatibilist.","who":["Calvin (1559)","Edwards (1754)","Helm (1993)","Frame"],"f":"F3"}]}]},{"t":"Suffering builds souls","s":"Hardship is developmental.","who":["John Hick","Irenaeus"],"f":"gate","q":"Which growth story?","kids":[{"t":"Two-stage creation","s":"Humans are made immature and grow toward God’s likeness through struggle.","who":["Irenaeus (c. 180)","Hick (1966)"],"f":"gate"},{"t":"Epistemic distance","s":"God stays hidden so that faith and virtue can form freely.","who":["Hick (1966)","Murray (1993)","Swinburne (1998)"],"f":"gate"},{"t":"Theosis","s":"Suffering is part of being drawn into God’s life; the goal is union, not comfort.","who":["Maximus the Confessor (7th c.)","Gregory of Nyssa","Palamas (1340s)"],"f":"gate"},{"t":"Horrendous evils engulfed","s":"Some evils cannot be justified but can be swallowed up by later union with God.","who":["M. Adams (1999)","Stump (2010)"],"f":"gate"},{"t":"Everyone is saved in the end","s":"Every soul reaches God, so no suffering is final.","who":["Origen (3rd c.)","Gregory of Nyssa","Talbott (1999)","Hart (2019)"],"f":"gate"},{"t":"Redemptive suffering","s":"Suffering shared with God can itself be good, as the cross was.","who":["Weil (1942)","Moltmann (1972)","John Paul II (1984)"],"f":"gate"}]},{"t":"We cannot judge what is gratuitous","s":"Our view is too small to call any suffering pointless.","who":["Wykstra","Bergmann (skeptical theism)"],"f":"gate","q":"Why trust our blindness?","kids":[{"t":"CORNEA","s":"We may say ‘no reason appears’ only when we would likely see one if it were there; here we would not.","who":["Wykstra (1984)","Wykstra & Perrine (2012)"],"f":"gate","q":"Does it hold?","kids":[{"t":"Parent analogy","s":"As a child cannot see a parent’s reasons, we cannot see God’s.","who":["Wykstra (1984)","Wykstra & Perrine (2012)"],"f":"gate"},{"t":"Parent analogy fails","s":"A loving parent stays present and explains; God does neither.","who":["Rowe (1984)","Dougherty (2008)","Trakakis (2007)"],"f":"gate"}]},{"t":"No-see-um inferences fail","s":"Our grasp of possible goods and their links to evils is too thin to judge.","who":["Bergmann (2001)","Alston (1991)"],"f":"gate"},{"t":"No minimum of evil","s":"There is no least amount of suffering God could allow; any line is arbitrary, so ‘too much’ has no bite.","who":["van Inwagen (2006)","Rowe (2006), reply"],"f":"gate"},{"t":"Scepticism stays local","s":"Doubting our grasp of God’s reasons need not undercut moral knowledge or trust.","who":["Bergmann & Rea (2005)","Dougherty (2011)","Almeida & Oppy (2003), objection"],"f":"gate"}]},{"t":"The maker is not all-powerful","s":"Relaxes omnipotence instead.","who":["Process theology (Hartshorne)","Open theism"],"f":"gate","q":"Limited how?","kids":[{"t":"Process theism","s":"God persuades but cannot coerce; every actual entity has its own power.","who":["Whitehead (1929)","Hartshorne (1941)","Cobb & Griffin (1976)"],"f":"F3","q":"What is God’s shape in time?","kids":[{"t":"Dipolar God","s":"God has an unchanging character and a changing experience of the world.","who":["Hartshorne (1948)","Cobb (1965)","Viney (1985)"],"f":"F3"},{"t":"Fellow sufferer who understands","s":"God takes in every experience and is changed by it.","who":["Whitehead (1929)","Griffin (1976)"],"f":"F3"},{"t":"Creativity above God","s":"The ultimate is creativity; God is its chief but not sole instance.","who":["Whitehead (1929)","Neville (1980), critique"],"f":"F3"}]},{"t":"Open theism","s":"God chose a risky world and neither knows nor controls free outcomes.","who":["Pinnock, Rice, Sanders, Hasker & Basinger (1994)","Boyd (2000)"],"f":"gate"},{"t":"Kenotic self-limitation","s":"God freely empties itself of power to make room for creatures.","who":["Moltmann (1985)","Vanstone (1977)","Polkinghorne (2001)","Fiddes (1988)"],"f":"gate"},{"t":"Finite god","s":"God is good but simply limited; it fights evil alongside us.","who":["Mill (1874)","Brightman (1940)","Kushner (1981)","McMurrin (1965)"],"f":"gate"},{"t":"Logical limits only","s":"God cannot do the impossible; some goods logically require evils.","who":["Aquinas (ST I.25.3)","Plantinga (1974)","Mackie (1955), conceding"],"f":"gate"},{"t":"Growing god","s":"God develops with the world and is not yet complete.","who":["Alexander (1920)","Teilhard (1955)","Brightman (1940)"],"f":"gate"}]},{"t":"Evil is only the absence of good","s":"Not a thing that was made.","who":["Augustine"],"f":"gate","q":"Privation how?","kids":[{"t":"Augustinian privation","s":"Evil is a corruption of a good nature, never a thing God made.","who":["Augustine, Confessions VII (c. 400)","Enchiridion"],"f":"gate"},{"t":"Thomist privation","s":"Evil is the lack of a due good, caused by finite causes failing.","who":["Aquinas (ST I.48–49)","Maritain (1942)"],"f":"gate"},{"t":"Edge of emanation","s":"Evil is the fading of the One’s light at the last reach of matter.","who":["Plotinus, Ennead I.8 (c. 270)","Proclus (5th c.)"],"f":"gate"},{"t":"Metaphysical evil of finitude","s":"Any created thing is limited; limitation is the root of all evils.","who":["Leibniz (1710)","Wolff (1720)"],"f":"gate"},{"t":"Evil as illusion","s":"Evil is unreal; correct seeing dissolves it.","who":["Eddy (1875)","Advaita on ignorance","Stoics on externals"],"f":"gate"}]},{"t":"None of these work","s":"The amount and spread of suffering makes a good, all-powerful maker improbable.","who":["Rowe (1979), evidential problem of evil","Hume, Dialogues","Mackie (1955)","Epicurus"],"f":"gate","d":"This is your Gate 1. Corrected status: strong evidential pressure on a good and all-powerful maker, not a mathematical impossibility. Every escape above costs exactly one attribute.","doc":"05-authorship.md §4","q":"Which form of the argument?","kids":[{"t":"Logical problem","s":"A good, all-powerful God and evil are strictly inconsistent.","who":["Epicurus (via Lactantius)","Mackie (1955)","McCloskey (1960)","Sterba (2019)"],"f":"gate"},{"t":"Evidential problem","s":"Pointless-looking suffering makes God improbable.","who":["Rowe (1979, 1996)","Tooley (2008)","Trakakis (2007)"],"f":"gate"},{"t":"Hypothesis of indifference","s":"An indifferent source explains the pattern of pain and pleasure better than a good one.","who":["Draper (1989)","Hume, Dialogues X–XI (1779)"],"f":"gate"},{"t":"Animal and prehuman suffering","s":"Ages of animal pain before humans defeat free-will and soul-making stories.","who":["Rowe (1979)","Darwin (1860)","Murray (2008), reply","Southgate (2008), reply"],"f":"gate"},{"t":"Divine hiddenness","s":"A loving God would make itself available; nonresistant nonbelievers exist; so no such God.","who":["Schellenberg (1993, 2015)","Drange (1998)","Maitzen (2006)"],"f":"gate"},{"t":"Rebellion","s":"Even if a justification exists, no decent being would accept it.","who":["Dostoevsky (1880)","Camus (1947)","Phillips (2004)"],"f":"gate"}]},{"t":"Best of all possible worlds","s":"God chose the best world overall; local evils are part of the optimum.","who":["Leibniz (1710)","Malebranche (1680)","Plantinga (1974), no best world"],"f":"gate"},{"t":"Felix culpa","s":"A world with fall and redemption is better than one with neither.","who":["Plantinga (2004)","Aquinas","Milton (1667)"],"f":"gate"},{"t":"Karma across lives","s":"Suffering is the fruit of one’s own past deeds; God administers, does not author.","who":["Rāmānuja (11th c.)","Madhva (13th c.)","Reichenbach (1990)","Chadha & Trakakis (2007)"],"f":"gate"},{"t":"Penalty for the Fall","s":"All suffering is just punishment for inherited sin.","who":["Augustine (c. 420)","Calvin (1559)","Edwards (1758)"],"f":"gate"},{"t":"Refuse the question","s":"Explaining evil is itself immoral or confused; faith should protest or fall silent.","who":["Surin (1986)","Tilley (1991)","Roth (1981)","Phillips (2004)","Trakakis (2008)"],"f":"gate"},{"t":"God suffers too","s":"A God who suffers with us is not indicted like a distant judge.","who":["Bonhoeffer (1944)","Moltmann (1972)","Fiddes (1988)"],"f":"gate"},{"t":"What is the good maker like?","s":"Accounts of the maker’s nature that shape every answer above.","who":["Aquinas","Hartshorne","Swinburne","Rāmānuja"],"f":"F3","q":"How does it stand to the world?","kids":[{"t":"Classical theism","s":"Simple, unchanging, timeless, without passions, wholly other yet the cause of all.","who":["Augustine","Anselm (1078)","Avicenna (c. 1020)","Maimonides (1190)","Aquinas (1265–74)"],"f":"F3","q":"Which school?","kids":[{"t":"Thomism","s":"God is pure act and being itself; creatures share being by analogy.","who":["Aquinas","Cajetan (1498)","Garrigou-Lagrange (1936)","Feser (2017)"],"f":"F3","q":"Which reading?","kids":[{"t":"Analogy of being","s":"God-talk is neither literal nor merely metaphorical; it is proportional.","who":["Aquinas (ST I.13)","Cajetan (1498)","Przywara (1932)"],"f":"F3"},{"t":"Divine simplicity","s":"God has no parts; his attributes are identical to him.","who":["Aquinas (ST I.3)","Dolezal (2011)","Plantinga (1980), objection"],"f":"F3","q":"Does it collapse all modality?","kids":[{"t":"Modal collapse objection","s":"If God is identical to his act of creating, and God is necessary, creation is necessary.","who":["Mullins (2016)","Schmid (2022)","Moreland & Craig (2003)"],"f":"gate"},{"t":"Truthmaker reply","s":"God’s intrinsic act is one and necessary; what it makes true varies with the world.","who":["Brower (2008)","Bergmann & Brower (2006)"],"f":"F3"},{"t":"Extrinsic predication reply","s":"Talk of God creating is true in virtue of creatures, not of a change in God.","who":["Stump (2003)","Grant (2019)","Tomaszewski (2019)"],"f":"F3"},{"t":"Apophatic reply","s":"Simplicity is a rule for what not to say, so no collapse follows.","who":["Duby (2016)","Dolezal (2011)"],"f":"F3"}]},{"t":"Timeless presence","s":"God’s eternity is the whole of life possessed at once.","who":["Boethius (c. 524)","Stump & Kretzmann (1981)"],"f":"F3"},{"t":"Existential Thomism","s":"The act of existing, not essence, is the heart of God and things.","who":["Gilson (1948)","Maritain (1947)"],"f":"F3"},{"t":"Analytic Thomism","s":"Aquinas restated in modern logic and philosophy of mind.","who":["Haldane (1997)","Kerr (2002)","Stump (2003)"],"f":"F3"}]},{"t":"Scotism","s":"Being is said in one sense of God and creatures; God is infinite being and will is prior to intellect.","who":["Duns Scotus (c. 1300)","Cross (1999)","Williams (1998)"],"f":"F3"},{"t":"Palamism","s":"God’s essence is unknowable, but his energies are truly shared with creatures.","who":["Gregory Palamas (1340s)","Lossky (1944)","Bradshaw (2004)"],"f":"F3"},{"t":"Ash‘arism","s":"God’s will is the sole cause each moment; good is what God commands; attributes are real but unlike ours.","who":["al-Ash‘arī (c. 930)","al-Juwaynī","al-Ghazālī (1095)","Fakhr al-Dīn al-Rāzī"],"f":"F3"},{"t":"Mu‘tazilism","s":"God is one and just; reason knows good; the Qur’an is created; humans author their acts.","who":["Wāṣil ibn ‘Aṭā’ (8th c.)","Abd al-Jabbār (10th c.)","al-Zamakhsharī"],"f":"F3"},{"t":"Māturīdism","s":"Reason knows some good, but God’s command still makes it binding.","who":["al-Māturīdī (d. 944)","al-Nasafī (12th c.)"],"f":"F3"},{"t":"Maimonidean","s":"God’s attributes are only negations or actions; anthropomorphism is idolatry.","who":["Maimonides (1190)","Gersonides (1329)","Crescas (1410), critique"],"f":"F3"},{"t":"Reformed scholasticism","s":"God decrees all; his knowledge is of his own will; he deals by covenant.","who":["Calvin (1559)","Turretin (1679)","Owen","Bavinck (1895)"],"f":"F3"}]},{"t":"Theistic personalism","s":"God is a person, everlasting in time, with beliefs that change and no simplicity.","who":["Swinburne (1977)","Wolterstorff (1975)","Plantinga (1980)","Craig","Hasker"],"f":"F3","q":"Is God in time?","kids":[{"t":"Everlasting in time","s":"God has always existed and always will; he remembers and anticipates.","who":["Pike (1970)","Wolterstorff (1975)","Swinburne (1977)","Hasker (1989)"],"f":"F3"},{"t":"Timeless until creation, temporal since","s":"Without a world God is timeless; with one he enters time.","who":["Craig (2001)","Padgett (1992), relative timelessness"],"f":"F3"},{"t":"Timeless but really related","s":"God is outside time yet stands in real relations to temporal things.","who":["Leftow (1991)","Helm (1988)"],"f":"F3"}]},{"t":"Panentheism","s":"The world is in God, but God exceeds the world.","who":["Krause (1828)","Hartshorne","Clayton (2004)","Moltmann (1985)","Peacocke (1993)"],"f":"F3","q":"How is the world in God?","kids":[{"t":"World as God’s body","s":"Souls and matter are God’s body; he is their inner self.","who":["Rāmānuja (11th c.)","Jantzen (1984)"],"f":"F3"},{"t":"Emanation and return","s":"All flows out of God and returns to him without leaving him.","who":["Eriugena (c. 867)","Cusanus (1440)","Plotinus, adapted"],"f":"F3"},{"t":"Withdrawal to make room","s":"God contracted himself to open a space for a world that remains within him.","who":["Luria (16th c.)","Cordovero (1548)","Scholem (1941)"],"f":"F3"},{"t":"Unity of being","s":"Only God truly is; the world is his self-showing.","who":["Ibn ‘Arabī (c. 1230)","al-Qūnawī","Ibn Taymiyya, critique"],"f":"F3"},{"t":"God completing himself in history","s":"God becomes fully himself through the world’s development.","who":["Hegel (1807)","Pannenberg (1988)","Moltmann"],"f":"F3"},{"t":"Naturalistic panentheism","s":"The universe is God’s body and God its whole or mind, with no supernatural extra.","who":["Peacocke (1993)","Clayton (2004)","Bracken (2001)"],"f":"F3"}]},{"t":"Hindu theisms","s":"One Lord relates to souls and world in ways the schools dispute.","who":["Rāmānuja","Madhva","Vallabha","Caitanya","Meykaṇṭār"],"f":"F3","q":"How do soul, world and Lord relate?","kids":[{"t":"Viśiṣṭādvaita","s":"Souls and matter are real modes of one God, as body to soul.","who":["Rāmānuja (11th c.)","Yāmuna","Vedānta Deśika (14th c.)"],"f":"F3"},{"t":"Dvaita","s":"God, souls and matter are eternally distinct; God alone is independent.","who":["Madhva (13th c.)","Jayatīrtha","Vyāsatīrtha"],"f":"F3"},{"t":"Acintya-bhedābheda","s":"Difference and non-difference at once, inconceivably.","who":["Caitanya (16th c.)","Jīva Gosvāmī","Prabhupāda (1966)"],"f":"F3"},{"t":"Śuddhādvaita","s":"The world is God, pure and undivided; no illusion.","who":["Vallabha (16th c.)","Viṭṭhalanātha (16th c.)"],"f":"F3"},{"t":"Dvaitādvaita","s":"Both different and non-different from God.","who":["Nimbārka (13th c.)","Bhāskara (9th c.)"],"f":"F3"},{"t":"Śaiva Siddhānta","s":"Three eternal realities: Lord, souls, bonds; Śiva frees souls.","who":["Tirumūlar","Meykaṇṭār (13th c.)","Aghoraśiva"],"f":"F3"}]},{"t":"How many in the one?","s":"Whether the maker is internally one or plural.","who":["Nicaea (325)","Swinburne","Leftow","al-Ghazālī"],"f":"F3","q":"One person or several?","kids":[{"t":"Nicene Trinity","s":"One God in three persons.","who":["Nicaea (325)","Constantinople (381)","Augustine (c. 420)","Cappadocians"],"f":"F3"},{"t":"Social trinitarianism","s":"Three centres of consciousness in perfect unity.","who":["Swinburne (1994)","C. Plantinga (1989)","Moltmann (1980)","Zizioulas (1985)"],"f":"F3"},{"t":"Latin trinitarianism","s":"One mind, three ways of being it.","who":["Augustine","Aquinas","Leftow (2004)","Brower & Rea (2005)"],"f":"F3"},{"t":"Strict oneness","s":"God is absolutely one, without persons or partners.","who":["Qur’an 112","al-Ghazālī","Ibn Taymiyya","Maimonides"],"f":"F3"},{"t":"Unitarianism","s":"God is one person; Jesus is not God.","who":["Socinus (1590s)","Priestley (1782)","Channing (1819)"],"f":"F3"},{"t":"Modalism","s":"One person appearing in three modes.","who":["Sabellius (3rd c.)","Oneness Pentecostalism (1914)"],"f":"F3"},{"t":"Subordinationism","s":"The Son is a creature or lesser than the Father.","who":["Arius (c. 320)","Eunomius","Jehovah’s Witnesses (1879)"],"f":"F3"}]},{"t":"Finite embodied God","s":"God is an exalted embodied person who progressed; matter and intelligence are eternal.","who":["Joseph Smith (1844)","Pratt (1855)","McMurrin (1965)","Ostler (2001)"],"f":"F3"},{"t":"Known only by self-disclosure","s":"Nothing about the maker can be read off the world; only its own word reveals it.","who":["Pascal (1670)","Kierkegaard (1844)","Barth (1932)","Plantinga (2000)"],"f":"F3"},{"t":"God beyond theism","s":"God is not a being among beings but being-itself; personal talk is symbol.","who":["Tillich (1951)","Robinson (1963)","Macquarrie (1966)"],"f":"F3"},{"t":"Ik Onkar","s":"One formless creator, within and beyond, known by grace and name.","who":["Guru Nanak (c. 1500)","Guru Granth Sahib"],"f":"F3"},{"t":"Unknowable essence, progressive messengers","s":"God’s essence cannot be known; manifestations reveal attributes age by age.","who":["Bahá’u’lláh (1860s)","‘Abdu’l-Bahá"],"f":"F3"}]}]},{"t":"Both creation and destruction","s":"Aspects that do not reduce to human good.","who":["Shaiva and Vaishnava Hinduism","Kashmir Shaivism"],"addr":"D1b S±","f":"F2","q":"Which face of the maker?","kids":[{"t":"Trimūrti","s":"One God as three functions: making, keeping, ending.","who":["Purāṇas (c. 300–1000)","Kālidāsa (5th c.)"],"f":"F3"},{"t":"Śiva destroyer-creator","s":"Destruction is the condition of renewal; the dance ends and begins worlds.","who":["Śaiva Purāṇas","Chola Nataraja","Coomaraswamy (1918)"],"f":"F3"},{"t":"Śākta Kālī","s":"The Mother births and devours; both are grace.","who":["Devī Māhātmya (c. 500)","Rāmprasād Sen (18th c.)","Ramakrishna (19th c.)"],"f":"F3"},{"t":"Līlā","s":"The world is God’s play; making and unmaking have no end beyond play.","who":["Brahma Sūtra 2.1.33","Bhāgavata Purāṇa","Watts (1966)"],"f":"F3"},{"t":"Answer to Job","s":"God has an unconscious shadow and needs humans to become conscious of it.","who":["Jung (1952)","Edinger (1992)"],"f":"F3"},{"t":"Mysterium tremendum","s":"The holy is dread and pull at once; morality is a late overlay.","who":["Otto (1917)","Eliade (1957)"],"f":"F3"},{"t":"Deus absconditus","s":"God’s hidden will works destruction as well as mercy; we cling only to the revealed word.","who":["Luther (1525)","Isaiah 45:7"],"f":"F3"},{"t":"Double predestination","s":"God freely elects some to glory and others to ruin for his glory.","who":["Gottschalk (9th c.)","Calvin (1559)","Beza (1582)"],"f":"F3"},{"t":"Heraclitean god","s":"God is day and night, war and peace, surfeit and hunger.","who":["Heraclitus (c. 500 BC)","Kahn (1979), reading"],"f":"F3"},{"t":"Zurvanite time-god","s":"Both the good and the evil spirit are sons of one Time.","who":["Zurvanism (Sasanian era)","Zaehner (1955)"],"f":"F3"}]},{"t":"Two makers, one good, one evil","s":"The world is their battlefield.","who":["Zoroastrianism","Manichaeism"],"addr":"D1b C5 S{+,−}","f":"F2","q":"Which dualism?","kids":[{"t":"Zoroastrian","s":"Ahura Mazda made good; Angra Mainyu counter-created; the war ends in good’s victory.","who":["Zarathustra, Gathas (c. 1200–600 BC)","Bundahishn","Boyce (1975)"],"f":"F3","q":"Eternal or ending?","kids":[{"t":"Ending in renovation","s":"Evil is finally destroyed and the world made fresh.","who":["Bundahishn","Frashokereti doctrine"],"f":"F3"},{"t":"Eternal opposition","s":"Two uncreated spirits forever.","who":["Gathas, Yasna 30","Pahlavi texts"],"f":"F3"}]},{"t":"Manichaeism","s":"Two eternal principles, light and dark, mixed; history is their separation.","who":["Mani (240s)","Kephalaia","Augustine, against (c. 400)"],"f":"F3"},{"t":"Cathar dualisms","s":"Two gods, or one fallen power, made spirit and matter.","who":["Cathars","Bogomils","Paulicians (7th c.)"],"f":"F3","q":"How absolute?","kids":[{"t":"Absolute dualism","s":"Two eternal principles, neither made by the other.","who":["John of Lugio (c. 1250)","Book of the Two Principles"],"f":"F3"},{"t":"Mitigated dualism","s":"Satan is a fallen creature who made the material world.","who":["Cosmas the Priest (10th c.)","Concorezzo Cathars"],"f":"F3"}]},{"t":"Plato’s evil world-soul","s":"A disordered soul opposes the good one in the heavens.","who":["Plato, Laws X (c. 350 BC)","Plutarch (c. 100)","Numenius"],"f":"F3"},{"t":"Love and Strife","s":"Two forces mix and unmix the roots in turn.","who":["Empedocles (c. 450 BC)","O’Brien (1969), reading"],"f":"F3"},{"t":"Mandaean light and dark","s":"The King of Light and the Lord of Darkness; the world is their mixture.","who":["Ginza Rabba","Drower (1937)"],"f":"F3"}]},{"t":"Only what it is not","s":"Described by negation alone.","who":["Maimonides","Aquinas, in part"],"addr":"D1b S?","f":"F3","d":"This edges toward the ungraspable branch. If the ground is truly beyond concepts, it belongs there, not here.","q":"Which negative way?","kids":[{"t":"Pseudo-Dionysius","s":"God is beyond every affirmation and every denial; we ascend by unsaying.","who":["Mystical Theology (c. 500)","Maximus (7th c.)","Eriugena (c. 867)"],"f":"F3"},{"t":"Maimonides’ negative attributes","s":"Only negations and actions can be said; ‘God lives’ means ‘God is not dead’.","who":["Maimonides, Guide I.51–60 (1190)","Bahya ibn Paquda (c. 1080)","Seeskin (2000)"],"f":"F3"},{"t":"Eckhart’s Godhead","s":"Beyond God-the-creator is the still desert of the Godhead, of which nothing is said.","who":["Eckhart (c. 1300)","Tauler","Suso"],"f":"F3"},{"t":"Learned ignorance","s":"God is the coincidence of opposites; knowing we cannot know is the highest knowing.","who":["Nicholas of Cusa (1440)","Hopkins (1981), reading"],"f":"F3"},{"t":"Cloud of Unknowing","s":"God is reached by love in darkness, not by thought.","who":["Anonymous (14th c.)","John of the Cross (1580s)"],"f":"F3"},{"t":"Ismaili double negation","s":"God is neither a thing nor not a thing; both denials must be denied.","who":["al-Sijistānī (10th c.)","al-Kirmānī (11th c.)"],"f":"F3"},{"t":"Divine darkness","s":"God’s essence is infinite and never comprehended; Moses meets him in the dark.","who":["Gregory of Nyssa (c. 390)","Philo of Alexandria (1st c.)","Evagrius (4th c.)"],"f":"F3"},{"t":"Ein Sof","s":"The Infinite in itself is beyond all names; only its emanations are spoken of.","who":["Zohar (13th c.)","Azriel of Gerona","Cordovero (1548)"],"f":"F3"},{"t":"Not this, not this","s":"The ultimate has no qualities; denial is the only true speech about it.","who":["Bṛhadāraṇyaka Upaniṣad (c. 700 BC)","Śaṅkara (8th c.)","Kabīr (15th c.)"],"f":"F3"},{"t":"God without being","s":"God is given as gift and love, prior to the category of being.","who":["Marion (1982)","Derrida (1987)","Levinas (1961)"],"f":"F3"}]},{"t":"Does it command good, or is good prior?","s":"The Euthyphro dilemma.","q":"Which way does it go?","f":"gate","doc":"06-morality.md §3","kids":[{"t":"It commands things because they are good","s":"Then goodness is prior to the maker, and morality is grounded elsewhere.","f":"gate","d":"Move to natural facts or reason-based facts under What is right.","q":"Where does the prior good live?","kids":[{"t":"Form of the Good","s":"Goodness is an independent form; even gods answer to it.","who":["Plato (c. 375 BC)","Cudworth (1731)"],"f":"gate"},{"t":"Necessary moral truths","s":"Moral truths are necessary like mathematics; God knows them, does not make them.","who":["Leibniz (1686)","Clarke (1705)","Swinburne (1977)"],"f":"gate"},{"t":"Mu‘tazilite objectivism","s":"Reason knows justice; God is bound by it.","who":["Abd al-Jabbār (10th c.)","al-Qāḍī"],"f":"gate"},{"t":"Moral platonism today","s":"Moral facts are necessary and non-natural; no God is needed to ground them.","who":["Huemer (2005)","Enoch (2011)","Wielenberg (2014)"],"f":"gate"}]},{"t":"Things are good because it commands them","s":"Then saying the maker is good says nothing.","who":["Ockham","Ash’arite theology"],"f":"gate","q":"Which command theory?","kids":[{"t":"Ockhamist voluntarism","s":"God could have commanded hatred of himself and it would be right.","who":["Ockham (1320s)","d’Ailly","Gerson"],"f":"gate"},{"t":"Ash‘arite command theory","s":"Good and evil are only what God commands and forbids.","who":["al-Ash‘arī","al-Ghazālī","al-Juwaynī"],"f":"gate"},{"t":"Modified divine command theory","s":"Right is what a loving God commands; ‘loving’ blocks the horror cases.","who":["R.M. Adams (1979, 1999)","Quinn (1978)","Evans (2013)"],"f":"gate"},{"t":"Suspension of the ethical","s":"Faith can suspend the ethical when God commands.","who":["Kierkegaard (1843)","Evans (2004), reading"],"f":"gate"},{"t":"Created eternal truths","s":"Even logic and mathematics depend on God’s will.","who":["Descartes (1630, 1644)","Frankfurt (1977), reading","Curley (1984)"],"f":"gate"},{"t":"Calvinist voluntarism","s":"God’s will is the rule of righteousness; nothing stands above it.","who":["Calvin (1559)","Edwards (1758)"],"f":"gate"}]},{"t":"Its nature, not its will, is the standard","s":"The usual escape.","who":["Aquinas","Robert Adams"],"f":"gate","q":"How does nature ground good?","kids":[{"t":"Thomist natural law","s":"Good is what fulfils the natures God made; God’s nature is goodness itself.","who":["Aquinas (ST I-II.94)","Finnis (1980)","Murphy (2011)"],"f":"gate"},{"t":"Resemblance to God","s":"Goodness is likeness to God, who is the Good.","who":["Augustine","Anselm","R.M. Adams (1999)"],"f":"gate"},{"t":"Divine motivation theory","s":"Good is what God’s motives are; virtues are likenesses to them.","who":["Zagzebski (2004)","Baggett & Walls (2016), partial"],"f":"gate"},{"t":"Nature grounds values, commands ground duties","s":"Values rest on God’s nature; obligations on his will.","who":["Craig (2008)","Baggett & Walls (2011)"],"f":"gate"},{"t":"Scotist split","s":"Duties toward God follow from his nature; duties among creatures are contingent commands.","who":["Duns Scotus (c. 1300)","Williams (1998)"],"f":"gate"}]}]}]},{"t":"Us","s":"The observers are the authors.","who":["Wheeler’s participatory universe","Advaita: Brahman is Atman","Self-simulation hypotheses","Fichte’s absolute I"],"addr":"B1 D1c","f":"F2","q":"How could we make our own world?","kids":[{"t":"Participatory universe","s":"Observers bring the universe into being by observing; a self-excited circuit.","who":["Wheeler (1983, 1990)","Zurek (2009), partly"],"f":"F2","q":"By what mechanism?","kids":[{"t":"Delayed choice","s":"Present measurements fix what past events were.","who":["Wheeler (1978)","Kim et al. (2000)","Ma et al. (2012)"],"f":"F2"},{"t":"Top-down cosmology","s":"We select the cosmic history compatible with us from a superposition of histories.","who":["Hawking & Hertog (2006)","Hertog (2023)"],"f":"F2"},{"t":"QBist world-making","s":"Reality is created in each agent’s experiences; the world is what participation makes.","who":["Fuchs (2010, 2017)","Mermin (2014)"],"f":"F2"},{"t":"Consciousness causes collapse","s":"Minds fix physical outcomes; without minds there is no definite world.","who":["von Neumann (1932)","Wigner (1961)","Stapp (1993)","Chalmers & McQueen (2022)"],"f":"F1"}]},{"t":"Self-creating universe","s":"The universe loops back through a closed timelike curve and causes itself.","who":["Gott & Li (1998)","Gott (2001)"],"f":"F2"},{"t":"Our descendants made it","s":"Future intelligence reaches back or runs us.","who":["Tipler (1994)","Bostrom (2003)","Moravec (1988)"],"f":"F2","q":"How?","kids":[{"t":"Omega Point","s":"Life at the end of time gains total power and resurrects everyone by emulation.","who":["Teilhard (1955)","Tipler (1994)","Deutsch (1997), sympathetic"],"f":"F3"},{"t":"Retrocausal engineering","s":"A late civilisation sets the initial conditions of its own past.","who":["Gott & Li (1998)","Lloyd et al. (2011)"],"f":"F3"}]},{"t":"Made by our concepts","s":"Reality as we know it is shaped by our forms, languages and practices.","who":["Kant (1781)","Goodman (1978)","Berger & Luckmann (1966)","Putnam (1981)"],"f":"F2","q":"How deep does the making go?","kids":[{"t":"Transcendental idealism","s":"Space, time and causality are the mind’s forms; things in themselves are unknown.","who":["Kant (1781)","Allison (1983)"],"f":"F3"},{"t":"Irrealism","s":"There are many right world-versions, each made by a symbol system.","who":["Goodman (1978)","Elgin (1997)"],"f":"F3"},{"t":"Social construction","s":"Institutions, categories and much of what counts as real are built by shared practice.","who":["Berger & Luckmann (1966)","Searle (1995)","Latour & Woolgar (1979)"],"f":"F2"},{"t":"Internal realism","s":"Truth is idealised rational acceptability; objects are cut by conceptual schemes.","who":["Putnam (1981)","Putnam (1987)","Dummett (1978), kindred"],"f":"F2"},{"t":"Radical constructivism","s":"Knowledge is built by the knower and never mirrors an outside.","who":["von Glasersfeld (1984)","von Foerster (1973)","Maturana & Varela (1980)"],"f":"F2"},{"t":"Enactivism","s":"Worlds are brought forth through embodied action, not found ready-made.","who":["Varela, Thompson & Rosch (1991)","Thompson (2007)","Di Paolo"],"f":"F2"},{"t":"Self-positing I","s":"The I posits itself and the not-I; the world is the I’s product.","who":["Fichte (1794)","Schelling (1795), early"],"f":"F3"}]},{"t":"Solipsism","s":"Only my mind exists; the world is its content.","who":["Schopenhauer (1818), as irrefutable","Wittgenstein (1921)","Prakāśānanda (16th c.)"],"f":"F3"}]}]},{"t":"Not made","s":"No intention behind it.","addr":"B1 D2","q":"Then what is it made of?","doc":"03-substrate.md","kids":[{"t":"Physical stuff","s":"Particles, fields, spacetime. Experience is derived or illusory. Clutter.","addr":"B1 C2 D2","q":"Then what is experience?","kids":[{"t":"An illusion","s":"Introspection misreports what the brain does.","who":["Dennett","Frankish","Graziano"],"addr":"C2-i","f":"F1","q":"Which illusion?","kids":[{"t":"Illusionism","s":"Phenomenal consciousness seems to exist but does not; the task is to explain the seeming.","who":["Frankish (2016)","Dennett (1991, 2016)","Humphrey (2011)","Kammerer (2021)"],"f":"F1"},{"t":"Eliminative materialism","s":"Folk mental categories will be dropped as neuroscience matures, as phlogiston was.","who":["Feyerabend (1963)","Rorty (1965)","P.M. Churchland (1981)","P.S. Churchland (1986)"],"f":"F2"},{"t":"Attention schema theory","s":"The brain models its own attention crudely, and that model is what we call awareness.","who":["Graziano (2013, 2019)","Webb & Graziano (2015)"],"f":"F1"},{"t":"Multiple drafts","s":"There is no inner theatre; many parallel processes settle what was ‘experienced’ after the fact.","who":["Dennett (1991)","Dennett & Kinsbourne (1992)"],"f":"F1"},{"t":"Quining qualia","s":"Qualia as private, ineffable, intrinsic properties are incoherent and should be dropped.","who":["Dennett (1988)","Rey (1995)"],"f":"F2"},{"t":"User illusion","s":"Consciousness is a simplified interface the brain presents to itself.","who":["Nørretranders (1991)","Hoffman (2019), partly"],"f":"F2"}]},{"t":"A function","s":"Anything organized the right way has it. We are the information the neuron holds.","who":["Global Workspace (Baars, Dehaene)","Higher-order thought (Rosenthal)","Attention schema (Graziano)","Recurrent processing (Lamme)","Predictive processing (Seth, Clark)"],"addr":"C2-f","f":"F0","d":"The Cogitate collaboration (2023 to 2025) tested Global Workspace against IIT. Both lost specific predictions. What it settles is which correlates track reports, never whether the correlates are the experience.","q":"Which function?","kids":[{"t":"Functionalism","s":"A mental state is what it does, regardless of what does it.","who":["Putnam (1967)","Lewis (1966)","Armstrong (1968)","Fodor (1968)"],"f":"F0","q":"Which kind?","kids":[{"t":"Machine functionalism","s":"Mental states are states of a probabilistic automaton.","who":["Putnam (1967)","Block & Fodor (1972)"],"f":"F2"},{"t":"Analytic functionalism","s":"Mental terms are defined by their place in common-sense psychology.","who":["Lewis (1966, 1972)","Armstrong (1968)","Jackson (1998)"],"f":"F2"},{"t":"Psychofunctionalism","s":"Mental states are defined by mature empirical psychology, not folk theory.","who":["Fodor (1968)","Block (1978)"],"f":"F2"},{"t":"Teleofunctionalism","s":"Mental states are what evolution selected them to do.","who":["Millikan (1984)","Dretske (1988)","Neander (2017)"],"f":"F2"}]},{"t":"Global workspace","s":"Consciousness is information broadcast widely to many brain systems at once.","who":["Baars (1988)","Dehaene & Naccache (2001)","Dehaene (2014)"],"f":"F1","q":"How does the broadcast work?","kids":[{"t":"Global neuronal workspace","s":"Frontoparietal ignition makes a content available brain-wide.","who":["Dehaene, Kerszberg & Changeux (1998)","Mashour et al. (2020)"],"f":"F1","q":"How does it fare against integration theory?","kids":[{"t":"Adversarial collaboration","s":"Preregistered tests pitted workspace against integration; each predicted some results and failed others.","who":["Cogitate Consortium (2023)","Melloni et al. (2021)"],"f":"F1"},{"t":"Posterior hot zone","s":"Experience correlates with posterior cortex, not frontal broadcast.","who":["Koch, Massimini, Boly & Tononi (2016)","Boly et al. (2017)"],"f":"F1"},{"t":"Frontal necessity","s":"Prefrontal activity is needed for conscious access.","who":["Dehaene (2014)","Odegaard, Knight & Lau (2017)"],"f":"F1"}]},{"t":"Multiple drafts as workspace","s":"Fame in the brain, no single moment of arrival.","who":["Dennett (2001)","Dennett (2005)"],"f":"F1"}]},{"t":"Higher-order theories","s":"A state is conscious when the mind represents itself as being in it.","who":["Rosenthal (2005)","Lycan (1996)","Lau & Rosenthal (2011)","Brown (2015)"],"f":"F1","q":"What kind of higher-order state?","kids":[{"t":"Higher-order thought","s":"A thought about the first-order state makes it conscious.","who":["Rosenthal (1986, 2005)","Gennaro (2012)","Weisberg (2011)"],"f":"F1"},{"t":"Higher-order perception","s":"An inner sense scans first-order states.","who":["Locke (1690)","Armstrong (1968)","Lycan (1996)"],"f":"F2"},{"t":"Self-representational","s":"The state represents itself; no separate monitor.","who":["Kriegel (2009)","Brentano (1874)"],"f":"F2"},{"t":"Perceptual reality monitoring","s":"Consciousness is the brain’s judgement that a representation is reliable and world-sourced.","who":["Lau (2019, 2022)","Michel"],"f":"F1"}]},{"t":"Representationalism","s":"Experience is a kind of representation; its felt character is the content represented.","who":["Dretske (1995)","Tye (1995, 2000)","Harman (1990)"],"f":"F2","q":"Which content?","kids":[{"t":"First-order representationalism","s":"Conscious states are poised, abstract, non-conceptual contents.","who":["Tye (1995)","Dretske (1995)"],"f":"F2"},{"t":"Phenomenal intentionality","s":"Intentionality is grounded in phenomenal character, not the other way round.","who":["Horgan & Tienson (2002)","Kriegel (2013)","Mendelovici (2018)"],"f":"F2"}]},{"t":"Predictive processing","s":"The brain is a prediction machine; experience is its best current guess about causes of its input.","who":["Friston (2010)","Clark (2013, 2016)","Hohwy (2013)","Seth (2021)"],"f":"F1","q":"What does prediction add?","kids":[{"t":"Free-energy principle","s":"All brain activity minimises prediction error; consciousness falls out of that.","who":["Friston (2010)","Solms (2021)"],"f":"F1"},{"t":"Controlled hallucination","s":"Perception is the brain’s prediction reined in by sense data; selfhood is prediction about the body.","who":["Seth (2021)","Clark (2016)"],"f":"F1"},{"t":"Active inference and the self","s":"The self is a model used to control action.","who":["Hohwy & Michael (2017)","Metzinger (2003)"],"f":"F1"}]},{"t":"Computationalism about mind","s":"Mind is computation over representations; any substrate that computes it has it.","who":["Putnam (1960)","Fodor (1975)","Pylyshyn (1984)","Piccinini (2015)"],"f":"F2"},{"t":"Anomalous monism","s":"Mental events are physical events, but no strict laws link mental and physical descriptions.","who":["Davidson (1970)","Kim (1993), critique"],"f":"F2"},{"t":"Recurrent processing theory","s":"Local feedback loops in sensory cortex suffice for experience, before any broadcast.","who":["Lamme (2006, 2010)","Block (2007), sympathetic"],"f":"F1"}]},{"t":"A property of specific structure","s":"Not computation as such, but the right causal organization.","who":["Integrated Information Theory (Tononi, Koch)","Searle","Electromagnetic field theory (McFadden, Pockett)","Orch-OR, quantum microtubules (Penrose, Hameroff)"],"addr":"C2-b","f":"F0","d":"IIT’s Phi cannot be computed for anything the size of a brain.","q":"Which structure?","kids":[{"t":"Type identity theory","s":"Each kind of experience just is a kind of brain state.","who":["Place (1956)","Smart (1959)","Feigl (1958)","Polger (2004)"],"f":"F2"},{"t":"Biological naturalism","s":"Consciousness is a biological feature caused by and realised in neurons, as digestion is in the gut.","who":["Searle (1992, 2004)","Searle (2007)"],"f":"F2"},{"t":"Integrated information theory","s":"Experience is integrated information; how much a system is conscious is how irreducible its causal structure is.","who":["Tononi (2004, 2008)","Koch (2012)","Oizumi, Albantakis & Tononi (2014)"],"f":"F1","q":"What follows?","kids":[{"t":"Exclusion and the physical substrate","s":"Only the local maximum of integration is conscious; feed-forward systems are not, however smart.","who":["Tononi & Koch (2015)","Albantakis et al. (2023)"],"f":"F1"},{"t":"Panpsychist reach","s":"Any system with nonzero integration has some experience, down to simple circuits.","who":["Tononi & Koch (2015)","Koch (2019)"],"f":"F2"},{"t":"Unfolding objection","s":"Any recurrent system can be unfolded into a feed-forward one with identical behaviour, so the theory is untestable.","who":["Doerig, Schurger, Hess & Herzog (2019)","Hanson & Walker (2021), reply"],"f":"FG"}]},{"t":"Quantum brain theories","s":"Experience arises from quantum processes in neurons.","who":["Penrose (1989, 1994)","Hameroff & Penrose (1996)","Beck & Eccles (1992)","Fisher (2015)"],"f":"F1","q":"Which process?","kids":[{"t":"Orchestrated objective reduction","s":"Gravity-driven collapse in microtubules produces moments of experience.","who":["Hameroff & Penrose (1996, 2014)","Hameroff (2022)"],"f":"F1"},{"t":"Quantum synaptic exocytosis","s":"Quantum tunnelling at synapses is where mind acts on brain.","who":["Beck & Eccles (1992)","Beck (2008)"],"f":"F2"},{"t":"Nuclear spin qubits","s":"Phosphorus nuclear spins in Posner molecules carry quantum information in the brain.","who":["Fisher (2015)","Fisher & Radzihovsky (2018)"],"f":"F1"}]},{"t":"Electromagnetic field theories","s":"The brain’s electromagnetic field, not its neurons, is what experience is.","who":["Pockett (2000)","McFadden (2002, 2020)","John (2001)"],"f":"F1"},{"t":"Dynamic core","s":"A rapidly changing, highly integrated thalamocortical cluster is the seat of experience.","who":["Edelman & Tononi (2000)","Edelman (1989)"],"f":"F1"},{"t":"Dendritic integration theory","s":"Consciousness depends on coupling of the two compartments of layer-5 pyramidal neurons.","who":["Aru, Suzuki & Larkum (2020)","Larkum (2013)"],"f":"F1"},{"t":"Embodied and enactive","s":"Experience is a property of a living body coupled to its world, not of a brain alone.","who":["Varela, Thompson & Rosch (1991)","Noë (2004)","Thompson (2007)"],"f":"F2"},{"t":"Temporo-spatial theory","s":"Consciousness is the brain’s spontaneous spatiotemporal structure, which stimuli align with.","who":["Northoff (2014)","Northoff & Huang (2017)"],"f":"F1"}]},{"t":"Real, physical, and beyond us","s":"There is an explanation and we cannot hold it.","who":["McGinn","Pinker","Chomsky"],"addr":"B2a-m","f":"F3","q":"Why beyond us?","kids":[{"t":"Cognitive closure","s":"Our minds lack the concepts that would link brain to experience, as a dog lacks calculus.","who":["McGinn (1989, 1999)","Chomsky (1975), problems vs mysteries"],"f":"F3"},{"t":"Epistemic view","s":"We are ignorant of some physical fact; once known, the gap would close, but we may never find it.","who":["Stoljar (2006)","Nagel (1974), early"],"f":"F3"},{"t":"Permanent explanatory gap","s":"Even with a complete physics, why this brain state feels this way stays unexplained.","who":["Levine (1983, 2001)","Pinker (1997)"],"f":"F3"},{"t":"Future conceptual revolution","s":"A physics we cannot yet imagine will include mind as it now includes fields.","who":["Nagel (1986)","Chalmers (1996), as one option","Strawson (2006)"],"f":"F3"},{"t":"Teleological naturalism","s":"Nature has a built-in tendency toward mind that present science does not see.","who":["Nagel (2012)","Thompson (2007), kindred"],"f":"F3"}]},{"t":"What is the physical bottom?","s":"Fields, strings, loops, sets, or graphs.","q":"Which?","kids":[{"t":"Quantum fields","s":"The Standard Model plus general relativity, unreconciled.","who":["Standard Model","General relativity"],"f":"F0","q":"How should the quantum be read?","kids":[{"t":"Copenhagen","s":"The wavefunction is a tool for predicting measurement results; the classical apparatus is taken as given.","who":["Bohr (1928)","Heisenberg (1927)","Pauli","Born (1926)"],"f":"F2","q":"Which Copenhagen?","kids":[{"t":"Complementarity","s":"Wave and particle pictures each apply in their own setting and never together.","who":["Bohr (1928, 1949)","Folse (1985)","Plotnitsky (2012)"],"f":"F2"},{"t":"Potentiality","s":"The wavefunction describes tendencies that become actual on measurement.","who":["Heisenberg (1958)","Kastner, Kauffman & Epperson (2018)"],"f":"F2"},{"t":"Consciousness collapse","s":"The chain of measurement ends only in an observer’s mind.","who":["von Neumann (1932)","London & Bauer (1939)","Wigner (1961)","Stapp"],"f":"F1"},{"t":"Information-theoretic","s":"Quantum theory is about information; there is no deeper story to tell.","who":["Bub & Pitowsky (2010)","Zeilinger (1999)","Brukner"],"f":"F2"},{"t":"Pragmatist","s":"The theory gives good advice on what to expect; it describes nothing.","who":["Healey (2017)","Friederich (2015)"],"f":"F2"},{"t":"Ensemble","s":"The state describes an ensemble of similarly prepared systems, not one system.","who":["Einstein (1936)","Ballentine (1970)"],"f":"F2"}]},{"t":"Many worlds","s":"The wavefunction is everything and never collapses; every outcome happens in its own branch.","who":["Everett (1957)","DeWitt (1970)","Deutsch (1997)","Wallace (2012)","Carroll (2019)"],"f":"F2","q":"What are the branches, and where does probability come from?","kids":[{"t":"Emergent branches","s":"Branches are approximate, decoherence-defined patterns, like species or storms.","who":["Wallace (2012)","Saunders (1993)","Zurek (2003)"],"f":"F2"},{"t":"Literal splitting","s":"The universe splits into copies at each measurement.","who":["DeWitt (1970)","Deutsch (1985)"],"f":"F2"},{"t":"Many minds","s":"The physical world never splits; each observer has a continuum of minds that do.","who":["Albert & Loewer (1988)","Lockwood (1989)"],"f":"F2"},{"t":"Born rule from something else","s":"Why squared amplitudes give the odds when everything happens.","who":["Deutsch (1999)","Wallace (2012)","Zurek (2005)","Sebens & Carroll (2018)"],"f":"F2","q":"From what?","kids":[{"t":"Decision theory","s":"A rational agent in a branching world must bet by squared amplitude.","who":["Deutsch (1999)","Wallace (2003, 2012)"],"f":"F2","q":"Do the axioms hold?","kids":[{"t":"Deutsch’s original argument","s":"Ordinary decision theory plus quantum mechanics forces Born weights.","who":["Deutsch (1999)","Barnum et al. (2000), critique"],"f":"F2"},{"t":"Wallace’s axiomatisation","s":"Branching indifference and diachronic consistency together imply the rule.","who":["Wallace (2003, 2012)","Greaves (2004)"],"f":"F2"},{"t":"Branch-counting objection","s":"A rational agent might count branches equally instead of weighting them.","who":["Kent (2010)","Albert (2010)","Price (2010)"],"f":"gate","q":"Is there a count to use?","kids":[{"t":"No fact about branch number","s":"Decoherence gives no natural count, so equal counting is not even available.","who":["Wallace (2012)","Saunders (2010)"],"f":"F2"},{"t":"Counting is coherent","s":"Branch counts can be defined and then the Born rule fails or must be imposed.","who":["Kent (2010)","Saunders (2021), counting with care"],"f":"F2"}]}]},{"t":"Envariance","s":"Symmetries of entangled states force the Born rule.","who":["Zurek (2005)","Zurek (2018)"],"f":"F2"},{"t":"Self-locating uncertainty","s":"Not knowing which branch you are in, credences must follow the Born rule.","who":["Sebens & Carroll (2018)","Vaidman (1998)"],"f":"F2"},{"t":"Brute posit","s":"The rule is an extra axiom; nothing derives it.","who":["Papineau (1996)","Kent (2010), critique"],"f":"F2"}]},{"t":"Mad-dog Everettianism","s":"Only the Hilbert-space vector exists; space, particles and fields are emergent patterns in it.","who":["Carroll & Singh (2019)","Carroll (2022)"],"f":"F2"}]},{"t":"Pilot wave","s":"Particles always have positions; the wavefunction guides them.","who":["de Broglie (1927)","Bohm (1952)","Bell (1987)","Dürr, Goldstein & Zanghì (1992)"],"f":"F2","q":"What is the wave?","kids":[{"t":"Wavefunction as law","s":"The wave is nomological, like a Hamiltonian, not a thing.","who":["Dürr, Goldstein & Zanghì (1997)","Goldstein & Zanghì (2013)"],"f":"F2"},{"t":"Wavefunction as field","s":"The wave is a real field in configuration space.","who":["Albert (1996)","Valentini (1992)","Holland (1993)"],"f":"F2"},{"t":"Quantum non-equilibrium","s":"The Born rule is a relaxed state; early-universe deviations could be seen.","who":["Valentini (1991, 2010)","Valentini & Westman (2005)","Colin & Valentini (2015)"],"f":"F1"},{"t":"Bohmian field theory","s":"Fields, not particles, take the beables in relativistic settings.","who":["Bohm (1952b)","Struyve (2010)","Dürr et al. (2004)"],"f":"F2"}]},{"t":"Objective collapse","s":"The wavefunction really collapses by a physical process, randomly and spontaneously.","who":["Ghirardi, Rimini & Weber (1986)","Pearle (1989)","Diósi (1989)","Penrose (1996)"],"f":"F1","q":"What triggers collapse?","kids":[{"t":"GRW spontaneous localisation","s":"Each particle localises randomly at a tiny rate; large bodies localise fast.","who":["Ghirardi, Rimini & Weber (1986)","Bell (1987)"],"f":"F1"},{"t":"Continuous spontaneous localisation","s":"Collapse is a continuous noisy process.","who":["Pearle (1989)","Ghirardi, Pearle & Rimini (1990)","Bassi & Ghirardi (2003)"],"f":"F1"},{"t":"Gravity-induced collapse","s":"Superpositions of different mass distributions decay in a time set by gravity.","who":["Diósi (1989)","Penrose (1996)","Bassi et al. (2017)"],"f":"F1"},{"t":"Flash ontology","s":"What exists are the collapse events themselves, sparse flashes in spacetime.","who":["Bell (1987)","Tumulka (2006)","Esfeld & Gisin (2014)"],"f":"F2"},{"t":"Mass density ontology","s":"What exists is a smeared mass field given by the wavefunction.","who":["Ghirardi, Grassi & Benatti (1995)","Allori et al. (2008)"],"f":"F2"}]},{"t":"QBism","s":"Quantum states are an agent’s personal degrees of belief; the world is what agents meet in experience.","who":["Fuchs (2010)","Fuchs, Mermin & Schack (2014)","Caves, Fuchs & Schack (2002)"],"f":"F2"},{"t":"Relational quantum mechanics","s":"There are no observer-independent states; facts are relative to the system they are relative to.","who":["Rovelli (1996, 2021)","Laudisa","Di Biagio & Rovelli (2021)"],"f":"F2"},{"t":"Consistent histories","s":"Quantum theory assigns probabilities to whole histories within a consistent set; no collapse, no observer.","who":["Griffiths (1984, 2002)","Omnès (1988)","Gell-Mann & Hartle (1990)"],"f":"F2"},{"t":"Transactional","s":"Emitters send offer waves forward and absorbers send confirmation waves back; a transaction is an event.","who":["Cramer (1986)","Kastner (2012)"],"f":"F2","q":"Where does the handshake happen?","kids":[{"t":"Possibilist transactional","s":"Offers and confirmations live in a realm of possibility outside spacetime.","who":["Kastner (2012, 2022)","Kastner & Cramer (2018)"],"f":"F2"},{"t":"Relativistic transactional","s":"Transactions build spacetime relations themselves.","who":["Kastner (2012)","Cramer (2016)"],"f":"F2"}]},{"t":"Modal interpretations","s":"The state gives what is possible; a definite value is picked out by the system’s current decomposition.","who":["van Fraassen (1972, 1991)","Kochen (1985)","Dieks (1989)","Healey (1989)"],"f":"F2"},{"t":"Two-state vector","s":"A system is described by a state from the past and one from the future together.","who":["Aharonov, Bergmann & Lebowitz (1964)","Aharonov & Vaidman (1990)"],"f":"F2"},{"t":"Superdeterminism","s":"Measurement settings and hidden variables are correlated from the start; Bell’s theorem is evaded.","who":["Bell (1985), noted","’t Hooft (2016)","Hossenfelder & Palmer (2020)"],"f":"F2"},{"t":"Retrocausal","s":"Influences run backward in time; no nonlocality is needed.","who":["Costa de Beauregard (1953)","Price (1996)","Wharton (2010)","Sutherland (2017)"],"f":"F2"},{"t":"Wavefunction realism","s":"The wavefunction is a real field on a high-dimensional configuration space; our 3D world is derived.","who":["Albert (1996)","Ney (2021)","North (2013)"],"f":"F2","q":"Or is there a primitive ontology in 3D?","kids":[{"t":"Primitive ontology","s":"Any acceptable theory posits local beables in ordinary space; the wavefunction is not one.","who":["Allori, Goldstein, Tumulka & Zanghì (2008)","Maudlin (2019)"],"f":"F2"},{"t":"Spacetime state realism","s":"The state is assigned to regions of spacetime rather than to a configuration space.","who":["Wallace & Timpson (2010)","Wallace (2012)"],"f":"F2"}]},{"t":"Cellular automaton interpretation","s":"Beneath quantum mechanics is a deterministic classical automaton.","who":["’t Hooft (2014, 2016)","’t Hooft (2021)"],"f":"F2"},{"t":"Relational blockworld","s":"The quantum is an adynamical, whole-spacetime constraint, not an evolving state.","who":["Silberstein, Stuckey & McDevitt (2018)","Stuckey, Silberstein & Cifone (2008)"],"f":"F2"}]},{"t":"Strings and branes","who":["String theory","M-theory (Witten)"],"f":"F2","q":"Which string theory?","kids":[{"t":"Type I","s":"Open and closed unoriented strings with gauge group SO(32).","who":["Green & Schwarz (1984)","Polchinski (1998)"],"f":"F2"},{"t":"Type IIA","s":"Closed strings, non-chiral, lifts to eleven dimensions.","who":["Green, Schwarz & Witten (1987)","Witten (1995)"],"f":"F2"},{"t":"Type IIB","s":"Closed strings, chiral, self-dual under S-duality.","who":["Schwarz (1983)","Hull & Townsend (1995)"],"f":"F2"},{"t":"Heterotic SO(32)","s":"Right-movers superstring, left-movers bosonic; dual to Type I.","who":["Gross, Harvey, Martinec & Rohm (1985)","Polchinski & Witten (1996), duality"],"f":"F2"},{"t":"Heterotic E8×E8","s":"The version that first made the Standard Model look reachable.","who":["Gross, Harvey, Martinec & Rohm (1985)","Candelas, Horowitz, Strominger & Witten (1985)"],"f":"F2"},{"t":"M-theory","s":"All five string theories are limits of one eleven-dimensional theory.","who":["Witten (1995)","Townsend (1995)","Duff (1996)"],"f":"F2","q":"How is it formulated?","kids":[{"t":"Matrix theory","s":"M-theory in a light-cone frame is a quantum mechanics of matrices.","who":["Banks, Fischler, Shenker & Susskind (1997)","Taylor (2001)"],"f":"F2"},{"t":"Eleven-dimensional supergravity as low-energy limit","s":"The classical limit is a known theory from 1978.","who":["Cremmer, Julia & Scherk (1978)","Witten (1995)"],"f":"F2"},{"t":"F-theory","s":"A twelve-dimensional bookkeeping for Type IIB with varying coupling.","who":["Vafa (1996)","Morrison & Vafa (1996)","Heckman & Vafa (2010)"],"f":"F2"}]},{"t":"Holographic duality","s":"A gravitational theory in a volume equals a non-gravitational theory on its boundary.","who":["Maldacena (1997)","Witten (1998)","Gubser, Klebanov & Polyakov (1998)"],"f":"F2","q":"How far does it reach?","kids":[{"t":"AdS/CFT as definition","s":"Quantum gravity in anti-de Sitter space is defined by its boundary field theory.","who":["Maldacena (1997)","Witten (1998)"],"f":"F2"},{"t":"Holography for our universe","s":"Some version holds for de Sitter or flat space too.","who":["Strominger (2001)","Susskind (2021)","Anninos, Hartman & Strominger (2017)"],"f":"F2"},{"t":"Emergent bulk from entanglement","s":"Spacetime geometry is stitched from boundary entanglement.","who":["Ryu & Takayanagi (2006)","Van Raamsdonk (2010)","Maldacena & Susskind (2013)"],"f":"F2"}]},{"t":"Landscape","s":"There are perhaps ten to the five hundred stable vacua; ours is one, picked by chance and selection.","who":["Bousso & Polchinski (2000)","Kachru, Kallosh, Linde & Trivedi (2003)","Susskind (2003)"],"f":"F2","q":"Or does the landscape exclude most of them?","kids":[{"t":"Anthropic selection on the landscape","s":"Observers exist only where the constants allow; that explains the constants.","who":["Weinberg (1987)","Susskind (2003)","Bousso"],"f":"F2"},{"t":"Swampland","s":"Most seemingly consistent effective theories cannot come from string theory; de Sitter itself may be excluded.","who":["Vafa (2005)","Ooguri & Vafa (2007)","Obied, Ooguri, Spodyneiko & Vafa (2018)"],"f":"F2","q":"Which conjecture?","kids":[{"t":"Weak gravity conjecture","s":"Gravity is always the weakest force; some particle must be superextremal.","who":["Arkani-Hamed, Motl, Nicolis & Vafa (2007)","Harlow, Heidenreich, Reece & Rudelius (2023)"],"f":"F2"},{"t":"Distance conjecture","s":"Moving far in field space brings down an infinite tower of light states.","who":["Ooguri & Vafa (2007)","Klaewer & Palti (2017)"],"f":"F2"},{"t":"de Sitter conjecture","s":"Stable positive-energy vacua like our own cannot come from string theory.","who":["Obied, Ooguri, Spodyneiko & Vafa (2018)","Danielsson & Van Riet (2018)"],"f":"F2","q":"How strict?","kids":[{"t":"Refined de Sitter conjecture","s":"Either the potential slopes steeply or it is unstable; metastable de Sitter is out.","who":["Ooguri, Palti, Shiu & Vafa (2019)","Garg & Krishnan (2019)"],"f":"F2"},{"t":"KKLT survives","s":"Explicit constructions of de Sitter vacua still stand; the conjecture is too strong.","who":["Kachru, Kim, McAllister & Zimet (2019)","Akrami et al. (2019), critique of quintessence"],"f":"F2"},{"t":"Quintessence instead","s":"Dark energy is a rolling field, as the conjecture requires.","who":["Agrawal, Obied, Steinhardt & Vafa (2018)","Heisenberg et al. (2018)"],"f":"F1"}]},{"t":"Trans-Planckian censorship","s":"No mode that was ever sub-Planckian may become classical; inflation is tightly bounded.","who":["Bedroya & Vafa (2019)","Bedroya, Brandenberger, Loverde & Vafa (2020)"],"f":"F2"},{"t":"No global symmetries","s":"Quantum gravity forbids exact global symmetries.","who":["Banks & Seiberg (2011)","Harlow & Ooguri (2019)"],"f":"F2"}]},{"t":"String theory predicts nothing","s":"With so many vacua, the theory is unfalsifiable as physics.","who":["Smolin (2006)","Woit (2006)"],"f":"gate"}]},{"t":"String gas cosmology","s":"The early universe was a hot gas of strings; winding modes keep three dimensions large.","who":["Brandenberger & Vafa (1989)","Nayeri, Brandenberger & Vafa (2006)"],"f":"F2"},{"t":"Compactification on Calabi–Yau spaces","s":"Six extra dimensions curl into a shape whose geometry fixes particles and forces.","who":["Candelas, Horowitz, Strominger & Witten (1985)","Yau (1978)"],"f":"F2"},{"t":"Braneworlds","s":"Our universe is a membrane in a higher space; gravity leaks off it.","who":["Randall & Sundrum (1999)","Arkani-Hamed, Dimopoulos & Dvali (1998)","Dvali, Gabadadze & Porrati (2000)"],"f":"F1"},{"t":"Double copy and amplitudes","s":"Gravity is the square of a gauge theory at the level of scattering amplitudes.","who":["Bern, Carrasco & Johansson (2008)","Kawai, Lewellen & Tye (1986)"],"f":"F2"}]},{"t":"Loops of space","who":["Loop quantum gravity (Rovelli, Smolin)"],"f":"F2","q":"Which loop approach?","kids":[{"t":"Canonical loop quantum gravity","s":"Quantise general relativity directly; space comes in discrete quanta of area and volume.","who":["Ashtekar (1986)","Rovelli & Smolin (1990, 1995)","Thiemann (2007)"],"f":"F2"},{"t":"Spin foams","s":"Spacetime is a history of spin networks; amplitudes sum over foams.","who":["Reisenberger & Rovelli (1997)","Barrett & Crane (1998)","Engle, Pereira, Rovelli & Livine (2008)"],"f":"F2","q":"Which model?","kids":[{"t":"Barrett–Crane","s":"The first four-dimensional model, later found to lack the right degrees of freedom.","who":["Barrett & Crane (1998)","Baez (1998)"],"f":"F2"},{"t":"EPRL/FK","s":"The current standard model of spin foams, matching the canonical theory’s boundary states.","who":["Engle, Pereira, Rovelli & Livine (2008)","Freidel & Krasnov (2008)"],"f":"F2"}]},{"t":"Loop quantum cosmology","s":"Applying loop quantisation to the whole universe replaces the big bang with a bounce.","who":["Bojowald (2001)","Ashtekar, Pawlowski & Singh (2006)","Agullo & Singh (2017)"],"f":"F1"},{"t":"Group field theory","s":"Spin foams as Feynman diagrams of a field theory on a group manifold; spacetime as a condensate.","who":["Boulatov (1992)","Oriti (2006)","Gielen, Oriti & Sindoni (2013)"],"f":"F2"},{"t":"Spin networks","s":"Space itself is a graph of spins; geometry is combinatorial.","who":["Penrose (1971)","Rovelli & Smolin (1995)"],"f":"F2"},{"t":"Shape dynamics","s":"Gravity is the dynamics of shapes, with scale and time removed; relational to the core.","who":["Barbour (2003)","Gomes, Gryb & Koslowski (2011)","Mercati (2018)"],"f":"F2"},{"t":"Twistor theory","s":"Light rays, not points, are basic; spacetime is derived from twistor space.","who":["Penrose (1967)","Penrose & MacCallum (1972)","Witten (2004)"],"f":"F2"}]},{"t":"Discrete events","who":["Causal set theory (Sorkin)","Causal dynamical triangulations"],"f":"F2","q":"Which discreteness?","kids":[{"t":"Causal set theory","s":"Spacetime is a locally finite partial order of events; order plus number gives geometry.","who":["Bombelli, Lee, Meyer & Sorkin (1987)","Sorkin (2003)","Dowker (2005)"],"f":"F2","q":"How does it grow?","kids":[{"t":"Classical sequential growth","s":"Elements are born one at a time with probabilities fixed by covari
