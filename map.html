onstituted by clay; what makes you a person is a first-person perspective.","who":["Baker (2000)","Baker (2007)","Corcoran (2006)"],"f":"F2"},{"t":"Somatic and bodily criterion","s":"You go where your body goes; the body, not the brain, is the bearer.","who":["Williams (1970)","Thomson (1997)","Ayers (1991)"],"f":"F2"}]},{"t":"Simple view","s":"Personal identity is a further fact not analysable in terms of body or psychology; it is all-or-nothing and always determinate.","who":["Butler (1736)","Reid (1785)","Chisholm (1976)","Swinburne (1984)","Lowe (1996)","Madell (1981)"],"f":"F2","q":"What grounds the further fact?","kids":[{"t":"Entia per se","s":"Persons are strict and philosophical unities that persist by being the same substance, not by loose and popular criteria.","who":["Chisholm (1969, 1976)","Butler (1736)"],"f":"F2"},{"t":"Anticriterialism","s":"There are true identity facts but no informative criterion for them.","who":["Merricks (1998)","Zimmerman (1998)","Lowe (1996)"],"f":"F2"},{"t":"Soul criterion","s":"You are an immaterial soul, and identity is identity of soul.","who":["Swinburne (1986, 2019)","Descartes (1641)","Plantinga (2007)"],"f":"F2"}]},{"t":"Four-dimensionalism","s":"A person is a spacetime worm made of temporal parts, or a momentary stage related to other stages; persistence is having parts at other times.","who":["Lewis (1976, 1986)","Sider (2001)","Hawley (2001)","Heller (1990)"],"f":"F2","q":"Worms or stages?","kids":[{"t":"Worm theory","s":"You are the whole four-dimensional object; a person-stage is a part of you.","who":["Lewis (1976)","Heller (1990)","Quine (1950)"],"f":"F2"},{"t":"Stage theory","s":"You are a momentary stage; you persist by having temporal counterparts that stand in the right relation to you.","who":["Sider (1996, 2001)","Hawley (2001)"],"f":"F2"},{"t":"Endurantism","s":"You are wholly present at each time; there are no temporal parts, and the same thing exists at each moment.","who":["Wiggins (1980)","van Inwagen (1990)","Merricks (1994)","Haslanger (1989)"],"f":"F2"}]},{"t":"Conventionalism","s":"Where persons begin and end is partly a matter of our conventions and interests, not a deep fact.","who":["Braddon-Mitchell and West (2001)","Kovacs (2016)","Miller (2009)","Johnston (1989)"],"f":"F2"},{"t":"Relational self","s":"A person is constituted by roles and relations to others; identity is social before it is metaphysical.","who":["Menkiti (1984)","Ames and Rosemont (2011)","Mbiti (1969)","Taylor (1989)"],"f":"F2"}],"q":"What makes it the same person over time?"},{"t":"None that lasts","s":"Each moment its own; no persisting self.","who":["Parfit","Buddhist anatta","Hume’s bundle"],"addr":"empty","f":"F2","kids":[{"t":"Parfitian reductionism","s":"A person is just a brain, body and series of interrelated events; identity is not what matters, and questions about it can be empty.","who":["Parfit (1971, 1984)","Parfit (1995)","Shoemaker (1997)"],"f":"F2","q":"What matters, if not identity?","kids":[{"t":"Relation R","s":"What matters in survival is psychological connectedness and continuity with any cause; whether the continuer is you is an empty question.","who":["Parfit (1984)","Parfit (1971)"],"f":"F2"},{"t":"Extreme and moderate claims","s":"Either nothing matters in survival once identity is dropped, or continuity matters as much as identity did; Parfit leans moderate.","who":["Parfit (1984)","Wolf (1986)","Brink (1997)"],"f":"F2"},{"t":"Impersonal description","s":"Reality can be fully described without ever saying who is who; persons are not among the fundamental facts.","who":["Parfit (1984)","Siderits (2003)","Johnston (1997), contra"],"f":"F2"},{"t":"Buddha would agree","s":"Parfit's own claim that the reductionist view is the Buddhist view of no self, put in modern terms.","who":["Parfit (1984), appendix J","Siderits (1997)","Collins (1982)"],"f":"F2"}]},{"t":"Buddhist no-self","s":"There is no unchanging owner behind experience; the person is a shifting bundle of five aggregates.","who":["The Buddha (5th c. BCE)","Nāgārjuna (2nd c.)","Vasubandhu (4th c.)","Buddhaghosa (5th c.)"],"f":"F2","q":"Which school?","kids":[{"t":"Abhidharma momentariness","s":"Reality is a stream of momentary events (dharmas) arising and perishing; persons are conventional labels on the stream.","who":["Vasubandhu (4th c.)","Sarvāstivāda","Theravāda Abhidhamma","von Rospatt (1995)"],"f":"F2","q":"How does a stream carry karma?","kids":[{"t":"Storehouse consciousness","s":"A subliminal store of seeds carries dispositions across moments and lives without being a self.","who":["Asaṅga (4th c.)","Vasubandhu (4th c.)","Waldron (2003)"],"f":"F2"},{"t":"Pudgalavāda","s":"The person is real but neither the same as nor different from the aggregates; the minority Buddhist view.","who":["Vātsīputrīyas (3rd c. BCE)","Sāṃmitīyas","Priestley (1999)"],"f":"F2"},{"t":"Chariot analogy","s":"As the chariot is nothing but its parts arranged, the person is nothing but aggregates arranged; the name is a convenience.","who":["Milindapañha (c. 100 BCE)","Nāgasena","Siderits (2007)"],"f":"F2"}]},{"t":"Madhyamaka emptiness","s":"Persons and their parts alike lack intrinsic nature; even the aggregates are empty, so no-self goes all the way down.","who":["Nāgārjuna (2nd c.)","Candrakīrti (7th c.)","Garfield (1995)","Siderits (2003)"],"f":"F2"},{"t":"Buddhist reductionism, analytic","s":"Persons are conceptual constructions over impersonal psychophysical elements; this is defended with modern arguments.","who":["Siderits (2003, 2007)","Collins (1982)","Ganeri (2007), critical"],"f":"F2"},{"t":"Two-tiered illusion","s":"The bounded self is an illusion, but a witness-consciousness that is not a self survives the analysis.","who":["Albahari (2006)","Albahari (2019)","Fasching (2008)"],"f":"F2"}]},{"t":"Humean bundle theory","s":"Introspection finds only a bundle of perceptions in flux; the self is a fiction of imagination, and Hume later confessed he could not explain the bundling.","who":["Hume (1739, 1740 appendix)","Russell (1921)","Ayer (1956)"],"f":"F2","q":"What bundles the bundle?","kids":[{"t":"Hume's labyrinth","s":"Hume's own admission that no principle he accepts can explain why perceptions seem to belong together.","who":["Hume (1740)","Stroud (1977)","Garrett (1997)"],"f":"F2"},{"t":"Logical construction","s":"The self is a logical construction out of experiences related by memory and causation, as a table is out of appearances.","who":["Russell (1914, 1921)","Ayer (1936)","Carnap (1928)"],"f":"F2"}]},{"t":"Short-lived selves","s":"There are real subjects of experience, but each lasts only as long as one unbroken stretch of experience, so many selves pass through a day.","who":["G. Strawson (1997, 2009)","Whitehead (1929)","Bostrom (2002), observer-moments"],"f":"F2","q":"How short?","kids":[{"t":"Pearl view","s":"Selves are like pearls on a string, each a single mental thing lasting a few seconds; the string is not a self.","who":["G. Strawson (1997, 2009)","Strawson (2011)"],"f":"F2"},{"t":"Actual occasions","s":"Each moment of experience is a new subject that arises, feels its past, and perishes into data for the next.","who":["Whitehead (1929)","Hartshorne (1970)","Cobb and Griffin (1976)"],"f":"F2"},{"t":"Observer-moments","s":"The basic unit for reasoning about who you are is a momentary observer-state; persons are sets of them.","who":["Bostrom (2002)","Bostrom (2003)","Yudkowsky (2008)"],"f":"F2"}]},{"t":"Self as useful fiction","s":"The self is a model or story the brain produces; like a centre of gravity, it is not a thing but is useful to speak of.","who":["Dennett (1991, 1992)","Metzinger (2003, 2009)","Hood (2012)","Harris (2014)"],"f":"F2","q":"Which fiction?","kids":[{"t":"Centre of narrative gravity","s":"The self is the abstract point the brain's stories converge on, as real as a centre of gravity and no more.","who":["Dennett (1991, 1992)","Velleman (2006)"],"f":"F2"},{"t":"Ego tunnel","s":"We live inside a transparent self-model and mistake it for a self; no one ever was or had a self.","who":["Metzinger (2003, 2009)","Blanke and Metzinger (2009)"],"f":"F2"},{"t":"No doer behind the deed","s":"The agent is a grammatical fiction added to the act; there is lightning but no flasher.","who":["Nietzsche (1887)","Sartre (1936), transcendence of the ego","Hume (1739)"],"f":"F2"}]},{"t":"Empty individualism","s":"Each moment of experience has its own subject and none is identical to any other; the view Kolak names as the third option.","who":["Kolak (2004), naming it","Parfit (1984)","Bostrom (2002)","G. Strawson (2009)"],"f":"F2"}],"q":"What is there instead of a self?"},{"t":"More than one at once?","s":"Whether a single skull can hold two subjects, and whether one subject can be partly unified.","who":["Sperry (1968)","Nagel (1971)","Bayne (2010)","Schechter (2018)"],"f":"F1","q":"What do split brains show?","kids":[{"t":"Two minds after commissurotomy","s":"Each hemisphere has its own perception, memory and will; there are two conscious systems in one head.","who":["Sperry (1968, 1984)","Puccetti (1981)","Gazzaniga (1970)"],"f":"F1"},{"t":"Indeterminate number","s":"The split-brain patient has neither one mind nor two; the concept of a countable subject breaks down.","who":["Nagel (1971)","Lockwood (1989)","Hurley (1998), partial unity"],"f":"F2"},{"t":"Switch model","s":"There is one stream of consciousness that switches rapidly between hemispheres, so unity is preserved.","who":["Bayne (2008, 2010)","Bayne and Chalmers (2003)"],"f":"F1"},{"t":"Two minds, one person","s":"There are two conscious subjects but only one person, because personhood is fixed by agency and social embedding.","who":["Schechter (2018)","Schechter (2015)"],"f":"F2"},{"t":"One agent, split perception","s":"Split-brain patients respond to stimuli in either field with either hand, so agency is unified even when perception is not.","who":["Pinto et al. (2017)","Pinto, de Haan and Lamme (2017)","Volz and Gazzaniga (2017), contra"],"f":"F1"},{"t":"Partial unity","s":"Experiences can be co-conscious in overlapping but non-transitive ways, so the unity of consciousness is not all-or-nothing.","who":["Lockwood (1989)","Hurley (1998)","Bayne (2010), contra"],"f":"F2"},{"t":"Dissociative identity","s":"Alters in dissociative identity disorder are distinct centres of self-representation, either separate persons or fragments of one.","who":["Braude (1991)","Humphrey and Dennett (1989)","Hacking (1995)","Kastrup (2018), as model of idealism"],"f":"F2"},{"t":"Unity thesis","s":"Every experience a subject has at a time is part of a single total experience; the unity is necessary, not contingent.","who":["Bayne and Chalmers (2003)","Bayne (2010)","Tye (2003), one-experience view","Dainton (2000)"],"f":"F2"}]}]},{"t":"Can we control it?","s":"Yes, in every branch.","f":"F0","d":"Under physical stuff, the prefrontal network modulates lower circuits. Under mind, mind organizes itself. Under two kinds, mind acts on matter. The brain running near a phase transition (criticality) is neutral between them. The question had the same answer everywhere, which is why it never discriminated.","doc":"04-mind.md §6","kids":[{"t":"Hard determinism","s":"Every event including every choice is fixed by prior causes; free will as ordinarily understood does not exist.","who":["d'Holbach (1770)","Laplace (1814)","Spinoza (1677)","Honderich (1988)"],"f":"F2","q":"Is the world actually determined?","kids":[{"t":"Laplacean determinism","s":"An intellect knowing all positions and forces at one instant could compute the whole past and future.","who":["Laplace (1814)","Earman (1986), primer","Hoefer (2003)"],"f":"F2"},{"t":"Quantum indeterminism","s":"Quantum outcomes are irreducibly chancy, so determinism is false, though chance does not by itself give control.","who":["Heisenberg (1927)","Born (1926)","Bohr (1928)","Hodgson (2012)"],"f":"F0"},{"t":"Bohmian and many-worlds determinism","s":"Hidden variables or a branching universal wave function restore determinism beneath the apparent chance.","who":["Bohm (1952)","Everett (1957)","Wallace (2012)","Goldstein (2001)"],"f":"F2"},{"t":"Superdeterminism","s":"Measurement settings and hidden variables are correlated from the start, so Bell tests are compatible with local determinism.","who":["'t Hooft (2016)","Hossenfelder and Palmer (2020)","Bell (1985), dismissing it"],"f":"F2"},{"t":"Free will theorem","s":"If experimenters are free to choose settings, then particles' responses are not determined by the past either.","who":["Conway and Kochen (2006, 2009)","Kochen and Specker (1967)","Goldstein et al. (2010), critique"],"f":"FG"}]},{"t":"Hard incompatibilism","s":"Whether or not determinism is true, we lack the control needed for basic desert; if determined we are like manipulated agents, if undetermined our actions are luck.","who":["Pereboom (2001, 2014)","G. Strawson (1994)","Caruso (2021)","Levy (2011)"],"f":"F2","q":"Which argument?","kids":[{"t":"Four-case manipulation argument","s":"An agent manipulated by neuroscientists is not responsible; ordinary determinism differs from manipulation only in ways that do not matter.","who":["Pereboom (2001, 2014)","Mele (2006), zygote argument","McKenna (2008), hard-line reply","Fischer (2011), soft-line reply"],"f":"F2"},{"t":"Basic argument","s":"To be truly responsible you must be responsible for how you are, which requires having made yourself, which is impossible.","who":["G. Strawson (1994, 2010)","Nietzsche (1886), causa sui"],"f":"F2"},{"t":"Luck pincer","s":"Whether an action is determined or undetermined, its source is either constitutive luck or present luck, and luck excludes responsibility.","who":["Levy (2011)","Mele (2006)"],"f":"F2"},{"t":"Optimistic skepticism","s":"Life without free will belief is livable and possibly better: less retribution, more repair.","who":["Pereboom (2014)","Caruso (2021)","Waller (2011)","Sapolsky (2023)"],"f":"F2"},{"t":"Disillusionism","s":"We should tell people the truth that free will is an illusion; the benefits of belief are overstated.","who":["Caruso (2012)","Pereboom (2014)","Smilansky (2000), contra"],"f":"F2"}]},{"t":"Libertarianism","s":"Free will requires indeterminism and we have it: some choices are up to the agent in a way no prior cause fixes.","who":["Kane (1996)","O'Connor (2000)","Chisholm (1964)","Ginet (1990)"],"f":"F2","q":"What kind of causation?","kids":[{"t":"Agent-causal libertarianism","s":"The agent, as a substance, directly causes the decision; this is a kind of causation not reducible to event causation.","who":["Reid (1788)","Chisholm (1964, 1976)","O'Connor (2000)","Clarke (2003)","Steward (2012)"],"f":"F2","q":"What is agent causation?","kids":[{"t":"Prime mover unmoved","s":"Chisholm's picture: in acting freely each of us is a first cause, like God's causation on a small scale.","who":["Chisholm (1964)","Reid (1788)"],"f":"F2"},{"t":"Emergent agent causation","s":"Agent-causal power is an emergent property of complex organisms, compatible with naturalism.","who":["O'Connor (2000, 2009)","Steward (2012), animal agency","Lowe (2008)"],"f":"F2"}]},{"t":"Event-causal libertarianism","s":"Free decisions are caused by the agent's reasons, but indeterministically; in self-forming actions the agent has plural voluntary control.","who":["Kane (1996, 2011)","Ekstrom (2000)","Balaguer (2010)","Franklin (2018)"],"f":"F2","q":"Does chance help or hurt?","kids":[{"t":"Self-forming actions","s":"In torn decisions, competing efforts of will are each indeterministic, and whichever wins the agent willed.","who":["Kane (1996, 2002)","Kane (2007)"],"f":"F2"},{"t":"Torn decisions","s":"In genuinely torn decisions, if the outcome is undetermined at the moment of choice, that is enough for libertarian freedom.","who":["Balaguer (2010)","Balaguer (2014)"],"f":"F2"},{"t":"Luck objection","s":"If the same agent in the same state could have chosen otherwise, the outcome is luck, not control.","who":["Mele (2006)","Haji (1999)","van Inwagen (2000), rollback argument","Kane (1999), reply"],"f":"F2"},{"t":"Disappearing agent","s":"In event-causal indeterminism nothing settles the outcome, so the agent drops out of the story.","who":["Pereboom (2014)","Clarke (2003)"],"f":"F2"}]},{"t":"Non-causal libertarianism","s":"Free actions are uncaused; what makes them yours is their intrinsic actish quality or the agent's reasons, not causation.","who":["Ginet (1990, 2007)","Goetz (2008)","McCann (1998)"],"f":"F2"},{"t":"Two-stage models","s":"First chance generates alternatives, then a determined evaluation selects; freedom lives in the combination.","who":["James (1884)","Dennett (1978), Valerian model","Doyle (2011)","Heisenberg (2009), Martin"],"f":"F2"},{"t":"Quantum libertarianism","s":"Quantum indeterminacy in the brain is where the agent's choice enters the physical world.","who":["Hameroff and Penrose (2014)","Stapp (2007)","Eccles (1994)","Hodgson (2012)"],"f":"F2"}]},{"t":"Compatibilism","s":"Free will and determinism can both be true; what freedom requires is the right kind of control, not an uncaused cause.","who":["Hobbes (1651)","Hume (1748)","Frankfurt (1971)","Fischer and Ravizza (1998)","Dennett (1984, 2003)"],"f":"F2","q":"What kind of control?","kids":[{"t":"Classical compatibilism","s":"Freedom is the absence of external constraint: you are free if you could have done otherwise had you chosen to.","who":["Hobbes (1651)","Hume (1748)","Moore (1912)","Ayer (1954)","Schlick (1930)"],"f":"F2","q":"Does the conditional analysis work?","kids":[{"t":"Conditional analysis","s":"Could have done otherwise means would have, had one chosen to.","who":["Moore (1912)","Ayer (1954)"],"f":"F2"},{"t":"Consequence argument","s":"If determinism is true our acts are consequences of the laws and the remote past, neither of which is up to us, so nothing is up to us.","who":["van Inwagen (1983)","Ginet (1966)","Wiggins (1973)"],"f":"F2","q":"Can we break laws or change the past?","kids":[{"t":"Local miracle compatibilism","s":"We are able to do things such that, had we done them, a law would have been broken, without our breaking it.","who":["Lewis (1981)","Beebee and Mele (2002), Humean"],"f":"F2"},{"t":"Multiple-pasts compatibilism","s":"Had we acted otherwise, the past would have been different; this is harmless backtracking.","who":["Saunders (1968)","Horgan (1985)","Fischer (1994), discussion"],"f":"F2"},{"t":"Dispositional compatibilism","s":"Abilities are dispositions, which we keep even when unexercised; determinism does not remove dispositions.","who":["Vihvelin (2004, 2013)","Fara (2008)","Smith (2003)"],"f":"F2"}]}]},{"t":"Hierarchical mesh","s":"You act freely when your first-order desire is the one you want to be moved by; the will is free when it meshes with second-order volitions.","who":["Frankfurt (1971, 1988)","Dworkin (1988)","Bratman (2007), planning agency"],"f":"F2","q":"Which higher-order state?","kids":[{"t":"Frankfurt cases","s":"An agent who could not have done otherwise because a counterfactual intervener stood ready is still responsible, so alternatives are not needed.","who":["Frankfurt (1969)","Fischer (1994)","Widerker (1995), contra","Kane (1985), dilemma defence"],"f":"F2"},{"t":"Valuational identification","s":"Free action flows from what the agent values, not merely from what it desires to desire.","who":["Watson (1975)","Watson (1987)"],"f":"F2"},{"t":"Regress objection","s":"Why do second-order desires have authority? Appealing to third-order desires never ends.","who":["Watson (1975)","Frankfurt (1987), decisive commitment reply","Bratman (2007)"],"f":"F2"}]},{"t":"Reasons-responsiveness","s":"You are responsible when the mechanism that issued your action would have responded to sufficient reasons to do otherwise; regulative control is unnecessary.","who":["Fischer and Ravizza (1998)","Fischer (1994)","Fischer (2006)"],"f":"F2","q":"How does this become semi-compatibilism?","kids":[{"t":"Semi-compatibilism","s":"Moral responsibility is compatible with determinism even if freedom to do otherwise is not.","who":["Fischer (1994)","Fischer and Ravizza (1998)","Fischer (2007)"],"f":"F2"},{"t":"Guidance versus regulative control","s":"Guiding one's action is enough for responsibility; power over alternatives is not required.","who":["Fischer (1982, 1994)","Fischer and Ravizza (1998)"],"f":"F2"},{"t":"Moderate reasons-responsiveness","s":"The mechanism must be regularly receptive to reasons and at least weakly reactive.","who":["Fischer and Ravizza (1998)","McKenna (2005), critique","Sartorio (2016), actual sequence"],"f":"F2"}]},{"t":"Reactive attitudes","s":"Responsibility practices are grounded in attitudes like resentment and gratitude that we could not give up and need no metaphysical warrant.","who":["P.F. Strawson (1962)","Wallace (1994)","Watson (1987)","McKenna (2012), conversational"],"f":"F2"},{"t":"Dennett's compatibilism","s":"The free will worth wanting is the capacity to avoid, plan and respond; evolution built it, and determinism does not remove evitability.","who":["Dennett (1984, 2003)","Dennett and Caruso (2021)"],"f":"F2"},{"t":"Reason view","s":"Freedom is the ability to act in accordance with reason and the good; blame requires that the agent could have done right, praise does not.","who":["Wolf (1990)","Wolf (1980)"],"f":"F2"},{"t":"Attributionism","s":"You are responsible for what reflects your evaluative judgements, whether or not you could control it.","who":["Scanlon (1998)","Smith (2005, 2008)","Sher (2006)","Arpaly (2003)"],"f":"F2"},{"t":"Revisionism","s":"The folk concept of free will is partly mistaken; keep responsibility practices on a revised, justified footing.","who":["Vargas (2005, 2013)","Nichols (2015)","McCormick (2013)"],"f":"F2"},{"t":"Higher-level indeterminism","s":"Free will is a higher-level phenomenon; even if physics is deterministic, the agential level admits alternatives.","who":["List (2014, 2019)","Ismael (2016)","Butterfield (2012), levels"],"f":"F2"},{"t":"Consequentialist justification","s":"Blame and punishment are justified by their effects on behaviour, so free will in the deep sense is beside the point.","who":["Schlick (1930)","Smart (1961)","Vargas (2013)"],"f":"F2"}]},{"t":"Illusionism about free will","s":"Free will does not exist, but the illusion of it is morally necessary and should be preserved.","who":["Smilansky (2000, 2002)","Wegner (2002)","Nietzsche (1886)"],"f":"F2","q":"Why keep the illusion?","kids":[{"t":"Fundamental dualism","s":"Compatibilism and hard determinism are both partly right; only the illusion holds the moral order together.","who":["Smilansky (2000)","Smilansky (2011)"],"f":"F2"},{"t":"Illusion of conscious will","s":"The feeling of willing is an inference the mind draws when a thought precedes an act; it is not the cause.","who":["Wegner (2002)","Wegner and Wheatley (1999)","Nahmias (2002), critique"],"f":"F1"}]},{"t":"Libet debate","s":"Brain activity predicting a movement precedes the reported moment of deciding; what this shows about free will is disputed.","who":["Libet, Gleason, Wright and Pearl (1983)","Soon, Brass, Heinze and Haynes (2008)","Schurger, Sitt and Dehaene (2012)","Mele (2009)"],"f":"F1","q":"What does the readiness potential mean?","kids":[{"t":"Readiness potential precedes the will","s":"The brain starts a movement about half a second before the person is aware of intending it.","who":["Libet et al. (1983)","Kornhuber and Deecke (1965)","Haggard and Eimer (1999)"],"f":"F0"},{"t":"Free won't","s":"Consciousness cannot start an act but can veto one in the last 150 ms.","who":["Libet (1985, 1999)","Schultze-Kraft et al. (2016), point of no return"],"f":"F1"},{"t":"Stochastic accumulator","s":"The readiness potential is not a decision but noise drifting toward a threshold; it looks like a precursor only when averaged backward from the act.","who":["Schurger, Sitt and Dehaene (2012)","Schurger et al. (2021)","Maoz et al. (2019), absent in deliberate choice"],"f":"F1"},{"t":"Decoding predictions seconds ahead","s":"Frontopolar and parietal activity predicts the side of a button press up to ten seconds before awareness, at slightly above chance.","who":["Soon et al. (2008)","Bode et al. (2011)","Fried, Mukamel and Kreiman (2011), single neurons"],"f":"F0"},{"t":"Philosophical deflation","s":"The experiments concern arbitrary flicks, not reasoned choices, and awareness of intention is not what free will needs.","who":["Mele (2009)","Nahmias (2014)","Roskies (2010)","Dennett (2003)"],"f":"F2"},{"t":"Time-on theory","s":"Awareness of a stimulus needs about half a second of neural activity, and is then referred backward in time.","who":["Libet (2004)","Libet, Wright, Feinstein and Pearl (1979)","Churchland (1981), critique"],"f":"F1"}]},{"t":"Experimental philosophy of free will","s":"What ordinary people believe about freedom, measured by survey.","who":["Nahmias, Morris, Nadelhoffer and Turner (2005)","Nichols and Knobe (2007)","Sarkissian et al. (2010)"],"f":"F0","q":"Are the folk compatibilists?","kids":[{"t":"Natural compatibilism","s":"Most people judge determined agents responsible when the case is described concretely.","who":["Nahmias et al. (2005, 2006)","Murray and Nahmias (2014)"],"f":"F0"},{"t":"Affective incompatibilism","s":"Abstract cases draw incompatibilist judgements; concrete emotional cases draw compatibilist ones, so intuitions are affect-driven.","who":["Nichols and Knobe (2007)","Nichols (2011)"],"f":"F0"},{"t":"Cross-cultural convergence","s":"Across the US, Hong Kong, India and Colombia most people say the universe is indeterministic and that determinism would remove responsibility.","who":["Sarkissian et al. (2010)","Hannikainen et al. (2019)"],"f":"F0"}]},{"t":"Theological compatibilisms","s":"How divine foreknowledge or decree coexists with human choice.","who":["Augustine (c. 420)","Boethius (524)","Molina (1588)","al-Ash'arī (10th c.)"],"f":"F2","q":"How does God know or fix the choice?","kids":[{"t":"Timeless knowledge","s":"God sees all times at once, so foreknowledge does not precede and fix the act.","who":["Boethius (524)","Aquinas (1265)","Stump and Kretzmann (1981)"],"f":"F2"},{"t":"Middle knowledge","s":"God knows what every free creature would do in every circumstance and chooses which circumstances to create.","who":["Molina (1588)","Flint (1998)","Plantinga (1974)"],"f":"F2"},{"t":"Predestination","s":"God's decree fixes who is saved; human will is free only in the compatibilist sense.","who":["Augustine (c. 420)","Calvin (1559)","Edwards (1754)"],"f":"F2"},{"t":"Acquisition","s":"God creates every act, and the human acquires it as theirs; a middle way between compulsion and creation.","who":["al-Ash'arī (10th c.)","al-Māturīdī (10th c.)","Frank (1983)"],"f":"F2"},{"t":"Open theism","s":"God does not know future free choices because they do not yet exist to be known.","who":["Pinnock et al. (1994)","Hasker (1989)","Boyd (2000)"],"f":"F2"},{"t":"Muʿtazilite freedom","s":"Humans create their own acts, otherwise divine justice would punish what God caused.","who":["Wāṣil ibn ʿAṭāʾ (8th c.)","ʿAbd al-Jabbār (10th c.)","Hourani (1985)"],"f":"F2"}]}],"q":"Which theory of freedom?"},{"t":"What can machines tell us?","s":"Decoders, dishes, emulations, qubits.","q":"Which machine?","kids":[{"t":"Brain decoders","s":"fMRI and MEG with AI. Gist, not verbatim. You can resist them.","f":"F0","d":"Which neural states carry which contents. Nothing about what experience is. The limits are physical: blood flow takes seconds, and reconstructing sources from surface fields has no unique answer.","kids":[{"t":"Neural coding theories","s":"Which feature of neural activity carries the message the decoder reads.","who":["Adrian (1926)","Barlow (1961)","Georgopoulos (1986)","Rieke et al. (1997)"],"f":"F1","q":"Rate, timing, or population?","kids":[{"t":"Rate coding","s":"Information is in the number of spikes per unit time; timing is noise.","who":["Adrian (1926)","Shadlen and Newsome (1998)","London et al. (2010)"],"f":"F1"},{"t":"Temporal coding","s":"The precise timing and phase of spikes carries information beyond the rate.","who":["Bialek et al. (1991)","O'Keefe and Recce (1993), phase precession","Singer (1999)","VanRullen, Guyonneau and Thorpe (2005)"],"f":"F1"},{"t":"Population coding","s":"Stimuli are read from the joint activity of many neurons, each broadly tuned.","who":["Georgopoulos, Schwartz and Kettner (1986)","Pouget, Dayan and Zemel (2000)","Averbeck, Latham and Pouget (2006)"],"f":"F0"},{"t":"Sparse and efficient coding","s":"Sensory systems represent inputs with few active units, matching natural statistics to save energy.","who":["Barlow (1961)","Olshausen and Field (1996)","Simoncelli and Olshausen (2001)"],"f":"F0"},{"t":"Predictive coding in cortex","s":"Feedback carries predictions and feedforward carries errors; the decoder reads residuals, not images.","who":["Rao and Ballard (1999)","Mumford (1992)","Bastos et al. (2012)"],"f":"F1"},{"t":"Neural manifolds","s":"Population activity lives on low-dimensional surfaces; decoding is finding the manifold, not the neuron.","who":["Gallego et al. (2017)","Cunningham and Yu (2014)","Chung and Abbott (2021)"],"f":"F1"}]},{"t":"Decoding models","s":"Statistical methods that map measured brain activity back to stimulus or intent.","who":["Haxby et al. (2001)","Naselaris, Kay, Nishimoto and Gallant (2011)","Tang, LeBel, Jain and Huth (2023)"],"f":"F0","q":"What kind of model?","kids":[{"t":"Multivoxel pattern analysis","s":"Distributed fMRI patterns classify which category was seen, even where no single region is selective.","who":["Haxby et al. (2001)","Kamitani and Tong (2005)","Norman et al. (2006)"],"f":"F0"},{"t":"Encoding-model inversion","s":"Fit a forward model from stimulus features to voxels, then invert it to reconstruct novel stimuli.","who":["Kay, Naselaris, Prenger and Gallant (2008)","Naselaris et al. (2011)","Nishimoto et al. (2011), movies"],"f":"F0"},{"t":"Semantic language decoding","s":"Continuous language is reconstructed from fMRI as paraphrase, only with the subject's cooperation, and not across subjects.","who":["Tang, LeBel, Jain and Huth (2023)","Huth et al. (2016), semantic maps","Défossez et al. (2023), MEG"],"f":"F0"},{"t":"Dream and imagery decoding","s":"Classifiers trained on waking vision read the categories present in dreams at sleep onset.","who":["Horikawa, Tamaki, Miyawaki and Kamitani (2013)","Horikawa and Kamitani (2017)","Siclari et al. (2017)"],"f":"F0"},{"t":"Speech neuroprostheses","s":"Intracortical arrays and ECoG decode attempted speech at conversational speed in paralysed people.","who":["Willett et al. (2023)","Metzger et al. (2023)","Moses et al. (2021)","Card et al. (2024)"],"f":"F0"},{"t":"Diffusion-model reconstruction","s":"Generative image models conditioned on fMRI features reconstruct seen images with recognisable gist.","who":["Takagi and Nishimoto (2023)","Ozcelik and VanRullen (2023)","Scotti et al. (2023)"],"f":"F0"}]},{"t":"Limits of measurement","s":"Positions on why decoders cannot become mind-readers.","who":["Helmholtz (1853)","Poldrack (2006)","Farah and Wolpe (2004)"],"f":"gate","q":"Which limit?","kids":[{"t":"Inverse problem","s":"Infinitely many source configurations produce the same scalp field, so EEG and MEG localisation needs priors that decide the answer.","who":["Helmholtz (1853)","Grech et al. (2008)","Baillet, Mosher and Leahy (2001)"],"f":"F0"},{"t":"Reverse inference","s":"Inferring a mental state from activation of a region is weak because regions serve many functions.","who":["Poldrack (2006, 2011)","Hutzler (2014)","Machery (2014)"],"f":"F0"},{"t":"Haemodynamic lag","s":"Blood flow responds over seconds and blurs millisecond events; fMRI is a slow proxy.","who":["Logothetis (2008)","Buxton (2009)","Ogawa et al. (1990)"],"f":"F0"},{"t":"Cooperation requirement","s":"Decoders trained on a subject's cooperating brain fail when the subject attends elsewhere or counts backwards.","who":["Tang et al. (2023)","Farah, Hutchinson, Phelps and Wagner (2014), lie detection","Ienca and Andorno (2017), neurorights"],"f":"F0"}]}],"q":"What code do they read, and how?"},{"t":"Biocomputing","s":"Living neurons on chips.","f":"F1","d":"Tells you the learning efficiency of tissue and whether neuron-like dynamics matter for intelligence. A dish that plays Pong says nothing about whether it feels. Behavior is not experience. Silicon AI did not hit a wall that needed brain cells; that claim was false.","kids":[{"t":"Synthetic biological intelligence","s":"Cultured neurons embedded in a game loop learn to play Pong; the claim is that they show goal-directed learning in a dish.","who":["Kagan et al. (2022), DishBrain","Cortical Labs (2022)","Friston et al. (2022), free energy account"],"f":"F1","q":"Does it learn, and does it feel?","kids":[{"t":"Free energy reading","s":"The culture reduces unpredictable input, as active inference predicts, which is offered as evidence of sentience-like behaviour.","who":["Kagan et al. (2022)","Friston (2022)"],"f":"F1"},{"t":"Behaviour is not sentience","s":"Learning in a dish is what any adaptive system does; nothing in the result speaks to experience.","who":["Balci et al. (2023)","Birch (2024)","Koch (2023)"],"f":"gate"}]},{"t":"Organoid intelligence","s":"Brain organoids wired to input and output become a computing substrate; a research programme with a name and a roadmap.","who":["Smirnova et al. (2023)","Cai et al. (2023), Brainoware","Hartung et al. (2023)"],"f":"F1","q":"Could an organoid be conscious?","kids":[{"t":"Precautionary organoid ethics","s":"If organoids could suffer we should test them with perturbational complexity before scaling them.","who":["Lavazza and Massimini (2018)","Koplin and Savulescu (2019)","Sawai et al. (2019)"],"f":"F2"},{"t":"Organoids lack the architecture","s":"Without thalamus, sensory input and organised layers, organoids show bursts but no candidate for experience.","who":["Trujillo et al. (2019), oscillations","Kagan et al. (2023)","Birch and Browning (2021)"],"f":"F1"}]},{"t":"Neuromorphic and hybrid computing","s":"Silicon that spikes like neurons, and neurons that talk to silicon, test whether brain-like dynamics matter for intelligence.","who":["Mead (1990)","Indiveri et al. (2011)","Davies et al. (2018), Loihi","Furber et al. (2014), SpiNNaker"],"f":"F1"},{"t":"Silicon did not need biology","s":"Large models reached human-level performance on many tasks without neurons, so the claim that AI needed living tissue was false.","who":["Vaswani et al. (2017)","Brown et al. (2020)","Bubeck et al. (2023)","Marcus (2022), contra"],"f":"F0"}],"q":"What does living tissue on a chip test?"},{"t":"Whole-brain emulation","s":"Copy the wiring, run it.","f":"F1","d":"Settles whether behavior follows from structure. Cannot settle whether the copy experiences anything. So it cannot confirm Clutter, contrary to the conversation.","kids":[{"t":"Emulation roadmap","s":"Scanning, translation and simulation at a chosen level of detail would reproduce behaviour; the required level is unknown.","who":["Sandberg and Bostrom (2008)","Sandberg (2013)","Hayworth (2012)"],"f":"F1","q":"At which level?","kids":[{"t":"Connectome-level emulation","s":"The wiring diagram plus synapse types suffices; the fly connectome is the test bed.","who":["Seung (2012)","Dorkenwald et al. (2024), FlyWire","Shiu et al. (2024), whole-brain model"],"f":"F1"},{"t":"Biophysical emulation","s":"Ion channels, dendrites and neuromodulators must be included; the wiring alone is not enough.","who":["Markram (2006, 2015)","Einevoll et al. (2019)","Koch and Segev (2000)"],"f":"F1"},{"t":"Molecular emulation","s":"Behaviour depends on molecular state, so scanning must go to the protein level or fail.","who":["Hayworth (2012)","Miller (2015)","Jonas and Kording (2017), could a neuroscientist understand a microprocessor"],"f":"F2"}]},{"t":"Substrate independence","s":"The same computation in any medium gives the same mind; an emulation would be you.","who":["Bostrom (2003)","Chalmers (1996, 2010)","Moravec (1988)","Kurzweil (2005)"],"f":"F2","q":"What does the copy have?","kids":[{"t":"Fading and dancing qualia","s":"Gradually replacing neurons with chips cannot make experience fade or flip without absurdity, so organisation suffices.","who":["Chalmers (1996)","Chalmers (2010)","Pylyshyn (1980)"],"f":"F2"},{"t":"Simulation is not instantiation","s":"A simulated storm is not wet; a simulated brain has zero integrated information on a von Neumann machine.","who":["Tononi and Koch (2015)","Koch (2019)","Searle (1980)"],"f":"F2"},{"t":"Biological gap","s":"If consciousness depends on metabolism or dendritic biophysics, an emulation behaves like you and feels nothing.","who":["Godfrey-Smith (2016)","Seth (2021)","Aru, Larkum and Shine (2023)"],"f":"F3"}]},{"t":"Large-scale brain models","s":"Running models of millions of neurons tests whether behaviour follows from structure.","who":["Eliasmith et al. (2012), Spaun","Markram et al. (2015)","Izhikevich and Edelman (2008)","OpenWorm (2014)"],"f":"F1"},{"t":"Uploading and identity","s":"Whether an emulation would be you is the fission problem again; destructive scanning and gradual replacement are judged differently.","who":["Chalmers (2010)","Parfit (1984)","Schneider (2019)","Hauskeller (2012)"],"f":"F2"}],"q":"What does copying the wiring settle?"},{"t":"Quantum computers","s":"Nothing on this axis.","f":"F2","d":"Except possibly Penrose and Hameroff’s microtubule coherence claim, where results lean negative.","kids":[{"t":"Gödelian argument against mechanism","s":"Humans can see the truth of a system's Gödel sentence, so human insight is not algorithmic and needs non-computable physics.","who":["Lucas (1961)","Penrose (1989, 1994)"],"f":"F2","q":"Does it work?","kids":[{"t":"Consistency reply","s":"We cannot know we are consistent, so we cannot see the Gödel sentence as true; the argument fails.","who":["Putnam (1960)","Benacerraf (1967)","Feferman (1995)","Franzén (2005)"],"f":"F2"},{"t":"Algorithm-unknown reply","s":"We might be algorithms too complex to know; Gödel himself allowed this disjunction.","who":["Gödel (1951)","Chalmers (1995)","Shapiro (1998)"],"f":"F2"}]},{"t":"Quantum tests of Orch-OR","s":"Proposed measurements of microtubule coherence, anaesthetic binding and superradiance that would confirm or rule out quantum effects in neurons.","who":["Bandyopadhyay (2014)","Kalra et al. (2023)","Khan et al. (2024)","Hameroff (2022)"],"f":"F1"},{"t":"Nuclear spin test","s":"Lithium-6 and lithium-7 differ in nuclear spin; if they differ in behavioural effect, nuclear spin coherence matters in the brain.","who":["Fisher (2015)","Ettenberg et al. (2020)","Sechzer et al. (1986), early isotope data"],"f":"F1"},{"t":"Freebits","s":"Free will could rest on quantum states that carry unknowable initial conditions from the early universe; testable in principle by whether brains amplify such states.","who":["Aaronson (2013)","Lloyd (2012), Turing test for free will"],"f":"F2"},{"t":"Quantum simulation of brain chemistry","s":"Quantum computers could simulate the molecules of neurotransmission exactly, but this concerns chemistry, not experience.","who":["Feynman (1982)","Lloyd (1996)","Cao et al. (2019)"],"f":"F1"},{"t":"Quantum cognition as mathematics only","s":"Hilbert-space models fit order effects in judgement without any claim about quantum physics in neurons.","who":["Busemeyer and Bruza (2012)","Pothos and Busemeyer (2013)","Khrennikov (2010)"],"f":"F1"}],"q":"Where could quantum computing touch the question?"},{"t":"Artificial minds","s":"Whether a built system could be conscious, and how anyone could tell.","who":["Turing (1950)","Searle (1980)","Schneider (2019)","Butlin, Long et al. (2023)","Chalmers (2023)"],"f":"F3","q":"How would we test it?","kids":[{"t":"Behavioural tests","s":"Judge the mind by what it does in conversation or action.","who":["Turing (1950)","Harnad (1991)","Bringsjord, Bello and Ferrucci (2001)","Levesque (2012)"],"f":"F2","q":"Which test?","kids":[{"t":"Turing test","s":"If a machine cannot be told from a human in typed conversation, the question of whether it thinks is settled or meaningless.","who":["Turing (1950)","Moor (1976)","Dennett (1985)"],"f":"F2","q":"What is wrong with it?","kids":[{"t":"Blockhead","s":"A lookup table of every possible conversation passes the test with no intelligence, so passing is not sufficient.","who":["Block (1981)","Braddon-Mitchell and Jackson (1996)"],"f":"F2"},{"t":"Total Turing test","s":"Require embodied performance across all sensorimotor abilities, not just typing.","who":["Harnad (1991)","Harnad (2000)"],"f":"F2"},{"t":"Lovelace test","s":"The machine must produce something its designers cannot explain from its programming.","who":["Bringsjord, Bello and Ferrucci (2001)","Riedl (2014), Lovelace 2.0"],"f":"F2"},{"t":"Winograd schemas","s":"Pronoun disambiguation that needs world knowledge, meant to resist trickery; large models later passed it.","who":["Levesque, Davis and Morgenstern (2012)","Kocijan et al. (2023)"],"f":"F0"}]},{"t":"Artificial Consciousness Test","s":"Isolate a system from human talk about consciousness, then probe whether it grasps the concepts anyway.","who":["Schneider and Turner (2017)","Schneider (2019)","Udell and Schwitzgebel (2021), critique"],"f":"F2"},{"t":"Chip test","s":"Replace parts of a human brain with chips and ask whether experience survives; an empirical test of substrate.","who":["Schneider (2019)","Chalmers (1996), forerunner"],"f":"F2"}]},{"t":"Theory-based indicators","s":"Take the leading scientific theories of consciousness, extract the properties each says are necessary, and check systems for them.","who":["Butlin, Long et al. (2023)","Dehaene, Lau and Kouider (2017)","Bengio (2017), consciousness prior"],"f":"F2","q":"Which indicators?","kids":[{"t":"Recurrence and workspace indicators","s":"Recurrent processing, a limited-capacity broadcast, and global availability of content.","who":["Butlin, Long et al. (2023)","Lamme (2010)","Dehaene (2014)"],"f":"F2"},{"t":"Higher-order indicators","s":"A metacognitive model that distinguishes reliable from noisy first-order representations.","who":["Butlin, Long et al. (2023)","Lau (2022)","Fleming (2020)"],"f":"F2"},{"t":"Agency and embodiment indicators","s":"An agent that models the effects of its own outputs on its inputs and pursues goals.","who":["Butlin, Long et al. (2023)","Seth (2021)","Godfrey-Smith (2016)"],"f":"F2"},{"t":"C1 and C2 for machines","s":"Machines could have global availability and self-monitoring; present ones mostly lack both.","who":["Dehaene, Lau and Kouider (2017)","Kouider (2017)"],"f":"F2"}]},{"t":"Positions on large language models","s":"Whether current language models could be conscious.","who":["Chalmers (2023)","Butlin, Long et al. (2023)","Seth (2024)","Bender et al. (2021)"],"f":"F2","q":"Could a transformer be conscious?","kids":[{"t":"Chalmers on LLMs","s":"Present models lack recurrence, a global workspace, unified agency and senses, so low credence now, but the obstacles are removable within a decade.","who":["Chalmers (2023)","Chalmers (2025)"],"f":"F2"},{"t":"Stochastic parrots","s":"Language models manipulate form without meaning; fluency is not understanding.","who":["Bender, Gebru, McMillan-Major and Mitchell (2021)","Bender and Koller (2020)","Marcus and Davis (2019)"],"f":"F2"},{"t":"Understanding without grounding","s":"Models could acquire meaning from text alone through internal structure that mirrors the world.","who":["Piantadosi and Hill (2022)","Søgaard (2023)","Mitchell and Krakauer (2023), debate summary"],"f":"F2"},{"t":"Biological naturalism about AI","s":"Consciousness depends on being alive and regulating a body; no software will have it.","who":["Seth (2024, 2025)","Aru, Larkum and Shine (2023)","Godfrey-Smith (2016)"],"f":"F2"},{"t":"IIT verdict on computers","s":"Conventional hardware has near-zero integrated information regardless of what it computes, so no digital AI is conscious.","who":["Tononi and Koch (2015)","Koch (2019)","Findlay et al. (2024)"],"f":"F2"},{"t":"Excluded middle policy","s":"Do not build systems whose moral status is unclear; make them clearly conscious or clearly not.","who":["Schwitzgebel and Garza (2015, 2020)","Metzinger (2021), moratorium"],"f":"F2"},{"t":"Precautionary sentience","s":"Where the evidence is uncertain, treat a system as a sentience candidate and take proportionate precautions.","who":["Birch (2024)","Long, Sebo et al. (2024)","Sebo and Long (2023)"],"f":"F2"},{"t":"Digital minds propositions","s":"A programme for what a society should assume about machine welfare given the possibility of conscious software.","who":["Bostrom and Shulman (2023)","Shulman and Bostrom (2021)","Schwitzgebel (2023)"],"f":"F2"}]},{"t":"Behaviour never reveals experience","s":"Any test based on behaviour can be passed by a system without experience and failed by one with it.","who":["Block (1978, 2002)","Nagel (1974)","Searle (1980)","Harnad (2003)"],"f":"gate"}]}]}]},{"t":"What is right","s":"Whether there are moral facts, and whether the origin of things changes them.","q":"Are there moral facts independent of anyone’s attitudes?","doc":"06-morality.md","kids":[{"t":"Yes","s":"Some things are wrong whatever anyone thinks.","q":"Grounded in what?","kids":[{"t":"The will or nature of the ground","s":"God, the Good, the cosmic order.","who":["Divine command theory","Natural law (Aquinas)","Plato’s Form of the Good","Dharma"],"addr":"M1a","f":"gate","q":"Commanded because good, or good because commanded?","kids":[{"t":"It commands things because they are good","s":"Then goodness is prior to the maker, and morality is grounded elsewhere.","f":"gate","d":"Move to natural facts or reason-based facts under What is right.","kids":[{"t":"Platonic Form of the Good","s":"Goodness is a real form; gods and makers are good by sharing in it.","who":["Plato (c. 380 BC)","Plotinus (c. 250)","Iris Murdoch (1970)","Robert Adams (1999)"],"f":"F2","q":"How do we reach the Form?","kids":[{"t":"Recollection and ascent","s":"The soul once saw the Good and can climb back to it by dialectic.","who":["Plato, Republic and Symposium"],"f":"F3"},{"t":"Emanation","s":"The Good overflows into lower levels of being; value is nearer the source.","who":["Plotinus (c. 250)","Proclus (c. 450)","Pseudo-Dionysius (c. 500)"],"f":"F3"},{"t":"Godless Platonism","s":"The Good is real and central but no god is needed.","who":["Iris Murdoch (1970)","Erik Wielenberg (2014)"],"f":"F2"},{"t":"Theistic Platonism","s":"God is the Good itself; finite goods resemble God.","who":["Robert Adams (1999)","Augustine (c. 400)"],"f":"F2"}]},{"t":"Muʿtazilite rationalism","s":"Acts are good or bad in themselves; God commands them because they are good.","who":["Abd al-Jabbar (c. 1000)","Abu al-Hudhayl (c. 840)","al-Qadi Abd al-Jabbar"],"f":"F2"},{"t":"Rationalist theism","s":"Eternal moral truths bind even God; God is good by conforming to them.","who":["Leibniz (1686)","Ralph Cudworth (1731)","Samuel Clarke (1706)","Richard Price (1758)"],"f":"F2"},{"t":"Grotius’s hypothesis","s":"Natural law would hold even if there were no God.","who":["Hugo Grotius (1625)","Francisco Suárez (1612), partly"],"f":"F2"},{"t":"Maimonidean rational commandments","s":"Some commandments would be known as right by reason alone; revelation adds the rest.","who":["Saadia Gaon (933)","Maimonides (1190)"],"f":"F2"},{"t":"Confucian tian as moral pattern","s":"Heaven is the source of moral order, not a will that decides it.","who":["Mencius (c. 300 BC)","Zhongyong","Zhu Xi (c. 1180)"],"f":"F2"},{"t":"Shīʿa uṣūlī rationalism","s":"Reason can know some moral truths independently, and God’s law agrees with them.","who":["al-Shaykh al-Mufid (c. 1000)","Allama Hilli (c. 1300)","Muhammad Baqir al-Sadr (1959)"],"f":"F2"}],"q":"Which prior good?"},{"t":"Things are good because it commands them","s":"Then saying the maker is good says nothing.","who":["Ockham","Ash’arite theology"],"f":"gate","kids":[{"t":"Ockhamist voluntarism","s":"God could have commanded hatred of God, and it would then be right.","who":["William of Ockham (c. 1320)","Pierre d’Ailly (c. 1400)","Gabriel Biel (c. 1480)"],"f":"gate"},{"t":"Scotist partial voluntarism","s":"The first table of the law is necessary; the second depends on God’s will.","who":["Duns Scotus (c. 1300)"],"f":"gate"},{"t":"Ashʿarite occasionalist ethics","s":"Good means commanded; nothing is obligatory before revelation.","who":["al-Ashʿari (c. 930)","al-Ghazali (c. 1100), partly","al-Juwayni (c. 1080)"],"f":"gate"},{"t":"Cartesian creation of eternal truths","s":"God freely created even the truths of logic and value.","who":["Descartes (1641)"],"f":"gate"},{"t":"Reformation voluntarism","s":"God’s will is the rule of righteousness; asking why is impious.","who":["Martin Luther (1525)","John Calvin (1559)"],"f":"gate"},{"t":"Barthian command ethics","s":"The good is what God commands here and now; no general theory replaces hearing the command.","who":["Karl Barth (1932–67)","Dietrich Bonhoeffer (1949)"],"f":"gate"},{"t":"Kierkegaard’s teleological suspension","s":"Faith can override the ethical when God commands, as with Abraham.","who":["Søren Kierkegaard (1843)"],"f":"gate"},{"t":"Quinn’s causal divine command","s":"God’s commands cause moral obligations, as a lawgiver makes law.","who":["Philip Quinn (1978)","Janine Idziak (1979)"],"f":"gate"},{"t":"Hanbali and Zahiri literalism","s":"Only the text’s command settles right and wrong; reason has no independent say.","who":["Ibn Hanbal (c. 850)","Ibn Hazm (c. 1050)"],"f":"gate"}],"q":"How far does the will reach?"},{"t":"Its nature, not its will, is the standard","s":"The usual escape.","who":["Aquinas","Robert Adams"],"f":"gate","kids":[{"t":"Thomist natural law","s":"Right is what fits the natures God made; God’s law and reason agree because both flow from God’s nature.","who":["Thomas Aquinas (1270)","Francisco de Vitoria (c. 1530)","Jacques Maritain (1943)"],"f":"F2","q":"How is natural law known?","kids":[{"t":"Classical Thomism","s":"Practical reason reads ends off human nature; the first precept is to do good and avoid evil.","who":["Aquinas (1270)","Ralph McInerny (1982)","Henry Veatch (1985)"],"f":"F2"},{"t":"New natural law","s":"Basic goods are grasped directly by practical reason, not derived from facts about nature.","who":["Germain Grisez (1965)","John Finnis (1980)","Robert George (1999)","Joseph Boyle"],"f":"F2"},{"t":"Natural law as participation in eternal law","s":"Human law is right insofar as it shares in the eternal law of God’s mind.","who":["Aquinas","Richard Hooker (1594)","Suárez (1612)"],"f":"F2"},{"t":"Protestant natural law","s":"Fallen reason still reads God’s law in creation and conscience.","who":["Philip Melanchthon (1521)","Hooker (1594)","Emil Brunner (1932)","J. Budziszewski (1997)"],"f":"F2"},{"t":"Islamic natural law","s":"Reason can find God’s law in nature, within limits set by revelation.","who":["Anver Emon (2010) on Muʿtazila and Maturidi","al-Maturidi (c. 940)","Ibn Rushd (c. 1180)"],"f":"F2"},{"t":"Jewish natural law","s":"The Noahide laws are known by reason and bind everyone.","who":["David Novak (1998)","Saadia Gaon (933)","Nachmanides (c. 1260)"],"f":"F2"}]},{"t":"Adams’s modified divine command","s":"Wrong means contrary to the commands of a loving God; God’s loving nature blocks arbitrariness.","who":["Robert Adams (1979, 1999)","William Alston (1990)","Stephen Evans (2013)"],"f":"F2"},{"t":"Divine nature theory","s":"Goodness is God’s nature; obligation comes from commands, value from character.","who":["William Lane Craig (2008)","David Baggett and Jerry Walls (2011)","Mark Murphy (2011)"],"f":"F2"},{"t":"Divine motivation theory","s":"Good motives are those that resemble God’s; commands are downstream.","who":["Linda Zagzebski (2004)"],"f":"F2"},{"t":"Maturidi middle position","s":"Reason can know good and bad; obligation to act needs revelation.","who":["al-Maturidi (c. 940)","Abu Hanifa (c. 750), by tradition"],"f":"F2"},{"t":"Neo-Confucian li","s":"A single principle runs through Heaven and human nature; right action expresses it.","who":["Zhu Xi (c. 1180)","Cheng Yi (c. 1090)","Wang Yangming (1527)"],"f":"F2"},{"t":"Rta and asha","s":"A cosmic order that gods uphold rather than make.","who":["Rigveda","Zoroastrian Gathas (c. 1000 BC)"],"f":"F2"},{"t":"Divine simplicity reading","s":"God does not have goodness; God is goodness, so the dilemma does not arise.","who":["Aquinas (1270)","Eleonore Stump (2003)","Brian Davies (2006)"],"f":"gate"},{"t":"Leibowitz theocentrism","s":"Serving God is the only value; morality is worth nothing except as obedience.","who":["Yeshayahu Leibowitz (1975)"],"f":"gate"}],"q":"How does the nature become a standard?"},{"t":"The ground is an impersonal order","s":"Right fits a cosmic pattern that no one wills.","who":["Dharma","Dao","Ma’at","Stoic logos","Rta"],"f":"F2","q":"Which order?","kids":[{"t":"Mīmāṃsā dharma","s":"Dharma is what Vedic injunction enjoins; the Veda is authorless and eternal.","who":["Jaimini (c. 200 BC)","Kumarila Bhatta (c. 650)","Prabhakara (c. 650)"],"f":"F2","q":"Where does the obligation sit?","kids":[{"t":"Bhāṭṭa","s":"The injunction points to a result the agent wants.","who":["Kumarila"],"f":"F2"},{"t":"Prābhākara","s":"The injunction itself commands, apart from any result.","who":["Prabhakara"],"f":"F2"}]},{"t":"Dharmaśāstra","s":"Duty is fixed by station, stage of life, and text.","who":["Manusmṛti (c. 200)","Yajnavalkya Smriti","P.V. Kane (1930–62)"],"f":"F2"},{"t":"Nyāya theistic dharma","s":"God authors the Veda and dharma is what it enjoins.","who":["Udayana (c. 1000)","Jayanta Bhatta (c. 900)"],"f":"F2"},{"t":"Karma as impersonal law","s":"Acts carry their own fruit without a judge.","who":["Buddhist Abhidharma","Jain Tattvārtha Sūtra","Upanishads"],"f":"F2"},{"t":"Stoic logos","s":"Right is living according to the reason that runs through nature.","who":["Zeno (c. 300 BC)","Chrysippus (c. 240 BC)","Marcus Aurelius (c. 170)"],"f":"F2"},{"t":"Daoist Dao","s":"The way is prior to Heaven and to good and evil; right is following it.","who":["Laozi (c. 400 BC)","Zhuangzi (c. 300 BC)"],"f":"F2"},{"t":"Ma’at","s":"Truth, order, and justice as a single cosmic quality that kings and gods serve.","who":["Egyptian wisdom texts (c. 2000 BC)","Instruction of Ptahhotep"],"f":"F2"}]}]},{"t":"Natural facts","s":"Welfare, flourishing, cooperation. Survives every origin.","who":["Cornell realism (Boyd, Sturgeon)","Railton","Foot","Aristotle","Harris"],"addr":"M1b","kids":[{"t":"Non-reductive naturalism","s":"Moral properties are natural properties, found the way science finds any kind.","who":["Richard Boyd (1988)","Nicholas Sturgeon (1985)","David Brink (1989)","Peter Railton"],"f":"F2","q":"How do moral terms refer?","kids":[{"t":"Cornell realism","s":"Good refers to a homeostatic cluster of properties, as water refers to H2O.","who":["Boyd (1988)","Sturgeon (1985)","Brink (1989)"],"f":"F2"},{"t":"Moral explanation argument","s":"Moral facts explain events, so they earn their place like other facts.","who":["Sturgeon (1985)","Brink (1989)"],"f":"F2"},{"t":"Synthetic naturalism against the open question","s":"Moore’s test fails because identities can be true yet not analytic.","who":["Boyd (1988)","Brink (1989)"],"f":"F2"}]},{"t":"Reductive naturalism","s":"Moral terms can be defined in non-moral terms once idealized.","who":["Peter Railton (1986)","Richard Brandt (1979)","Frank Jackson (1998)","Michael Smith (1994)"],"f":"F2","q":"Defined by what?","kids":[{"t":"Railton’s reforming naturalism","s":"A person’s good is what their fully informed self would want for them; morality is what is rational from a social point of view.","who":["Peter Railton (1986)"],"f":"F2"},{"t":"Moral functionalism","s":"Moral terms are defined by their place in the network of mature folk morality.","who":["Frank Jackson (1998)","Philip Pettit (1995)"],"f":"F2"},{"t":"Brandt’s rational desire theory","s":"Right is what an agent would choose after cognitive psychotherapy of desires.","who":["Richard Brandt (1979)"],"f":"F2"},{"t":"Smith’s rationalist naturalism","s":"Right is what we would desire if fully rational, and full rationality converges.","who":["Michael Smith (1994)"],"f":"F2"},{"t":"End-relational theory","s":"Good means good for some end; the end is fixed by context.","who":["Stephen Finlay (2014)"],"f":"F2"},{"t":"Humean reasons realism","s":"Reasons are facts that explain why acting would promote a desire.","who":["Mark Schroeder (2007)"],"f":"F2"},{"t":"Society-centered theory","s":"Moral codes are justified when a society would rationally choose them.","who":["David Copp (1995)"],"f":"F2"}]},{"t":"Neo-Aristotelian naturalism","s":"Good and bad for humans are facts about the human life form, like good sight for a hawk.","who":["Philippa Foot (2001)","Michael Thompson (1995)","Rosalind Hursthouse (1999)","Alasdair MacIntyre (1999)"],"f":"F2","q":"What fixes the life form’s good?","kids":[{"t":"Foot’s natural goodness","s":"Moral evaluation is a species of natural evaluation of living things.","who":["Philippa Foot (2001)"],"f":"F2"},{"t":"Thompson’s life-form logic","s":"Judgments about a kind of living thing have their own logic; vice is defect.","who":["Michael Thompson (1995, 2008)"],"f":"F2"},{"t":"Hursthouse’s four ends","s":"Virtue serves survival, reproduction, freedom from pain, and group function, plus rationality.","who":["Rosalind Hursthouse (1999)"],"f":"F2"},{"t":"MacIntyre’s dependent rational animals","s":"Human good includes acknowledged dependence and the virtues it needs.","who":["Alasdair MacIntyre (1999)"],"f":"F2"},{"t":"Kraut’s developmentalism","s":"Good is the development of a being’s natural powers.","who":["Richard Kraut (2007)"],"f":"F2"},{"t":"Darwinian natural right","s":"Evolved human desires ground a natural standard of right.","who":["Larry Arnhart (1998)","James Q. Wilson (1993)"],"f":"F2"},{"t":"Bloomfield’s health analogy","s":"Moral goodness is real the way health is real.","who":["Paul Bloomfield (2001)"],"f":"F2"},{"t":"Nussbaum’s capabilities","s":"A good life needs a list of central human capabilities; justice secures them.","who":["Martha Nussbaum (2000, 2011)","Amartya Sen (1985)"],"f":"F2"}]},{"t":"Scientific naturalism","s":"Moral facts are facts about wellbeing that science can in principle measure.","who":["Sam Harris (2010)","Owen Flanagan (1991)","William Casebeer (2003)","Patricia Churchland (2011)"],"f":"F1","q":"Which science?","kids":[{"t":"Harris’s moral landscape","s":"Good is what raises the wellbeing of conscious creatures; neuroscience will map it.","who":["Sam Harris (2010)"],"f":"F1"},{"t":"Neurobiological naturalism","s":"Morality grows from attachment and care circuitry; norms are what such brains settle on.","who":["Patricia Churchland (2011)","Antonio Damasio (1994)"],"f":"F1"},{"t":"Pragmatic naturalism","s":"Ethics is a human project that improves by solving problems of altruism failure.","who":["Philip Kitcher (2011)","John Dewey (1922)","Owen Flanagan (2017)"],"f":"F2"},{"t":"Fact-value entanglement","s":"Facts and values cannot be pulled apart, so ethics is as objective as science.","who":["Hilary Putnam (2002)","John Dewey (1939)"],"f":"F2"}]},{"t":"Theories of the welfare fact","s":"What natural fact wellbeing is.","who":["Bentham","Parfit (1984)","Griffin (1986)","Heathwood"],"f":"F2","q":"What is good for a person?","kids":[{"t":"Hedonism about welfare","s":"Wellbeing is pleasant experience minus painful.","who":["Jeremy Bentham (1789)","Roger Crisp (2006)","Fred Feldman (2004)","Torbjörn Tännsjö"],"f":"F2","q":"What is pleasure?","kids":[{"t":"Sensory hedonism","s":"Pleasure is a felt quality of experience.","who":["Bentham (1789)","Roger Crisp (2006)"],"f":"F2"},{"t":"Attitudinal hedonism","s":"Pleasure is taking a favorable attitude toward a state of affairs.","who":["Fred Feldman (2004)"],"f":"F2"},{"t":"Qualitative hedonism","s":"Pleasures differ in kind as well as amount.","who":["John Stuart Mill (1861)"],"f":"F2"},{"t":"Heterogeneity problem","s":"Pleasures share no felt quality, so hedonism needs an attitude account or fails.","who":["Henry Sidgwick (1874)","Roger Crisp (2006)","Ben Bramble (2013)"],"f":"gate"}]},{"t":"Desire satisfaction","s":"Wellbeing is getting what you want.","who":["Chris Heathwood (2006)","Railton (1986)","Brandt (1979)"],"f":"F2","q":"Which desires?","kids":[{"t":"Actual desire","s":"Any actual desire counts.","who":["early preference utilitarians"],"f":"F2"},{"t":"Informed desire","s":"Only desires that survive full information count.","who":["James Griffin (1986)","Railton (1986)"],"f":"F2","q":"Does full information settle it?","kids":[{"t":"Idealized advisor model","s":"Your good is what a fully informed version of you would want for you as you actually are.","who":["Peter Railton (1986)","Michael Smith (1994)"],"f":"F2","q":"Can the ideal self advise the actual one?","kids":[{"t":"Conditional fallacy","s":"Idealizing changes the desires, so the counterfactual picks out the wrong thing.","who":["Robert Shope (1978)","Robert Johnson (1999)","David Sobel (1994)"],"f":"gate"}]},{"t":"Full-information objection","s":"No one could hold every experience at once, and trying would change what they want.","who":["Connie Rosati (1995)","David Sobel (1994)","Don Loeb (1995)"],"f":"gate"}]},{"t":"Global desire","s":"Only desires about one’s life as a whole count.","who":["Derek Parfit (1984)"],"f":"F2"}]},{"t":"Objective list","s":"Some things are good for you whether you want them or not.","who":["John Finnis (1980)","Guy Fletcher (2013)","Parfit (1984)"],"f":"F2"},{"t":"Perfectionism about welfare","s":"Wellbeing is developing distinctively human capacities.","who":["Thomas Hurka (1993)","Richard Kraut (2007)"],"f":"F2"},{"t":"Hybrid welfare theories","s":"Wellbeing is enjoying what is objectively worthwhile.","who":["Susan Wolf (1997)","Shelly Kagan (2009)","Robert Adams (1999)"],"f":"F2"},{"t":"Life satisfaction theory","s":"Wellbeing is judging your life to be going well.","who":["Wayne Sumner (1996)","Valerie Tiberius (2008)"],"f":"F2"},{"t":"Eudaimonist psychology","s":"Wellbeing is autonomy, competence, and relatedness.","who":["Carol Ryff (1989)","Deci and Ryan (2000)"],"f":"F1"}]}],"q":"Which natural facts, and how do moral terms pick them out?"},{"t":"Facts known by reason, not nature","s":"Real, mind-independent, not physical.","who":["Moore","Parfit","Enoch","Huemer","Sidgwick"],"addr":"M1c","d":"Under pressure from evolutionary debunking: if selection explains why we believe it, the belief needs no truth to explain it (Street, Joyce).","kids":[{"t":"Classical intuitionism","s":"Some moral truths are self-evident to a reflective mind.","who":["G.E. Moore (1903)","H.A. Prichard (1912)","W.D. Ross (1930)","Henry Sidgwick (1874)"],"f":"F2","q":"What is grasped?","kids":[{"t":"Moore’s non-natural good","s":"Good is a simple, indefinable, non-natural property; the open question shows it.","who":["G.E. Moore (1903)"],"f":"F2"},{"t":"Prichard’s rejection of proof","s":"Asking why we ought to do our duty rests on a mistake; obligations are seen directly.","who":["H.A. Prichard (1912)"],"f":"F2"},{"t":"Ross’s prima facie duties","s":"Several irreducible duties are self-evident and weigh against each other.","who":["W.D. Ross (1930)","Robert Audi (2004)"],"f":"F2"},{"t":"Sidgwick’s axioms","s":"Rational benevolence and prudence are self-evident, and they conflict.","who":["Henry Sidgwick (1874)"],"f":"F2"},{"t":"Rashdall and Ewing","s":"Ideal utilitarianism and fittingness known by intuition.","who":["Hastings Rashdall (1907)","A.C. Ewing (1947)","C.D. Broad (1930)"],"f":"F2"}]},{"t":"Contemporary intuitionism","s":"Moral seemings give default justification, as perception does.","who":["Michael Huemer (2005)","Robert Audi (2004)","Philip Stratton-Lake (2002)","John Bengson (2015)"],"f":"F2","q":"What kind of justification?","kids":[{"t":"Phenomenal conservatism","s":"If it seems to you that p, you are justified in believing p absent defeaters.","who":["Michael Huemer (2005)"],"f":"F2"},{"t":"Audi’s moderate intuitionism","s":"Ross’s duties are self-evident yet can be systematized by Kant’s humanity formula.","who":["Robert Audi (2004)"],"f":"F2"},{"t":"Reflective equilibrium","s":"Principles and judgments are adjusted to each other until stable.","who":["John Rawls (1971)","Norman Daniels (1979)"],"f":"F2"},{"t":"Perceptual intuitionism","s":"We literally perceive moral properties in situations.","who":["Robert Audi (2013)","Lawrence Blum (1994)","Iris Murdoch (1970)"],"f":"F2"}]},{"t":"Robust realism","s":"Irreducibly normative facts exist and are needed for deliberation.","who":["David Enoch (2011)","Russ Shafer-Landau (2003)","Terence Cuneo (2007)","William FitzPatrick (2008)"],"f":"F2","q":"What is the argument?","kids":[{"t":"Enoch’s deliberative indispensability","s":"Normative facts are indispensable to deliberation, so we may believe in them.","who":["David Enoch (2011)"],"f":"F2"},{"t":"Shafer-Landau’s non-natural realism","s":"Moral facts are constituted by natural ones without being natural.","who":["Russ Shafer-Landau (2003)"],"f":"F2"},{"t":"Cuneo’s normative web","s":"Denying moral facts would deny epistemic facts too, which is self-defeating.","who":["Terence Cuneo (2007)","Richard Rowland (2013)"],"f":"F2"},{"t":"Godless robust realism","s":"Necessary moral truths hold without God and without nature.","who":["Erik Wielenberg (2014)"],"f":"F2"},{"t":"Value realism about desire","s":"Values are real and desire is a perception of them.","who":["Graham Oddie (2005)"],"f":"F2"},{"t":"Moral fixed points","s":"Some moral propositions are conceptual truths no coherent moral system can deny.","who":["Terence Cuneo and Russ Shafer-Landau (2014)"],"f":"F2"}]},{"t":"Relaxed or quietist realism","s":"Normative truths are real but need no metaphysical backing; ask no further.","who":["Derek Parfit (2011)","T.M. Scanlon (2014)","Ronald Dworkin (2011)","Thomas Nagel (1986)","Matthew Kramer (2009)"],"f":"F2","q":"What kind of truth?","kids":[{"t":"Parfit’s non-metaphysical cognitivism","s":"Normative truths are true in the way mathematical truths are, with no ontological weight.","who":["Derek Parfit (2011)"],"f":"F2"},{"t":"Scanlon’s reasons fundamentalism","s":"Reasons are the basic normative notion; truths about them belong to their own domain.","who":["T.M. Scanlon (2014)"],"f":"F2"},{"t":"Dworkin’s independence of value","s":"Value is a separate domain; skepticism about it must itself be a moral claim.","who":["Ronald Dworkin (1996, 2011)"],"f":"F2"},{"t":"Nagel’s view from nowhere","s":"Objective reasons exist because we can step back from our own standpoint.","who":["Thomas Nagel (1970, 1986)"],"f":"F2"},{"t":"Parfit’s triple theory","s":"Kantian, contractualist, and rule-consequentialist views converge on one set of principles.","who":["Derek Parfit (2011)"],"f":"F2"}]},{"t":"Fitting-attitude theories of value","s":"Good means what it is fitting to favor.","who":["Franz Brentano (1889)","A.C. Ewing (1947)","T.M. Scanlon (1998)","Rabinowicz and Rønnow-Rasmussen (2004)"],"f":"F2","q":"What is the relation?","kids":[{"t":"Buck-passing account","s":"To be good is to have properties that give reasons to favor it.","who":["T.M. Scanlon (1998)","Jonas Olson"],"f":"F2"},{"t":"Brentano’s correct love","s":"Good is what it is correct to love.","who":["Franz Brentano (1889)","Max Scheler (1913)"],"f":"F2"},{"t":"Wrong kind of reasons problem","s":"Reasons to favor that do not track value show the account needs a filter.","who":["Rabinowicz and Rønnow-Rasmussen (2004)","Justin D’Arms and Daniel Jacobson (2000)"],"f":"gate"}]},{"t":"Early modern rationalism","s":"Moral truth is grasped by the understanding like geometry.","who":["Samuel Clarke (1706)","Ralph Cudworth (1731)","Richard Price (1758)","Richard Cumberland (1672)","Kant, on a realist reading"],"f":"F2"},{"t":"Phenomenological value realism","s":"Values are given in feeling and ordered in a hierarchy.","who":["Max Scheler (1913)","Nicolai Hartmann (1926)","Dietrich von Hildebrand (1953)"],"f":"F2"},{"t":"Replies to evolutionary debunking","s":"Selection and moral truth can line up, so evolution does not undercut belief.","who":["Enoch (2010)","Wielenberg (2010)","Knut Skarsaune (2011)","Parfit (2011)"],"f":"F2","q":"How do they line up?","kids":[{"t":"Third-factor accounts","s":"Some natural fact both shaped our beliefs and makes them true.","who":["David Enoch (2010)","Erik Wielenberg (2010)","Knut Skarsaune (2011)"],"f":"F2"},{"t":"Pre-established harmony","s":"Survival is good, so selection for survival tracks good.","who":["Enoch (2010)"],"f":"F2"},{"t":"Rational reflection escape","s":"Some moral beliefs, like impartial benevolence, are not what selection would give.","who":["Parfit (2011)","de Lazari-Radek and Singer (2012)"],"f":"F2"},{"t":"Clarke-Doane’s parity","s":"Debunking would sink mathematics too, so it proves too much.","who":["Justin Clarke-Doane (2012, 2020)"],"f":"F2"},{"t":"Vavova’s no-good-reason","s":"You cannot judge your beliefs off-track without moral premises.","who":["Katia Vavova (2014)"],"f":"F2"}]}],"q":"How does reason reach them?"},{"t":"Facts about how we would respond","s":"Moral properties are like colors: real, but defined by fitting responses of suitable subjects.","who":["John McDowell (1985)","David Wiggins (1987)","Mark Johnston (1989)","David Lewis (1989)"],"f":"F2","q":"Whose responses?","kids":[{"t":"Sensibility theory","s":"Values are what merit a response from someone with the right sensibility; no circle-free definition.","who":["John McDowell (1985)","David Wiggins (1987)"],"f":"F2"},{"t":"Dispositional theory of value","s":"Value is what we would desire to desire under ideal conditions.","who":["David Lewis (1989)","Mark Johnston (1989)"],"f":"F2"},{"t":"Rational sentimentalism","s":"Values are what sentiments fittingly respond to, with fittingness assessed by reasons.","who":["Justin D’Arms and Daniel Jacobson (2000, 2023)"],"f":"F2"},{"t":"Secondary-quality analogy","s":"Moral properties are anthropocentric but real, like redness.","who":["McDowell (1985)","Wiggins (1987)"],"f":"F2"},{"t":"Rigidified response theory","s":"Good is what we, as we actually are, would approve in ideal conditions.","who":["Michael Smith (1994)","Crispin Wright (1992)"],"f":"F2"},{"t":"Ideal observer theory","s":"Right is whatever an omniscient, impartial, dispassionate spectator would approve.","who":["Roderick Firth (1952)","Adam Smith (1759)"],"f":"F2"}]}]},{"t":"No","s":"Nothing is wrong independent of attitudes.","q":"Then what is moral talk doing?","kids":[{"t":"Failing","s":"It aims at facts and there are none.","who":["Mackie","Joyce, fictionalism","Nietzsche, on one reading"],"addr":"M2a","kids":[{"t":"Error theory","s":"Moral judgments assert facts, and all such assertions are false.","who":["J.L. Mackie (1977)","Richard Joyce (2001)","Jonas Olson (2014)","Bart Streumer (2017)"],"f":"F2","q":"Why are they all false?","kids":[{"t":"Mackie’s argument from queerness","s":"Objective values would be strange entities with built-in to-be-pursuedness, and we have no faculty for them.","who":["J.L. Mackie (1977)"],"f":"F2"},{"t":"Mackie’s argument from relativity","s":"Moral disagreement tracks ways of life, not perception of facts.","who":["J.L. Mackie (1977)"],"f":"F2"},{"t":"Evolutionary error theory","s":"Selection explains moral belief fully, so its truth is an idle extra.","who":["Richard Joyce (2001, 2006)","Michael Ruse (1986)"],"f":"F2"},{"t":"Irreducible normativity error theory","s":"Moral facts would have to be irreducibly normative, and nothing is.","who":["Jonas Olson (2014)"],"f":"F2"},{"t":"Global normative error theory","s":"No normative judgment is true, and we cannot believe this, which explains why it seems false.","who":["Bart Streumer (2017)"],"f":"F2"},{"t":"Argument from moral disagreement","s":"Persistent expert disagreement is best explained by there being nothing to agree on.","who":["Mackie (1977)","John Doris and Alexandra Plakias (2008)"],"f":"F2"},{"t":"Presupposition error theory","s":"Moral talk presupposes categorical reasons, and there are none.","who":["Richard Garner (1990)","Ian Hinckfuss (1987)"],"f":"F2"},{"t":"Anscombe’s diagnosis","s":"The moral ought is a leftover from divine law that no longer has a lawgiver.","who":["G.E.M. Anscombe (1958)"],"f":"F2"},{"t":"Nietzsche as error theorist","s":"Moral values are a mistaken projection serving slave psychology.","who":["Nietzsche (1887)","Brian Leiter (2002), reading"],"f":"F2"},{"t":"Marxist ideology critique","s":"Moral talk expresses class interest dressed as universal truth.","who":["Karl Marx (1846)","Allen Wood (1972), reading","Friedrich Engels (1878)"],"f":"F2"}]},{"t":"What to do after the error","s":"Once moral talk is known to be false, what should be done with it.","who":["Joyce","Kalderon","Garner","Olson"],"f":"gate","q":"Keep it, change it, or drop it?","kids":[{"t":"Revolutionary fictionalism","s":"Keep using moral talk as a useful fiction, knowing it is false.","who":["Richard Joyce (2001)","Daniel Nolan, Greg Restall, Caroline West (2005)"],"f":"gate"},{"t":"Hermeneutic fictionalism","s":"We already use moral talk as make-believe, so nothing needs to change.","who":["Mark Kalderon (2005)"],"f":"gate"},{"t":"Conservationism","s":"Keep believing in morality in ordinary life while denying it in the study.","who":["Jonas Olson (2014)"],"f":"gate"},{"t":"Abolitionism","s":"Drop moral talk; it does more harm than good.","who":["Richard Garner (2007)","Ian Hinckfuss (1987)","Joel Marks (2013)"],"f":"gate"},{"t":"Substitutionism","s":"Replace moral talk with talk of what we want and what works.","who":["Matt Lutz (2014)","Joel Marks (2013)"],"f":"gate"},{"t":"Propagandism","s":"Use moral talk to steer others, without belief.","who":["Stephen Ingram (2015)"],"f":"gate"},{"t":"Companions in guilt reply","s":"Error theory sinks epistemic norms too, so it should be rejected.","who":["Terence Cuneo (2007)","Richard Rowland (2013)","Christopher Cowie (2019), against"],"f":"gate"}]},{"t":"Genealogical debunking","s":"Tracing where morality came from shows it deserves no authority.","who":["Nietzsche (1887)","Michel Foucault (1975)","Bernard Williams (2002), partly","Matthieu Queloz (2021)"],"f":"F2","q":"Does the genealogy vindicate or debunk?","kids":[{"t":"Nietzsche’s slave revolt","s":"Christian and Kantian morality grew from resentment and inverts noble values.","who":["Nietzsche (1887)"],"f":"F2"},{"t":"Foucault’s disciplinary genealogy","s":"Moral subjects are produced by power; there is no prior moral truth.","who":["Michel Foucault (1975, 1984)"],"f":"F2"},{"t":"Williams’s vindicatory genealogy","s":"A fictional origin story can show a value earns its keep even if it debunks others.","who":["Bernard Williams (2002)","Edward Craig (1990)","Matthieu Queloz (2021)"],"f":"F2"},{"t":"Genealogy of morals as sociology","s":"Moral codes are the sacred face of social solidarity.","who":["Émile Durkheim (1912)","Max Weber (1905)"],"f":"F2"},{"t":"Freudian genealogy","s":"Conscience is the superego, internalized parental threat.","who":["Sigmund Freud (1930)"],"f":"F2"}]},{"t":"Williams’s critique of the morality system","s":"The special notion of moral obligation is a peculiar institution best left behind, though ethics remains.","who":["Bernard Williams (1985)","Elizabeth Anscombe (1958)"],"f":"F2"}],"q":"Why does it fail, and what then?"},{"t":"Expressing","s":"It voices attitudes, not facts.","who":["Ayer","Blackburn","Gibbard"],"addr":"M2b","kids":[{"t":"Emotivism","s":"Moral sentences express feelings and try to arouse them; they state nothing.","who":["A.J. Ayer (1936)","C.L. Stevenson (1944)","Rudolf Carnap (1935)","Ogden and Richards (1923)"],"f":"F2","q":"What is expressed?","kids":[{"t":"Ayer’s boo-hurrah","s":"Moral words add nothing to the description, only a tone of feeling.","who":["A.J. Ayer (1936)"],"f":"F2"},{"t":"Stevenson’s emotive meaning","s":"Moral terms have descriptive and emotive meaning; disagreements are disagreements in attitude.","who":["C.L. Stevenson (1937, 1944)"],"f":"F2"},{"t":"Hume as proto-expressivist","s":"Vice is a sentiment of disapproval in the breast, not a fact in the object.","who":["David Hume (1739)","Simon Blackburn (1998), reading"],"f":"F2"},{"t":"Wittgenstein’s Lecture on Ethics","s":"Ethical talk runs against the limits of language; it can only be shown.","who":["Ludwig Wittgenstein (1929)"],"f":"F2"}]},{"t":"Prescriptivism","s":"Moral judgments are universalizable prescriptions, like commands that bind their speaker too.","who":["R.M. Hare (1952, 1963)"],"f":"F2","q":"What follows from universalizability?","kids":[{"t":"Hare’s universal prescriptivism","s":"Ought-judgments are prescriptions the speaker must accept for anyone in the same position.","who":["R.M. Hare (1952, 1963)"],"f":"F2"},{"t":"Hare’s two-level utilitarianism","s":"Full universalization yields preference utilitarianism at the critical level and rules at the intuitive level.","who":["R.M. Hare (1981)"],"f":"F2"},{"t":"Carnap’s optative logic","s":"Value statements are disguised imperatives.","who":["Rudolf Carnap (1935)","Hans Reichenbach (1951)"],"f":"F2"}]},{"t":"Quasi-realism","s":"Attitudes are projected, then earn the right to talk of truth and mind-independence.","who":["Simon Blackburn (1984, 1998)"],"f":"F2","q":"How does it earn realist talk?","kids":[{"t":"Projectivism","s":"We spread our sentiments onto the world and then read them back as properties.","who":["Simon Blackburn (1984)","Hume (1739)"],"f":"F2"},{"t":"Blackburn’s earned truth","s":"Once attitudes are disciplined by higher-order attitudes, calling them true is legitimate.","who":["Simon Blackburn (1993, 1998)"],"f":"F2"},{"t":"Creeping minimalism problem","s":"If minimalism about truth is granted, nothing separates quasi-realism from realism.","who":["James Dreier (2004)"],"f":"gate"},{"t":"Frege–Geach problem","s":"Expressivism must explain how moral sentences embed in conditionals without asserting.","who":["Peter Geach (1965)","John Searle (1962)"],"f":"gate","q":"Which solution?","kids":[{"t":"Higher-order attitudes","s":"Logical consistency among attitudes is disapproval of certain combinations of attitudes.","who":["Simon Blackburn (1984, 1988)"],"f":"gate"},{"t":"Fact-prac worlds semantics","s":"Content is a set of combined factual and normative possibilities; logic falls out.","who":["Allan Gibbard (2003)"],"f":"gate"},{"t":"Being-for semantics","s":"All contents are states of being for; negation and embedding compose.","who":["Mark Schroeder (2008)"],"f":"gate"},{"t":"Wishful thinking objection","s":"If moral premises are attitudes, inferring factual conclusions from them is wishful thinking.","who":["Cian Dorr (2002)","David Enoch (2003), reply"],"f":"gate"}]}]},{"t":"Norm-expressivism","s":"To call an act rational or wrong is to express acceptance of norms permitting or forbidding it.","who":["Allan Gibbard (1990)"],"f":"F2","q":"What state is expressed?","kids":[{"t":"Gibbard’s norm acceptance","s":"Moral judgment expresses acceptance of a system of norms.","who":["Allan Gibbard (1990)"],"f":"F2"},{"t":"Plan-expressivism","s":"Moral judgments express plans; fact-plan worlds give them logic.","who":["Allan Gibbard (2003)"],"f":"F2"},{"t":"Gibbard’s normative concepts as natural","s":"Normative concepts are indispensable planning concepts that pick out natural properties.","who":["Allan Gibbard (2012)"],"f":"F2"}]},{"t":"Schroeder’s being for","s":"All moral states are states of being for something; this
