cking (1965)","Edwards (1972)","Royall (1997)","Sober (2008)"],"f":"F2"},{"t":"Bayesian confirmation measures","s":"Confirmation is a change in probability, but many measures of the change disagree; the choice matters.","who":["Fitelson (1999)","Crupi, Tentori and Gonzalez (2007)","Good (1950)"],"f":"F2"}]},{"t":"Falsificationism","s":"Theories are never confirmed, only refuted; science advances by bold conjectures and severe attempts to refute them.","who":["Popper (1934, 1959, 1963)","Miller (1994)","Musgrave (1993)"],"f":"F2","q":"What survives the objections?","kids":[{"t":"Demarcation by falsifiability","s":"A claim is scientific only if some observation could contradict it.","who":["Popper (1934)","Popper (1963)","Laudan (1983), demise of demarcation","Pigliucci and Boudry (2013)"],"f":"F2"},{"t":"Corroboration without induction","s":"A theory that survives tests is corroborated, but corroboration is not evidence it will keep working.","who":["Popper (1959)","Salmon (1981), critique","Watkins (1984)"],"f":"F2"},{"t":"Duhem problem for falsification","s":"A failed test refutes only the conjunction of theory and auxiliaries; logic does not say which to blame.","who":["Duhem (1906)","Quine (1951)","Lakatos (1970)","Grünbaum (1960)"],"f":"F2"},{"t":"Verisimilitude","s":"Theories can approach truth by degrees; the first formal definition failed and later ones repaired it.","who":["Popper (1963)","Tichý (1974) and Miller (1974), refutation","Oddie (1986)","Niiniluoto (1987)"],"f":"F2"}]},{"t":"Hypothetico-deductivism","s":"A hypothesis is confirmed by the truth of what it entails and refuted by the falsity of it.","who":["Hempel (1945)","Whewell (1840), consilience","Gemes (1998), repair"],"f":"F2","q":"What are the paradoxes?","kids":[{"t":"Raven paradox","s":"A white shoe confirms that all ravens are black, since it confirms the equivalent all non-black things are non-ravens.","who":["Hempel (1945)","Good (1967)","Fitelson and Hawthorne (2010), Bayesian resolution"],"f":"F2"},{"t":"Grue and the new riddle of induction","s":"Every observed emerald confirms that emeralds are green and that they are grue; only entrenchment separates them.","who":["Goodman (1955)","Quine (1969), natural kinds","Jackson (1975)"],"f":"F2"},{"t":"Tacking paradox","s":"If evidence confirms a theory it confirms the theory conjoined with anything; deductivism needs a relevance repair.","who":["Glymour (1980)","Gemes (1993)","Schurz (1991)"],"f":"F2"}]},{"t":"Inductivism","s":"Laws are generalised from repeated observation; the more instances, the stronger the support.","who":["Bacon (1620)","Mill (1843)","Reichenbach (1938)","Carnap (1950)"],"f":"F2","q":"Can induction be justified?","kids":[{"t":"Hume's problem","s":"No argument, deductive or inductive, can justify expecting the future to resemble the past.","who":["Hume (1748)","Hume (1739)"],"f":"F2"},{"t":"Pragmatic vindication","s":"If any method will predict the future, induction will; so use it even without a guarantee.","who":["Reichenbach (1938, 1949)","Salmon (1967)","Schurz (2008), meta-induction"],"f":"F2"},{"t":"Dissolution","s":"To be rational just is to proportion belief to evidence, so asking whether induction is rational is confused.","who":["Strawson (1952)","Edwards (1949)","Ayer (1956)"],"f":"F2"},{"t":"Material theory of induction","s":"There are no universal rules of induction; each inference is licensed by local facts about the domain.","who":["Norton (2003, 2021)","Norton (2010)"],"f":"F2"},{"t":"Combinatorial justification","s":"Most large samples match the population in composition, so sampling is justified by arithmetic.","who":["Williams (1947)","Stove (1986)","Campbell and Franklin (2004)"],"f":"F2"},{"t":"Inductive logic","s":"Degrees of confirmation can be fixed by the logical structure of language, as a generalisation of deduction.","who":["Carnap (1950, 1952)","Hintikka (1966)","Maher (2010)"],"f":"F2"}]},{"t":"Inference to the best explanation","s":"We should believe the hypothesis that best explains the evidence; explanatory virtues are guides to truth.","who":["Peirce (1903), abduction","Harman (1965)","Lipton (1991, 2004)","Thagard (1978)"],"f":"F2","q":"Is the best explanation likely true?","kids":[{"t":"Bad lot objection","s":"The best of the hypotheses we happened to think of may be the best of a bad lot.","who":["van Fraassen (1989)","Lipton (1993), reply","Schupbach (2014)"],"f":"F2"},{"t":"Explanationism versus Bayes","s":"Explanatory loveliness is either a heuristic for probability, a component of the prior, or an illegitimate extra.","who":["van Fraassen (1989)","Lipton (2004)","Okasha (2000)","Henderson (2014)"],"f":"F2"}]},{"t":"Error statistics","s":"A hypothesis passes a severe test when the test would probably have detected its falsity; probability attaches to methods, not beliefs.","who":["Neyman and Pearson (1933)","Fisher (1925, 1935)","Mayo (1996, 2018)","Mayo and Spanos (2006)"],"f":"F2","q":"Fisher or Neyman-Pearson?","kids":[{"t":"Significance testing","s":"Reject the null when the data would be improbable under it; the p-value measures the improbability.","who":["Fisher (1925, 1935)","Fisher (1955)","Wasserstein and Lazar (2016), on misuse"],"f":"F0"},{"t":"Hypothesis testing with error rates","s":"Choose a rule that controls the long-run rates of false rejection and false acceptance.","who":["Neyman and Pearson (1933)","Neyman (1957)","Lehmann (1993)"],"f":"F0"},{"t":"Severe testing","s":"A claim is warranted only to the extent it has passed a test that would have found it wrong.","who":["Mayo (1996, 2018)","Mayo and Spanos (2011)","Popper (1959), forerunner"],"f":"F2"},{"t":"Likelihood principle dispute","s":"All evidential import is in the likelihood function, which frequentists deny because stopping rules then do not matter.","who":["Birnbaum (1962)","Berger and Wolpert (1988)","Mayo (2014), critique"],"f":"F2"}]}]},{"t":"Underdetermination and theory-ladenness","s":"Positions on whether evidence can ever pick out one theory, and whether observation is neutral.","who":["Duhem (1906)","Quine (1951, 1975)","Hanson (1958)","Kuhn (1962)"],"f":"F2","q":"How much does evidence leave open?","kids":[{"t":"Duhem-Quine thesis","s":"Any theory can be kept in the face of any evidence by adjusting auxiliaries; evidence never forces a choice.","who":["Duhem (1906)","Quine (1951, 1975)","Laudan (1990), critique","Stanford (2006)"],"f":"F2"},{"t":"Empirical equivalence","s":"Rival theories with identical observable consequences exist, at least in physics.","who":["Quine (1975)","Earman (1993)","Laudan and Leplin (1991), contra","Norton (2008)"],"f":"F2"},{"t":"Theory-laden observation","s":"What one sees depends on what one knows; Tycho and Kepler see different things at dawn.","who":["Hanson (1958)","Kuhn (1962)","Feyerabend (1962)","Fodor (1984), contra"],"f":"F2"},{"t":"Experimenter's regress","s":"Whether an experiment worked can only be judged by whether it got the right result, which is what is in dispute.","who":["Collins (1985)","Collins and Pinch (1993)","Franklin (1994), reply"],"f":"F2"}]},{"t":"Philosophy of experiment","s":"How experiments and instruments produce knowledge independently of high theory.","who":["Hacking (1983)","Franklin (1986)","Galison (1987)","Mayo (1996)"],"f":"F2","q":"What makes an experiment count?","kids":[{"t":"Experimentation has a life of its own","s":"Experimenters manipulate entities before theory explains them; if you can spray electrons they are real.","who":["Hacking (1983)","Hacking (1982)"],"f":"F2"},{"t":"Epistemology of experiment","s":"Strategies like calibration, intervention and independent confirmation give rational grounds for trusting results.","who":["Franklin (1986, 2002)","Franklin and Perovic (2019)"],"f":"F2"},{"t":"How experiments end","s":"Experiments stop when a community judges background and systematic error under control; the judgement is partly social.","who":["Galison (1987)","Galison (1997), trading zones"],"f":"F2"},{"t":"Robustness","s":"A result found by many independent methods is trustworthy even if each method is suspect.","who":["Wimsatt (1981)","Levins (1966)","Woodward (2006)","Stegenga (2009), critique"],"f":"F2"},{"t":"Observability as a continuum","s":"Observing a cell with a microscope and a quark with a detector differ in degree, not in kind.","who":["Maxwell (1962)","Shapere (1982)","Hacking (1981), microscopes","van Fraassen (1980), contra"],"f":"F2"}]},{"t":"Simulation and model epistemology","s":"Computer models and idealised models produce knowledge in ways that fit neither experiment nor theory.","who":["Humphreys (2004)","Winsberg (2010)","Weisberg (2013)","Cartwright (1983)"],"f":"F2","q":"What do models tell us?","kids":[{"t":"Simulations as experiments","s":"Simulation knowledge is sanctioned by the same strategies as experiment: calibration, robustness, validation.","who":["Winsberg (2003, 2010)","Parker (2009)","Morrison (2009)"],"f":"F2"},{"t":"Epistemic opacity","s":"No human can follow the steps of a large simulation, so its warrant differs in kind from proof.","who":["Humphreys (2004, 2009)","Lenhard (2019)","Durán and Formanek (2018)"],"f":"F2"},{"t":"Idealisation and how the laws lie","s":"Laws describe idealised models, not the world; models mediate between theory and phenomena.","who":["Cartwright (1983, 1999)","Morgan and Morrison (1999)","Weisberg (2007), three kinds"],"f":"F2"},{"t":"Robustness analysis of models","s":"Agreement across models with different idealisations is evidence the shared result is not an artefact.","who":["Levins (1966)","Weisberg (2006)","Odenbaugh and Alexandrova (2011), critique"],"f":"F2"}]},{"t":"Theories of explanation","s":"What it is for a test result to explain, and be explained.","who":["Hempel and Oppenheim (1948)","Salmon (1984)","Kitcher (1981)","Woodward (2003)"],"f":"F2","q":"What is an explanation?","kids":[{"t":"Deductive-nomological model","s":"To explain is to deduce the event from laws plus conditions.","who":["Hempel and Oppenheim (1948)","Hempel (1965)","Bromberger (1966), flagpole objection"],"f":"F2"},{"t":"Causal-mechanical explanation","s":"To explain is to trace the causal processes and interactions that produced the event.","who":["Salmon (1984)","Dowe (2000)","Railton (1978)"],"f":"F2"},{"t":"Unificationism","s":"To explain is to derive many phenomena from few argument patterns.","who":["Friedman (1974)","Kitcher (1981, 1989)"],"f":"F2"},{"t":"Mechanistic explanation","s":"To explain a phenomenon is to describe the entities and activities organised so as to produce it.","who":["Machamer, Darden and Craver (2000)","Bechtel and Richardson (1993)","Craver (2007)","Glennan (1996)"],"f":"F2"},{"t":"Interventionist explanation","s":"X explains Y when intervening on X would change Y; causation is difference-making under intervention.","who":["Woodward (2003)","Pearl (2000)","Spirtes, Glymour and Scheines (1993)"],"f":"F2"},{"t":"Pragmatic theory of explanation","s":"Explanation is an answer to a why-question relative to a contrast class and interests; not a relation in nature.","who":["van Fraassen (1980)","Achinstein (1983)","Garfinkel (1981)"],"f":"F2"},{"t":"Non-causal explanation","s":"Some explanations work by mathematical or structural necessity, not causes; the bridges of Königsberg.","who":["Lange (2016)","Pincock (2007)","Reutlinger (2016)","Baker (2005)"],"f":"F2"}]},{"t":"Values and the risk of error","s":"How much certainty a test must reach before accepting a result depends on what accepting it costs.","who":["Rudner (1953)","Jeffrey (1956)","Douglas (2000, 2009)","Longino (1990)"],"f":"F2","q":"Do scientists make value judgements?","kids":[{"t":"Inductive risk argument","s":"Since accepting a hypothesis risks error with consequences, the scientist must weigh values in setting the standard.","who":["Rudner (1953)","Churchman (1948)","Douglas (2000)"],"f":"F2"},{"t":"Value-free ideal","s":"Scientists report probabilities and leave acceptance to others; values enter only outside the inference.","who":["Jeffrey (1956)","Levi (1960)","Betz (2013)"],"f":"F2"},{"t":"Epistemic versus non-epistemic values","s":"Simplicity and scope are epistemic; social consequences are not; only the former should shape inference.","who":["McMullin (1983)","Kuhn (1977), theory choice","Steel (2010)"],"f":"F2"}]},{"t":"Replication and reform","s":"Positions on why many published findings fail to replicate and what would fix it.","who":["Meehl (1978, 1990)","Ioannidis (2005)","Open Science Collaboration (2015)","Gelman and Loken (2013)"],"f":"F0","q":"Why do results not replicate?","kids":[{"t":"Most published findings are false","s":"With low prior odds, small samples and flexible analysis, most positive results in a field are false positives.","who":["Ioannidis (2005)","Button et al. (2013), power failure","Simmons, Nelson and Simonsohn (2011)"],"f":"F0"},{"t":"Garden of forking paths","s":"Analysis choices made after seeing the data inflate false positives even without intent.","who":["Gelman and Loken (2013, 2014)","Simmons, Nelson and Simonsohn (2011)"],"f":"F0"},{"t":"Meehl's crud factor","s":"In psychology everything correlates with everything, so rejecting a null of zero tests almost nothing.","who":["Meehl (1967, 1990)","Lykken (1968)","Orben and Lakens (2020)"],"f":"F0"},{"t":"Preregistration and registered reports","s":"Fix hypotheses and analyses before data, and accept papers before results, to remove the incentive to find.","who":["Nosek et al. (2018)","Chambers (2013)","Munafò et al. (2017)"],"f":"F1"},{"t":"Theory crisis, not replication crisis","s":"Failures stem from weak theories that make no risky predictions; statistics reform will not fix that.","who":["Muthukrishna and Henrich (2019)","Oberauer and Lewandowsky (2019)","Eronen and Bringmann (2021)","Meehl (1978)"],"f":"F2"}]}],"q":"How does a test settle a claim?"},{"t":"Knowable, no test yet","s":"Inside our logic, no experiment designed.","f":"F2","d":"Whether spacetime is emergent in our universe. Whether there is a Layer 2 maker. Which substrate is fundamental.","kids":[{"t":"Scientific realism","s":"Mature theories are approximately true, their terms refer, and unobservables like electrons exist as described.","who":["Boyd (1983)","Putnam (1975)","Psillos (1999)","Chakravartty (2007)"],"f":"F2","q":"Why believe it?","kids":[{"t":"No-miracles argument","s":"Realism is the only philosophy that does not make the success of science a miracle.","who":["Putnam (1975)","Boyd (1983)","Smart (1963)","Howson (2000), base-rate objection"],"f":"F2"},{"t":"Selective realism","s":"Only the parts of a theory that did the work in its successes should be believed; those parts survive theory change.","who":["Kitcher (1993)","Psillos (1999), divide et impera","Vickers (2013)","Saatsi (2005)"],"f":"F2"},{"t":"Entity realism","s":"Believe in the entities we can manipulate, not in the theories about them.","who":["Hacking (1983)","Cartwright (1983)","Giere (1988)"],"f":"F2"},{"t":"Semirealism","s":"Believe in the detection properties we causally interact with; stay agnostic about the auxiliary ones.","who":["Chakravartty (1998, 2007)","Chakravartty (2017)","Psillos (2009), critique"],"f":"F2"},{"t":"Perspectival realism","s":"Knowledge claims are true from a perspective, but perspectives can be compared and real patterns cross them.","who":["Giere (2006)","Massimi (2018, 2022)","Teller (2011)"],"f":"F2"},{"t":"Convergent realism","s":"Successive theories approach truth and retain reference across change.","who":["Putnam (1978)","Boyd (1973)","Laudan (1981), critique"],"f":"F2"}]},{"t":"Structural realism","s":"What survives theory change is mathematical structure; we know the structure of the world, not its nature.","who":["Poincaré (1905)","Worrall (1989)","Ladyman (1998)","French (2014)"],"f":"F2","q":"Structure of what?","kids":[{"t":"Epistemic structural realism","s":"There are unobservable natures behind the structure, but only the structure can be known.","who":["Worrall (1989)","Russell (1927)","Maxwell (1970)"],"f":"F3","q":"Is a pure structure empty?","kids":[{"t":"Newman objection","s":"If all we know is structure, we know only that the world has some cardinality; structural knowledge is trivial.","who":["Newman (1928)","Demopoulos and Friedman (1985)","Melia and Saatsi (2006), reply"],"f":"F2"},{"t":"Ramsey-sentence realism","s":"Theoretical terms are existentially bound variables; the Ramsey sentence is all the theory claims.","who":["Ramsey (1929)","Lewis (1970)","Cruse (2005)"],"f":"F2"}]},{"t":"Ontic structural realism","s":"There are no natures behind structure; relations are all there is, and objects are nodes.","who":["Ladyman (1998)","Ladyman and Ross (2007)","French and Ladyman (2003)","Esfeld (2004), moderate"],"f":"F2"},{"t":"Real patterns","s":"What exists is what compresses data; patterns that carry information about the world are real whatever they are made of.","who":["Dennett (1991)","Ladyman and Ross (2007)","Wallace (2012)"],"f":"F2"}]},{"t":"Anti-realism about the unobservable","s":"Positions that stop belief at what could be observed.","who":["van Fraassen (1980)","Duhem (1906)","Mach (1883)","Laudan (1981)"],"f":"F2","q":"Why stop at the observable?","kids":[{"t":"Constructive empiricism","s":"Accept a theory as empirically adequate, believe only what it says about observables; belief in more is optional.","who":["van Fraassen (1980, 1989)","Monton and Mohler (2008)"],"f":"F2","q":"Where is the line?","kids":[{"t":"Observable by us","s":"Observable means detectable by unaided human senses; moons of Jupiter yes, electrons no.","who":["van Fraassen (1980)","Churchland (1985), contra","Alspector-Kelly (2004)"],"f":"F2"},{"t":"Voluntarist epistemology","s":"Rationality permits but does not compel belief; the realist takes a risk that reason does not require.","who":["van Fraassen (1989, 2002)","James (1896), forerunner"],"f":"F2"}]},{"t":"Instrumentalism","s":"Theories are tools for prediction and control; the question of their truth does not arise.","who":["Duhem (1906)","Mach (1883)","Dewey (1929)","Rowbottom (2019)"],"f":"F2"},{"t":"Verificationism","s":"A statement is meaningful only if verifiable in experience; metaphysics is not false but empty.","who":["Schlick (1936)","Ayer (1936)","Carnap (1932)","Hempel (1950), on its collapse"],"f":"F2"},{"t":"Natural ontological attitude","s":"Accept the results of science at face value and refuse to add a realist or anti-realist gloss.","who":["Fine (1984, 1986)","Musgrave (1989), critique"],"f":"F2"},{"t":"Social constructivism","s":"Facts about unobservables are made in the laboratory by negotiation and instruments, then projected onto nature.","who":["Latour and Woolgar (1979)","Knorr Cetina (1981)","Pickering (1984)","Hacking (1999), on the debate"],"f":"F2"}]},{"t":"Historical arguments against realism","s":"Theories that succeeded were later thrown out, so present success is weak evidence of truth.","who":["Poincaré (1905)","Laudan (1981)","Stanford (2006)","Wray (2018)"],"f":"F2","q":"Which lesson from history?","kids":[{"t":"Pessimistic meta-induction","s":"Most past successful theories are now judged false, so most present ones probably are too.","who":["Laudan (1981)","Poincaré (1905)","Lewis (2001), base-rate reply","Fahrbach (2011), exponential growth reply"],"f":"F2"},{"t":"Problem of unconceived alternatives","s":"At each stage scientists failed to conceive alternatives later accepted; we are probably in the same position now.","who":["Stanford (2006)","Stanford (2001)","Chakravartty (2008), reply","Ruhmkorff (2011)"],"f":"F3"},{"t":"Kuhn loss and incommensurability","s":"Successive paradigms lose as well as gain problems, and cannot be compared point by point.","who":["Kuhn (1962, 1970)","Feyerabend (1962)","Kitcher (1978), local reference","Sankey (1994)"],"f":"F2"}]},{"t":"Non-empirical theory assessment","s":"Theories can gain credibility without new data, from no alternatives being found, from unexpected explanatory links, and from a track record.","who":["Dawid (2013)","Dawid, Hartmann and Sprenger (2015)","Ellis and Silk (2014), contra","Smolin (2006), contra"],"f":"F2","q":"Is it science?","kids":[{"t":"No alternatives argument","s":"Long failure to find alternatives is Bayesian evidence for the one theory we have.","who":["Dawid, Hartmann and Sprenger (2015)","Dawid (2013)"],"f":"F2"},{"t":"Defend the integrity of physics","s":"Untestable theories should not be called science; falsifiability is the line.","who":["Ellis and Silk (2014)","Hossenfelder (2018)","Woit (2006)"],"f":"F2"}]},{"t":"Semantic realism and anti-realism","s":"Whether truth can outrun what could be known or verified.","who":["Dummett (1978)","Putnam (1980)","Wright (1992)","Tennant (1997)"],"f":"F2","q":"Can there be truths no one could know?","kids":[{"t":"Dummettian anti-realism","s":"Meaning is use, so a statement can be true only if it could in principle be verified; bivalence fails for the undecidable.","who":["Dummett (1978, 1991)","Tennant (1987, 1997)","Wright (1992)"],"f":"F2"},{"t":"Model-theoretic argument","s":"Any consistent theory has a model in the world, so realist truth as correspondence to a unique interpretation is empty.","who":["Putnam (1980)","Lewis (1984), reference magnetism reply","Hale and Wright (1997)"],"f":"F2"},{"t":"Fitch's knowability paradox","s":"If every truth is knowable, then every truth is known; so either some truths are unknowable or anti-realism is refuted.","who":["Fitch (1963)","Church (1945), anonymous referee","Williamson (2000)","Tennant (1997), restriction","Salerno (2009)"],"f":"FG"},{"t":"Metaphysical realism","s":"Truth is correspondence to a mind-independent world and can transcend all evidence.","who":["Devitt (1984)","Alston (1996)","Searle (1995)"],"f":"F2"}]},{"t":"Scrutability","s":"All truths are knowable a priori from a compact base of truths, so there are no truths hidden in principle from an ideal reasoner given the base.","who":["Chalmers (2012)","Jackson (1998)","Carnap (1928), forerunner","Block and Stalnaker (1999), contra"],"f":"F2","q":"What must be in the base?","kids":[{"t":"Physical-phenomenal-indexical base","s":"Physics, phenomenal truths, indexicals and a that's-all clause suffice to scrutinise everything.","who":["Chalmers (2012)","Chalmers and Jackson (2001)"],"f":"F2"},{"t":"A priori entailment denied","s":"Even given all micro-physical truths, macro truths like water is H2O are not derivable a priori; identities are found, not deduced.","who":["Block and Stalnaker (1999)","Byrne (1999)","Yablo (2002)"],"f":"F2"}]},{"t":"Cosmological underdetermination","s":"Facts beyond our light cone or before the Big Bang may be knowable in principle but not settled by any observation we can make.","who":["Ellis (2007)","Manchak (2009)","Butterfield (2014)","Smeenk (2013)"],"f":"F3","q":"What does the horizon hide?","kids":[{"t":"Global structure is unobservable","s":"Any spacetime is observationally indistinguishable from others with different global topology, by theorem.","who":["Manchak (2009)","Malament (1977)","Glymour (1977)"],"f":"FG"},{"t":"Multiverse as inference","s":"Other universes cannot be observed but can be inferred from inflation and fine-tuning, or so it is claimed.","who":["Carr (2007)","Tegmark (2014)","Ellis (2011), contra","Carroll (2019)"],"f":"F2"},{"t":"Cosmic variance","s":"With one universe to observe, the largest scales admit only one sample; statistical inference about them has an irreducible floor.","who":["Peebles (1993)","Ellis (2007)","Smeenk and Ellis (2017)"],"f":"F0"}]}],"q":"What can we say about what no test has reached?"},{"t":"Provably undecidable","s":"Fog inside our own logic, proven.","f":"FG","d":"Gödel: any consistent system rich enough for arithmetic has truths it cannot prove. Turing: no general test for whether a program halts. This cuts through every level, including below us. It is the part of your intuition that a system cannot fully read itself that is actually a theorem.","who":["Gödel (1931)","Turing (1936)","Chaitin"],"kids":[{"t":"Incompleteness","s":"Any consistent formal system rich enough for arithmetic has true sentences it cannot prove, and cannot prove its own consistency.","who":["Gödel (1931)","Rosser (1936)","Franzén (2005)","Smith (2007)"],"f":"FG","q":"Which theorem, and what does it not say?","kids":[{"t":"First incompleteness theorem","s":"A consistent, effectively axiomatised theory containing arithmetic is incomplete; the Gödel sentence is true but unprovable in it.","who":["Gödel (1931)","Rosser (1936), strengthening","Kleene (1952)"],"f":"FG"},{"t":"Second incompleteness theorem","s":"Such a theory cannot prove its own consistency; Hilbert's finitist consistency proofs are impossible.","who":["Gödel (1931)","Hilbert and Bernays (1939)","Löb (1955)"],"f":"FG","q":"How did Hilbert's programme respond?","kids":[{"t":"Gentzen's consistency proof","s":"Arithmetic is consistent by transfinite induction up to epsilon-zero, a method just beyond arithmetic itself.","who":["Gentzen (1936)","Takeuti (1987)","Rathjen (2006)"],"f":"FG"},{"t":"Relativised Hilbert programme","s":"Reduce strong theories to constructive ones where possible; most of ordinary mathematics needs very little.","who":["Feferman (1988, 1998)","Simpson (1999), reverse mathematics","Friedman (1975)"],"f":"F2"},{"t":"Hilbert's optimism","s":"There is no ignorabimus in mathematics; every well-posed problem can be settled.","who":["Hilbert (1900, 1930)","Kreisel (1958), on what Hilbert meant"],"f":"F2"}]},{"t":"Gödel's disjunction","s":"Either the human mind surpasses every machine, or there are absolutely undecidable arithmetical problems; Gödel favoured the first.","who":["Gödel (1951)","Feferman (2006)","Koellner (2016, 2018)","Horsten and Welch (2016)"],"f":"F2"},{"t":"Anti-mechanist use","s":"Minds can see the truth of their own Gödel sentence, so minds are not machines.","who":["Lucas (1961)","Penrose (1989, 1994)","Benacerraf (1967), critique","Putnam (1960), critique"],"f":"F2"},{"t":"Wittgenstein's deflation","s":"A Gödel sentence is just a sentence of a calculus; calling it true but unprovable trades on a picture of truth the calculus does not supply.","who":["Wittgenstein (1956)","Floyd and Putnam (2000)","Steiner (2001), critique"],"f":"F2"},{"t":"Natural independence","s":"Concrete combinatorial statements about finite objects, not just self-referential ones, escape Peano arithmetic.","who":["Paris and Harrington (1977)","Kirby and Paris (1982), Goodstein","Friedman (1998)"],"f":"FG"}]},{"t":"Uncomputability","s":"There are precisely defined questions no algorithm can answer for all inputs.","who":["Turing (1936)","Church (1936)","Rice (1953)","Post (1944)"],"f":"FG","q":"Which question has no algorithm?","kids":[{"t":"Halting problem","s":"No program can decide, for every program and input, whether it will halt.","who":["Turing (1936)","Church (1936), Entscheidungsproblem","Davis (1958)"],"f":"FG"},{"t":"Rice's theorem","s":"Every non-trivial property of what a program computes is undecidable; you cannot check behaviour in general.","who":["Rice (1953)","Rogers (1967)"],"f":"FG"},{"t":"Hilbert's tenth problem","s":"No algorithm decides whether a polynomial with integer coefficients has integer roots.","who":["Matiyasevich (1970)","Davis, Putnam and Robinson (1961)","Davis (1973)"],"f":"FG"},{"t":"Word problem for groups","s":"No algorithm decides whether two words in a finitely presented group name the same element.","who":["Novikov (1955)","Boone (1958)","Dehn (1911), posing it"],"f":"FG"},{"t":"Church-Turing thesis","s":"Everything effectively computable is Turing computable; a definition, not a theorem, but never breached.","who":["Church (1936)","Turing (1936)","Gandy (1980)","Copeland (2002), hypercomputation debate"],"f":"F2","q":"Could physics compute more?","kids":[{"t":"Physical Church-Turing thesis","s":"No physical process computes a non-Turing-computable function.","who":["Deutsch (1985)","Gandy (1980)","Piccinini (2011)","Aaronson (2005)"],"f":"F2"},{"t":"Hypercomputation","s":"Relativistic spacetimes, infinite precision or oracles could in principle exceed Turing machines.","who":["Hogarth (1992)","Copeland (2002)","Siegelmann (1995)","Davis (2004), contra"],"f":"F2"},{"t":"Non-computable physics","s":"Some wave-equation solutions with computable initial data are non-computable, and spectral gaps are undecidable.","who":["Pour-El and Richards (1981)","Cubitt, Perez-Garcia and Wolf (2015)","Moore (1990), dynamical systems","da Costa and Doria (1991)"],"f":"FG"}]}]},{"t":"Algorithmic information limits","s":"Randomness and complexity cannot be certified; most mathematical facts have no reason.","who":["Kolmogorov (1965)","Chaitin (1966, 1975, 1987)","Solomonoff (1964)","Li and Vitányi (1997)"],"f":"FG","q":"What cannot be computed about information?","kids":[{"t":"Kolmogorov complexity is uncomputable","s":"No program can compute the shortest description of an arbitrary string.","who":["Kolmogorov (1965)","Chaitin (1966)","Solomonoff (1964)"],"f":"FG"},{"t":"Chaitin's incompleteness","s":"A formal system can prove that a string is random only for strings shorter than roughly the system itself.","who":["Chaitin (1974, 1987)","Calude (2002)","Raatikainen (1998), critique of interpretation"],"f":"FG"},{"t":"Omega number","s":"The halting probability is definable, random, and its digits are unknowable beyond a finite prefix.","who":["Chaitin (1975)","Calude and Dinneen (2007), first 64 bits","Solovay (2000)"],"f":"FG"},{"t":"Solomonoff induction","s":"The ideal predictor weights all hypotheses by simplicity; it is optimal and uncomputable, so real induction is approximation.","who":["Solomonoff (1964)","Hutter (2005), AIXI","Rathmanner and Hutter (2011)"],"f":"FG"},{"t":"Computational irreducibility","s":"Some systems can be predicted only by running them; there is no shortcut, so their future is undecidable in advance.","who":["Wolfram (2002)","Israeli and Goldenfeld (2004), contra for coarse-graining","Zwirn and Delahaye (2013)"],"f":"F2"}]},{"t":"Undefinability of truth","s":"No language can contain its own truth predicate without contradiction; truth for a language lives one level up.","who":["Tarski (1933, 1944)","Kripke (1975)","Gupta and Belnap (1993)"],"f":"FG","q":"How do we handle the liar?","kids":[{"t":"Hierarchy of languages","s":"Truth for L is defined only in a richer metalanguage; there is no universal language.","who":["Tarski (1933)","Russell (1908), types","Parsons (1974)"],"f":"FG"},{"t":"Fixed-point theories","s":"Let truth be partial; the liar is neither true nor false, and truth can be defined within the language at a fixed point.","who":["Kripke (1975)","Martin and Woodruff (1975)","Field (2008)"],"f":"F2"},{"t":"Revision theory","s":"Truth is a circular concept whose extension is found by revising guesses; paradoxical sentences never settle.","who":["Gupta and Belnap (1993)","Herzberger (1982)"],"f":"F2"},{"t":"Dialetheism","s":"The liar is both true and false; some contradictions are true and logic must be paraconsistent.","who":["Priest (1979, 1987)","Beall (2009)","Routley (1979)"],"f":"F2"},{"t":"Inconsistency theories","s":"Natural language truth is governed by inconsistent rules; we should replace the concept.","who":["Chihara (1979)","Eklund (2002)","Scharp (2013)","Tarski (1944), semantic closure"],"f":"F2"}]},{"t":"Set-theoretic independence","s":"Some questions about infinity are neither provable nor refutable from the accepted axioms of mathematics.","who":["Gödel (1940)","Cohen (1963)","Woodin (2001)","Hamkins (2012)"],"f":"FG","q":"Does independence mean there is no answer?","kids":[{"t":"Continuum hypothesis is independent","s":"Neither CH nor its negation follows from ZFC.","who":["Gödel (1940), consistency","Cohen (1963), independence","Kunen (1980)"],"f":"FG","q":"Is CH nevertheless true or false?","kids":[{"t":"Set-theoretic platonism","s":"CH has a determinate truth value we have not yet found; new axioms will settle it.","who":["Gödel (1947)","Woodin (2001, 2017), Ultimate L","Koellner (2014)","Maddy (1988)"],"f":"F2"},{"t":"Multiverse view","s":"There are many equally legitimate universes of sets; CH is true in some and false in others, and that is the whole story.","who":["Hamkins (2012)","Hamkins (2020)","Balaguer (1998)"],"f":"F2"},{"t":"CH is not a definite problem","s":"The concept of arbitrary subset of the reals is too vague for CH to have a truth value.","who":["Feferman (2000, 2011)","Weyl (1918)","Koellner (2011), reply"],"f":"F2"},{"t":"Forcing axioms","s":"Axioms that maximise the universe settle CH as false and the continuum as aleph-two.","who":["Foreman, Magidor and Shelah (1988)","Woodin (1999)","Todorcevic (1989)","Moore (2005)"],"f":"F2"}]},{"t":"Large cardinal axioms","s":"Strong axioms of infinity form a linear hierarchy that settles many independent questions and has never been found inconsistent.","who":["Gödel (1947)","Kanamori (1994)","Steel (2000)","Koellner (2010)"],"f":"F2"},{"t":"Axiom of choice","s":"Choice is independent of ZF, implies well-ordering and Banach-Tarski, and is accepted for its fruits.","who":["Zermelo (1904)","Fraenkel (1922)","Cohen (1963)","Moore (1982)"],"f":"FG"}]},{"t":"Limits of self-prediction","s":"No system can fully predict itself or a world containing itself, by argument rather than by physics.","who":["Popper (1950)","MacKay (1960)","Wolpert (2008)","Lloyd (2012)"],"f":"FG","q":"Why can a system not read itself?","kids":[{"t":"Logical indeterminacy of free choice","s":"A prediction of your choice, once told to you, can be falsified by you, so no prediction is binding on you.","who":["MacKay (1960, 1967)","Popper (1950)","Rummens and Cuypers (2010)"],"f":"FG"},{"t":"Inference devices","s":"No physical device can infer every function of the universe it belongs to; two devices cannot both infer each other.","who":["Wolpert (2008)","Wolpert (2018)","Binder (2008)"],"f":"FG"},{"t":"Turing test for free will","s":"A decider that is computationally irreducible cannot know its own decision before making it, so it experiences free will.","who":["Lloyd (2012)","Aaronson (2013)"],"f":"F2"},{"t":"Laplace's demon inside the world","s":"A predictor embedded in the system it predicts fails on inputs that depend on its own output.","who":["Popper (1950)","Ismael (2016)","Breuer (1995), universal measurement impossible"],"f":"FG"}]},{"t":"Complexity barriers","s":"Questions that are decidable in principle but not in any feasible time, and whether that is a hard limit.","who":["Cook (1971)","Karp (1972)","Aaronson (2013)","Impagliazzo (1995)"],"f":"F2","q":"Is intractability a limit on knowledge?","kids":[{"t":"P versus NP","s":"Whether every problem with quickly checkable answers is quickly solvable; unknown, and believed not.","who":["Cook (1971)","Levin (1973)","Karp (1972)","Fortnow (2009)"],"f":"F2"},{"t":"Natural proofs barrier","s":"Most known proof techniques provably cannot separate P from NP.","who":["Razborov and Rudich (1997)","Baker, Gill and Solovay (1975), relativisation","Aaronson and Wigderson (2009), algebrisation"],"f":"FG"},{"t":"Complexity as philosophically relevant","s":"Distinguishing what is knowable in principle from what is knowable in practice changes the answers to old philosophical questions.","who":["Aaronson (2013)","Dean (2016)","Cherniak (1986), minimal rationality"],"f":"F2"},{"t":"Quantum speedups","s":"Some problems, such as factoring, are fast on quantum computers; the boundary of feasible knowledge depends on physics.","who":["Shor (1994)","Bernstein and Vazirani (1997)","Aaronson (2013)"],"f":"F1"}]}],"q":"Which theorem draws the line?"},{"t":"Closed to us, open to some mind","s":"A differently built observer could settle it.","f":"F3","d":"Whether other systems experience anything. What Layer 3 and above are like.","kids":[{"t":"Cognitive closure","s":"Our concept-forming capacities were built for other tasks and simply do not reach some truths.","who":["McGinn (1989)","Chomsky (1975)","Fodor (1983)","Nagel (1974)"],"f":"F3","q":"Which faculty is bounded?","kids":[{"t":"Epistemic boundedness","s":"Central cognition has a fixed architecture, so there are thoughts we cannot think, as a dog cannot do algebra.","who":["Fodor (1983)","Chomsky (1975)","Pinker (1997)"],"f":"F3"},{"t":"Problems and mysteries","s":"Questions our minds can pose and progress on are problems; questions that stay dark across centuries are mysteries.","who":["Chomsky (1975, 2009)","Chomsky (1988)","McGinn (1993)"],"f":"F3"},{"t":"Bounded rationality","s":"We satisfice with limited memory and time; ideal inference is unavailable to us, whatever is true in principle.","who":["Simon (1955, 1957)","Gigerenzer and Selten (2001)","Cherniak (1986)"],"f":"F0"},{"t":"View from nowhere","s":"Objective understanding abstracts from any point of view, so subjective facts resist it by their nature.","who":["Nagel (1986)","Nagel (1974)","Williams (1978), absolute conception"],"f":"F3"}]},{"t":"Humility about intrinsic natures","s":"We can know how fundamental properties are related and what they do, never what they are in themselves.","who":["Kant (1781)","Russell (1927)","Langton (1998)","Lewis (2009)"],"f":"F3","q":"What kind of humility?","kids":[{"t":"Kantian humility","s":"Things in themselves are unknowable because we know only through our receptivity to their effects.","who":["Kant (1781)","Langton (1998)","Van Cleve (2002)"],"f":"F3"},{"t":"Ramseyan humility","s":"Given any theory of fundamental properties, permuting which property plays which role gives an indistinguishable world; we cannot know which is actual.","who":["Lewis (2009)","Locke (2009)","Schaffer (2005), quiddistic knowledge"],"f":"F3"},{"t":"Quidditism versus structuralism","s":"Either properties have natures beyond their roles (unknowable) or they are their roles (nothing to be ignorant of).","who":["Black (2000)","Bird (2007), dispositional essentialism","Hawthorne (2001)"],"f":"F2"}]},{"t":"Other minds","s":"Whether anyone can know what, or whether, another creature experiences.","who":["Mill (1865)","Wittgenstein (1953)","Nagel (1974)","Avramides (2001)"],"f":"F3","q":"How do we reach another mind?","kids":[{"t":"Argument from analogy","s":"Others behave as I do when I feel pain, so they probably feel pain.","who":["Mill (1865)","Russell (1948)","Hyslop (1995)","Malcolm (1958), critique"],"f":"F2"},{"t":"Inference to the best explanation of behaviour","s":"Other minds are the best explanation of others' behaviour, as electrons are of tracks.","who":["Pargetter (1984)","Melnyk (1994)","Hyslop and Jackson (1972)"],"f":"F2"},{"t":"Criterial view","s":"Behaviour is a criterion for mental states by the grammar of our concepts, not evidence for a hidden state.","who":["Wittgenstein (1953)","Malcolm (1958)","Hacker (1990)"],"f":"F2"},{"t":"Direct social perception","s":"We perceive others' emotions and intentions in their expressive behaviour; no inference or theory is involved.","who":["Dretske (1973)","Gallagher (2008)","Zahavi (2011)","Scheler (1913)"],"f":"F2"},{"t":"Theory-theory and simulation","s":"We understand others by a folk theory of mind, or by simulating their states in ourselves.","who":["Gopnik and Wellman (1992)","Gordon (1986)","Goldman (2006)","Baker, Saxe and Tenenbaum (2009), Bayesian"],"f":"F1"},{"t":"Beetle in the box","s":"If a word for an inner object had a purely private referent, the object would drop out as irrelevant; sensation talk works otherwise.","who":["Wittgenstein (1953, §293)","Kripke (1982)","Kenny (1973)"],"f":"F2"},{"t":"Animal minds","s":"Which animals have experience, and whether any method could tell.","who":["Tye (2017)","Godfrey-Smith (2016)","Birch (2024)","Carruthers (2019)"],"f":"F3","q":"Is there a fact to find?","kids":[{"t":"No fact of the matter","s":"Whether an animal is phenomenally conscious has no answer beyond the functional facts; the question is empty.","who":["Carruthers (2019)","Carruthers (2018)"],"f":"F2"},{"t":"Markers and precaution","s":"Behavioural and neural markers give probabilistic evidence; act on reasonable candidates without waiting for certainty.","who":["Birch (2024)","Birch, Schnell and Clayton (2020)","Sneddon et al. (2014)"],"f":"F1"},{"t":"Newton's rule for animals","s":"Attribute the same states when the same behaviour has the same cause; absent a reason to differ, extend consciousness widely.","who":["Tye (2017)","Godfrey-Smith (2016)","Allen and Bekoff (1997)"],"f":"F2"},{"t":"Hard problem of other animal minds","s":"Even a complete neuroscience of an octopus would leave open what, if anything, it is like to be one.","who":["Nagel (1974)","Godfrey-Smith (2016)","Dawkins (2012)"],"f":"F3"}]}]},{"t":"Harder problem","s":"Even a realist cannot tell whether a functionally identical creature of different make-up is conscious; the question is not merely unanswered but has no conceivable evidence.","who":["Block (2002)","Papineau (2003)","McLaughlin (2003)"],"f":"F3"},{"t":"Horizons in physics","s":"Regions and scales that no observer at our position can reach, though an observer elsewhere or later could.","who":["Ellis (2007)","Rees (1997)","Bekenstein (1981)","Susskind (2003)"],"f":"F3","q":"Which horizon?","kids":[{"t":"Cosmic horizons","s":"Light from beyond the particle horizon has not reached us and, with acceleration, never will.","who":["Rindler (1956)","Ellis and Rothman (1993)","Krauss and Scherrer (2007)"],"f":"F3"},{"t":"Black hole information","s":"Whether information falling into a black hole is lost, hidden, or encoded on the horizon divides the field.","who":["Hawking (1976)","Susskind (1995)","Page (1993)","Almheiri et al. (2013), firewalls"],"f":"F2"},{"t":"Planck-scale inaccessibility","s":"Direct probes of Planck-scale structure need energies no accelerator could reach; only indirect signatures are possible.","who":["Amelino-Camelia (2013)","Hossenfelder (2013)","Bekenstein (2012)"],"f":"F3"},{"t":"Anthropic selection","s":"What we observe is filtered by what permits observers, so some cosmic facts are hidden by our own existence.","who":["Carter (1974)","Barrow and Tipler (1986)","Bostrom (2002)","Weinberg (1987)"],"f":"F2"}]},{"t":"Kantian limits of reason","s":"Reason produces contradictions when applied beyond experience; the antinomies mark the boundary.","who":["Kant (1781)","Rescher (1984)","Allison (1983)"],"f":"F3","q":"What lies past the boundary?","kids":[{"t":"Antinomies","s":"Whether the world is finite or infinite, simple or composite, free or determined, necessary or contingent: each side is provable, so the question is ill-posed.","who":["Kant (1781)","Al-Azm (1972)","Grier (2001)"],"f":"F3"},{"t":"Question propagation","s":"Every answer raises new questions, so inquiry cannot be completed; the boundary moves but never vanishes.","who":["Kant (1781)","Rescher (1984, 1999)","Rescher (2009)"],"f":"gate"},{"t":"Correlationism","s":"Since Kant, philosophy has only had access to the correlation of thought and being, never to either alone; the absolute is closed by that circle.","who":["Meillassoux (2006)","Brassier (2007)","Harman (2011), object-oriented reply"],"f":"F3"}]}],"q":"What shuts us out while leaving the door open for others?"},{"t":"Closed to all","s":"The Un-Concept. Cannot be shown non-empty from anywhere.","f":"F4","kids":[{"t":"Ignorabimus","s":"Some riddles are not just unsolved but unsolvable for any science, present or future.","who":["Du Bois-Reymond (1872)","Du Bois-Reymond (1880), the seven riddles","Haeckel (1899), reply","Hilbert (1930), reply"],"f":"F4","q":"Which riddles?","kids":[{"t":"Nature of matter and force","s":"What matter and force are in themselves lies outside physics, which handles only their relations.","who":["Du Bois-Reymond (1872)","Kant (1786)","Russell (1927)"],"f":"F4"},{"t":"Origin of sensation","s":"How movement of atoms gives rise to sensation is transcendent; no arrangement of matter explains a feeling.","who":["Du Bois-Reymond (1872)","Leibniz (1714), the mill","Tyndall (1868), the chasm"],"f":"F4"},{"t":"We must know, we shall know","s":"Hilbert's reply that in mathematics, and by extension in science, there is no ignorabimus.","who":["Hilbert (1930)","Hilbert (1900)","Gödel (1931), one year later"],"f":"F2"}]},{"t":"Absolutely undecidable propositions","s":"Mathematical statements that no justified extension of our axioms could ever settle, if such exist.","who":["Gödel (1951)","Feferman (2006)","Koellner (2010, 2018)","Hamkins (2012)"],"f":"F4","q":"Are there any?","kids":[{"t":"Gödel's optimism","s":"There are none; every well-posed mathematical question is decidable by the human mind given time.","who":["Gödel (1951)","Hilbert (1930)","Wang (1996)"],"f":"F2"},{"t":"Pluralism as absolute undecidability","s":"If the set-theoretic multiverse is right, CH is absolutely undecidable because there is nothing to decide.","who":["Hamkins (2012)","Feferman (2011)","Koellner (2014), contra"],"f":"F4"},{"t":"Reflection and the limits of justification","s":"Reflection principles extend theories but any effective extension is itself incomplete; the process has no end.","who":["Turing (1939), ordinal logics","Feferman (1962)","Franzén (2004)"],"f":"FG"}]},{"t":"Apophatic theology","s":"The ultimate reality can be described only by what it is not; positive knowledge of it is impossible for any creature.","who":["Pseudo-Dionysius (c. 500)","Maimonides (1190)","Eckhart (c. 1300)","Nicholas of Cusa (1440)"],"f":"F4","q":"How does negation know?","kids":[{"t":"Negative attributes","s":"Every positive predicate applied to God is false or equivocal; only negations are literally true.","who":["Maimonides (1190)","Plotinus (c. 270)","Pseudo-Dionysius (c. 500)"],"f":"F4"},{"t":"Learned ignorance","s":"The infinite is incomprehensible to the finite; the highest knowledge is knowing that one cannot know.","who":["Nicholas of Cusa (1440)","Socrates (via Plato, c. 380 BCE)","Eckhart (c. 1300)"],"f":"F4"},{"t":"Essence and energies","s":"God's essence is unknowable to any created intellect forever; only his activities are known.","who":["Gregory Palamas (1341)","Basil of Caesarea (4th c.)","Lossky (1944)"],"f":"F4"},{"t":"Neti neti","s":"The Self is described only by not this, not this; every positive description falls short.","who":["Bṛhadāraṇyaka Upaniṣad (c. 700 BCE)","Śaṅkara (8th c.)","Ramana Maharshi (20th c.)"],"f":"F4"}]},{"t":"Ineffability","s":"Some things can be known or experienced but not said; language itself is the wall.","who":["James (1902)","Wittgenstein (1921)","Alston (1956)","Kukla (2005)"],"f":"F4","q":"What cannot be said?","kids":[{"t":"Tractarian silence","s":"What cannot be put into words shows itself; ethics, the mystical and the sense of the world lie outside what can be said.","who":["Wittgenstein (1921)","Diamond (1991), resolute reading","Hacker (1986), ineffable-truths reading"],"f":"F4"},{"t":"Mystical ineffability","s":"Mystical states are noetic yet cannot be transferred in words; that is one of their marks.","who":["James (1902)","Stace (1960)","Katz (1978), constructivist critique","Forman (1990)"],"f":"F4"},{"t":"Perennialism versus constructivism","s":"Either one unsayable core underlies all mystical traditions, or each experience is shaped through and through by its tradition.","who":["Huxley (1945)","Stace (1960)","Katz (1978)","Forman (1990, 1999)"],"f":"F2"},{"t":"Tetralemma","s":"The ultimate is not existent, not non-existent, not both, not neither; every position on it fails.","who":["Nāgārjuna (2nd c.)","Candrakīrti (7th c.)","Garfield and Priest (2003), on its logic"],"f":"F4"},{"t":"Semantic ineffability","s":"There may be facts whose expression would require concepts no possible language could contain.","who":["Kukla (2005)","Jonas (2016)","Hofweber (2017), contra"],"f":"F4"}]},{"t":"Akatalēpsia","s":"Nothing can be grasped with certainty by anyone; the wise withhold assent.","who":["Arcesilaus (3rd c. BCE)","Carneades (2nd c. BCE)","Sextus Empiricus (c. 200)","Cicero (45 BCE)"],"f":"F4","q":"Is the claim itself graspable?","kids":[{"t":"Self-refutation charge","s":"To assert that nothing can be known is to claim to know something.","who":["Epictetus (c. 108)","Augustine (386)","Sextus Empiricus (c. 200), reply: the purge"],"f":"F2"},{"t":"Purgative reading","s":"The skeptical argument purges itself along with the rest, like a drug that is expelled with the disease.","who":["Sextus Empiricus (c. 200)","McPherran (1987)","Castagnoli (2010)"],"f":"F2"}]},{"t":"Optimism against all limits","s":"No limits are absolute: everything not forbidden by the laws of physics is achievable, and every problem is soluble.","who":["Deutsch (2011)","Hilbert (1900)","Peirce (1878)","Popper (1963)"],"f":"F2","q":"Why think so?","kids":[{"t":"Beginning of infinity","s":"Explanatory knowledge has unbounded reach; any apparent limit is a problem, and problems are soluble.","who":["Deutsch (2011)","Deutsch (1997)"],"f":"F2"},{"t":"Universal constructor","s":"Any physical transformation not forbidden by law can be caused given the right knowledge.","who":["Deutsch (2011)","Deutsch and Marletto (2015), constructor theory","von Neumann (1966)"],"f":"F2"},{"t":"End of science thesis","s":"The big questions have been answered; what remains is detail or unanswerable, and science is winding down.","who":["Horgan (1996)","Stent (1969)","Glass (1971)","Rescher (1978), contra"],"f":"F2"}]}],"q":"Who has said some things are beyond any knower?"},{"t":"Why the fog moves","s":"Knowability grows with position.","d":"Move to a higher layer or a stronger instrument and the set of claims you can settle grows. A claim closed to you today may be settled tomorrow. Three things do not move: Gödel’s fog, the fact that behavior never reveals experience, and the existence of some boundary at every position. Everything else about the fog is relative to where you stand.","f":"gate","doc":"07-fog-front.md §4","kids":[{"t":"Theories of scientific progress","s":"What it is for later knowledge to be better than earlier knowledge.","who":["Popper (1963)","Kuhn (1962)","Lakatos (1970)","Laudan (1977)","Bird (2007)"],"f":"F2","q":"What accumulates?","kids":[{"t":"Conjectures and refutations","s":"Knowledge grows by guessing and eliminating; truth is approached by removing error, never by confirmation.","who":["Popper (1963, 1972)","Miller (1994)"],"f":"F2","q":"Is knowledge growth like evolution?","kids":[{"t":"Evolutionary epistemology","s":"Theories compete like organisms; blind variation and selective retention drive growth.","who":["Popper (1972)","Campbell (1974)","Toulmin (1972)","Hull (1988)"],"f":"F2"},{"t":"World 3","s":"Objective knowledge lives in a realm of theories, problems and arguments that has consequences no one intended.","who":["Popper (1972)","Popper (1978)","Frege (1918), the third realm"],"f":"F2"}]},{"t":"Paradigm shifts","s":"Normal science solves puzzles inside a paradigm; anomalies build to a crisis and revolution, after which progress is not cumulative.","who":["Kuhn (1962, 1970)","Kuhn (1977)","Hoyningen-Huene (1993)"],"f":"F2","q":"Is anything carried across?","kids":[{"t":"Incommensurability","s":"Rival paradigms lack a common measure; their advocates talk past each other and choose by persuasion.","who":["Kuhn (1962)","Feyerabend (1962)","Sankey (1994)","Kitcher (1978), contra"],"f":"F2"},{"t":"Kuhn's values for theory choice","s":"Accuracy, consistency, scope, simplicity and fruitfulness guide choice but do not determine it.","who":["Kuhn (1977)","McMullin (1983)","Okasha (2011), Arrow's theorem applied"],"f":"F2"},{"t":"Structure of scientific revolutions as evolutionary","s":"Later Kuhn: speciation of specialties, not approach to truth, is the shape of progress.","who":["Kuhn (2000)","Wray (2011)","Bird (2000)"],"f":"F2"}]},{"t":"Research programmes","s":"A hard core protected by a belt of auxiliaries; a programme is progressive if it predicts novel facts and degenerating if it only patches.","who":["Lakatos (1970, 1978)","Zahar (1973)","Worrall (1978)"],"f":"F2"},{"t":"Anything goes","s":"No methodological rule holds in all cases; science advanced by breaking each of them, and should keep its freedom.","who":["Feyerabend (1975, 1978)","Feyerabend (1987)","Preston (1997)"],"f":"F2"},{"t":"Problem-solving progress","s":"Progress is the growth in a tradition's problem-solving effectiveness, whether or not it approaches truth.","who":["Laudan (1977, 1981)","Laudan (1984), reticulated model"],"f":"F2"},{"t":"Epistemic account of progress","s":"Science progresses when it accumulates knowledge, not merely true belief or solved problems.","who":["Bird (2007, 2022)","Niiniluoto (2014), truthlikeness account","Dellsén (2016), noetic account"],"f":"F2"},{"t":"Iron rule of explanation","s":"Modern science works because it forces every dispute to be settled by empirical test alone, however irrational the scientists.","who":["Strevens (2020)","Strevens (2003)"],"f":"F2"},{"t":"Realist convergence","s":"Later theories retain the successful structure of earlier ones; progress is approach to truth by degrees.","who":["Boyd (1983)","Psillos (1999)","Niiniluoto (1987, 1999)","Post (1971), general correspondence principle"],"f":"F2"}]},{"t":"Instruments extend the observable","s":"What counts as observable widens with instruments; the boundary of the knowable is technological, not fixed.","who":["Shapere (1982)","Hacking (1983)","Humphreys (2004)","Baird (2004)"],"f":"F2","q":"How does a tool change knowing?","kids":[{"t":"Observing with neutrinos","s":"Detecting solar neutrinos is observing the sun's core; observation is any information transfer without interference we can model.","who":["Shapere (1982)","Churchland (1985)","Kosso (1989)"],"f":"F2"},{"t":"Epistemic enhancement","s":"Computers and instruments extend the senses and the reasoning capacity; the human is no longer the measure of what is knowable.","who":["Humphreys (2004)","Ihde (1990), postphenomenology","Baird (2004), thing knowledge"],"f":"F2"},{"t":"Styles of scientific reasoning","s":"New styles (statistical, laboratory, historical-genetic) bring new kinds of objects and truth candidates into existence.","who":["Hacking (1992, 2012)","Crombie (1994)","Kusch (2010)"],"f":"F2"},{"t":"Epistemes and thought collectives","s":"What can count as knowledge in a period is fixed by an unspoken framework shared by a collective.","who":["Fleck (1935)","Foucault (1966, 1969)","Kuhn (1962)"],"f":"F2"},{"t":"Rescher's technological escalation","s":"Each level of scientific progress needs exponentially more resources; the boundary moves but ever more slowly.","who":["Rescher (1978, 1984)","Rescher (1999)","Price (1963), Little Science Big Science"],"f":"F2"}]},{"t":"Positional knowability","s":"What a knower can settle depends on where and what it is; the same claim is closed to one observer and open to another.","who":["Nagel (1986)","Bostrom (2002)","Wolpert (2008)","Rescher (1984)"],"f":"gate","q":"What fixes position?","kids":[{"t":"Observer selection","s":"Reasoning about our position must correct for the fact that only some positions allow observers.","who":["Bostrom (2002)","Carter (1974)","Leslie (1996)"],"f":"F2","q":"Which reference class?","kids":[{"t":"Self-sampling assumption","s":"Reason as if you were a random sample from all observers in your reference class.","who":["Bostrom (2002)","Leslie (1996)","Carter (1983)"],"f":"F2"},{"t":"Self-indication assumption","s":"Weight hypotheses by how many observers they contain; you are more likely to exist in a world with more observers.","who":["Dieks (1992)","Olum (2002)","Bostrom (2002), contra"],"f":"F2"},{"t":"Doomsday argument","s":"If you are a random human, humanity is probably not near its beginning, so the future is shorter than we hope.","who":["Carter (1983)","Leslie (1989, 1996)","Gott (1993)","Bostrom (1999), critique"],"f":"F2"},{"t":"Anthropic shadow","s":"Catastrophes that would have prevented observers are under-represented in our record, so we underestimate their frequency.","who":["Ćirković, Sandberg and Bostrom (2010)","Tegmark and Bostrom (2005)"],"f":"F2"}]},{"t":"Levels and layers","s":"A knower at a higher level of organisation or in a containing world can settle what the lower one cannot, as we settle facts about characters in a simulation.","who":["Bostrom (2003)","Chalmers (2022)","Hofstadter (1979), strange loops","Lloyd (2006)"],"f":"F2"},{"t":"Three fixed points","s":"Whatever moves, Gödel's limit, the silence of behaviour about experience, and the existence of some horizon at every position do not.","who":["Gödel (1931)","Block (1978)","Rescher (1984)","Wolpert (2008)"],"f":"gate"}]}],"q":"What moves the boundary of the knowable?"},{"t":"The pop: every squeeze ends","s":"Cell, animal, mind. Each step explained the last and hid the next.","f":"F2","d":"Your hypothesis: every wall we meet is fog, not stone. Crossing is a squeeze that tightens, then a pop, and everything before becomes simple. The record favors it for the next step: eight major transitions, all crossed, gives about nine in ten by Laplace, nearer three in four after allowing that only survivors get to count. Whether the pops go on forever, or end at the Akatalepton, cannot be judged from inside. That is your own Turn 14 point.","who":["Maynard Smith and Szathmáry, major transitions","Anderson, More Is Different","Vinge, the singularity as a wall we cannot see past","Teilhard’s Omega","Kurzweil"],"doc":"14-the-pop.md","kids":[{"t":"Emergence and reduction","s":"Whether higher levels are new in principle or only in practice.","who":["Anderson (1972)","Nagel (1961)","Weinberg (1992)","Batterman (2002)"],"f":"F2","q":"Does the higher level reduce?","kids":[{"t":"More is different","s":"Each level has its own laws and concepts that cannot be constructed from the level below, though they do not violate it.","who":["Anderson (1972)","Laughlin and Pines (2000)","Laughlin (2005)"],"f":"F2"},{"t":"Grand reductionism","s":"The arrows of explanation all point down to fundamental physics, even if we can never follow them in practice.","who":["Weinberg (1992)","Weinberg (2001)","Oppenheim and Putnam (1958), unity of science"],"f":"F2"},{"t":"Nagelian reduction","s":"One theory reduces to another when its laws are derived via bridge principles; the classic model of a pop.","who":["Nagel (1961)","Schaffner (1967)","Dizadji-Bahmani, Frigg and Hartmann (2010)"],"f":"F2"},{"t":"Special sciences autonomy","s":"Higher-level kinds are multiply realised, so their laws are not derivable from physics even in principle.","who":["Fodor (1974, 1997)","Kim (1992), contra","Dupré (1993)"],"f":"F2"},{"t":"Asymptotic emergence","s":"New behaviour appears only in singular limits, so the higher theory is not derivable from the lower without the limit.","who":["Batterman (2002, 2011)","Berry (1994)","Butterfield (2011), contra"],"f":"F2"},{"t":"Weak and strong emergence","s":"Weak: deducible only by simulation. Strong: not deducible at all. Only consciousness is a live candidate for strong.","who":["Bedau (1997)","Chalmers (2006)","Wilson (2021)","Kim (1999)"],"f":"F2"},{"t":"Dappled world","s":"The laws of physics hold only in the tidy conditions of models; the world is a patchwork with no single fundamental level.","who":["Cartwright (1999)","Dupré (1993)","Cartwright (1983)"],"f":"F2"}]},{"t":"Major transitions","s":"Life's history is a sequence of steps in which formerly independent units combine and information is transmitted in new ways.","who":["Maynard Smith and Szathmáry (1995)","Szathmáry (2015)","West, Fisher, Gardner and Kiers (2015)","Okasha (2006)"],"f":"F1","q":"How does a unit become part of a bigger one?","kids":[{"t":"Eight transitions","s":"Replicating molecules to compartments, genes to chromosomes, RNA to DNA and protein, prokaryotes to eukaryotes, asexual to sexual, protists to multicellular, solitary to colonial, primate societies to language.","who":["Maynard Smith and Szathmáry (1995)","Szathmáry and Maynard Smith (1995)"],"f":"F0"},{"t":"Transitions in individuality","s":"The key is when selection at the lower level is suppressed and the group becomes the unit; fitness is transferred upward.","who":["Michod (1999)","Buss (1987)","Okasha (2006)","Godfrey-Smith (2009)"],"f":"F1"},{"t":"Cooperation and kin","s":"Every transition needed cooperation, which needed either kinship or aligned interests; egalitarian and fraternal routes differ.","who":["Queller (1997, 2000)","West et al. (2015)","Bourke (2011)"],"f":"F1"},{"t":"Transitions in information","s":"The pops are changes in how information is stored and passed: template, gene, epigenetic, behavioural, symbolic.","who":["Jablonka and Lamb (2005)","Szathmáry (2015)","Maynard Smith (2000)"],"f":"F2"},{"t":"Origin of life as first pop","s":"Life began at a threshold of autocatalytic closure, or of replication, or of compartmentalised metabolism; each proposal names a different pop.","who":["Kauffman (1993)","Eigen (1971), hypercycles","Szostak (2001), protocells","Lane and Martin (2012), alkaline vents"],"f":"F2"}]},{"t":"Grand histories of complexity","s":"Accounts that place cosmic, biological and cultural steps on one ladder.","who":["Chaisson (2001)","Morowitz (2002)","Christian (2004)","Teilhard de Chardin (1955)"],"f":"F2","q":"What is the ladder measured in?","kids":[{"t":"Energy rate density","s":"Complexity grows with the energy flowing through a system per unit mass per unit time, from galaxies to brains to society.","who":["Chaisson (2001, 2011)","Chaisson (2014)"],"f":"F2"},{"t":"Twenty-eight steps","s":"Everything from the Big Bang to spirit emerges in about twenty-eight identifiable steps, each with new rules.","who":["Morowitz (2002)","Morowitz (1968)"],"f":"F2"},{"t":"Big History thresholds","s":"Eight thresholds of increasing complexity structure the story from stars to modernity.","who":["Christian (2004, 2018)","Spier (2010)"],"f":"F2"},{"t":"Noosphere and Omega","s":"Evolution converges on a sphere of thought and then on a final point of unification.","who":["Teilhard de Chardin (1955)","Vernadsky (1926), noosphere","Le Roy (1927)"],"f":"F2"},{"t":"Dissipative structures","s":"Order arises far from equilibrium; each new structure is a way to dissipate energy faster.","who":["Prigogine (1977)","Nicolis and Prigogine (1977)","Schneider and Kay (1994)","England (2013), dissipative adaptation"],"f":"F2"},{"t":"Adjacent possible","s":"Each new thing opens new possibilities; the space of what could happen next grows and cannot be pre-stated, so no law entails the future.","who":["Kauffman (2000, 2019)","Longo, Montévil and Kauffman (2012)","Johnson (2010)"],"f":"F2"},{"t":"Incomplete nature","s":"Absence and constraint, not stuff, generate teleology and mind at successive levels of dynamics.","who":["Deacon (2012)","Deacon (2006)"],"f":"F2"}]},{"t":"Singularity and its skeptics","s":"Whether a coming step in intelligence is a wall we cannot see past.","who":["Vinge (1993)","Kurzweil (2005)","Good (1965)","Bostrom (2014)"],"f":"F2","q":"Is the next pop an intelligence explosion?","kids":[{"t":"Intelligence explosion","s":"An ultraintelligent machine would design better machines, and so on; the first is the last invention humans need make.","who":["Good (1965)","Bostrom (2014)","Chalmers (2010), the singularity"],"f":"F2"},{"t":"Law of accelerating returns","s":"Technological change is exponential and reaches a point past which human affairs cannot continue as before.","who":["Kurzweil (1999, 2005)","Moravec (1998)","Vinge (1993)"],"f":"F2"},{"t":"Age of Em","s":"Brain emulations, not superintelligence, are the next transition; economics predicts their world in detail.","who":["Hanson (2016)","Hanson (1994)"],"f":"F2"},{"t":"Singularity skepticism","s":"Exponentials saturate, intelligence is not one quantity, and the forecast rests on curve-fitting.","who":["Modis (2012)","Allen and Greaves (2011)","Lanier (2010)","Floridi (2016)"],"f":"F2"},{"t":"Great filter","s":"The silence of the sky suggests a step that almost no civilisation passes; it may lie ahead of us.","who":["Hanson (1998)","Bostrom (2008)","Sandberg, Drexler and Ord (2018), dissolving the paradox"],"f":"F2"}]},{"t":"Reasoning from the record","s":"How to estimate the chance the next wall is fog from the fact that past walls fell.","who":["Laplace (1814)","Gott (1993)","Bostrom (2002)","Ćirković, Sandberg and Bostrom (2010)"],"f":"F2","q":"How do past successes bear on the next?","kids":[{"t":"Rule of succession","s":"After n successes in n trials the chance of another is (n+1)/(n+2); eight for eight gives nine in ten.","who":["Laplace (1814)","Zabell (1989)","Jaynes (2003)"],"f":"F0"},{"t":"Copernican time principle","s":"You are not at a special point in the duration of anything, so estimate its remaining life from its age.","who":["Gott (1993)","Gott (1994)","Caves (2000), critique"],"f":"F2"},{"t":"Survivorship correction","s":"Only lineages that crossed every wall are here to count walls, so the raw success rate overstates the odds.","who":["Ćirković, Sandberg and Bostrom (2010)","Bostrom (2002)","Wald (1943), the missing bullet holes"],"f":"F2"},{"t":"Reference class problem","s":"The estimate depends on what the next step is counted as an instance of; no rule fixes the class.","who":["Reichenbach (1949)","Hájek (2007)","Bostrom (2002)"],"f":"F2"}]},{"t":"The unanswerable remainder","s":"Positions on whether the pops go on forever or end in something that cannot be grasped.","who":["Rescher (1984)","Deutsch (2011)","Horgan (1996)","Sextus Empiricus (c. 200)"],"f":"F4","q":"Does the sequence end?","kids":[{"t":"Endless inquiry","s":"There is no final theory; each answer produces new questions, and the sequence has no last term.","who":["Rescher (1984, 1999)","Peirce (1898)","Popper (1972)"],"f":"F2"},{"t":"Final theory","s":"A theory of everything is reachable and would mark the end of fundamental physics, though not of science.","who":["Weinberg (1992)","Hawking (1988)","Greene (1999)"],"f":"F2"},{"t":"Akatalēpton","s":"The ungraspable is not the far end of a sequence but a permanent feature of every position; the Academic term for what cannot be apprehended.","who":["Arcesilaus (3rd c. BCE)","Sextus Empiricus (c. 200)","Cicero (45 BCE)","Kant (1781), things in themselves"],"f":"F4"}]}],"q":"What kind of step is a pop?"},{"t":"Holding every branch","s":"Religion is a person convinced of one pillar. Growing scope means holding them all.","q":"Why do we collapse to one, and how do we stop?","doc":"17-holding-every-branch.md","kids":[{"t":"Pillar-lock","s":"A mind that must act picks one picture and calls it the floor. Animism, gods, one God, matter alone: each held as the whole.","who":["Kruglanski, need for closure","Becker, terror management","Ellsberg, ambiguity aversion","Dugas, intolerance of uncertainty"],"f":"F0","d":"Survival machinery. Fast confident commitment beats waiting for the fog to clear."},{"t":"Scope growth","s":"Accepting uncertainty is a learned override with a track record.","who":["Sextus Empiricus, suspension","Nāgārjuna, emptiness of views","Keats, negative capability (1817)","Bayes and Laplace","Popper, fallibilism","Rorty, ironism"],"f":"F0","d":"From creed to credence: several branches with weights instead of one pillar as the world. Not complete. Getting there."},{"t":"Leaving survival","s":"If collapsing to one branch is survival machinery, holding every branch means stepping partly outside it.","f":"gate","d":"The same step the matrix already has twice: the Architect whose values are not rooted in survival, and the unlearning phase of the wake-up. Branch, branch, branch is not indecision. It is holding the whole partition open, weighting it, and acting anyway. Only the proven constraints stay closed: the gates, Gödel, other minds."}]},{"t":"Two fogs people confuse","s":"Reading thoughts versus knowing minds.","d":"Content fog: decoders only read what is active in working memory. Shallow; better instruments shrink it. Nature fog: no outside method settles whether a system experiences. Deep; possibly closed to all.","f":"gate","doc":"04-mind.md §7","kids":[{"t":"Content fog: reading what is active","s":"How far instruments can go in reading the contents of a mind, and where the method stops.","who":["Haynes and Rees (2006)","Poldrack (2006)","Tang et al. (2023)","Farah and Wolpe (2004)"],"f":"F1","q":"What limits the reading?","kids":[{"t":"Working memory bottleneck","s":"Decoders read only what is currently represented; long-term memories and dispositions leave no signature until retrieved.","who":["Tang et al. (2023)","Cowan (2001)","Norman et al. (2006)"],"f":"F0"},{"t":"Reverse inference","s":"Activation in a region weakly implies a mental state, since regions are shared across functions.","who":["Poldrack (2006, 2011)","Machery (2014)","Hutzler (2014)"],"f":"F0"},{"t":"Brain privacy and neurorights","s":"The content fog will thin, so law should protect mental privacy before the instruments arrive.","who":["Farah and Wolpe (2004)","Ienca and Andorno (2017)","Yuste et al. (2017)","Farahany (2023)"],"f":"F1"},{"t":"Introspection as a decoder","s":"Introspection is itself an unreliable readout of current experience, so even the first-person view has a content fog.","who":["Schwitzgebel (2008, 2011)","Nisbett and Wilson (1977)","Hurlburt and Heavey (2006), descriptive experience sampling","Bayne and Spener (2010), introspective humility"],"f":"F1"}]},{"t":"Nature fog: whether there is anyone there","s":"Whether any outside method can settle that a system experiences, not just what it represents.","who":["Nagel (1974)","Block (2002)","Chalmers (1996)","Birch (2024)"],"f":"F3","q":"Can any measurement reach experience?","kids":[{"t":"Measurement problem of consciousness","s":"Every measure of consciousness is validated against report, so no measure can be trusted where report fails.","who":["Irvine (2013)","Michel (2019)","Michel (2021)","Bayne, Hohwy and Owen (2016), levels of consciousness"],"f":"F2","q":"Is there a way around report?","kids":[{"t":"Consciousness meter","s":"The perturbational complexity index and similar measures aim to grade consciousness without behaviour, in coma and anaesthesia.","who":["Casali et al. (2013)","Koch, Massimini, Boly and Tononi (2016)","Sitt et al. (2014)"],"f":"F1"},{"t":"Calibration problem","s":"We can calibrate a consciousness measure only on cases we already agree about, so it cannot adjudicate the disputed ones.","who":["Michel (2019)","Irvine (2013)","Klein and Barron (2020)"],"f":"F2"},{"t":"Eliminate the concept","s":"Consciousness is not a scientific kind; split it into access, arousal and report and drop the rest.","who":["Irvine (2013)","Wilkes (1988)","Rey (1983)"],"f":"F2"}]},{"t":"Behaviour is silent","s":"Any behavioural criterion could be met by a system without experience, so behaviour cannot settle nature.","who":["Block (1978, 2002)","Searle (1980)","Harnad (2003)","Kirk (1974)"],"f":"gate"},{"t":"Meta-inaccessibility","s":"In the case of a functionally identical alien, we cannot even say what evidence would bear on whether it is conscious.","who":["Block (2002)","Papineau (2003)","Balog (2012)"],"f":"F3"},{"t":"First-person data","s":"Experience can be studied as data through trained report and neurophenomenology, which narrows but does not close the nature fog.","who":["Chalmers (2004)","Varela (1996)","Lutz and Thompson (2003)","Dennett (2003), heterophenomenology"],"f":"F1"},{"t":"Theory can close it","s":"A confirmed theory of consciousness would let us read nature off structure, as chemistry reads valence off electrons.","who":["Koch (2019)","Dehaene (2014)","Seth (2021)","Chalmers (1996), contra"],"f":"F2"},{"t":"Closed to all knowers","s":"No possible observer, however built, can verify experience in another from outside; the nature fog is absolute.","who":["Nagel (1974)","Block (2002)","Levine (2001)","Goff (2019)"],"f":"F4"}]},{"t":"Positions that conflate them","s":"Views that treat reading contents as reading minds, or the reverse.","who":["Dennett (1991)","Koch (2019)","Hoffman (2019)"],"f":"F2","q":"Which way does the conflation run?","kids":[{"t":"Decoding as mind-reading","s":"Public claims that fMRI reads thoughts or detects lies treat content decoding as access to the mind itself.","who":["Langleben et al. (2002)","Farah et al. (2014), critique","Greely and Illes (2007)"],"f":"F0"},{"t":"Access is all there is","s":"If phenomenal consciousness is access consciousness, the two fogs are one and it is shallow.","who":["Dennett (1991)","Cohen and Dennett (2011)","Frankish (2016)"],"f":"F2"},{"t":"Access and phenomenal distinct","s":"Access consciousness is functional and readable; phenomenal consciousness is neither, so the fogs are two.","who":["Block (1995)","Block (2007)","Chalmers (1997)"],"f":"F2"}]}],"q":"Which fog, and how thick?"}]},{"t":"Now","s":"τὸ νῦν, the standing point. Dated 4 September 2026.","q":"What is the score today?","doc":"08-to-nyn.md","kids":[{"t":"Nothing on any main axis is eliminated","s":"Bottom, graspability, substrate, maker, stance, morality: all open.","f":"F0","d":"Everything crossed off so far is a specific sub-theory: particular predictions of Global Workspace and IIT, particular discrete-spacetime models, fMRI lie detection as evidence, interaction dualism, and consciousness-collapse as a sign of rendering. The four pillars stand exactly where they stood, along with the cells they missed."},{"t":"What the instruments reach","s":"And where they stop.","q":"Which domain?","kids":[{"t":"Brain, from outside","s":"7T fMRI, wearable MEG, dense EEG.","d":"Reach: gist-level semantic decoding, category-level images, clinical consciousness detection. Stop: verbatim thought, single neurons.","f":"F0"},{"t":"Brain, from inside","s":"Utah arrays, Neuropixels, Neuralink-class implants.","d":"Reach: thousands of neurons, speech prostheses at conversational speed. Stop: whole-brain single-cell recording in a living human.","f":"F0"},{"t":"Wiring maps","s":"Fruit fly done. One cubic millimetre of human cortex done.","d":"A whole human brain at that resolution is about 1.4 zettabytes. Not yet storable.","f":"F1"},{"t":"Particles","s":"LHC at 13.6 TeV.","d":"Fifteen orders of magnitude short of the Planck scale.","f":"F0"},{"t":"Cosmos","s":"Planck, JWST, DESI, gravitational waves.","d":"Reach: cosmological parameters. Stop: any direct sign of other universes or of before the Big Bang.","f":"F0"},{"t":"Quantum computers","s":"Hundreds to a thousand noisy qubits; first error-corrected logical qubits.","d":"Reach: small quantum simulations, toy gauge theories, toy holography. Stop: fault-tolerant simulation of realistic systems, and anything outside our logic.","f":"F1"}]},{"t":"Will quantum computing settle it?","s":"No, and not because it is immature.","d":"A quantum computer is a physical system inside our layer obeying our layer’s laws. It moves questions from “testable soon” to “settled” inside the structure-and-information branch: which models of emergent spacetime and holographic codes match our universe. It cannot detect whether the layer was made, cannot measure experience, and cannot step outside our logic by running faster. Gödel applies to it as to any machine. Every computer already uses the universe’s physics; a quantum one uses superposition as a speed resource, which is not an ontological upgrade.","f":"gate","doc":"09-tests.md §4"},{"t":"Is any of this world-changing?","s":"Not yet.","d":"That would need a prediction no existing theory makes, testable soon, that moves an axis. There is none here. What there is: a valid partition that makes elimination well-posed, a fog front that survives your own objection, and a demonstration that origin constrains morality far less than intuition says. Useful. Not new to philosophy.","f":"gate"},{"t":"Rules for crossing anything off","s":"Twelve. The ones that matter most:","d":"Eliminate cells, not names. Elimination needs a partition proven exhaustive. Unexplained is not inexplicable. Every knowability claim carries a position. Only formal inconsistency eliminates; pressure lowers credence. Behavior tests never reach experience. Facts about a maker never reach facts about the ground. Value never descends without a stated bridge. Praise from an evaluator changes nothing.","f":"gate","doc":"10-elimination-rules.md"}]}]};
const W=(n)=>n.kids?n.kids.filter(k=>!k.walk):[];
function nodeAt(p){let n=TREE;for(const i of p)n=W(n)[i];return n;}
let path=[];
try{const s=JSON.parse(localStorage.getItem("gem-map")||"[]");let n=TREE,ok=true;for(const i of s){if(!W(n)[i]){ok=false;break;}n=W(n)[i];}if(ok)path=s;}catch(e){}
const below=n=>{ if(n.walk||n.goto) return 0; const k=W(n); return k.length ? k.reduce((a,c)=>a+1+below(c),0) : (n.who||[]).length; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const n=nodeAt(path), stage=document.getElementById("stage"), svg=document.getElementById("lines");
  stage.querySelectorAll(".node").forEach(e=>e.remove()); svg.innerHTML="";
  const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2+10;
  const kids=W(n); const items=kids.length?kids.map((k,i)=>({t:k.t,f:k.f,i,loop:!!k.goto,click:true})):(n.who||[]).map(t=>({t,click:false}));
  const N=items.length, rx=Math.min(w*0.40,340), ry=Math.min(h*0.38,300);
  const mk=(cls,html,x,y)=>{const d=document.createElement("button");d.className="node "+cls;d.innerHTML=html;d.style.left=x+"px";d.style.top=y+"px";stage.appendChild(d);return d;};
  mk("center",esc(n.t)+(n.f?`<span class="dot ${n.f}"></span>`:"")+(below(n)?`<span class="n">${below(n)} below</span>`:""),cx,cy);
  items.forEach((it,k)=>{
    const a=-Math.PI/2+(2*Math.PI*k)/N + (N===1?0:0), x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",cx);l.setAttribute("y1",cy);l.setAttribute("x2",x);l.setAttribute("y2",y);svg.appendChild(l);
    const cnt=it.click?below(kids[it.i]):0;
    const d=mk((it.click?"":"holder ")+(it.loop?"loop":""),esc(it.t)+(it.f&&!W(kids[it.i]).length?`<span class="dot ${it.f}"></span>`:"")+(cnt?`<span class="n">${cnt}</span>`:""),x,y);
    d.style.animationDelay=(k*30)+"ms";
    if(it.click) d.addEventListener("click",e=>{e.stopPropagation();enter(it.i);});
  });
  let cur=TREE;const crumbs=[{t:cur.t,p:[]}];path.forEach((i,k)=>{cur=W(cur)[i];crumbs.push({t:cur.t,p:path.slice(0,k+1)});});
  document.getElementById("path").innerHTML=crumbs.map((c,k)=>(k?"<i>›</i>":"")+`<span data-p="${c.p.join(",")}">${esc(c.t)}</span>`).join("");
  document.querySelectorAll("#path span").forEach(s=>s.addEventListener("click",e=>{e.stopPropagation();path=s.dataset.p?s.dataset.p.split(",").map(Number):[];go();}));
  document.title=path.length?n.t+" · Genesis Map":"Genesis Map";
}
let clickTimer=null;
function enter(i){ clearTimeout(clickTimer); clickTimer=setTimeout(()=>{const k=W(nodeAt(path))[i]; if(k.goto){path=k.goto.slice(); path=fixGoto(path);} else path.push(i); go();},220); }
function fixGoto(p){ // goto paths were authored against TREE.kids including the walk node at index 0; map hides it
  const q=p.slice(); if(q.length) q[0]=q[0]-1; return q; }
function back(){ clearTimeout(clickTimer); if(path.length){path.pop();go();} }
function go(){ try{localStorage.setItem("gem-map",JSON.stringify(path));}catch(e){} render(); }
addEventListener("contextmenu",e=>{e.preventDefault();back();});
addEventListener("dblclick",e=>{e.preventDefault();back();});
let lastTap=0; addEventListener("touchend",e=>{const t=Date.now(); if(t-lastTap<320){e.preventDefault();back();} lastTap=t;},{passive:false});
addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="Backspace"){e.preventDefault();back();}});
addEventListener("resize",render);
render();
</script>
