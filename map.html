rned inward.","who":["Graziano (2013)","Kelly, Webb and Graziano (2014)"],"f":"F1"},{"t":"Compatible with realism","s":"The theory can be read as saying awareness is real but not what the schema says, so it sits between illusionism and functionalism.","who":["Graziano (2020)","Graziano, Guterstam, Bio and Wilterson (2020)"],"f":"F2"}]},{"t":"Illusionism as a theory of consciousness","s":"Explain why states seem phenomenal instead of explaining phenomenality; that replaces the hard problem with the illusion problem.","who":["Frankish (2016, 2019)","Dennett (2016)"],"f":"F2","q":"Where does the illusion come from?","kids":[{"t":"Introspective misrepresentation","s":"Introspection represents complex functional states with simple, seemingly intrinsic properties because it lacks access to the machinery.","who":["Frankish (2016)","Pereboom (2011)","Rey (1995)"],"f":"F2"},{"t":"Theoretical introspection hypothesis","s":"We seem to have phenomenal states because we run an innate theory of how things affect us, and that theory posits felt qualities.","who":["Kammerer (2016, 2019, 2021)","Frankish (2019)"],"f":"F2"},{"t":"Phenomenal concept strategy, inverted","s":"The special concepts we use for experience explain the appearance of a gap without any gap in the world.","who":["Frankish (2012)","Balog (2012)","Papineau (2002)"],"f":"F2"}]},{"t":"Sentition and the magic show","s":"Sensations began as bodily expressive responses, then were internalised into a self-sustaining loop the brain reads as a rich inner theatre; the show evolved because it makes life feel worth living.","who":["Humphrey (1992, 2006, 2011, 2022)","Dennett (2011), endorsing"],"f":"F2","q":"Who else gets the show?","kids":[{"t":"Only warm-blooded animals","s":"Phenomenal consciousness is present only in mammals and birds, where it pays for itself in a longer, more invested life.","who":["Humphrey (2022)","Godfrey-Smith (2020), contra"],"f":"F2"}]},{"t":"Eliminative materialism","s":"Folk psychology is a false theory; beliefs, desires and qualia will go the way of phlogiston as neuroscience matures.","who":["Feyerabend (1963)","Rorty (1965)","P.M. Churchland (1981)","Stich (1983)","P.S. Churchland (1986)"],"f":"F2","q":"What replaces folk psychology?","kids":[{"t":"Disappearance theory","s":"Sensation talk will not be reduced but replaced by talk of brain states, as demon talk was replaced.","who":["Rorty (1965, 1970)","Feyerabend (1963)"],"f":"F2"},{"t":"Neurocomputational replacement","s":"Vector coding and prototype activation in neural networks replace sentences and propositional attitudes.","who":["P.M. Churchland (1989)","P.S. Churchland and Sejnowski (1992)"],"f":"F2"},{"t":"Quining qualia","s":"No property has all four marks of qualia (ineffable, intrinsic, private, directly apprehended); so there are no qualia.","who":["Dennett (1988)","Rey (1983)"],"f":"F2"}]},{"t":"Behaviourism","s":"Mental terms name patterns of behaviour and dispositions, not inner episodes; there is nothing private to explain.","who":["Watson (1913)","Skinner (1953, 1974)","Ryle (1949)","Hempel (1935)"],"f":"F2","q":"Which behaviourism?","kids":[{"t":"Logical behaviourism","s":"Mental statements translate into statements about behaviour and dispositions to behave.","who":["Hempel (1935)","Ryle (1949)","Carnap (1932)"],"f":"F2"},{"t":"Radical behaviourism","s":"Private events exist but are behaviour too, to be explained by the same laws of reinforcement.","who":["Skinner (1945, 1974)","Watson (1913)"],"f":"F2"},{"t":"Chomsky's review","s":"Reinforcement language cannot describe verbal behaviour without covertly reintroducing the mind; behaviourism fails on its own terms.","who":["Chomsky (1959)","Putnam (1963)","Fodor (1968)"],"f":"F0"}]}]},{"t":"Weak illusionism","s":"Some features experience seems to have (being intrinsic, ineffable, non-physical) are illusory, but there is still something it is like.","who":["Chalmers (2018)","Pereboom (2011)","Schwitzgebel (2016)"],"f":"F2","q":"What exactly is misrepresented?","kids":[{"t":"Qualitative inaccuracy hypothesis","s":"Introspection represents phenomenal states as having qualitative natures they lack; the states are real and physical.","who":["Pereboom (2011, 2016)","Frankish (2016), sympathetic"],"f":"F2"},{"t":"Introspective unreliability","s":"We are poor judges even of our own current experience, so introspection cannot anchor a theory of consciousness.","who":["Schwitzgebel (2008, 2011)","Nisbett and Wilson (1977)","Irvine (2013)"],"f":"F1"}]},{"t":"The meta-problem programme","s":"Explain why we think there is a hard problem; if the explanation needs no phenomenality, illusionism follows, and if it does, realism stands.","who":["Chalmers (2018)","Frankish (2019)","Kammerer (2019)","Graziano (2019)"],"f":"F2","q":"What follows from the explanation?","kids":[{"t":"Debunking argument","s":"If our belief in consciousness is fully explained by processes that would run whether or not consciousness existed, the belief is unjustified.","who":["Chalmers (2018)","Kammerer (2018)"],"f":"F2"},{"t":"Realist reply from acquaintance","s":"We know experience by being directly acquainted with it, so no debunking story can undercut the belief.","who":["Chalmers (2018)","Balog (2012)","Goff (2017)","G. Strawson (2018)"],"f":"F2"},{"t":"Illusionism is obviously false","s":"Denying experience is the strangest claim ever made; the datum outranks any theory that removes it.","who":["G. Strawson (2018)","Searle (1997)","Goff (2019)","Nida-Rümelin (2016)"],"f":"F2"}]}],"q":"Which kind of illusion?"},{"t":"Yes","s":"There is something it is like to be you.","q":"Is it built or basic?","kids":[{"t":"Built from function","s":"The pattern matters; the neuron is one implementation.","who":["Global Workspace","Higher-order thought","Predictive processing"],"addr":"C2-f","f":"F0","d":"Your Turn 6: we are the information the neuron holds.","kids":[{"t":"Global workspace family","s":"A state is conscious when its content is broadcast widely so many specialised processes can use it at once.","who":["Baars (1988)","Dehaene and Changeux (1998)","Mashour, Roelfsema, Changeux and Dehaene (2020)"],"f":"F1","q":"What does the broadcasting?","kids":[{"t":"Global Workspace Theory","s":"A theatre with a bright spot: unconscious specialists compete for a limited-capacity stage and the winner is broadcast to the whole audience.","who":["Baars (1988, 1997)","Baars, Franklin and Ramsøy (2013)"],"f":"F1","q":"How is the stage implemented?","kids":[{"t":"LIDA cognitive architecture","s":"A software agent built on the theatre model, cycling through perception, broadcast and action selection every few hundred milliseconds.","who":["Franklin and Patterson (2006)","Franklin, Madl, D'Mello and Snaider (2014)"],"f":"F1"},{"t":"Conscious Turing Machine","s":"A formal machine with a tiny short-term memory that all long-term processors read; consciousness is what is on that tape.","who":["Blum and Blum (2022)","Blum and Blum (2023)"],"f":"F2"}]},{"t":"Global Neuronal Workspace","s":"Long-range pyramidal neurons in prefrontal and parietal cortex ignite into a sustained, all-or-none state that makes content reportable.","who":["Dehaene and Changeux (1998, 2011)","Dehaene and Naccache (2001)","Dehaene (2014)"],"f":"F1","q":"What are its signatures?","kids":[{"t":"Ignition","s":"Around 300 ms after a stimulus, activity either dies out or explodes into a self-sustaining fronto-parietal state; there is nothing in between.","who":["Dehaene, Sergent and Changeux (2003)","Sergent, Baillet and Dehaene (2005)","Del Cul, Baillet and Dehaene (2007)"],"f":"F1","q":"Does the P3b really mark consciousness?","kids":[{"t":"P3b and late signatures","s":"Late, sustained, frontal signals are the marker of conscious access.","who":["Dehaene (2014)","Salti et al. (2015)"],"f":"F1"},{"t":"No-report paradigm challenge","s":"When subjects need not report, the late frontal signals shrink or vanish, so they track report, not experience.","who":["Tsuchiya, Wilke, Frässle and Lamme (2015)","Pitts, Metzler and Hillyard (2014)","Koch, Massimini, Boly and Tononi (2016)"],"f":"F1"},{"t":"Cogitate adversarial test","s":"A pre-registered contest between GNW and IIT found sustained posterior content but weaker prefrontal ignition than GNW predicted, and less late synchrony than IIT predicted.","who":["Melloni, Mudrik, Pitts and Koch (2021)","Cogitate Consortium (2023, 2025)"],"f":"F0","q":"How did each side read it?","kids":[{"t":"Workspace reading","s":"Prefrontal decoding of content was present though weak, and ignition timing matched; the theory needs revision, not rejection.","who":["Dehaene (2025)","Mashour et al. (2020)","Cogitate Consortium (2025)"],"f":"F1"},{"t":"Integrated information reading","s":"Posterior sustained content was found as predicted, but the predicted sustained synchrony was not; the measures may have been too coarse.","who":["Koch (2025)","Tononi (2025)","Cogitate Consortium (2025)"],"f":"F1"},{"t":"Adversarial collaboration as method","s":"Pre-registered contests between theories, with both sides agreeing on what would count, are the way to make the field settle anything.","who":["Melloni et al. (2021)","Mellor (2019), Templeton programme","Yaron, Melloni, Pitts and Mudrik (2022)"],"f":"F1"}]}]},{"t":"Two dimensions: C1 and C2","s":"Consciousness splits into global availability of information (C1) and self-monitoring of one's own processing (C2); machines could have either.","who":["Dehaene, Lau and Kouider (2017)","Kouider and Dehaene (2007)"],"f":"F2"},{"t":"Neuronal recycling and the brain reader","s":"The workspace is what lets a literate brain recycle visual circuits for reading; a test case of broadcast rewiring.","who":["Dehaene and Cohen (2007)","Dehaene (2009)"],"f":"F0"}]},{"t":"Attended intermediate-level representations","s":"Consciousness is intermediate-level perceptual content that has been modulated by attention so that it can reach working memory.","who":["Prinz (2012)","Jackendoff (1987), intermediate-level hypothesis"],"f":"F1"},{"t":"Deep learning global workspace","s":"A shared latent space that many pretrained modules translate into and out of realises broadcasting in artificial systems.","who":["VanRullen and Kanai (2021)","Goyal and Bengio (2022), consciousness prior","Shanahan (2006, 2010)"],"f":"F1"},{"t":"Frontal versus posterior debate","s":"Whether prefrontal cortex is part of the experience or only of the report divides the workspace camp from posterior hot-zone theories.","who":["Odegaard, Knight and Lau (2017)","Boly et al. (2017)","Michel and Morales (2020)","Raccah, Block and Fox (2021)"],"f":"F1"}]},{"t":"Higher-order theories","s":"A mental state is conscious when the system represents itself as being in that state.","who":["Rosenthal (1986, 2005)","Lycan (1996)","Brown, Lau and LeDoux (2019)"],"f":"F2","q":"What represents what?","kids":[{"t":"Higher-order thought","s":"A state is conscious when accompanied by a thought, arrived at without inference, that one is in that state.","who":["Rosenthal (1986, 2005)","Gennaro (1996)"],"f":"F2","q":"Actual or potential thought?","kids":[{"t":"Actualist HOT","s":"The higher-order thought must actually occur.","who":["Rosenthal (2005)","Gennaro (2012)"],"f":"F2"},{"t":"Dispositionalist HOT","s":"It is enough that the state be available to higher-order thought; its content acquires a dual first- and higher-order aspect.","who":["Carruthers (2000, 2005)","Dennett (1978)"],"f":"F2"},{"t":"Wide intrinsicality view","s":"The higher-order thought is part of the same complex state it is about, so there is no separate second state.","who":["Gennaro (1996, 2012)","Van Gulick (2004)"],"f":"F2"},{"t":"Misrepresentation objection","s":"If the higher-order thought misdescribes or targets no state, what is conscious? Either answer breaks the theory.","who":["Block (2011)","Neander (1998)","Rosenthal (2011), reply"],"f":"F2"}]},{"t":"Higher-order perception","s":"An inner sense scans first-order states as the eyes scan the world; consciousness is being monitored by that scanner.","who":["Armstrong (1968, 1981)","Lycan (1996, 2004)","Locke (1690), reflection"],"f":"F2"},{"t":"HOROR","s":"The higher-order representation is itself the conscious state; a first-order state without one is not conscious even if it drives behaviour.","who":["Brown (2015)","Brown, Lau and LeDoux (2019)","Lau and Rosenthal (2011)"],"f":"F2"},{"t":"Perceptual reality monitoring","s":"A higher-order mechanism judges which first-order signals are reliable reflections of the world, as a discriminator judges a generator; states passed as real are conscious.","who":["Lau (2019, 2022)","Michel and Lau (2021)","Gershman (2019)"],"f":"F1","q":"What is the evidence?","kids":[{"t":"Blindsight and metacognition","s":"Patients discriminate well but report nothing, showing first-order sensitivity and higher-order judgement come apart.","who":["Weiskrantz (1986)","Lau and Passingham (2006)","Ko and Lau (2012)"],"f":"F0"},{"t":"Prefrontal lesion and TMS studies","s":"Disrupting dorsolateral prefrontal cortex lowers visual awareness or confidence while leaving discrimination intact.","who":["Rounis et al. (2010)","Fleming et al. (2014)","Del Cul et al. (2009)"],"f":"F1"}]},{"t":"Higher-order state space","s":"Awareness is a higher-order judgement about how present or absent a content is, drawn from a generative model of one's own perceptual states.","who":["Fleming (2020)","Fleming and Daw (2017)"],"f":"F1"},{"t":"Radical plasticity thesis","s":"The brain learns to redescribe its own activity to itself; consciousness is what that learned self-model feels like from inside.","who":["Cleeremans (2011)","Cleeremans et al. (2020)","Pasquali, Timmermans and Cleeremans (2010)"],"f":"F1"},{"t":"Self-representationalism","s":"A conscious state represents itself, so the awareness and the state are one and the same.","who":["Kriegel (2009)","Williford (2006)","Brentano (1874)","Sartre (1943), pre-reflective"],"f":"F2"},{"t":"Higher-order theory of emotional consciousness","s":"Emotions are conscious higher-order representations built in cortex from survival circuits, self-schema and memory; fear is not in the amygdala.","who":["LeDoux (2019)","LeDoux and Brown (2017)"],"f":"F1"}]},{"t":"Recurrent processing theory","s":"Local feedback loops within sensory cortex are enough for experience; the feedforward sweep is unconscious and prefrontal access adds only report.","who":["Lamme (2006, 2010)","Lamme and Roelfsema (2000)","Block (2007)"],"f":"F1","q":"Does experience overflow report?","kids":[{"t":"Phenomenal overflow","s":"We see more than we can report; partial-report tasks show rich experience narrowed by working memory.","who":["Block (2007, 2011)","Sperling (1960)","Landman, Spekreijse and Lamme (2003)","Lamme (2010)"],"f":"F1"},{"t":"No overflow","s":"The impression of richness is itself a sparse representation; consciousness cannot be separated from access.","who":["Cohen and Dennett (2011)","Kouider, de Gardelle, Sackur and Dupoux (2010)","Phillips (2011, 2018)","Ward, Bear and Scholl (2016)"],"f":"F1"},{"t":"Local recurrence as sufficient","s":"Figure-ground signals in V1 that survive masking track experience even without attention.","who":["Lamme (2004)","Super, Spekreijse and Lamme (2001)","Fahrenfort, Scholte and Lamme (2007)"],"f":"F1"}]},{"t":"Predictive processing family","s":"The brain is a prediction machine; experience is the best current guess about the causes of sensory signals, shaped by how much each error can be trusted.","who":["Friston (2005, 2010)","Clark (2013, 2016)","Hohwy (2013)","Seth (2021)"],"f":"F1","q":"What is being minimised?","kids":[{"t":"Free energy principle","s":"Any self-organising system that persists must act so as to minimise a bound on surprise; perception, action and learning all follow from this.","who":["Friston (2006, 2010)","Friston, Kilner and Harrison (2006)","Parr, Pezzulo and Friston (2022)"],"f":"F2","q":"How is it grounded?","kids":[{"t":"Active inference","s":"Actions are chosen to make sensory predictions come true, so behaviour is inference too.","who":["Friston et al. (2017)","Pezzulo, Rigoli and Friston (2015)"],"f":"F1"},{"t":"Markov blankets and life","s":"Anything with a statistical boundary that persists does approximate Bayesian inference; the principle covers all life.","who":["Friston (2013)","Kirchhoff et al. (2018)","Ramstead, Badcock and Friston (2018)"],"f":"F2"},{"t":"Unfalsifiable or not","s":"Critics say the principle is a mathematical tautology that fits any system; defenders say it is a modelling stance, not a hypothesis.","who":["Andrews (2021)","Colombo and Wright (2021)","Bruineberg et al. (2022)","Friston (2019), reply"],"f":"F2"}]},{"t":"Predictive processing","s":"Hierarchical generative models pass predictions down and errors up; attention is precision weighting; perception is controlled hallucination.","who":["Rao and Ballard (1999)","Clark (2013, 2016)","Hohwy (2013)"],"f":"F1","q":"Where does experience sit?","kids":[{"t":"Hohwy's mind-brain seclusion","s":"The mind is sealed behind its evidentiary boundary and knows the world only by inference.","who":["Hohwy (2013, 2016)","Helmholtz (1867), unconscious inference"],"f":"F2"},{"t":"Clark's extended predictive mind","s":"Prediction runs through body and world, so the mind is not sealed but distributed across its loops.","who":["Clark (2016, 2017)","Kirchhoff and Kiverstein (2019)"],"f":"F2"},{"t":"Dark room problem","s":"If the goal is to reduce surprise, why not sit in a dark room? Replies appeal to priors that expect exploration.","who":["Friston, Thornton and Clark (2012)","Sun and Firestone (2020)","Van de Cruys et al. (2020)"],"f":"F2"}]},{"t":"Beast machine","s":"Selfhood begins as the brain predicting and controlling the body's internal state; all experience is coloured by that drive to stay alive.","who":["Seth (2013, 2021)","Seth and Tsakiris (2018)","Damasio (1999), forerunner"],"f":"F1","q":"Which question replaces the hard one?","kids":[{"t":"Real problem","s":"Explain, predict and control the properties of experience; the hard problem may dissolve as the vital force did.","who":["Seth (2016, 2021)","Seth and Bayne (2022)"],"f":"F1"},{"t":"Interoceptive inference","s":"Emotion and mood are predictions about bodily states; anxiety and depersonalisation are precision failures in that channel.","who":["Seth, Suzuki and Critchley (2012)","Barrett and Simmons (2015)","Paulus and Stein (2010)"],"f":"F1"}]},{"t":"Phenomenal self-model","s":"The self is a transparent model the brain runs; because we cannot see the model as a model, we take ourselves to be it. No one has or is a self.","who":["Metzinger (2003, 2009)","Blanke and Metzinger (2009)"],"f":"F2","q":"What does out-of-body evidence show?","kids":[{"t":"Full-body illusion","s":"Synchronous stroking of a virtual body shifts self-location, so the sense of being here is a construction.","who":["Lenggenhager et al. (2007)","Ehrsson (2007)","Blanke (2012)"],"f":"F0"},{"t":"Minimal phenomenal selfhood","s":"Self-identification, self-location and first-person perspective are separable components with separable neural bases.","who":["Blanke and Metzinger (2009)","Limanowski and Blankenburg (2013)"],"f":"F1"}]},{"t":"Projective consciousness model","s":"Experience has the geometry of a three-dimensional projective field centred on a viewpoint; the field is built by active inference under that geometry.","who":["Rudrauf, Williford et al. (2017)","Williford et al. (2018)"],"f":"F2"},{"t":"Integrated world modelling theory","s":"Consciousness arises where predictive processing, workspace broadcasting and integration meet in a spatial-temporal-causal world model.","who":["Safron (2020, 2022)","Friston et al. (2020)"],"f":"F2"}]},{"t":"Representationalism","s":"What an experience is like is fixed by what it represents; qualia are just represented properties of the world or body.","who":["Tye (1995, 2000)","Dretske (1995)","Harman (1990)","Lycan (1996)"],"f":"F2","q":"Which representations count?","kids":[{"t":"PANIC theory","s":"Phenomenal character is poised, abstract, nonconceptual intentional content ready to affect belief and desire.","who":["Tye (1995, 2000, 2009)","Byrne (2001)"],"f":"F2"},{"t":"Representational naturalism","s":"Experiences are natural indicators with a systemic function to represent; what they are like is what they indicate.","who":["Dretske (1995)","Millikan (1984), teleosemantics","Neander (2017)"],"f":"F2"},{"t":"Phenomenal intentionality","s":"The order is reversed: representation itself is grounded in what experience is like, not the other way.","who":["Horgan and Tienson (2002)","Kriegel (2013)","Mendelovici (2018)","Loar (2003)"],"f":"F2"},{"t":"Inverted-spectrum and Swampman objections","s":"Behaviourally identical people with inverted experiences, or a creature with no history, break the tie between content and feel.","who":["Block (1990)","Shoemaker (1982)","Davidson (1987), Swampman"],"f":"F2"},{"t":"Transparency of experience","s":"When we introspect we see through the experience to the world; that is why nothing is left but content.","who":["Harman (1990)","Moore (1903)","Tye (2002)","Kind (2003), contra"],"f":"F2"}]},{"t":"Functionalism proper","s":"Mental states are defined by their causal roles among inputs, outputs and other states; anything playing the role has the state.","who":["Putnam (1960, 1967)","Lewis (1966, 1972)","Armstrong (1968)","Fodor (1968)"],"f":"F2","q":"Which roles, fixed how?","kids":[{"t":"Machine functionalism","s":"Mental states are states of a probabilistic automaton; the mind is the software.","who":["Putnam (1960, 1967)","Putnam (1988), later rejection"],"f":"F2"},{"t":"Analytic functionalism","s":"Roles are fixed by common-sense platitudes about the mind, written out as a single Ramsey sentence.","who":["Lewis (1966, 1972)","Armstrong (1968)","Jackson, Pargetter and Prior (1982)"],"f":"F2"},{"t":"Psychofunctionalism","s":"Roles are fixed by empirical psychology, not common sense, so the analysis waits on science.","who":["Fodor (1968)","Block and Fodor (1972)","Block (1978)"],"f":"F2"},{"t":"Teleofunctionalism","s":"Roles are the biological functions a state was selected for.","who":["Lycan (1987)","Millikan (1989)","Sober (1985)"],"f":"F2"},{"t":"Homuncular functionalism","s":"Explain a mind by decomposing it into dumber and dumber sub-agents until each can be built from switches.","who":["Lycan (1981)","Dennett (1978)","Attneave (1961)"],"f":"F2"},{"t":"Computational theory of mind","s":"Thinking is computation over symbolic mental representations with a language-like syntax.","who":["Fodor (1975, 1987)","Pylyshyn (1984)","Marr (1982), three levels","Newell and Simon (1976)"],"f":"F2","q":"Symbols or networks?","kids":[{"t":"Classical symbol systems","s":"Thought needs a combinatorial syntax and semantics; networks that lack it cannot explain systematicity.","who":["Fodor and Pylyshyn (1988)","Newell (1980)"],"f":"F2"},{"t":"Connectionism","s":"Cognition is spreading activation in networks of simple units; rules are emergent, not stored.","who":["Rumelhart and McClelland (1986)","Smolensky (1988)","Hinton (1986)","Elman (1990)"],"f":"F1"},{"t":"Dynamical systems","s":"Cognition is continuous change in a coupled brain-body-world system, better described by differential equations than by computation.","who":["van Gelder (1995)","Thelen and Smith (1994)","Port and van Gelder (1995)","Kelso (1995)"],"f":"F2"},{"t":"Mechanistic computation","s":"A physical system computes when it has a mechanism whose function is to manipulate vehicles by rules; this fixes which systems compute.","who":["Piccinini (2015)","Miłkowski (2013)","Chalmers (2011, 1996), combinatorial state automata"],"f":"F2"}]},{"t":"Standard objections","s":"Absent qualia, inverted qualia, a nation of people wired as a brain, and a room that passes Turing's test without understanding.","who":["Block (1978), China brain","Searle (1980), Chinese room","Shoemaker (1975)","Chalmers (1996), fading and dancing qualia as reply"],"f":"F2"}]},{"t":"Embodied and enactive theories","s":"Experience is something an organism does with its body in its world, not something produced inside a skull.","who":["Varela, Thompson and Rosch (1991)","Noë (2004)","Clark and Chalmers (1998)","Gibson (1979)"],"f":"F2","q":"Where does the mind stop?","kids":[{"t":"Autopoietic enactivism","s":"A living system that produces itself brings forth its own meaningful world; mind and life are continuous.","who":["Varela, Thompson and Rosch (1991)","Thompson (2007)","Di Paolo (2005)","Maturana and Varela (1980)"],"f":"F2"},{"t":"Sensorimotor enactivism","s":"Seeing is knowing how sensory input changes with movement; qualities are patterns of sensorimotor dependence.","who":["O'Regan and Noë (2001)","Noë (2004)","Hurley (1998)"],"f":"F1"},{"t":"Radical enactivism","s":"Basic minds have no content at all; representation enters only with public language.","who":["Hutto and Myin (2013, 2017)","Chemero (2009)"],"f":"F2"},{"t":"Extended mind","s":"Notebooks and tools that are reliably coupled to the brain are parts of the mind, not aids to it.","who":["Clark and Chalmers (1998)","Menary (2007)","Clark (2008)"],"f":"F2","q":"Does coupling make constitution?","kids":[{"t":"Coupling-constitution fallacy","s":"Being causally linked to a process is not being part of it; the mind stays in the head.","who":["Adams and Aizawa (2001, 2008)","Rupert (2004, 2009)"],"f":"F2"},{"t":"Cognitive integration","s":"Mind is a hybrid of bodily and external manipulations that are integrated into one practice.","who":["Menary (2007, 2010)","Sutton (2010), second wave","Kirchhoff (2012)"],"f":"F2"}]},{"t":"Embodied cognition","s":"Concepts are grounded in sensorimotor simulations and bodily metaphors, not amodal symbols.","who":["Lakoff and Johnson (1980, 1999)","Barsalou (1999, 2008)","Gallagher (2005)","Shapiro (2011)"],"f":"F1"},{"t":"Ecological psychology","s":"Organisms directly pick up affordances from structured light and sound; no inner representation is needed.","who":["Gibson (1966, 1979)","Turvey and Shaw (1979)","Chemero (2009)"],"f":"F2"},{"t":"Neurophenomenology","s":"Disciplined first-person reports and neural data constrain each other; experience is data, not noise.","who":["Varela (1996)","Lutz and Thompson (2003)","Petitmengin (2006)"],"f":"F1"}]},{"t":"Affective and brainstem-first theories","s":"Feeling comes before thinking; the oldest layer of consciousness is bodily affect generated in the brainstem and midbrain.","who":["Panksepp (1998)","Damasio (1999, 2010)","Merker (2007)","Solms (2021)"],"f":"F1","q":"Which layer is first?","kids":[{"t":"Somatic marker and core self","s":"Feelings are the brain's maps of body states; the proto-self, core self and autobiographical self stack on that base.","who":["Damasio (1994, 1999, 2010)","Damasio and Carvalho (2013)"],"f":"F1"},{"t":"Affective neuroscience","s":"Seven primary emotion systems in the mammalian midbrain and basal forebrain generate raw feeling without cortex.","who":["Panksepp (1998, 2005)","Panksepp and Biven (2012)"],"f":"F1"},{"t":"Midbrain consciousness","s":"The upper brainstem alone can support a simple conscious agent; hydranencephalic children behave as if aware.","who":["Merker (2007)","Shewmon, Holmes and Byrne (1999)","Penfield and Jasper (1954)"],"f":"F1"},{"t":"The hidden spring","s":"Consciousness is felt uncertainty in the brainstem's homeostatic control, read through free energy; cortex only adds content.","who":["Solms (2019, 2021)","Solms and Friston (2018)"],"f":"F1"},{"t":"Dynamic core and neural Darwinism","s":"Consciousness is a rapidly changing cluster of reentrant thalamocortical interactions that is at once integrated and highly differentiated.","who":["Edelman (1989, 2003)","Tononi and Edelman (1998)","Edelman and Tononi (2000)"],"f":"F1"}]},{"t":"Neural correlate programme","s":"Find the minimal neural events jointly sufficient for a given experience; theory can wait until the correlates are in hand.","who":["Crick and Koch (1990, 2003)","Chalmers (2000), defining NCC","Koch (2004)"],"f":"F1","q":"What do correlates show?","kids":[{"t":"Content-specific NCCs","s":"Different contents map to different posterior areas: faces to fusiform, motion to MT.","who":["Koch, Massimini, Boly and Tononi (2016)","Rees, Kreiman and Koch (2002)","Tong, Nakayama, Vaughan and Kanwisher (1998)"],"f":"F0"},{"t":"Full NCC and background conditions","s":"Distinguish the correlates of being conscious at all (arousal, thalamus, brainstem) from correlates of particular contents.","who":["Chalmers (2000)","Hohwy (2009)","Bayne and Hohwy (2013)"],"f":"F1"},{"t":"Claustrum hypothesis","s":"The claustrum, connected to almost all cortex, is the conductor binding contents into one experience.","who":["Crick and Koch (2005)","Koubeissi et al. (2014)","Smythies, Edelstein and Ramachandran (2012)"],"f":"F1"},{"t":"Correlates are not constituents","s":"A correlate could be a cause, an effect, or a prerequisite; the NCC method cannot tell them apart without theory.","who":["Klein, Hohwy and Bayne (2020)","Neisser (2012)","Michel (2019)","Noë and Thompson (2004)"],"f":"F2"}]}],"q":"Which function?"},{"t":"Built from specific structure","s":"The right causal organization, not computation as such.","who":["IIT","Searle"],"addr":"C2-b","f":"F0","kids":[{"t":"Integrated Information Theory","s":"Consciousness is integrated information: a system is conscious to the degree its whole constrains its own past and future more than its parts do, and experience is the shape of that constraint.","who":["Tononi (2004, 2008)","Oizumi, Albantakis and Tononi (2014)","Koch (2019)","Albantakis et al. (2023)"],"f":"F1","q":"Which version?","kids":[{"t":"IIT 1.0","s":"Phi is the effective information across the weakest bipartition of a complex; consciousness needs both integration and differentiation.","who":["Tononi (2004)","Tononi and Sporns (2003)"],"f":"F2"},{"t":"IIT 2.0","s":"Qualia are shapes in a space whose axes are the system's informational relationships; experience is a geometric object.","who":["Balduzzi and Tononi (2008, 2009)","Tononi (2008)"],"f":"F2"},{"t":"IIT 3.0","s":"Five axioms (intrinsic existence, composition, information, integration, exclusion) become postulates about cause-effect structures; only the maximum is conscious.","who":["Oizumi, Albantakis and Tononi (2014)","Tononi and Koch (2015)","Tononi, Boly, Massimini and Koch (2016)"],"f":"F2","q":"What follows from exclusion?","kids":[{"t":"Exclusion postulate","s":"Only the system with maximal phi exists as a subject; smaller and larger overlapping systems do not, so brains have one experience at one grain.","who":["Oizumi, Albantakis and Tononi (2014)","Tononi (2012)"],"f":"F2"},{"t":"Simple systems are conscious","s":"A photodiode-like grid of two elements has a tiny but non-zero phi, so the theory leans toward panpsychism.","who":["Tononi and Koch (2015)","Koch (2019)","Tononi (2008)"],"f":"F2"},{"t":"Feedforward systems are not","s":"Any purely feedforward network, however smart, has zero phi; digital computers are unconscious by construction.","who":["Oizumi, Albantakis and Tononi (2014)","Koch (2019)","Tononi and Koch (2015)"],"f":"F2"}]},{"t":"IIT 4.0","s":"Intrinsic information is defined afresh; experience is the unfolded phi-structure of distinctions and relations, and quality is fully determined by it.","who":["Albantakis et al. (2023)","Tononi et al. (2022)","Haun and Tononi (2019), spatial experience"],"f":"F2"},{"t":"Perturbational complexity index","s":"Zap the cortex with TMS and measure how complex the echo is; complexity tracks consciousness across sleep, anaesthesia and brain injury.","who":["Casali et al. (2013)","Casarotto et al. (2016)","Massimini et al. (2005)"],"f":"F0"},{"t":"Posterior hot zone","s":"The physical substrate of experience is a temporo-parieto-occipital region, not prefrontal cortex.","who":["Koch, Massimini, Boly and Tononi (2016)","Siclari et al. (2017), dreaming","Boly et al. (2017)"],"f":"F1"},{"t":"Unfolding argument","s":"Any recurrent network can be replaced by a feedforward one with identical input-output; if phi differs while behaviour is identical, IIT is untestable or false.","who":["Doerig, Schurger, Hess and Herzog (2019)","Herzog, Esfeld and Gerstner (2007)","Tsuchiya, Andrillon and Haun (2020), reply"],"f":"F2"},{"t":"Expander graph objection","s":"Simple error-correcting circuits would have enormous phi; the theory calls a grid of logic gates far more conscious than a person.","who":["Aaronson (2014)","Tononi (2014), reply, accepting the consequence","Cerullo (2015)"],"f":"F2"},{"t":"Pseudoscience letter","s":"Over a hundred researchers said IIT's panpsychist implications and untestability make it pseudoscience; others called the letter unfair.","who":["Fleming et al. (2023)","Lenharo (2023)","Seth (2023), dissent","Koch (2023), reply"],"f":"F2"},{"t":"Integrated information decomposition","s":"Partial-information decomposition gives multiple measures of integration that can be computed on real data without IIT's full apparatus.","who":["Mediano et al. (2019, 2021)","Barrett and Seth (2011)","Barrett and Mediano (2019)","Luppi et al. (2022)"],"f":"F1"}]},{"t":"Biological naturalism","s":"Consciousness is a higher-level biological feature of brains, caused by lower-level neuronal processes, as digestion is caused by stomach processes; syntax is never sufficient for semantics.","who":["Searle (1980, 1992, 2004)","Searle (1997)","Feinberg and Mallatt (2018), allied"],"f":"F2","q":"Why not computation?","kids":[{"t":"Chinese room","s":"A man following rules to manipulate Chinese symbols understands nothing, so running a program is not understanding.","who":["Searle (1980)","Searle (1990)"],"f":"F2","q":"Which reply?","kids":[{"t":"Systems reply","s":"The man is only part of the system; the whole room understands.","who":["Searle (1980), stating and rejecting","Copeland (1993)","Chalmers (1996)"],"f":"F2"},{"t":"Robot reply","s":"Give the program a body and sensors and the symbols acquire meaning through causal contact with the world.","who":["Harnad (1989, 1990), symbol grounding","Fodor (1980)"],"f":"F2"},{"t":"Brain simulator reply","s":"Simulate the neurons themselves and the room does what the brain does.","who":["Pylyshyn (1980)","Churchland and Churchland (1990), luminous room"],"f":"F2"},{"t":"Speed and complexity reply","s":"The thought experiment works only because we imagine it slow and small; at brain speed the intuition vanishes.","who":["Dennett (1991)","Hofstadter and Dennett (1981)","Block (1980)"],"f":"F2"}]},{"t":"Observer-relativity of computation","s":"Whether a system computes is fixed by an observer's interpretation, so computation cannot be intrinsic to a mind.","who":["Searle (1992)","Putnam (1988), triviality theorem","Chalmers (1996), reply"],"f":"F2"},{"t":"Causal powers of the brain","s":"Only systems with the brain's specific causal powers, whatever they turn out to be, can be conscious; silicon might or might not have them.","who":["Searle (1992, 2004)","Block (2009)"],"f":"F3"}]},{"t":"Biological theories of consciousness","s":"Consciousness is a biological phenomenon tied to the kind of thing living nervous systems do, and functional equivalence in another medium would not carry it.","who":["Block (2009, 2023)","Godfrey-Smith (2016, 2020)","Feinberg and Mallatt (2016)","Seth (2021)"],"f":"F2","q":"Which biology?","kids":[{"t":"Block's biological view","s":"Neuroscience, not functional analysis, will settle what consciousness is; the functional theories are too liberal.","who":["Block (2009)","Block (2023)"],"f":"F2"},{"t":"Fine-grained functionalism","s":"Function matters, but at a grain so fine it includes metabolism and cell signalling, which silicon does not share.","who":["Godfrey-Smith (2016)","Godfrey-Smith (2020)","Cao (2022)"],"f":"F2"},{"t":"Neurobiological naturalism","s":"Sensory consciousness appeared in Cambrian vertebrates about 520 million years ago with isomorphic maps and hierarchical processing.","who":["Feinberg and Mallatt (2016, 2018)","Feinberg and Mallatt (2020)"],"f":"F1"},{"t":"Unlimited associative learning","s":"The transition marker for consciousness is a capacity for open-ended learning about compound stimuli and their value.","who":["Ginsburg and Jablonka (2019)","Birch, Ginsburg and Jablonka (2020)"],"f":"F1"},{"t":"Gradualist animal consciousness","s":"Consciousness came in degrees and more than once; octopuses and arthropods are separate experiments in subjectivity.","who":["Godfrey-Smith (2016, 2020)","Birch (2024)","Tye (2017)","Barron and Klein (2016), insects"],"f":"F1"}]},{"t":"Cellular and dendritic theories","s":"The relevant structure is inside single cortical neurons: how apical and basal dendrites couple decides whether cortex is conscious.","who":["Aru, Suzuki and Larkum (2020)","Larkum (2013)","Suzuki and Larkum (2020)"],"f":"F1","q":"What decouples?","kids":[{"t":"Dendritic integration theory","s":"Layer 5 pyramidal neurons couple feedforward input at the cell body with feedback at the apical tuft; anaesthetics break that coupling.","who":["Aru, Suzuki and Larkum (2020)","Suzuki and Larkum (2020)","Bachmann, Suzuki and Aru (2020)"],"f":"F1"},{"t":"Apical amplification","s":"Context signals reaching apical dendrites amplify relevant feedforward signals; consciousness is amplified processing.","who":["Phillips (2017)","Phillips, Bachmann and Storm (2018)","Larkum, Senn and Lüscher (2004)"],"f":"F1"},{"t":"Thalamic gating of dendrites","s":"Higher-order thalamic nuclei switch the dendritic coupling on and off, giving the thalamus control of conscious state.","who":["Aru, Suzuki, Rutiku, Larkum and Bachmann (2019)","Suzuki, Pinto and Larkum (2023)"],"f":"F1"}]},{"t":"Thalamocortical theories","s":"Consciousness is a rhythm of thalamus and cortex talking to each other; break the loop and consciousness goes.","who":["Llinás and Paré (1991)","Llinás (2001)","Ward (2011)","Redinbaugh et al. (2020)"],"f":"F1","q":"Which loop?","kids":[{"t":"Forty-hertz resonance","s":"Gamma-band coherence between specific and non-specific thalamic loops binds contents into one moment of experience.","who":["Llinás, Ribary, Contreras and Pedroarena (1998)","Llinás (2001)","Singer (1999), binding by synchrony"],"f":"F1"},{"t":"Thalamic dynamic core","s":"The thalamus, not cortex, is where the integrated core resides; cortex supplies content.","who":["Ward (2011)","Ward (2013)"],"f":"F2"},{"t":"Central thalamus stimulation","s":"Stimulating central lateral thalamus at 50 Hz wakes anaesthetised macaques, and deep brain stimulation improves minimally conscious patients.","who":["Redinbaugh et al. (2020)","Schiff et al. (2007)","Bastos et al. (2021)"],"f":"F0"},{"t":"Corticothalamic unbinding by anaesthesia","s":"Anaesthetics work by disrupting thalamocortical connectivity rather than by shutting off cortex.","who":["Alkire, Hudetz and Tononi (2008)","Mashour and Alkire (2013)","Mashour (2024)"],"f":"F1"}]},{"t":"Temporo-spatial theory","s":"Consciousness is a matter of how the brain's spontaneous activity is nested across time scales and aligned with the world; content is added to that background dynamic.","who":["Northoff and Huang (2017)","Northoff (2018)","Northoff and Zilio (2022)"],"f":"F1","q":"Which temporo-spatial feature?","kids":[{"t":"Nestedness and scale-free activity","s":"Slow fluctuations contain faster ones in a power-law hierarchy; loss of nestedness tracks loss of consciousness.","who":["Northoff and Huang (2017)","He (2014)","Zilio et al. (2021)"],"f":"F1"},{"t":"Alignment and expansion","s":"Stimuli become conscious when spontaneous activity aligns to their timing and expands their effects across the cortex.","who":["Northoff and Huang (2017)","Northoff, Wainio-Theberge and Evers (2020)"],"f":"F1"},{"t":"Self as temporo-spatial","s":"The self is the point where the brain's intrinsic timing meets the body and world, not a content among contents.","who":["Northoff (2016)","Wolff et al. (2019)","Qin, Wang and Northoff (2020)"],"f":"F2"}]},{"t":"Entropic brain","s":"The richness of experience tracks the entropy of brain activity; psychedelics raise it, deep sleep and anaesthesia lower it, and the ordinary ego sits near a fixed point.","who":["Carhart-Harris et al. (2014)","Carhart-Harris (2018)","Carhart-Harris and Friston (2019)"],"f":"F1","q":"What do psychedelics show?","kids":[{"t":"REBUS and the anarchic brain","s":"Psychedelics relax high-level priors, letting bottom-up signals reshape belief; therapy works by loosening rigid models.","who":["Carhart-Harris and Friston (2019)","Girn et al. (2023)"],"f":"F1"},{"t":"Default mode network and ego","s":"Psychedelic ego dissolution correlates with disintegration of the default mode network.","who":["Carhart-Harris et al. (2012, 2016)","Tagliazucchi et al. (2016)","Raichle (2001), DMN"],"f":"F1"},{"t":"Criticality hypothesis","s":"The waking brain sits near a phase transition; consciousness needs the poised state between order and chaos.","who":["Beggs and Plenz (2003)","Chialvo (2010)","Toker et al. (2022)","Tagliazucchi (2017)"],"f":"F1"}]},{"t":"Electromagnetic field theories","s":"The brain's own electromagnetic field, not the neurons alone, is the physical substrate of experience; fields integrate information in a way spikes cannot.","who":["McFadden (2002, 2020)","Pockett (2000, 2012)","John (2001)","Hunt and Schooler (2019)"],"f":"F2","q":"Which field property?","kids":[{"t":"CEMI field theory","s":"Conscious information is information physically integrated in the endogenous EM field, which feeds back onto neurons and drives voluntary action.","who":["McFadden (2002a, 2002b)","McFadden (2013, 2020)"],"f":"F1"},{"t":"Spatial EM patterns","s":"Experience is identical to certain spatial patterns in the brain's field; they are conscious in themselves and need not act on neurons.","who":["Pockett (2000)","Pockett (2012, 2014)"],"f":"F2"},{"t":"General resonance theory","s":"Shared resonance frequencies let parts combine into a larger conscious whole; this solves the combination problem physically.","who":["Hunt (2011)","Hunt and Schooler (2019)","Fries (2005), communication through coherence"],"f":"F2"},{"t":"Operational architectonics","s":"Nested EM field patterns form operational modules whose synchrony is the phenomenal structure.","who":["Fingelkurts and Fingelkurts (2001, 2010)","Fingelkurts, Fingelkurts and Neves (2013)"],"f":"F2"},{"t":"Ephaptic coupling evidence","s":"Weak endogenous fields measurably entrain neuronal firing, so the field is at least causally relevant.","who":["Anastassiou et al. (2011)","Fröhlich and McCormick (2010)","Chiang et al. (2019)"],"f":"F0"}]},{"t":"Quantum theories","s":"Consciousness depends on quantum effects in the brain that classical neuroscience misses.","who":["Penrose (1989, 1994)","Hameroff and Penrose (1996, 2014)","Fisher (2015)","Stapp (1993)"],"f":"F2","q":"Which quantum effect?","kids":[{"t":"Orchestrated objective reduction","s":"Quantum superpositions in neuronal microtubules collapse by gravity-induced objective reduction; each collapse is a moment of proto-experience orchestrated by the cell.","who":["Penrose (1989, 1994)","Hameroff and Penrose (1996, 2014)","Hameroff (2022)"],"f":"F1","q":"Does it survive the tests?","kids":[{"t":"Decoherence objection","s":"Brain temperatures decohere any superposition in femtoseconds, far faster than neural time scales.","who":["Tegmark (2000)","Koch and Hepp (2006)"],"f":"F0"},{"t":"Warm coherence reply","s":"Shielding, ordered water and screening could extend coherence; photosynthesis shows biology uses quantum effects.","who":["Hagan, Hameroff and Tuszynski (2002)","Engel et al. (2007)","Craddock et al. (2017)"],"f":"F1"},{"t":"Microtubule resonance and anaesthesia","s":"Microtubules show gigahertz resonances, anaesthetics bind them, and microtubule stabilisers delay anaesthesia in rats.","who":["Bandyopadhyay (2014)","Craddock et al. (2017)","Khan et al. (2024)","Kalra et al. (2023), tryptophan superradiance"],"f":"F1"},{"t":"Gödelian non-computability","s":"Human mathematical insight is non-algorithmic, so consciousness needs new physics beyond computation.","who":["Lucas (1961)","Penrose (1989, 1994)","Feferman (1995), contra","Putnam (1995), contra"],"f":"F2"}]},{"t":"Posner molecule quantum brain","s":"Phosphorus nuclear spins in calcium phosphate clusters could stay entangled for long enough to affect neurotransmitter release; lithium isotope effects are the test.","who":["Fisher (2015)","Fisher and Radzihovsky (2018)","Ettenberg et al. (2020)","Weingarten, Doraiswamy and Fisher (2016)"],"f":"F1"},{"t":"Quantum Zeno mind","s":"Attention holds a brain state by repeated observation, so mind acts on matter through the measurement process of orthodox quantum theory.","who":["Stapp (1993, 2007)","Schwartz, Stapp and Beauregard (2005)","von Neumann (1932), process 1"],"f":"F2"},{"t":"Quantum exocytosis","s":"Vesicle release at synapses is a quantum tunnelling event that a non-material mind could bias without violating conservation.","who":["Beck and Eccles (1992)","Eccles (1994)"],"f":"F2"},{"t":"Dissipative quantum brain","s":"Memory is stored in coherent condensates of a quantum field coupled to its environment; consciousness is the brain's dialogue with its double.","who":["Ricciardi and Umezawa (1967)","Vitiello (1995, 2001)","Freeman and Vitiello (2006)"],"f":"F2"},{"t":"Many-minds interpretations","s":"Every branch of the quantum state carries its own mind; consciousness is what selects a branch from inside.","who":["Albert and Loewer (1988)","Lockwood (1989)","Zeh (1970)","Wigner (1961), consciousness causes collapse"],"f":"F2"},{"t":"Quantum cognition without quantum brain","s":"Hilbert-space probability models fit human judgement errors, but this says nothing about physical quantum effects in neurons.","who":["Busemeyer and Bruza (2012)","Pothos and Busemeyer (2013)","Aerts (2009)"],"f":"F1"}]},{"t":"Identity theory","s":"Each type of mental state simply is a type of brain state, as lightning is electrical discharge; there is nothing more to explain.","who":["Place (1956)","Smart (1959)","Feigl (1958)","Lewis (1966)"],"f":"F2","q":"Type or token?","kids":[{"t":"Type-type identity","s":"Pain is C-fibre firing, full stop; any creature in pain has that brain state.","who":["Place (1956)","Smart (1959)","Polger and Shapiro (2016)"],"f":"F2","q":"What about other creatures?","kids":[{"t":"Multiple realisability objection","s":"Octopus pain is not C-fibre firing, so pain cannot be identical with one brain state type.","who":["Putnam (1967)","Fodor (1974)","Block (1978)"],"f":"F2"},{"t":"Realisability reply","s":"Real cases of multiple realisation are rare and the grain of neuroscience matches the grain of psychology.","who":["Bechtel and Mundale (1999)","Polger and Shapiro (2016)","Shapiro (2000)"],"f":"F2"}]},{"t":"Anomalous monism","s":"Every mental event is a physical event, but there are no strict laws linking mental and physical kinds.","who":["Davidson (1970)","Kim (1993), epiphenomenalism charge"],"f":"F2"},{"t":"Type-B physicalism","s":"Consciousness is physical, but the identity is known only a posteriori; the apparent gap is in our concepts, not the world.","who":["Loar (1990, 1997)","Papineau (2002)","Block and Stalnaker (1999)","Hill and McLaughlin (1999)"],"f":"F2","q":"How to explain the gap?","kids":[{"t":"Phenomenal concept strategy","s":"Phenomenal concepts are recognitional and conceptually isolated, so they cannot be derived from physical concepts even when they co-refer.","who":["Loar (1990)","Papineau (2002)","Balog (2012)","Chalmers (2007), master argument against"],"f":"F2"},{"t":"Ability hypothesis","s":"Mary learns no new fact on seeing red; she gains abilities to imagine, recognise and remember.","who":["Lewis (1988)","Nemirow (1990)","Jackson (1982), the original argument"],"f":"F2"},{"t":"Acquaintance hypothesis","s":"Mary gains acquaintance with a property she already knew about by description.","who":["Conee (1994)","Tye (2009)","Bigelow and Pargetter (1990)"],"f":"F2"},{"t":"Old fact, new guise","s":"Mary learns an old physical fact under a new phenomenal mode of presentation.","who":["Loar (1990)","Horgan (1984)","Lycan (1996)"],"f":"F2"}]},{"t":"Type-A physicalism","s":"Once all functional facts are known there is nothing left to explain; Mary would learn nothing and zombies are inconceivable.","who":["Dennett (1991)","Lewis (1988)","Jackson (1998), later view","Rey (1997)"],"f":"F2"},{"t":"Type-C physicalism","s":"The gap is real now but will close; either we lack concepts or we lack physics.","who":["Nagel (1974, 1998)","Churchland (1996)","Stoljar (2006), epistemic view","Van Gulick (1993)"],"f":"F3"}]}],"q":"Which structure?"},{"t":"Basic, and everywhere","s":"Brains focus a feeling that was already there.","who":["Panpsychism","Cosmopsychism","Idealism"],"addr":"C1","f":"F2","d":"Your Turn 7: feeling is the very thing from the start.","kids":[{"t":"Constitutive micropsychism","s":"Fundamental physical entities have experience, and human experience is constituted by theirs.","who":["G. Strawson (2006)","Goff (2017)","Chalmers (2015)","Seager (1995)"],"f":"F2","q":"How do little subjects add up?","kids":[{"t":"Combination problem","s":"Many small experiences do not obviously make one large one; James said a hundred feelings stay a hundred.","who":["James (1890)","Seager (1995)","Chalmers (2016), taxonomy","Goff (2006)"],"f":"F2","q":"Which combination problem?","kids":[{"t":"Subject-summing problem","s":"Facts about micro-subjects never entail a macro-subject, so the macro-subject would be an extra fact.","who":["Goff (2009)","Coleman (2014)","Chalmers (2016)"],"f":"F2"},{"t":"Palette problem","s":"A few basic micro-qualities must generate the whole range of human qualities.","who":["Chalmers (2016)","Roelofs (2014)"],"f":"F2"},{"t":"Structural mismatch","s":"Physics has the structure of atoms; experience has the structure of a visual field; they do not line up.","who":["Chalmers (2016)","Stoljar (2001)","Lockwood (1993), grain problem"],"f":"F2"}]},{"t":"Phenomenal bonding","s":"A basic relation between subjects, which we cannot conceive but can posit, bonds them into a larger subject.","who":["Goff (2016)","Goff (2017)"],"f":"F2"},{"t":"Fusionism and mental chemistry","s":"Micro-subjects fuse and cease to exist when they form a macro-subject, as hydrogen and oxygen give water.","who":["Seager (2010, 2016)","Mørch (2014)","Mill (1843), mental chemistry"],"f":"F2"},{"t":"Experience sharing","s":"Composite subjects literally share experiences with their parts; unity is a matter of degree.","who":["Roelofs (2019)","Roelofs (2014)"],"f":"F2"},{"t":"Panqualityism","s":"Basic entities have qualities but no subjects; subjects arise when qualities are taken up by awareness.","who":["Coleman (2012, 2014, 2017)","Feigl (1958)","James (1904), pure experience"],"f":"F2"}]},{"t":"Constitutive cosmopsychism","s":"The universe as a whole is the one fundamental subject; we are partial aspects of it.","who":["Goff (2017, 2019)","Shani (2015)","Nagasawa and Wager (2016)","Albahari (2020)"],"f":"F2","q":"How does the one become many?","kids":[{"t":"Priority monism","s":"The cosmos is the one fundamental thing and its parts are derivative, so grounding runs from whole to part.","who":["Schaffer (2010)","Schaffer (2018)","Spinoza (1677)"],"f":"F2"},{"t":"Decombination problem","s":"How does one cosmic subject give rise to many bounded subjects that do not feel the whole?","who":["Miller (2018)","Albahari (2020)","Chalmers (2020)"],"f":"F2"},{"t":"Cosmopsychist grounding by partial aspect","s":"Each creature is a partial grounding of the cosmic mind, as a wave is of the sea.","who":["Shani (2015)","Shani and Keppler (2018)","Goff (2017)"],"f":"F2"},{"t":"Agentive cosmopsychism","s":"The universe is a subject with purposes, which explains fine-tuning without a separate God.","who":["Goff (2019)","Goff (2023)","Nagasawa (2020)"],"f":"F2"}]},{"t":"Russellian monism","s":"Physics describes only what matter does, not what it is; the intrinsic nature that physics leaves blank is, or grounds, experience.","who":["Russell (1927)","Eddington (1928)","Chalmers (2015)","Alter and Nagasawa (2015)","Stoljar (2001)"],"f":"F2","q":"What fills the blank?","kids":[{"t":"Russellian panpsychism","s":"The hidden intrinsic natures are phenomenal properties.","who":["G. Strawson (2006)","Goff (2017)","Mørch (2014)"],"f":"F2"},{"t":"Panprotopsychism","s":"The intrinsic natures are protophenomenal: not experiences, but the kind of thing that yields experience when arranged.","who":["Chalmers (2013, 2015)","Stoljar (2001)","Pereboom (2011)"],"f":"F2"},{"t":"Russellian physicalism","s":"The categorical bases are physical in a broadened sense, so the view is a physicalism that respects the gap.","who":["Montero (2015)","Stoljar (2001, 2014)","Brown (2017)"],"f":"F2"},{"t":"Structure and dynamics argument","s":"Physical truths are all structural; experience is not; so experience cannot follow from physics alone.","who":["Chalmers (2003)","Alter (2016)","Howell (2015), contra","Ladyman and Ross (2007), everything is structure"],"f":"F2"}]},{"t":"Emergent panpsychism","s":"Micro-experience is fundamental, but macro-subjects emerge from it by new causal laws rather than being constituted by it.","who":["Mørch (2014)","Brüntrup (2016)","Rosenberg (2004)","Seager (2016)"],"f":"F2","q":"What kind of emergence?","kids":[{"t":"Natural individuals and carriers","s":"Experience carries causation; where a natural individual forms, its experiential base gives it causal powers.","who":["Rosenberg (2004)","Rosenberg (2015)"],"f":"F2"},{"t":"Process panexperientialism","s":"Reality is made of momentary occasions of experience that prehend one another; enduring things are societies of occasions.","who":["Whitehead (1929)","Hartshorne (1937)","Griffin (1998)"],"f":"F2"},{"t":"Monadology","s":"Reality is made of simple mind-like substances that do not interact but mirror one another in pre-established harmony.","who":["Leibniz (1714)","Leibniz (1695)"],"f":"F2"},{"t":"Teleological naturalism","s":"Consciousness and reason cannot be explained by mechanism or theism; nature has a built-in tendency toward mind.","who":["Nagel (2012)","Nagel (1979)"],"f":"F2"}]},{"t":"Idealism","s":"Mind is fundamental and matter is how mind appears; brains are what minds look like from outside.","who":["Berkeley (1710)","Kastrup (2019)","Hoffman (2019)","Śaṅkara (8th c.)","Chalmers (2019), taxonomy"],"f":"F2","q":"Whose mind?","kids":[{"t":"Subjective idealism","s":"To be is to be perceived; objects are collections of ideas held together by God's perception.","who":["Berkeley (1710, 1713)","Collier (1713)"],"f":"F2"},{"t":"Absolute idealism","s":"Reality is one self-developing rational spirit; finite minds are moments of it.","who":["Hegel (1807)","Bradley (1893)","Royce (1899)"],"f":"F2"},{"t":"Analytic idealism","s":"There is one universal consciousness; individual minds are dissociated alters of it, and matter is how mental processes look across the dissociative boundary.","who":["Kastrup (2019)","Kastrup (2018)"],"f":"F2"},{"t":"Conscious realism","s":"Conscious agents are the only reality; spacetime and objects are an interface that hides the truth because fitness beats accuracy.","who":["Hoffman (2008, 2019)","Hoffman and Prakash (2014)","Hoffman, Singh and Prakash (2015)"],"f":"F2"},{"t":"Advaita Vedānta","s":"Only Brahman, pure consciousness, is real; the world and separate selves are appearance, and the individual self is Brahman.","who":["Śaṅkara (8th c.)","Gauḍapāda (6th c.)","Albahari (2019)"],"f":"F2"},{"t":"Yogācāra mind-only","s":"Only mental events exist; the apparent external world is projection from the storehouse consciousness.","who":["Vasubandhu (4th c.)","Asaṅga (4th c.)","Xuanzang (7th c.)"],"f":"F2"},{"t":"Phenomenalism","s":"Physical objects are permanent possibilities of sensation; talk of matter is shorthand for patterns in experience.","who":["Mill (1865)","Mach (1886)","Ayer (1940)"],"f":"F2"},{"t":"Theistic idealism","s":"Matter is grounded in the perceptions and will of God, who sustains a common world for finite minds.","who":["Berkeley (1710)","Adams (2007)","Foster (2008)"],"f":"F2"}]},{"t":"Neutral monism","s":"Mind and matter are both built from a stuff that is neither; the difference is one of arrangement.","who":["James (1904)","Mach (1886)","Russell (1921)","Spinoza (1677)"],"f":"F2","q":"What is the neutral stuff?","kids":[{"t":"Pure experience","s":"There is one primal stuff, pure experience, which counts as thought in one context and as thing in another.","who":["James (1904, 1912)","Perry (1912)"],"f":"F2"},{"t":"Sensations as elements","s":"The world is a web of elements (colours, pressures, sounds) that are physical when related to bodies and psychical when related to nervous systems.","who":["Mach (1886)","Russell (1921)"],"f":"F2"},{"t":"Dual-aspect monism","s":"One underlying reality shows two irreducible aspects, mental and physical, that cannot be reduced to each other.","who":["Spinoza (1677)","Pauli and Jung (1952)","Atmanspacher (2012)","Velmans (2009), reflexive monism"],"f":"F2"},{"t":"Double-aspect information","s":"Information is the neutral stuff: every informational state has a physical and a phenomenal aspect.","who":["Chalmers (1996)","Wheeler (1990), it from bit","Bateson (1972)"],"f":"F2"}]},{"t":"Objections to panpsychism","s":"Positions that hold the view empty or unmotivated regardless of variant.","who":["Searle (2013)","Frankish (2016)","Chalmers (2016)","Goff (2019), replies"],"f":"F2","q":"Which objection?","kids":[{"t":"No sign problem","s":"Electrons show no sign of experience, so the attribution explains nothing and cannot be checked.","who":["Searle (2013)","McGinn (2006)"],"f":"F3"},{"t":"Illusionist alternative","s":"If we can explain why we believe in experience without positing it, there is no reason to spread it to matter.","who":["Frankish (2016)","Dennett (2017)"],"f":"F2"},{"t":"Incredulous stare","s":"The view is too strange to be believed, though defenders say strangeness is not evidence.","who":["Goff (2017), naming it","Lewis (1986), the phrase","Chalmers (2015)"],"f":"F2"}]}],"q":"How does the small feeling become you?"},{"t":"Basic, and an extra kind","s":"Mind alongside matter.","who":["Descartes","Chalmers","Samkhya"],"addr":"C5","f":"F2","kids":[{"t":"Substance dualism","s":"Mind and body are two kinds of thing; the mind can in principle exist without the body.","who":["Descartes (1641)","Swinburne (1986, 2013)","Hasker (1999)","Lowe (2008)"],"f":"F2","q":"Which substance view?","kids":[{"t":"Cartesian interactionism","s":"An immaterial thinking substance acts on the brain and the brain acts on it, through the pineal gland or some later stand-in.","who":["Descartes (1641, 1649)","Popper and Eccles (1977)","Eccles (1994), psychons"],"f":"F2","q":"Where does it interact?","kids":[{"t":"Causal closure objection","s":"Physics is causally closed and conserves energy, so an outside mind could not move a neuron.","who":["Papineau (2001, 2002)","Kim (2005)","Dennett (1991)"],"f":"F2"},{"t":"Pairing problem","s":"Nothing spatial links a particular soul to a particular body, so no story pairs the causes with the effects.","who":["Kim (2001, 2005)","Foster (1991), reply"],"f":"F2"},{"t":"Quantum indeterminacy loophole","s":"Quantum chance leaves room for mind to bias outcomes without breaking any law.","who":["Eccles (1994)","Stapp (2007)","Hodgson (1991)","Wilson (1999), contra"],"f":"F2"}]},{"t":"Emergent dualism","s":"The soul is a new substance that the brain generates and sustains, as a magnet generates its field.","who":["Hasker (1999)","Hasker (2018)","Zimmerman (2010)"],"f":"F2"},{"t":"Non-Cartesian substance dualism","s":"The person is a distinct substance with both mental and physical properties, but not a separable ghost.","who":["Lowe (1996, 2008)","Meixner (2004)","Baker (2000), constitution view"],"f":"F2"},{"t":"Thomistic and hylomorphic dualism","s":"The soul is the form of the living body, not a separate thing, yet the intellect can survive the body.","who":["Aquinas (1265)","Oderberg (2005)","Feser (2018)","Stump (1995)"],"f":"F2"},{"t":"Simple soul","s":"The self is a simple mental substance whose identity cannot be analysed into anything else.","who":["Swinburne (1986, 2019)","Butler (1736)","Reid (1785)"],"f":"F2"},{"t":"Sāṃkhya","s":"Countless pure witnesses (puruṣa) watch an active nature (prakṛti) that includes mind and intellect; liberation is seeing the difference.","who":["Īśvarakṛṣṇa (c. 350)","Larson (1969)","Burley (2007)"],"f":"F2"},{"t":"Nyāya-Vaiśeṣika self","s":"The self is an eternal substance in which cognition, pleasure and pain inhere; it is known by inference from these qualities.","who":["Gautama (c. 2nd c.)","Vātsyāyana (5th c.)","Udayana (10th c.)","Ganeri (2012)"],"f":"F2"}]},{"t":"Property dualism","s":"There is one kind of substance, but consciousness is a property that no physical property fixes.","who":["Chalmers (1996)","Jackson (1982)","Robinson (2004)","Kripke (1980)"],"f":"F2","q":"Does the mental property do anything?","kids":[{"t":"Naturalistic dualism","s":"Consciousness is a further fundamental feature linked to the physical by psychophysical laws yet to be found.","who":["Chalmers (1996, 2010)","Chalmers (2003), type D, E, F"],"f":"F2","q":"Which of Chalmers' options?","kids":[{"t":"Type-D interactionism","s":"Phenomenal properties act on the physical, perhaps at quantum collapse.","who":["Chalmers (2003)","Chalmers and McQueen (2022), collapse models","Lowe (2008)"],"f":"F2"},{"t":"Type-E epiphenomenalism","s":"The physical produces the phenomenal and the phenomenal produces nothing.","who":["Huxley (1874)","Jackson (1982)","Robinson (2019)","Chalmers (1996), tentatively"],"f":"F2","q":"How can we know about it then?","kids":[{"t":"Paradox of phenomenal judgement","s":"If experience causes nothing, our beliefs about it are not caused by it; the epiphenomenalist must explain how they are still knowledge.","who":["Chalmers (1996)","Shoemaker (1975)","Robinson (2019), reply"],"f":"F2"},{"t":"Evolutionary objection","s":"A property with no effects could not be selected, so epiphenomenal consciousness is an unexplained accident.","who":["James (1890)","Popper and Eccles (1977)","Robinson (2007), reply"],"f":"F2"}]},{"t":"Type-F monism","s":"The intrinsic natures of physical entities are phenomenal or protophenomenal; this is Russellian monism.","who":["Chalmers (2003, 2015)","Russell (1927)"],"f":"F2"}]},{"t":"Emergentism","s":"Wholes of sufficient complexity have new properties with new causal powers that no law of the parts predicts.","who":["Mill (1843)","Alexander (1920)","Broad (1925)","O'Connor (1994)","Sperry (1969)"],"f":"F2","q":"Is the emergence strong or weak?","kids":[{"t":"Strong emergence","s":"The high-level property is not deducible even in principle from the low-level facts, and it acts downward.","who":["Broad (1925)","O'Connor and Wong (2005)","Chalmers (2006)","Sperry (1980)"],"f":"F2"},{"t":"Weak emergence","s":"The property is novel only in that it could be found only by simulating the parts; there is nothing extra.","who":["Bedau (1997)","Chalmers (2006)","Wimsatt (1997)"],"f":"F2"},{"t":"Downward causation and exclusion","s":"If the physical is sufficient for every effect, an emergent property either does nothing or does double duty.","who":["Kim (1998, 2005)","Baker (1993), reply","List and Menzies (2009), reply"],"f":"F2"}]},{"t":"Non-reductive physicalism","s":"Mental properties are physically realised and supervene on the physical but are not identical to physical properties.","who":["Davidson (1970)","Fodor (1974)","Putnam (1967)","Pereboom (2002), constitution"],"f":"F2"},{"t":"Hylomorphism revived","s":"Minds are structured wholes; structure is a real principle that organises matter and is not itself matter.","who":["Aristotle (De Anima)","Jaworski (2016)","Koslicki (2008)","Marmodoro (2013)"],"f":"F2"}]},{"t":"Arguments for a gap","s":"Positions holding that some thought experiment shows consciousness is not fixed by the physical.","who":["Chalmers (1996)","Jackson (1982)","Kripke (1980)","Nagel (1974)","Levine (1983)"],"f":"F2","q":"Which argument?","kids":[{"t":"Zombie conceivability argument","s":"A physical duplicate without experience is conceivable, so possible, so consciousness is not physical.","who":["Chalmers (1996, 2010)","Kirk (1974)","Kripke (1980), forerunner"],"f":"F2","q":"Does conceivability give possibility?","kids":[{"t":"Two-dimensional defence","s":"Ideal primary conceivability entails primary possibility; the physicalist must deny the zombie is even ideally conceivable.","who":["Chalmers (2002, 2010)","Jackson (1998)"],"f":"F2"},{"t":"Type-B denial of the link","s":"Zombies are conceivable but not possible, as water without H2O is conceivable but not possible.","who":["Loar (1990)","Hill and McLaughlin (1999)","Yablo (1999)","Balog (1999)"],"f":"F2"},{"t":"Zombies are incoherent","s":"If zombies have all our functional states they have all our beliefs about experience, so the description is confused.","who":["Dennett (1991, 1995)","Kirk (2005)","Frankish (2007), anti-zombie"],"f":"F2"}]},{"t":"Knowledge argument","s":"Mary knows every physical fact about colour vision but learns something new on seeing red, so there are non-physical facts.","who":["Jackson (1982, 1986)","Nagel (1974)","Jackson (1998), later recanting"],"f":"F2"},{"t":"Explanatory gap","s":"Even if consciousness is physical, no explanation shows why this brain state feels like this; the gap may be permanent.","who":["Levine (1983, 2001)","Nagel (1974)","Papineau (2002), reply"],"f":"F2"},{"t":"Modal argument","s":"Pain is rigidly designated and so is C-fibre firing; the identity would have to be necessary, but seems contingent, so it fails.","who":["Kripke (1972, 1980)","Nagel (1974)","Boyd (1980), reply"],"f":"F2"},{"t":"Inverted spectrum","s":"Two people functionally alike could see red where the other sees green, so experience outruns function.","who":["Locke (1690)","Shoemaker (1982)","Block (1990)","Palmer (1999)"],"f":"F2"}]},{"t":"Parallelism and occasionalism","s":"Mind and matter never interact; they run in step because God coordinates them, either once or at every moment.","who":["Leibniz (1695)","Malebranche (1674)","Geulincx (1665)","al-Ghazālī (1095)"],"f":"F2"},{"t":"Interactionism with physics","s":"Positions that say a non-physical mind can move matter without breaking conservation laws or observed physics.","who":["Eccles (1994)","Stapp (2007)","Hodgson (1991)","Pitts (2019)"],"f":"F2","q":"Which loophole?","kids":[{"t":"Energy conservation is conditional","s":"Conservation holds only for closed systems with time-translation symmetry; a mind-brain system need not be one.","who":["Pitts (2019, 2020)","Collins (2008)","Averill and Keating (1981)"],"f":"F2"},{"t":"Collapse-model interaction","s":"Consciousness triggers or biases wave function collapse; the model is testable by the amount of collapse it predicts.","who":["Chalmers and McQueen (2022)","Kremnizer and Ranchin (2015)","Wigner (1961)"],"f":"F1"}]}],"q":"How does mind relate to matter?"},{"t":"Built, but we cannot see how","s":"The explanation exists and our minds are closed to it.","who":["McGinn"],"addr":"B2a-m","f":"F3","kids":[{"t":"Transcendental naturalism","s":"The link between brain and experience is a natural property, but our concepts, drawn from spatial perception and introspection, can never grasp it.","who":["McGinn (1989, 1991, 1999)","Fodor (1983), epistemic boundedness"],"f":"F3","q":"What exactly is closed?","kids":[{"t":"Cognitive closure","s":"A mind can be constitutionally unable to form a concept, as a rat cannot form the concept of a prime; we are that rat for consciousness.","who":["McGinn (1989)","McGinn (1993)","Kriegel (2003), critique"],"f":"F3"},{"t":"Spatial concept limit","s":"Our concepts of the brain are spatial and our concepts of experience are not; the bridge would need concepts of neither kind.","who":["McGinn (1995)","McGinn (2004)"],"f":"F3"},{"t":"Flanagan's reply","s":"New mysterianism assumes closure without evidence; constructive naturalism keeps working with the concepts we have.","who":["Flanagan (1991, 1992)","Dennett (1991)","P.S. Churchland (1996)"],"f":"F2"}]},{"t":"Problems and mysteries","s":"Human science solves problems that fit our cognitive design and stumbles on mysteries that do not; consciousness may be a mystery in this sense.","who":["Chomsky (1975, 1988, 2009)","Chomsky (2000)"],"f":"F3","q":"What happened to the mind-body problem?","kids":[{"t":"No body, no problem","s":"Newton destroyed the mechanical notion of body, so there is no coherent physical to contrast mind with; the problem cannot even be stated.","who":["Chomsky (2000, 2009)","Yolton (1983), thinking matter","Locke (1690)"],"f":"F2"},{"t":"Scope and limits of cognition","s":"The same innate structure that makes language learnable makes some questions unaskable.","who":["Chomsky (1975)","Chomsky (1980)","McGinn (1994)"],"f":"F3"}]},{"t":"Epistemic view","s":"We are ignorant of a type of physical or protophysical fact; the problem looks hard only because that fact is missing from our picture.","who":["Stoljar (2006)","Stoljar (2001)","Nagel (1998)","Russell (1927)"],"f":"F3","q":"Is the ignorance temporary?","kids":[{"t":"Missing ingredient, findable","s":"Future physics or neuroscience may supply the concept; the gap is like the gap before chemistry.","who":["Nagel (1998)","Stoljar (2006)","P.S. Churchland (1996)"],"f":"F2"},{"t":"Missing ingredient, unreachable","s":"The categorical natures physics omits are exactly what perception and theory cannot reach.","who":["Langton (1998), Kantian humility","Lewis (2009), Ramseyan humility","Russell (1927)"],"f":"F3"}]},{"t":"Ignorabimus","s":"Seven world riddles, of which two (the nature of matter and force, and the origin of sensation) are permanently unanswerable.","who":["Du Bois-Reymond (1872, 1880)","Haeckel (1899), reply","Hilbert (1930), reply: we shall know"],"f":"F3"},{"t":"Kantian closure","s":"We know things only as they appear under our forms of intuition; the self and matter as they are in themselves are closed to us.","who":["Kant (1781, 1787)","Schopenhauer (1818)","Langton (1998)","Allison (1983)"],"f":"F3","q":"What is the thing in itself?","kids":[{"t":"Two-worlds reading","s":"Noumena are a distinct realm of objects we cannot reach.","who":["Kant (1781), some passages","Strawson (1966)","Guyer (1987)"],"f":"F3"},{"t":"Two-aspects reading","s":"Noumena are the same objects considered apart from our way of knowing them; nothing extra is posited.","who":["Allison (1983, 2004)","Prauss (1974)","Bird (1962)"],"f":"F3"}]},{"t":"Subjective character argument","s":"Facts about what it is like are accessible only from a point of view; objective science, which abstracts from points of view, cannot capture them, though an objective phenomenology might narrow the gap.","who":["Nagel (1974)","Nagel (1986)","Jackson (1982)"],"f":"F3"},{"t":"Mystery is temporary","s":"Every past mystery of life became a problem once the tools existed; the same will happen here.","who":["Dennett (1991)","P.S. Churchland (1996)","Crick (1994)","Flanagan (1992)"],"f":"F2"}],"q":"Why closed, and for how long?"}]},{"t":"How many of us are there?","s":"One for all, one each, or none that lasts.","q":"How many subjects?","doc":"16-one-splitting-down.md","kids":[{"t":"One, and everyone is it","s":"Every person is the same subject living every life. The Egg.","who":["Kolak, open individualism","Advaita: Atman is Brahman","Schopenhauer’s one Will","Upanishads: tat tvam asi","Schrödinger","Andy Weir, The Egg"],"addr":"C1 D1c","f":"F2","d":"The tree converging at one apex shows common origin, not identity. All life shares one ancestor; you and a mushroom are not one organism. So the tree points at this cell and cannot reach it.","kids":[{"t":"Open individualism","s":"The borders between persons are not real; there is one numerically identical subject who is everyone.","who":["Kolak (2004)","Zuboff (1990)","Schrödinger (1958)"],"f":"F2","q":"What argument gets you there?","kids":[{"t":"Border argument","s":"No physical, psychological or spatial border is sharp enough to individuate subjects, so the default is one subject.","who":["Kolak (2004)","Kolak (2008)"],"f":"F2"},{"t":"Universalism from immediacy","s":"What makes an experience mine is only its immediacy, and every experience has that, so every experience is mine.","who":["Zuboff (1990)","Zuboff (2017)","Nagel (1986), objective self"],"f":"F2"},{"t":"Probability argument","s":"If you are one specific person the chance you exist at all is negligible; if you are everyone it is certain.","who":["Zuboff (1990)","Zuboff (2008)"],"f":"F2"},{"t":"Egg thought experiment","s":"Every human life is one soul being educated by living each life in turn.","who":["Weir (2009)","Kolak (2004)"],"f":"F2"}]},{"t":"Advaita Vedānta on selves","s":"The individual self is the one Self seen through ignorance; there was never more than one knower.","who":["Śaṅkara (8th c.)","Upaniṣads (c. 800 to 300 BCE)","Ramana Maharshi (20th c.)","Deutsch (1969)"],"f":"F2","q":"What then are the many?","kids":[{"t":"Reflection theory","s":"Each individual is the one consciousness reflected in a different mind, as one sun in many pots of water.","who":["Śaṅkara (8th c.)","Padmapāda (8th c.)","Vivaraṇa school"],"f":"F2"},{"t":"Limitation theory","s":"Each individual is the one consciousness apparently bounded by a body, as one space seems divided by pots.","who":["Vācaspati Miśra (10th c.)","Bhāmatī school","Gauḍapāda (6th c.)"],"f":"F2"}]},{"t":"Kashmir Śaivism","s":"One consciousness freely contracts itself into many limited subjects and recognises itself again through them.","who":["Utpaladeva (10th c.)","Abhinavagupta (c. 1000)","Kṣemarāja (11th c.)","Dyczkowski (1987)"],"f":"F2"},{"t":"The one Will","s":"Individuation belongs to appearance only; underneath, every striving thing is the same blind Will.","who":["Schopenhauer (1818, 1844)","Magee (1983)"],"f":"F2"},{"t":"Singular consciousness","s":"Consciousness is a singular whose plural is unknown; the sense of many is produced by many bodies with memories.","who":["Schrödinger (1944, 1958)","Weyl (1949)","Kastrup (2019)"],"f":"F2"},{"t":"Protean self","s":"We are not fixed to our bodies; a person who identifies with all sentient beings survives as them, so personal death is optional.","who":["Johnston (2010)","Parfit (1984), forerunner"],"f":"F2"},{"t":"Objections to the one subject","s":"Positions holding the open view false or empty.","who":["Parfit (1984)","Olson (1997)","Dainton (2008)"],"f":"F2","q":"Which objection?","kids":[{"t":"Streams do not merge","s":"Your experiences and mine are not co-conscious, so the one-subject claim has no experiential content.","who":["Dainton (2008)","Bayne (2010)","Tye (2003)"],"f":"F2"},{"t":"Common origin is not identity","s":"Sharing one ancestor, one substance or one field makes things related, not the same thing.","who":["Olson (1997)","Lewis (1976)","Parfit (1984)"],"f":"F2"}]}],"q":"How is the one spread across lives?"},{"t":"One each","s":"A subject per person, lasting a life.","who":["Common sense","Most Western philosophy"],"addr":"closed","f":"F2","kids":[{"t":"Psychological continuity theories","s":"A person persists as long as memory, character and intention connect the later stage to the earlier one.","who":["Locke (1690)","Shoemaker (1970, 1984)","Parfit (1971, 1984)","Perry (1972)"],"f":"F2","q":"Which connections, and with what cause?","kids":[{"t":"Lockean memory theory","s":"You are the person whose past experiences you can remember from the inside.","who":["Locke (1690)","Quinton (1962)","Grice (1941)"],"f":"F2","q":"Does memory work as a criterion?","kids":[{"t":"Brave officer objection","s":"Memory is not transitive: the general remembers the officer who remembered the boy but not the boy, so identity cannot be memory.","who":["Reid (1785)","Berkeley (1732)","Grice (1941), reply via chains"],"f":"F2"},{"t":"Circularity objection","s":"Genuine memory presupposes identity, so it cannot define it; quasi-memory is offered as a repair.","who":["Butler (1736)","Shoemaker (1970), quasi-memory","Parfit (1984)"],"f":"F2"}]},{"t":"Neo-Lockean continuity","s":"Overlapping chains of memory, belief, desire and intention with any cause, or the normal cause, or a reliable cause.","who":["Shoemaker (1984)","Parfit (1984)","Noonan (1989)","Nozick (1981)"],"f":"F2","q":"What about fission?","kids":[{"t":"Non-branching clause","s":"You survive as your continuer only if there is exactly one; two continuers means you are neither.","who":["Parfit (1971, 1984)","Shoemaker (1984)","Wiggins (1967)"],"f":"F2"},{"t":"Closest continuer","s":"You are whichever later person continues you most closely; ties mean death.","who":["Nozick (1981)","Nozick (1981), on Vienna Circle example"],"f":"F2"},{"t":"Multiple occupancy","s":"Two people already share the body before fission; they overlap like roads before a fork.","who":["Lewis (1976)","Perry (1972)","Noonan (1989)"],"f":"F2"},{"t":"Wide, narrow and widest continuity","s":"Whether the cause of continuity must be the brain, any reliable process, or anything at all.","who":["Parfit (1984)","Shoemaker (1984)","Unger (1990)"],"f":"F2"}]},{"t":"Phenomenal continuity","s":"What keeps you the same is the continuity of your stream of experience and your capacities for it, not memories or beliefs.","who":["Dainton (2008)","Dainton and Bayne (2005)","Unger (1990)","Foster (1991)"],"f":"F2"},{"t":"Narrative identity","s":"You are the protagonist of the story you tell and live; identity is a matter of how life hangs together as a narrative.","who":["Schechtman (1996)","MacIntyre (1981)","Ricoeur (1992)","Dennett (1992), centre of narrative gravity"],"f":"F2","q":"Must a life be a story?","kids":[{"t":"Against narrativity","s":"Many people live episodically, not as narratives, and are none the worse; narrativity is an optional style.","who":["G. Strawson (2004)","Lamarque (2004)"],"f":"F2"},{"t":"Person life view","s":"A person is a being that lives a person life: a cluster of social, biological and psychological functions in a culture.","who":["Schechtman (2014)","Lindemann (2014)"],"f":"F2"}]},{"t":"Minimal experiential self","s":"There is a thin pre-reflective self in every experience, the for-me-ness of it, prior to any narrative.","who":["Zahavi (2005, 2014)","Gallagher (2000)","Husserl (1913)"],"f":"F2"}]},{"t":"Animalism","s":"You are a human animal; your persistence is the persistence of the organism, whatever happens to your mind.","who":["Olson (1997, 2007)","Snowdon (1990, 2014)","van Inwagen (1990)","DeGrazia (2005)"],"f":"F2","q":"Where does the animal end?","kids":[{"t":"Thinking animal argument","s":"There is a human animal in your chair thinking your thoughts; if you are not it, there are two thinkers.","who":["Olson (1997, 2003)","Snowdon (1990)","Ayers (1991)"],"f":"F2"},{"t":"Brainstem criterion","s":"The organism lasts as long as its life-sustaining functions, centred on the brainstem, continue.","who":["Olson (1997)","van Inwagen (1990)","Shewmon (1998), contra brain death"],"f":"F2"},{"t":"Brain view","s":"You are your brain or the part of it that thinks; a transplant takes you with it.","who":["Nagel (1986)","Hudson (2001)","McMahan (2002), embodied mind","Parfit (2012), embodied part"],"f":"F2"},{"t":"Constitution view","s":"You are constituted by a human animal without being identical to it, as a statue is c
