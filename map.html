cs is becoming godlike through the sacraments and ascesis.","who":["Maximus the Confessor (c. 630)","Gregory Palamas (c. 1340)","Vladimir Lossky (1944)"],"f":"F2"},{"t":"Tolstoyan Christian anarchism","s":"The Sermon on the Mount taken literally: no violence, no oath, no state.","who":["Leo Tolstoy (1894)","Jacques Ellul (1988)"],"f":"F2"}]},{"t":"Hindu ethical schools","s":"Dharma, karma, and liberation as the frame for right action.","who":["Manu","Bhagavad Gita","Śaṅkara","Rāmānuja","Gandhi"],"f":"F2","q":"Which school?","kids":[{"t":"Varnashrama dharma","s":"Duty is set by class and stage of life.","who":["Manusmṛti (c. 200)","Dharmasutras"],"f":"F2"},{"t":"Gita’s niṣkāma karma","s":"Act without attachment to results, as duty and offering.","who":["Bhagavad Gita (c. 200 BC)","Śaṅkara (c. 800)","Tilak (1915)"],"f":"F2"},{"t":"Advaita ethics","s":"Ethics prepares for knowledge of non-duality; the liberated one is beyond rules.","who":["Śaṅkara (c. 800)","Swami Vivekananda (1896)"],"f":"F2"},{"t":"Bhakti ethics","s":"Loving devotion to God is the whole of righteousness.","who":["Rāmānuja (c. 1100)","Caitanya (c. 1510)","Tulsidas (c. 1575)"],"f":"F2"},{"t":"Yoga’s yamas","s":"Non-harm, truth, non-stealing, restraint, non-grasping as the base of practice.","who":["Patañjali (c. 300)"],"f":"F2"},{"t":"Neo-Vedantic universalism","s":"All religions are paths; service to humanity is worship.","who":["Vivekananda (1896)","Sri Aurobindo (1920)","Radhakrishnan (1927)"],"f":"F2"},{"t":"Gandhian dharma","s":"Truth, non-violence, and self-rule as dharma for the modern world.","who":["Gandhi (1909, 1927)"],"f":"F2"},{"t":"Cārvāka materialism","s":"No karma, no afterlife; pleasure here is the only good.","who":["Brihaspati (legendary)","Tattvopaplavasiṁha (c. 750)"],"f":"F2"}]},{"t":"Sikh ethics","s":"Truthful living, service, and remembrance of the one God; equality of all.","who":["Guru Nanak (c. 1500)","Guru Gobind Singh (1699)","Avtar Singh (1970)"],"f":"F2"},{"t":"Zoroastrian ethics","s":"Good thoughts, good words, good deeds; choose asha against druj.","who":["Zarathustra (c. 1000 BC)","Denkard (c. 900)"],"f":"F2"},{"t":"Bahá’í ethics","s":"Unity of humanity, progressive revelation, justice as the foremost virtue.","who":["Bahá’u’lláh (1873)","ʿAbdu’l-Bahá (1912)"],"f":"F2"}]},{"t":"Community and personhood","s":"A person becomes a person through others; right is what sustains harmonious relationship.","who":["Ifeanyi Menkiti (1984)","Kwame Gyekye (1997)","Thaddeus Metz (2007)","Mogobe Ramose (1999)","Desmond Tutu (1999)"],"f":"F2","q":"How much does the community define the person?","kids":[{"t":"Ubuntu","s":"A person is a person through other persons; humanity is shared.","who":["Mogobe Ramose (1999)","Desmond Tutu (1999)","Augustine Shutte (2001)","Michael Eze (2010)"],"f":"F2","q":"What does ubuntu ground?","kids":[{"t":"Metz’s relational theory","s":"An act is right insofar as it honors capacities for communal relationship, identity and solidarity.","who":["Thaddeus Metz (2007, 2022)"],"f":"F2"},{"t":"Ubuntu as restorative justice","s":"Wrongdoing breaks relationship; the aim is repair, not retribution.","who":["Desmond Tutu (1999)","Truth and Reconciliation Commission (1996)"],"f":"F2"},{"t":"Ubuntu as humanism","s":"Ubuntu is a secular ethic of human dignity.","who":["Kwasi Wiredu (1996)","Michael Eze (2010)"],"f":"F2"}]},{"t":"Menkiti’s radical communitarianism","s":"Personhood is acquired through community and can be failed.","who":["Ifeanyi Menkiti (1984)"],"f":"F2"},{"t":"Gyekye’s moderate communitarianism","s":"Community shapes persons but individual rights and autonomy remain.","who":["Kwame Gyekye (1997)","Bernard Matolino (2014), critic"],"f":"F2"},{"t":"Wiredu’s humanist ethics","s":"Akan morality is grounded in human welfare, not religion.","who":["Kwasi Wiredu (1992)","Kwame Gyekye (1987)"],"f":"F2"},{"t":"Yoruba iwa","s":"Good character is the essence of religion and the aim of life.","who":["Segun Gbadegesin (1991)","Wande Abimbola (1975)"],"f":"F2"},{"t":"African vitalism","s":"Right is what increases life force in the community.","who":["Placide Tempels (1945)","Bénézet Bujo (1998)","Laurenti Magesa (1997)"],"f":"F2"},{"t":"Zera Yacob’s rationalism","s":"Reason, given by God, judges all revealed laws.","who":["Zera Yacob (1667)","Walda Heywat (c. 1690)"],"f":"F2"},{"t":"Négritude and Afrocentric ethics","s":"African values of rhythm, relation, and community against colonial rationalism.","who":["Léopold Senghor (1964)","Molefi Asante (1980)"],"f":"F2"},{"t":"Indigenous relational ethics","s":"Humans are kin with land and other beings; reciprocity is the norm.","who":["Vine Deloria Jr. (1973)","Robin Wall Kimmerer (2013)","Māori tikanga","Brian Burkhart (2019)"],"f":"F2","q":"What are the relations?","kids":[{"t":"Kinship with land","s":"Land is a relative, not a resource.","who":["Vine Deloria Jr. (1973)","Kimmerer (2013)"],"f":"F2"},{"t":"Māori tikanga","s":"Right is what tikanga, custom rooted in whakapapa and mana, requires.","who":["Hirini Moko Mead (2003)","Māori Marsden"],"f":"F2"},{"t":"Buen vivir","s":"Living well means living in harmony with community and nature, not accumulating.","who":["Andean traditions","Alberto Acosta (2013)"],"f":"F2"}]},{"t":"East Asian relational ethics","s":"The self exists in betweenness; ethics is the study of relation.","who":["Watsuji Tetsuro (1937)","Nishida Kitaro (1911)","Nitobe Inazo (1900)"],"f":"F2","q":"Which form?","kids":[{"t":"Watsuji’s aidagara","s":"Ethics is the study of human betweenness; individual and society are two moments.","who":["Watsuji Tetsuro (1937)"],"f":"F2"},{"t":"Bushidō","s":"Loyalty, honor, and rectitude as a warrior code.","who":["Yamaga Soko (c. 1660)","Nitobe Inazo (1900)"],"f":"F2"},{"t":"Kyoto School ethics","s":"Absolute nothingness as the place of self-negating love.","who":["Nishida Kitaro (1911, 1945)","Tanabe Hajime (1946)"],"f":"F2"}]},{"t":"Western communitarianism","s":"Goods and duties are constituted by shared social meanings.","who":["Michael Sandel (1982)","Charles Taylor (1989)","Michael Walzer (1983)","Amitai Etzioni (1993)"],"f":"F2"},{"t":"Liberation ethics","s":"Ethics begins with the victim excluded by the system.","who":["Enrique Dussel (1998)","Paulo Freire (1968)"],"f":"F2"}]},{"t":"Spontaneity and non-contention","s":"Right action is effortless response in accord with the way; moral striving is already a fall.","who":["Laozi (c. 400 BC)","Zhuangzi (c. 300 BC)","Liezi","Wang Bi (c. 240)"],"f":"F2","q":"What does following the Dao rule out?","kids":[{"t":"Laozi’s wu-wei","s":"Act without forcing; the sage rules by not ruling; be like water.","who":["Laozi, Daodejing (c. 400 BC)","Edward Slingerland (2003), reading"],"f":"F2"},{"t":"Zhuangzi’s perspectivism","s":"Right and wrong are relative to standpoints; the sage wanders free of them.","who":["Zhuangzi (c. 300 BC)","Chad Hansen (1992)","Hans-Georg Moeller (2004)"],"f":"F2"},{"t":"Daoist primitivism","s":"Return to small communities without technology or morality.","who":["Laozi ch. 80","Zhuangzi outer chapters"],"f":"F2"},{"t":"Huang-Lao statecraft","s":"Rule by law modeled on the Dao’s impartial order.","who":["Huangdi sijing (c. 200 BC)","Sima Tan"],"f":"F2"},{"t":"Xuanxue","s":"Nature and spontaneity against Confucian ritual; morality as emergent from non-being.","who":["Wang Bi (c. 240)","Guo Xiang (c. 300)","Ruan Ji (c. 250)"],"f":"F2"},{"t":"Religious Daoist precepts","s":"Precepts and merit accumulation toward immortality.","who":["Celestial Masters (c. 150)","Ge Hong (c. 320)","Lingbao scriptures"],"f":"F2"},{"t":"Daoist critique of Confucian virtue","s":"Virtue talk arises only when the Dao is lost.","who":["Laozi ch. 18 and 38"],"f":"F2"},{"t":"Mohist impartial care","s":"Care for all without gradation; judge by benefit to the world.","who":["Mozi (c. 430 BC)","Chris Fraser (2016)"],"f":"F2"}]},{"t":"Acting when unsure which theory is right","s":"What one should do given credence spread across moral theories.","who":["William MacAskill (2014, 2020)","Toby Ord","Krister Bykvist","Ted Lockhart (2000)","Andrew Sepielli (2009)"],"f":"gate","q":"How to combine theories?","kids":[{"t":"Maximize expected choiceworthiness","s":"Weight each theory’s verdict by credence and pick the highest total.","who":["MacAskill, Bykvist, Ord (2020)","Ted Lockhart (2000)","Andrew Sepielli (2009)"],"f":"gate","q":"Are theories comparable?","kids":[{"t":"Intertheoretic comparison by normalization","s":"Normalize theories by variance or range before adding.","who":["MacAskill and Ord (2020)","Christian Tarsney (2018)"],"f":"gate"},{"t":"Borda rule for incomparable theories","s":"Treat ordinal theories as voters.","who":["William MacAskill (2016)"],"f":"gate"},{"t":"Moral parliament","s":"Imagine theories as delegates bargaining in proportion to credence.","who":["Nick Bostrom (2009)","Toby Newberry and Toby Ord (2021)"],"f":"gate"}]},{"t":"My favorite theory","s":"Act on the theory you find most probable.","who":["Johan Gustafsson and Olle Torpman (2014)"],"f":"gate"},{"t":"Moral hedging","s":"Choose acts acceptable to most theories you credit.","who":["Jacob Ross (2006)","Sepielli (2009)"],"f":"gate"},{"t":"Precautionary and risk views","s":"Avoid grave wrongs by any credible theory.","who":["Dan Moller (2011)","Alexander Guerrero (2007)","Christian Barry and Patrick Tomlin (2016)"],"f":"gate"},{"t":"Externalist rejection","s":"What you ought to do depends on the true theory, not your credences.","who":["Brian Weatherson (2014)","Elizabeth Harman (2015)"],"f":"gate"},{"t":"Moral fetishism objection","s":"Caring about rightness as such, rather than about people, is a vice.","who":["Michael Smith (1994)","Brian Weatherson (2014)"],"f":"gate"},{"t":"Value pluralism","s":"There are many irreducible values that can conflict without a common measure.","who":["Isaiah Berlin (1958)","Thomas Nagel (1979)","Michael Stocker (1990)","Bernard Williams (1981)","Ruth Chang (1997)"],"f":"F2","q":"What follows from conflict?","kids":[{"t":"Tragic conflict","s":"Some choices leave a moral remainder however one acts.","who":["Bernard Williams (1965)","Martha Nussbaum (1986)","Rosalind Hursthouse (1999)"],"f":"F2"},{"t":"Incommensurability","s":"Some values cannot be ranked on one scale, though choice remains rational.","who":["Joseph Raz (1986)","Ruth Chang (1997)","John Finnis (1980)"],"f":"F2"},{"t":"Fragmentation of value","s":"Distinct sources of value make no single theory complete.","who":["Thomas Nagel (1979)"],"f":"F2"},{"t":"Berlin’s pluralism","s":"Ultimate values conflict; liberty protects the space to choose.","who":["Isaiah Berlin (1958, 1990)","John Gray (1995)","William Galston (2002)"],"f":"F2"}]},{"t":"Convergence theories","s":"Rival theories converge on one set of principles when done well.","who":["Derek Parfit (2011)","Brad Hooker (2000)","R.M. Hare (1981)"],"f":"F2"},{"t":"Hybrid theories","s":"Combine standards deliberately: rights plus welfare, virtue plus consequences.","who":["Thomas Hurka (2001)","Brad Hooker","Robert Nozick (1981), partly","Hurka’s Kant-consequentialism"],"f":"F2"},{"t":"Moral progress theories","s":"Morality improves over time by discovery, inclusion, or problem-solving.","who":["Philip Kitcher (2011)","Allen Buchanan and Russell Powell (2018)","Peter Singer (1981)","Kwame Anthony Appiah (2010)","Michele Moody-Adams (1999)"],"f":"F2","q":"What drives it?","kids":[{"t":"Expanding circle","s":"Reason extends concern past kin and tribe.","who":["Peter Singer (1981)","William Lecky (1869)"],"f":"F2"},{"t":"Inclusivist progress","s":"Progress is gains in inclusion, enabled by security and surplus.","who":["Buchanan and Powell (2018)"],"f":"F2"},{"t":"Honor and moral revolutions","s":"Change comes when honor codes flip.","who":["Kwame Anthony Appiah (2010)"],"f":"F2"},{"t":"Progress as discovery","s":"We find moral truths as we find scientific ones.","who":["Derek Parfit (2011)","Michael Huemer (2016)"],"f":"F2"},{"t":"Progress skepticism","s":"Talk of progress is a local story told by winners.","who":["Nietzsche (1887)","Michel Foucault (1975)","John Gray (2013)"],"f":"F2"}]}]},{"t":"How moral judgment happens in the mind","s":"Theories of the psychology behind moral judgment, tested by experiment.","who":["Lawrence Kohlberg (1969)","Jonathan Haidt (2001)","Joshua Greene (2001)","Elliot Turiel (1983)","Fiery Cushman (2013)"],"f":"F1","q":"What produces the judgment?","kids":[{"t":"Cognitive-developmental theory","s":"Moral reasoning develops through fixed stages toward justice.","who":["Jean Piaget (1932)","Lawrence Kohlberg (1969, 1981)","James Rest (1979)"],"f":"F1","q":"What are the stages?","kids":[{"t":"Kohlberg’s six stages","s":"Preconventional, conventional, postconventional, ending in universal principles.","who":["Lawrence Kohlberg (1969)"],"f":"F1"},{"t":"Neo-Kohlbergian schemas","s":"Schemas of personal interest, maintaining norms, and postconventional reasoning replace hard stages.","who":["James Rest, Darcia Narvaez and others (1999)"],"f":"F1"},{"t":"Gilligan’s critique","s":"The stages privilege a justice voice and rank the care voice as lower.","who":["Carol Gilligan (1982)"],"f":"F1"},{"t":"Piaget’s heteronomy to autonomy","s":"Children move from rule-following to cooperation.","who":["Jean Piaget (1932)"],"f":"F1"}]},{"t":"Social domain theory","s":"Children distinguish moral, conventional, and personal domains early.","who":["Elliot Turiel (1983)","Larry Nucci (2001)","Judith Smetana (2006)"],"f":"F1"},{"t":"Social intuitionism","s":"Moral judgment is fast intuition; reasoning is mostly post hoc.","who":["Jonathan Haidt (2001)"],"f":"F1","q":"Which intuitions?","kids":[{"t":"Moral foundations theory","s":"Care, fairness, loyalty, authority, sanctity, and liberty are innate foundations tuned by culture.","who":["Jonathan Haidt and Craig Joseph (2004)","Jesse Graham (2009)"],"f":"F1"},{"t":"Moral dumbfounding","s":"People hold judgments they cannot justify.","who":["Haidt, Björklund, Murphy (2000)"],"f":"F0"},{"t":"Shweder’s big three","s":"Ethics of autonomy, community, and divinity organize moral discourse across cultures.","who":["Richard Shweder (1997)"],"f":"F1"}]},{"t":"Dual-process theory","s":"Deontological judgments come from fast emotion, utilitarian ones from slow reasoning.","who":["Joshua Greene (2001, 2013)","Fiery Cushman (2013)","Walter Sinnott-Armstrong"],"f":"F1","q":"What are the two systems?","kids":[{"t":"Greene’s camera model","s":"Automatic settings for familiar problems, manual mode for novel ones.","who":["Joshua Greene (2013)"],"f":"F1"},{"t":"Model-free vs model-based","s":"Action-based aversions are habit-like; outcome-based judgments are planning-like.","who":["Fiery Cushman (2013)","Molly Crockett (2013)"],"f":"F1"},{"t":"Debunking deontology via dual process","s":"If deontological intuitions are alarm bells, they carry no evidential weight.","who":["Joshua Greene (2008)","Peter Singer (2005)","Selim Berker (2009), critic"],"f":"gate"}]},{"t":"Universal moral grammar","s":"A rule-based innate faculty computes moral judgments like syntax.","who":["John Mikhail (2011)","Marc Hauser (2006)","Susan Dwyer (1999)","John Rawls (1971), analogy"],"f":"F1"},{"t":"Sentimentalist psychology","s":"Moral norms are those backed by affective response.","who":["Shaun Nichols (2004)","Jesse Prinz (2007)","R.J.R. Blair (1995)"],"f":"F1","q":"What role for emotion?","kids":[{"t":"Sentimental rules","s":"Norm plus emotion equals moral norm.","who":["Shaun Nichols (2004)"],"f":"F1"},{"t":"Violence inhibition mechanism","s":"Distress cues inhibit aggression; psychopathy is its failure.","who":["R.J.R. Blair (1995)"],"f":"F1"},{"t":"Somatic marker hypothesis","s":"Bodily feelings guide decision; damage to ventromedial cortex impairs moral choice.","who":["Antonio Damasio (1994)"],"f":"F1"},{"t":"Disgust and moralization","s":"Disgust extends moral condemnation beyond harm.","who":["Paul Rozin (1999)","Daniel Kelly (2011)","Jonathan Haidt"],"f":"F1"}]},{"t":"Empathy theories","s":"Empathy drives altruism and moral development, or misleads it.","who":["Martin Hoffman (2000)","C. Daniel Batson (1991)","Paul Bloom (2016)","Frans de Waal (2009)"],"f":"F1","q":"Does empathy help?","kids":[{"t":"Empathy-altruism hypothesis","s":"Empathic concern produces genuinely altruistic motivation.","who":["C. Daniel Batson (1991, 2011)"],"f":"F1"},{"t":"Hoffman’s developmental empathy","s":"Empathy matures from global distress to concern for another’s life condition.","who":["Martin Hoffman (2000)"],"f":"F1"},{"t":"Against empathy","s":"Empathy is biased and innumerate; rational compassion is better.","who":["Paul Bloom (2016)","Jesse Prinz (2011)"],"f":"F1"}]},{"t":"Cooperation theories of morality","s":"Moral norms are solutions to problems of cooperation.","who":["Oliver Scott Curry (2016)","Nicolas Baumard (2013)","Michael Tomasello (2016)","Tage Rai and Alan Fiske (2011)"],"f":"F1","q":"Which cooperation problems?","kids":[{"t":"Morality as cooperation","s":"Seven types of cooperation yield seven universal moral domains.","who":["Oliver Scott Curry (2016, 2019)"],"f":"F1"},{"t":"Mutualistic morality","s":"Morality evolved for partner choice, producing fairness intuitions.","who":["Nicolas Baumard, Jean-Baptiste André, Dan Sperber (2013)"],"f":"F1"},{"t":"Relationship regulation theory","s":"Moral motives regulate four relational models: unity, hierarchy, equality, proportionality.","who":["Tage Rai and Alan Fiske (2011)"],"f":"F1"},{"t":"Tomasello’s natural history","s":"Joint intentionality yields second-personal morality; collective intentionality yields norms.","who":["Michael Tomasello (2016)"],"f":"F1"}]},{"t":"Dyadic morality","s":"All moral judgment is a template of an intentional agent harming a vulnerable patient.","who":["Chelsea Schein and Kurt Gray (2018)","Kurt Gray, Liane Young, Adam Waytz (2012)"],"f":"F1"},{"t":"Sacred values","s":"Some values resist trade-off; offers to trade provoke outrage.","who":["Philip Tetlock (2003)","Scott Atran (2010)"],"f":"F1"},{"t":"Norm psychology","s":"Humans have a dedicated capacity to acquire and enforce norms.","who":["Chandra Sripada and Stephen Stich (2006)","Daniel Kelly (2020)","Cristina Bicchieri (2006)"],"f":"F1"},{"t":"Moral identity and disengagement","s":"Moral behavior depends on whether morality is central to the self, and on mechanisms that switch it off.","who":["Augusto Blasi (1984)","Albert Bandura (1999)","Karl Aquino (2002)"],"f":"F1"},{"t":"Experimental philosophy of morals","s":"Folk moral concepts tested empirically, including the side-effect effect.","who":["Joshua Knobe (2003)","Shaun Nichols (2004)","Eddy Nahmias"],"f":"F1"},{"t":"Situationism","s":"Situations, not character, predict moral behavior.","who":["Stanley Milgram (1963)","John Darley and Daniel Batson (1973)","John Doris (2002)","Philip Zimbardo (1971)"],"f":"F1"},{"t":"Triune ethics","s":"Safety, engagement, and imagination ethics correspond to brain systems shaped by early care.","who":["Darcia Narvaez (2008, 2014)"],"f":"F1"},{"t":"Psychoanalytic conscience","s":"Conscience is the superego formed by internalizing authority.","who":["Sigmund Freud (1923, 1930)","Melanie Klein (1933)","Erich Fromm (1947)"],"f":"F2"},{"t":"Durkheimian sociology of morals","s":"Moral rules are society’s authority felt as sacred.","who":["Émile Durkheim (1912, 1925)"],"f":"F2"},{"t":"Moral psychology of religion","s":"Belief in watchful gods and rituals expands cooperation.","who":["Ara Norenzayan (2013)","Dominic Johnson (2016)","Azim Shariff"],"f":"F1"}]},{"t":"Where morality came from","s":"Evolutionary and cultural accounts of moral capacities, and what they imply.","who":["Charles Darwin (1871)","Edward Westermarck (1906)","Frans de Waal (1996)","Richard Joyce (2006)","Sharon Street (2006)"],"f":"F1","q":"What selected for morality, and does the story debunk it?","kids":[{"t":"Mechanisms of selection","s":"Which biological processes produce moral dispositions.","who":["Hamilton","Trivers","Alexander","Sober and Wilson"],"f":"F1","q":"Which mechanism?","kids":[{"t":"Kin selection","s":"Care for relatives spreads genes shared with them.","who":["W.D. Hamilton (1964)","J.B.S. Haldane (1955)"],"f":"F0"},{"t":"Reciprocal altruism","s":"Help those who will help back; cheater detection follows.","who":["Robert Trivers (1971)","Robert Axelrod (1984)","Leda Cosmides (1989)"],"f":"F0"},{"t":"Indirect reciprocity and reputation","s":"Help because observers will reward reputation.","who":["Richard Alexander (1987)","Martin Nowak and Karl Sigmund (1998)"],"f":"F1"},{"t":"Group selection","s":"Groups of altruists outcompete groups of egoists.","who":["Elliott Sober and David Sloan Wilson (1998)","Darwin (1871)","Samuel Bowles and Herbert Gintis (2011)"],"f":"F1"},{"t":"Strong reciprocity","s":"Humans punish cheaters at cost to themselves.","who":["Ernst Fehr and Simon Gächter (2002)","Bowles and Gintis (2011)"],"f":"F1"},{"t":"Commitment and emotions","s":"Moral emotions solve commitment problems by making threats and promises credible.","who":["Robert Frank (1988)","Thomas Schelling (1960)"],"f":"F1"},{"t":"Self-domestication and reverse dominance","s":"Hunter-gatherers suppressed bullies, selecting against dominance.","who":["Christopher Boehm (1999, 2012)","Richard Wrangham (2019)"],"f":"F1"},{"t":"Sexual selection for morality","s":"Moral virtues are displayed to attract mates.","who":["Geoffrey Miller (2007)"],"f":"F1"}]},{"t":"Primate and comparative roots","s":"Building blocks of morality are visible in other animals.","who":["Frans de Waal (1996, 2006)","Sarah Brosnan (2003)","Marc Bekoff and Jessica Pierce (2009)"],"f":"F0","q":"What do animals have?","kids":[{"t":"De Waal’s towers of morality","s":"Empathy and reciprocity are the base; norms and judgment are added by humans.","who":["Frans de Waal (2006)"],"f":"F1"},{"t":"Inequity aversion in primates","s":"Capuchins and chimpanzees reject unequal pay.","who":["Sarah Brosnan and Frans de Waal (2003)"],"f":"F0"},{"t":"Wild justice","s":"Animals have fairness, empathy, and rules of play.","who":["Marc Bekoff and Jessica Pierce (2009)"],"f":"F1"}]},{"t":"Cultural evolution of morality","s":"Norms evolve by cultural transmission and group competition.","who":["Robert Boyd and Peter Richerson (1985)","Joseph Henrich (2016)","Kim Sterelny (2012)","Peter Turchin (2016)"],"f":"F1","q":"What drives cultural selection?","kids":[{"t":"Gene-culture coevolution","s":"Culture created selection pressures for norm-following psychology.","who":["Boyd and Richerson (1985)","Joseph Henrich (2016)"],"f":"F1"},{"t":"Big Gods","s":"Moralizing high gods enabled large-scale cooperation.","who":["Ara Norenzayan (2013)"],"f":"F1"},{"t":"Cultural group selection","s":"Norms spread because groups holding them outcompete others.","who":["Peter Richerson and others (2016)","Peter Turchin (2016)"],"f":"F1"},{"t":"WEIRD psychology","s":"Church kinship rules produced individualist, impersonal moral psychology.","who":["Joseph Henrich (2020)"],"f":"F1"},{"t":"Evolved apprentice","s":"Cooperation and teaching co-evolved to make norm-governed humans.","who":["Kim Sterelny (2012)"],"f":"F1"},{"t":"Axial age theories","s":"Moralizing religions arose with affluence or state scale.","who":["Karl Jaspers (1949)","Nicolas Baumard (2015)","Robert Bellah (2011)"],"f":"F1"}]},{"t":"Evolutionary debunking arguments","s":"If evolution explains our moral beliefs without their truth, realism faces a dilemma.","who":["Sharon Street (2006)","Richard Joyce (2006)","Michael Ruse (1986)","Guy Kahane (2011)"],"f":"F2","q":"What is debunked?","kids":[{"t":"Street’s Darwinian dilemma","s":"Either evaluative truths are unrelated to selection, making our beliefs likely false, or they track it, which is a worse scientific explanation.","who":["Sharon Street (2006)"],"f":"F2"},{"t":"Joyce’s evolutionary error theory","s":"Moral belief is fully explained by selection; there is no reason to think it true.","who":["Richard Joyce (2006)"],"f":"F2"},{"t":"Ruse’s collective illusion","s":"Morality is an illusion fobbed off on us by our genes to make us cooperate.","who":["Michael Ruse (1986)","Ruse and E.O. Wilson (1986)"],"f":"F2"},{"t":"Selective debunking","s":"Only some intuitions, such as partiality, are debunked; impartial benevolence survives.","who":["Peter Singer (2005)","de Lazari-Radek and Singer (2012)","Guy Kahane (2014)"],"f":"F2"},{"t":"Sociobiological ethics","s":"Ethics should be biologicized; the good is what serves the gene pool.","who":["E.O. Wilson (1975, 1998)","Herbert Spencer (1879)"],"f":"F2"}]},{"t":"Evolutionary vindications","s":"Evolution gave us a workable, even truth-tracking, morality.","who":["Philip Kitcher (2011)","Allan Gibbard (1990)","Frans de Waal (1996)","Robert Richards (1986)"],"f":"F2","q":"How does it vindicate?","kids":[{"t":"Kitcher’s functional account","s":"Morality functions to remedy altruism failures; progress is doing this better.","who":["Philip Kitcher (2011)"],"f":"F2"},{"t":"Richards’s evolutionary ethics","s":"Evolution built us to act altruistically; that is what moral means.","who":["Robert Richards (1986)","Larry Arnhart (1998)"],"f":"F2"},{"t":"Gibbard’s coordination story","s":"Normative discussion evolved to coordinate; expressivism explains the rest.","who":["Allan Gibbard (1990)"],"f":"F2"},{"t":"Tracking account","s":"Selection favored beliefs that track moral facts because moral facts concern cooperation.","who":["David Copp (2008)","William FitzPatrick (2015)","Nicholas Sturgeon"],"f":"F2"}]},{"t":"Darwin’s own account","s":"Social instincts plus reason and habit yield conscience; the golden rule is its summit.","who":["Charles Darwin (1871)"],"f":"F2"},{"t":"Social Darwinism and its rejection","s":"Evolution licenses competition as moral, or shows nothing of the sort.","who":["Herbert Spencer (1851)","William Graham Sumner (1883)","T.H. Huxley (1893), against","Peter Kropotkin (1902), mutual aid"],"f":"F2"}]}]},{"t":"Does the origin change the answer?","s":"Far less than it feels like it should.","f":"gate","d":"Natural-fact realism, reason-based realism, and every anti-realist option survive in every origin cell. Only “grounded in the maker’s will” depends on the origin, and it meets Euthyphro wherever it lands. If the ground is the Un-Concept, nothing moral can be read off it at all; that is your Gate 2. If the maker is indifferent or alien, its values do not bind you.","doc":"06-morality.md §4","kids":[{"t":"Origin-independence","s":"Morality binds whatever made us, because it rests on reason, nature, or our own construction.","who":["Immanuel Kant (1785)","Philippa Foot (2001)","Christine Korsgaard (1996)","Derek Parfit (2011)"],"f":"F2"},{"t":"Origin-dependence through command","s":"Only a maker’s will grounds obligation, so who made us settles what we owe.","who":["Ockham (c. 1320)","Robert Adams (1999)","G.E.M. Anscombe (1958)"],"f":"gate"},{"t":"Debunking genealogy","s":"If the origin explains the belief without its truth, the belief loses its warrant.","who":["Sharon Street (2006)","Richard Joyce (2006)","Nietzsche (1887)"],"f":"F2"},{"t":"Vindicating genealogy","s":"Some origin stories show why a value earns its keep.","who":["Bernard Williams (2002)","Matthieu Queloz (2021)","Philip Kitcher (2011)"],"f":"F2"},{"t":"Genetic fallacy reply","s":"Where a belief came from says nothing about whether it is true.","who":["Morris Cohen and Ernest Nagel (1934)","Erik Wielenberg (2010)"],"f":"F2"},{"t":"Indifferent maker","s":"A maker with no concern for us leaves morality exactly where it was.","who":["Hume’s Philo (1779)","Deism","Epicurus (c. 300 BC)"],"f":"F2"},{"t":"Alien or hostile maker","s":"A maker whose values differ from ours does not bind us.","who":["Gnostic Demiurge","H.P. Lovecraft (1928)","David Hume (1779)"],"f":"F2"},{"t":"Simulation ethics","s":"If we are simulated, the simulators’ values still do not bind; our reasons stay ours.","who":["Nick Bostrom (2003)","David Chalmers (2022)","Eric Steinhart (2010)"],"f":"F2"},{"t":"Created by evolution alone","s":"Selection produced our morality; theories divide on whether that debunks it.","who":["Darwin (1871)","Joyce (2006)","Kitcher (2011)","de Waal (1996)"],"f":"F2"}],"q":"How could the origin bear on morality?"},{"t":"Does our morality match the apex?","s":"If the Unconception is the most whole thing, are human morals aligned with it, inverted, or unrelated?","q":"How does our moral sense relate to the ground?","doc":"15-morality-and-the-apex.md","kids":[{"t":"Aligned","s":"Human good is real good. Wholeness is goodness.","who":["Plotinus","Aquinas: being and good are convertible","Spinoza","Natural law","Confucian tian","Stoic logos"],"addr":"R1","f":"F2","d":"A real and ancient premise, not a derivation. Moore’s open question stands against defining good as wholeness. Favored by cross-cultural convergence and moral progress as discovery.","kids":[{"t":"Neoplatonic emanation","s":"The One is the Good; all being is good insofar as it is, and evil is privation.","who":["Plotinus (c. 250)","Proclus (c. 450)","Pseudo-Dionysius (c. 500)","Augustine (c. 400)"],"f":"F3","q":"How does evil fit?","kids":[{"t":"Privation theory of evil","s":"Evil is lack of being, not a thing.","who":["Augustine (c. 400)","Aquinas (1270)","Plotinus"],"f":"F2"},{"t":"Ascent through virtue","s":"Moral purification is the first step in return to the One.","who":["Plotinus, Ennead I.2","Porphyry (c. 300)","Iamblichus (c. 300)"],"f":"F3"}]},{"t":"Convertibility of being and good","s":"Every being is good as a being; God, pure being, is the Good itself.","who":["Thomas Aquinas (1270)","Étienne Gilson (1948)","Jacques Maritain (1943)","Norris Clarke (2001)"],"f":"F3","q":"How known?","kids":[{"t":"Fourth Way","s":"Grades of goodness point to a maximum that causes all goodness.","who":["Aquinas, Summa I q.2"],"f":"F2"},{"t":"Analogy of being","s":"Creaturely goodness is analogous, not identical, to God’s.","who":["Aquinas","Erich Przywara (1932)"],"f":"F3"}]},{"t":"Spinoza’s blessedness","s":"Good is what increases our power of understanding; the highest good is knowledge of God or Nature.","who":["Baruch Spinoza (1677)"],"f":"F2"},{"t":"Natural law as cosmic order","s":"Right reason reads a law written into nature by its author.","who":["Cicero (c. 50 BC)","Aquinas (1270)","Grotius (1625)","John Finnis (1980)"],"f":"F2"},{"t":"Confucian tian","s":"Heaven’s mandate and human nature are one; sagehood is aligning with Heaven.","who":["Mencius (c. 300 BC)","Zhongyong","Dong Zhongshu (c. 130 BC)","Zhu Xi (c. 1180)","Zhang Zai (c. 1070)"],"f":"F2"},{"t":"Stoic providence","s":"The cosmos is rational and good; virtue is agreement with its logos.","who":["Chrysippus (c. 240 BC)","Cleanthes (c. 260 BC)","Epictetus (c. 110)","Marcus Aurelius (c. 170)"],"f":"F2"},{"t":"Advaita sat-cit-ānanda","s":"Brahman is being, consciousness, and bliss; ethics is alignment with what one already is.","who":["Śaṅkara (c. 800)","Ramana Maharshi (c. 1930)"],"f":"F3"},{"t":"Leibniz’s best possible world","s":"A perfect God chose the best world; apparent evil serves the whole.","who":["G.W. Leibniz (1710)","Alexander Pope (1734)"],"f":"F2"},{"t":"Hegel’s rational actual","s":"History is spirit coming to know itself; the ethical life realizes reason.","who":["G.W.F. Hegel (1807, 1821)"],"f":"F2"},{"t":"Process theism","s":"God lures creation toward richer experience; value is woven into becoming.","who":["Alfred North Whitehead (1929)","Charles Hartshorne (1948)","John Cobb (1976)"],"f":"F2"},{"t":"Teilhard’s Omega","s":"Evolution converges toward a point of love and consciousness.","who":["Pierre Teilhard de Chardin (1955)"],"f":"F2"},{"t":"Adams’s finite and infinite goods","s":"God is the Good itself; finite things are good by resembling God.","who":["Robert Adams (1999)"],"f":"F2"},{"t":"Murdoch’s sovereign Good","s":"The Good is a transcendent reality attention can approach, without God.","who":["Iris Murdoch (1970)"],"f":"F2"},{"t":"Moral argument for God","s":"Objective moral obligation is best explained by a good God.","who":["Kant (1788), as postulate","John Henry Newman (1870)","C.S. Lewis (1943)","William Lane Craig (2008)","Baggett and Walls (2011)"],"f":"F2"},{"t":"Perennialism","s":"All traditions point to one transcendent Good.","who":["Aldous Huxley (1945)","Frithjof Schuon (1948)","Seyyed Hossein Nasr (1981)"],"f":"F3"},{"t":"Great Chain of Being","s":"Reality is a graded hierarchy of goodness from matter to God.","who":["Arthur Lovejoy (1936), historian","Macrobius","Pseudo-Dionysius"],"f":"F2"},{"t":"Islamic tawḥīd ethics","s":"All good flows from the one God; Sufi perfection is realizing this.","who":["Ibn Arabi (c. 1230)","Mulla Sadra (c. 1630)","al-Ghazali (c. 1100)"],"f":"F3"},{"t":"Kabbalistic sefirot","s":"Divine attributes structure both cosmos and moral life; kindness and judgment are balanced.","who":["Zohar (c. 1290)","Isaac Luria (c. 1570)","Moses Cordovero (1588)"],"f":"F3"},{"t":"Zoroastrian asha","s":"Truth and order are the god’s nature; humans choose to join them.","who":["Zarathustra (c. 1000 BC)"],"f":"F2"},{"t":"Hindu ṛta and dharma","s":"Cosmic order and human duty are one order.","who":["Rigveda","Manusmṛti"],"f":"F2"},{"t":"Nagel’s natural teleology","s":"Value is built into a cosmos that tends toward mind and its grasp of good.","who":["Thomas Nagel (2012)"],"f":"F2"},{"t":"Weil’s Good and gravity","s":"The Good is real and supernatural; grace draws against the gravity of nature.","who":["Simone Weil (1947)"],"f":"F3"},{"t":"Levinas’s Good beyond being","s":"The Good commands from beyond ontology through the face.","who":["Emmanuel Levinas (1974)","Plato, Republic 509b"],"f":"F3"}],"q":"How is wholeness goodness?"},{"t":"Inverted","s":"What we call evil is what the ground favors.","who":["Gnosticism: the world-maker is evil","Nietzsche’s revaluation","de Sade","Dystheism"],"addr":"R2","f":"F2","d":"Favored only by a systematic anti-correlation between what flourishes and what we call good, or a maker shown to prefer suffering.","kids":[{"t":"Gnosticism","s":"The world-maker is ignorant or evil; the true God is alien; salvation is escape.","who":["Valentinus (c. 150)","Sethian texts","Marcion (c. 140)","Hans Jonas (1958), historian"],"f":"F3","q":"How evil is the maker?","kids":[{"t":"Marcionism","s":"The creator of the Old Testament is just but harsh; the alien God of Jesus is good.","who":["Marcion (c. 140)"],"f":"F3"},{"t":"Sethian Demiurge","s":"Yaldabaoth made the world in ignorance and arrogance.","who":["Apocryphon of John (c. 150)"],"f":"F3"},{"t":"Valentinian fall","s":"The world results from Sophia’s error; the Demiurge is a lesser craftsman.","who":["Valentinus (c. 150)","Ptolemy"],"f":"F3"}]},{"t":"Dualist cosmologies","s":"Two ultimate principles; our world belongs mostly to the dark one.","who":["Mani (c. 250)","Cathars (c. 1150)","Bogomils (c. 950)"],"f":"F3"},{"t":"Nietzsche’s revaluation","s":"Christian morality inverted noble values; the ground, will to power, favors what morality condemns.","who":["Friedrich Nietzsche (1887, 1888)"],"f":"F2"},{"t":"De Sade’s nature","s":"Nature commands destruction; virtue is a lie against it.","who":["Marquis de Sade (1795)"],"f":"F2"},{"t":"Dystheism","s":"God exists and is not good.","who":["David Blumenthal (1993)","Elie Wiesel (1979), partly","Ivan Karamazov (1880)"],"f":"F3","q":"What follows?","kids":[{"t":"Misotheism","s":"God exists and deserves hatred or rebellion.","who":["Bernard Schweizer (2010), historian","Philip Pullman (2000)","Percy Shelley (1813)"],"f":"F3"},{"t":"Protest theology","s":"Argue with God from within the covenant.","who":["Elie Wiesel (1979)","Anson Laytner (1990)","David Blumenthal (1993)"],"f":"F3"},{"t":"Ivan’s rebellion","s":"Even if God’s plan justifies suffering, one returns the ticket.","who":["Fyodor Dostoevsky (1880)","Albert Camus (1951)"],"f":"F2"}]},{"t":"Romantic Satanism","s":"The rebel against the tyrant God is the true moral hero.","who":["William Blake (1793)","Percy Shelley (1820)","Lord Byron (1821)","Anatole France (1914)"],"f":"F2"},{"t":"Cosmic pessimism","s":"Existence itself is the evil; consciousness is a mistake.","who":["Philipp Mainländer (1876)","Peter Wessel Zapffe (1933)","Thomas Ligotti (2010)","Eugene Thacker (2011)"],"f":"F2","q":"What is the wrong?","kids":[{"t":"Mainländer’s dying God","s":"God’s suicide became the world; the will to die drives everything.","who":["Philipp Mainländer (1876)"],"f":"F2"},{"t":"Zapffe’s tragic surplus","s":"Consciousness is an overdeveloped faculty that nature did not fit for happiness.","who":["Peter Wessel Zapffe (1933)"],"f":"F2"},{"t":"Ligotti’s malignant uselessness","s":"Being alive is not all right; consciousness is the parent of all horrors.","who":["Thomas Ligotti (2010)"],"f":"F2"},{"t":"Antinatalism","s":"Creating a life always harms it; the world favors what it should not.","who":["David Benatar (2006)","Julio Cabrera (1996)"],"f":"F2"}]},{"t":"Schopenhauer’s blind will","s":"The ground is a striving without aim; morality is denial of what the ground does.","who":["Arthur Schopenhauer (1818, 1840)","Eduard von Hartmann (1869)"],"f":"F2"},{"t":"Left-hand Satanism","s":"Indulgence, pride, and vital existence against the herd morality.","who":["Anton LaVey (1969)","Michael Aquino (1975)"],"f":"F2"},{"t":"Stirner’s egoist inversion","s":"What morality calls sacred is a spook that steals from the unique one.","who":["Max Stirner (1844)"],"f":"F2"},{"t":"Bataille’s sovereign transgression","s":"Evil, as transgression, is the deepest expression of the sacred.","who":["Georges Bataille (1957)"],"f":"F2"}],"q":"What favors the inversion?"},{"t":"Unrelated","s":"The ground has no value dimension. Morality is local: evolved or built.","who":["Physicalism with evolutionary debunking (Street, Joyce)","Hume","Expressivism","Constructivism","Camus"],"addr":"R3","f":"F2","kids":[{"t":"Physicalism with debunking","s":"The universe has no value dimension; morality is an evolved local device.","who":["Sharon Street (2006)","Richard Joyce (2006)","Michael Ruse (1986)","Alex Rosenberg (2011)"],"f":"F2"},{"t":"Hume’s wall","s":"No ought from is; the world is silent on value.","who":["David Hume (1739)"],"f":"F2"},{"t":"Expressivist detachment","s":"Value talk expresses us, not the world; the ground is beside the point.","who":["Simon Blackburn (1998)","Allan Gibbard (1990)"],"f":"F2"},{"t":"Constructivist independence","s":"Morality is built by agents from within; it does not read the ground.","who":["Christine Korsgaard (1996)","Sharon Street (2010)","John Rawls (1980)"],"f":"F2"},{"t":"Absurdism","s":"The universe is indifferent; meaning and value come from revolt.","who":["Albert Camus (1942, 1951)","Thomas Nagel (1971)"],"f":"F2"},{"t":"Existentialist humanism","s":"No God, no essence; humans are what they make themselves.","who":["Jean-Paul Sartre (1946)","Simone de Beauvoir (1947)"],"f":"F2"},{"t":"Scientific indifference","s":"The universe has no purpose; ethics is human.","who":["Bertrand Russell (1903)","Jacques Monod (1970)","Steven Weinberg (1977)","Richard Dawkins (1995)"],"f":"F2","q":"What follows for value?","kids":[{"t":"A Free Man’s Worship","s":"Dignity is found in affirming ideals against an indifferent nature.","who":["Bertrand Russell (1903)"],"f":"F2"},{"t":"Chance and necessity","s":"Ethics of knowledge replaces animist teleology.","who":["Jacques Monod (1970)"],"f":"F2"},{"t":"Pitiless indifference","s":"Nature is neither cruel nor kind; morality must be built against genes.","who":["Richard Dawkins (1995, 1976)"],"f":"F2"},{"t":"Cosmicism","s":"Humanity is insignificant in a cosmos without care; morality is provincial.","who":["H.P. Lovecraft (1928)"],"f":"F2"}]},{"t":"Epicurean gods","s":"The gods exist but take no interest in us; ethics is prudence about pleasure.","who":["Epicurus (c. 300 BC)","Lucretius (c. 55 BC)"],"f":"F2"},{"t":"Deism","s":"A maker who set the laws and withdrew leaves morality to reason.","who":["Voltaire (1764)","Thomas Paine (1794)","Matthew Tindal (1730)"],"f":"F2"},{"t":"Xunzi’s Heaven","s":"Heaven is nature with no moral intention; the sage makes order himself.","who":["Xunzi, Discourse on Heaven (c. 250 BC)"],"f":"F2"},{"t":"Laozi’s inhumane Heaven","s":"Heaven and earth are not humane; they treat all things as straw dogs.","who":["Laozi, ch. 5 (c. 400 BC)"],"f":"F2"},{"t":"Secular humanism","s":"Ethics is grounded in human needs and reason, without cosmic backing.","who":["Paul Kurtz (1973)","Humanist Manifesto (1933, 1973)","Corliss Lamont (1949)"],"f":"F2"},{"t":"Aristotelian Prime Mover","s":"The first cause thinks itself and cares for nothing; human good comes from human function.","who":["Aristotle, Metaphysics XII","Alexander of Aphrodisias (c. 200)"],"f":"F2"},{"t":"Foot’s species-relative good","s":"Goodness is a fact about the human life form, indifferent to cosmic origin.","who":["Philippa Foot (2001)"],"f":"F2"},{"t":"Williams’s world not made for us","s":"Ethical thought must live without the belief that the universe is on its side.","who":["Bernard Williams (1985, 1993)"],"f":"F2"},{"t":"Weber’s disenchantment","s":"Modern reason empties the world of value; value becomes a matter of choice.","who":["Max Weber (1917)"],"f":"F2"},{"t":"Dewey’s naturalism","s":"Values grow out of human experience and inquiry; no cosmic sanction is needed or possible.","who":["John Dewey (1929, 1934)"],"f":"F2"},{"t":"Freud’s illusion","s":"Religious morality is wish-fulfilment; civilization must build its ethic without it.","who":["Sigmund Freud (1927, 1930)"],"f":"F2"}],"q":"Where does morality come from instead?"},{"t":"Partly aligned, distorted","s":"Some of our good is real, some is noise.","who":["Plato’s shadows","Christian fallen-but-capable","Kant","Buddhist ignorance over dharma"],"addr":"R4","f":"F2","d":"Favored by partial convergence plus stable disagreement.","kids":[{"t":"Plato’s cave","s":"We see shadows of the Good and mistake them; dialectic corrects.","who":["Plato, Republic VII (c. 380 BC)"],"f":"F3"},{"t":"Fallen but capable","s":"Sin darkens moral knowledge without erasing it; conscience and law remain.","who":["Augustine (c. 400)","Aquinas (1270)","John Calvin (1559)","C.S. Lewis (1943)"],"f":"F2","q":"How much remains?","kids":[{"t":"Synderesis","s":"A natural habit of first moral principles survives the fall intact.","who":["Aquinas (1270)","Bonaventure (c. 1250)"],"f":"F2"},{"t":"Total depravity with common grace","s":"Reason is corrupt but God preserves civic virtue.","who":["John Calvin (1559)","Abraham Kuyper (1898)"],"f":"F2"},{"t":"Sensus divinitatis and moral sense","s":"An innate sense of God and right persists though damaged.","who":["Calvin","Alvin Plantinga (2000)"],"f":"F2"},{"t":"Tillich’s estrangement","s":"We are estranged from the ground of being yet not severed.","who":["Paul Tillich (1957)"],"f":"F2"}]},{"t":"Kant’s two standpoints","s":"The moral law is real and known, yet we can never be sure our maxims are pure; radical evil is in us.","who":["Immanuel Kant (1785, 1793)"],"f":"F2"},{"t":"Buddhist ignorance over dharma","s":"Avidya distorts a real moral order; awakening sees it clearly.","who":["Buddha","Nagarjuna (c. 150)","Buddha-nature texts"],"f":"F2","q":"What is undistorted?","kids":[{"t":"Buddha-nature","s":"All beings already have awakened nature; defilements are adventitious.","who":["Tathāgatagarbha sutras (c. 300)","Dogen (1231)"],"f":"F3"},{"t":"Two truths","s":"Conventional morality is partly right and ultimately empty.","who":["Nagarjuna","Candrakirti"],"f":"F3"}]},{"t":"Advaita māyā","s":"The world of moral distinction is appearance over a non-dual reality; partly true at its own level.","who":["Śaṅkara (c. 800)"],"f":"F3"},{"t":"Zoroastrian mixture","s":"The present age is a mixture of good and evil; humans help separate them.","who":["Bundahishn (c. 900)"],"f":"F2"},{"t":"Two inclinations","s":"Humans have a good and an evil inclination; the law trains the first.","who":["Rabbinic Judaism, Genesis Rabbah","Maimonides"],"f":"F2"},{"t":"Fitra and nafs","s":"Humans are born with a sound disposition toward God that the lower soul distorts.","who":["Qurʾan 30:30","al-Ghazali (c. 1100)","Ibn Taymiyya"],"f":"F2"},{"t":"Moral progress as partial discovery","s":"We have found some moral truth and are finding more.","who":["Derek Parfit (2011)","Peter Singer (1981)","Allen Buchanan and Russell Powell (2018)"],"f":"F2"},{"t":"Third-factor partial vindication","s":"Selection tracked truth in some domains and not others.","who":["David Enoch (2010)","Erik Wielenberg (2010)","Guy Kahane (2014)"],"f":"F2"},{"t":"Sidgwick’s dualism","s":"Reason endorses both self-interest and impartial good and cannot reconcile them.","who":["Henry Sidgwick (1874)"],"f":"F2"},{"t":"Hegelian dialectic","s":"Each moral form is partly true and is corrected by the next.","who":["G.W.F. Hegel (1807)"],"f":"F2"},{"t":"Freud’s civilization","s":"The superego is a distorted internalization of a real need for cooperation.","who":["Sigmund Freud (1930)"],"f":"F2"},{"t":"Jung’s shadow","s":"Moral wholeness requires integrating what morality repressed.","who":["Carl Jung (1951)"],"f":"F2"},{"t":"Murdoch’s unselfing","s":"The ego distorts; attention slowly corrects vision of the Good.","who":["Iris Murdoch (1970)"],"f":"F2"},{"t":"Reformed epistemology of morals","s":"Moral knowledge is warranted when faculties work as designed, and they partly do.","who":["Alvin Plantinga (1993, 2000)"],"f":"F2"},{"t":"Moral foundations partly universal","s":"Some foundations track real cooperation problems; others are cultural noise.","who":["Jonathan Haidt (2012)","Oliver Scott Curry (2019)"],"f":"F1"},{"t":"Original sin theories","s":"A primal fault explains why we know the good and do not do it.","who":["Augustine (c. 400)","Reinhold Niebuhr (1941)","Paul Ricoeur (1960)"],"f":"F2"}],"q":"What distorts?"},{"t":"Unstatable","s":"Under the Unconception, no relation can be asserted either way.","who":["Apophatic traditions","Job","Gate 2"],"addr":"R5","f":"F4","d":"Your own apex forces this cell. Neither wholeness-is-good nor its inverse can be asserted. Morality has to be grounded below the apex, in nature, reason, or construction.","kids":[{"t":"Christian apophaticism","s":"God is beyond every predicate, including good; the way up is the way of negation.","who":["Pseudo-Dionysius (c. 500)","Meister Eckhart (c. 1300)","John Scotus Eriugena (c. 860)","The Cloud of Unknowing (c. 1380)","Nicholas of Cusa (1440)"],"f":"F4","q":"What is left to say?","kids":[{"t":"Eckhart’s Godhead beyond God","s":"The Godhead is beyond the God who is good; the soul must let go even of goodness.","who":["Meister Eckhart (c. 1300)"],"f":"F4"},{"t":"Learned ignorance","s":"The maximum is beyond all opposition, including good and evil.","who":["Nicholas of Cusa (1440)"],"f":"F4"},{"t":"Dionysian negation","s":"Affirm, deny, then deny the denial.","who":["Pseudo-Dionysius (c. 500)"],"f":"F4"}]},{"t":"Maimonidean negative theology","s":"Nothing positive can be said of God; goodness is only a description of God’s effects.","who":["Maimonides (1190)"],"f":"F4"},{"t":"Ein Sof","s":"The infinite before the sefirot has no attribute at all.","who":["Kabbalah, Zohar (c. 1290)","Azriel of Gerona (c. 1230)"],"f":"F4"},{"t":"Ibn Arabi’s unknowable Essence","s":"The Essence is beyond all names, including the Good; names belong to the level of manifestation.","who":["Ibn Arabi (c. 1230)"],"f":"F4"},{"t":"Nirguṇa Brahman","s":"Brahman without attributes cannot be called good; ethics belongs to the qualified level.","who":["Śaṅkara (c. 800)","Upanishads, neti neti"],"f":"F4"},{"t":"Madhyamaka silence","s":"Ultimately no view is held; the Buddha taught no fixed position on the ultimate.","who":["Nagarjuna (c. 150)","Candrakirti (c. 600)"],"f":"F4"},{"t":"Buddha’s unanswered questions","s":"Some questions are set aside as not tending to release.","who":["Cūḷamālukya Sutta","Sañjaya Belaṭṭhiputta (c. 500 BC), agnostic"],"f":"F4"},{"t":"Zen non-duality","s":"Think neither good nor evil; what is your original face?","who":["Hui-neng (c. 700)","Dogen (1231)","Mumonkan (1228)"],"f":"F4"},{"t":"Zhuangzi beyond right and wrong","s":"Heaven’s standpoint has no this and that; the sage rests in what cannot be said.","who":["Zhuangzi (c. 300 BC)"],"f":"F4"},{"t":"Laozi’s unnameable Dao","s":"The Dao that can be spoken is not the constant Dao.","who":["Laozi, ch. 1 (c. 400 BC)"],"f":"F4"},{"t":"Job and the whirlwind","s":"God answers from the storm with questions, not a moral account.","who":["Book of Job (c. 500 BC)","Robert Alter (2010), reading"],"f":"F4"},{"t":"Ecclesiastes","s":"Under the sun no moral order can be read off events; fear God anyway.","who":["Qohelet (c. 250 BC)"],"f":"F4"},{"t":"Kierkegaard’s paradox","s":"Abraham’s faith cannot be justified in the language of ethics; it can only be admired in silence.","who":["Søren Kierkegaard (1843)"],"f":"F4"},{"t":"Wittgenstein’s transcendental ethics","s":"Ethics cannot be put into words; the sense of the world lies outside it.","who":["Ludwig Wittgenstein (1921, 1929)"],"f":"F4"},{"t":"Otto’s numinous","s":"The holy is prior to and other than the moral; mysterium tremendum.","who":["Rudolf Otto (1917)"],"f":"F4"},{"t":"Kant’s noumenal limit","s":"We cannot know things in themselves, so no relation between the ground and morality can be asserted, only postulated.","who":["Immanuel Kant (1781, 1788)"],"f":"F3"},{"t":"Hume’s Philo","s":"The moral attributes of the first cause are wholly inscrutable from the evidence.","who":["David Hume (1779)"],"f":"F3"},{"t":"Skeptical theism","s":"We are in no position to judge whether God has reasons for what looks evil.","who":["Stephen Wykstra (1984)","Michael Bergmann (2001)","William Alston (1991)"],"f":"F3"},{"t":"Pyrrhonian suspension","s":"On whether anything is by nature good, suspend judgment.","who":["Sextus Empiricus (c. 200)","Pyrrho (c. 300 BC)"],"f":"F3"},{"t":"Negative dialectics","s":"There is no right life in the wrong one; the whole cannot be affirmed or named.","who":["Theodor Adorno (1951, 1966)"],"f":"F3"},{"t":"Divine hiddenness","s":"A God whose relation to morality is hidden may not be assertable at all.","who":["J.L. Schellenberg (1993)","Blaise Pascal (1670)"],"f":"F3"},{"t":"Marcel’s mystery","s":"The ground is a mystery one participates in, not a problem one solves.","who":["Gabriel Marcel (1950)","Karl Rahner (1976)"],"f":"F3"},{"t":"Sufi fanāʾ","s":"In annihilation of the self, distinctions including good and evil fall away.","who":["al-Junayd (c. 900)","al-Hallaj (922)","Rumi (c. 1260)"],"f":"F4"}],"q":"What silences the question?"}]},{"t":"Your candidate: the ascent principle","s":"The good is moving up levels of understanding.","addr":"M2c N3","d":"Coherent as a perfectionist virtue ethic. Close to Aristotle’s contemplative life, Spinoza’s third kind of knowledge, Teilhard’s Omega. It needs a bridge from “cleaner description” to “better”. The anti-school corollary is empirically weak; the defensible core is Illich’s point that institutions can swap credentialing for learning.","doc":"06-morality.md §7","kids":[{"t":"Growth as the only moral end","s":"The good is growing in understanding and capacity; no fixed end.","who":["John Dewey (1920, 1922)","John Stuart Mill (1859), development","Henri Bergson (1907)"],"f":"F2"},{"t":"Contemplation as the highest good","s":"Understanding is the activity most worth doing for itself.","who":["Aristotle, Ethics X","Spinoza (1677), third kind of knowledge","Plotinus (c. 250)"],"f":"F2"},{"t":"Evolutionary and integral ascent","s":"Cosmos, life, and mind climb toward higher unity; the good is helping the climb.","who":["Pierre Teilhard de Chardin (1955)","Sri Aurobindo (1920)","Julian Huxley (1957)","Ken Wilber (1995)"],"f":"F2"},{"t":"Self-overcoming","s":"Value is in surpassing what one was.","who":["Friedrich Nietzsche (1883)","Ralph Waldo Emerson (1841)"],"f":"F2"},{"t":"Transhumanism","s":"Enhancing human capacities, including cognitive, is a moral good.","who":["Nick Bostrom (2005)","Julian Savulescu (2009)","Max More (1990)"],"f":"F2"},{"t":"Ladder of love","s":"Desire climbs from bodies to laws to knowledge to the Beautiful itself.","who":["Plato, Symposium (c. 380 BC)","Bonaventure (1259)","Dante (1320)"],"f":"F3"},{"t":"Deschooling","s":"Institutions swap learning for credentials; real learning is convivial and self-directed.","who":["Ivan Illich (1971)","Paulo Freire (1968)","John Holt (1964)"],"f":"F2"},{"t":"Epistemic virtue as moral virtue","s":"Intellectual virtues such as curiosity and honesty are part of good character.","who":["Linda Zagzebski (1996)","Jason Baehr (2011)","Robert Roberts and Jay Wood (2007)"],"f":"F2"},{"t":"Open question against ascent","s":"Calling understanding good needs a bridge; better description is not better by definition.","who":["G.E. Moore (1903)"],"f":"gate"}],"q":"What are its nearest neighbors?"}]},{"t":"What we can know","s":"The fog front, made precise.","q":"From where we stand, how far away is a claim?","doc":"07-fog-front.md","kids":[{"t":"Settled","s":"Tested, result in hand.","f":"F0","d":"Decoders read gist, not verbatim. Glia roughly equal neurons. No Planck-scale pixelation at tested sensitivity. Courts reject fMRI lie detection. Interaction dualism leaves no trace.","kids":[{"t":"Theories of justification","s":"What structure a body of beliefs must have for any of them to be justified.","who":["Descartes (1641)","BonJour (1985)","Klein (1999)","Haack (1993)"],"f":"F2","q":"Where does justification bottom out?","kids":[{"t":"Foundationalism","s":"Some beliefs are justified without support from other beliefs, and everything else rests on them.","who":["Descartes (1641)","Chisholm (1966)","BonJour (1998)","Fumerton (1995)"],"f":"F2","q":"How firm must the foundation be?","kids":[{"t":"Classical foundationalism","s":"Basic beliefs are infallible or indubitable: the given of sense or the truths of reason.","who":["Descartes (1641)","Russell (1912)","Lewis (1946)","Fumerton (1995)"],"f":"F2","q":"Is there a given?","kids":[{"t":"Myth of the given","s":"Nothing can be both a non-conceptual episode and a reason; the given cannot justify.","who":["Sellars (1956)","BonJour (1978)","Davidson (1986)","McDowell (1994)"],"f":"F2"},{"t":"Acquaintance theory","s":"Direct acquaintance with one's experience is a non-inferential source of justification that escapes the regress.","who":["Fumerton (1995, 2001)","Russell (1912)","BonJour (2003)","Fales (1996)"],"f":"F2"}]},{"t":"Modest foundationalism","s":"Basic beliefs are only defeasibly justified by experience; foundations can be wrong.","who":["Audi (1993)","Alston (1976)","Pryor (2000), dogmatism","Huemer (2001), phenomenal conservatism"],"f":"F2"},{"t":"Reformed epistemology","s":"Belief in God can be properly basic, warranted by a faculty without argument.","who":["Plantinga (1983, 2000)","Alston (1991)","Wolterstorff (1983)"],"f":"F2"}]},{"t":"Coherentism","s":"No belief is basic; a belief is justified by how well it fits a coherent system.","who":["Neurath (1932)","Sellars (1956)","BonJour (1985)","Lehrer (1990)","Quine (1951)"],"f":"F2","q":"What keeps coherence tied to truth?","kids":[{"t":"Isolation objection","s":"A coherent story could float free of the world; coherence alone does not track truth.","who":["Sosa (1980)","Plantinga (1993)","BonJour (1985), observation requirement"],"f":"F2"},{"t":"Bayesian coherence results","s":"Coherence is not truth-conducive in general; more coherent sets can be less probable.","who":["Bovens and Hartmann (2003)","Olsson (2005)","Klein and Warfield (1994)"],"f":"F0"},{"t":"Web of belief","s":"Statements face experience together; any can be revised, and only pragmatic choice decides which.","who":["Quine (1951)","Quine and Ullian (1970)","Duhem (1906)"],"f":"F2"}]},{"t":"Infinitism","s":"Justification requires an endless non-repeating chain of reasons, each available on demand; that is not vicious.","who":["Klein (1999, 2005)","Aikin (2011)","Peijnenburg and Atkinson (2010), probabilistic infinitism"],"f":"F2"},{"t":"Foundherentism","s":"Justification is like a crossword: clues (experience) and intersecting entries (other beliefs) support each other.","who":["Haack (1993)","Haack (2009)"],"f":"F2"},{"t":"Agrippan trilemma","s":"Any chain of reasons must end arbitrarily, circle, or regress forever; skeptics take this as decisive.","who":["Sextus Empiricus (c. 200)","Agrippa (1st c.)","Fogelin (1994)","Williams (2001)"],"f":"F2"}]},{"t":"Internalism and externalism","s":"Whether what justifies a belief must be accessible to the believer.","who":["BonJour (1980)","Goldman (1979)","Alston (1986)","Conee and Feldman (2001)"],"f":"F2","q":"Must the justifier be accessible?","kids":[{"t":"Access internalism","s":"A belief is justified only by factors the subject can become aware of on reflection.","who":["Chisholm (1977)","BonJour (1985)","Fumerton (1995)"],"f":"F2"},{"t":"Mentalism","s":"Justification depends only on the subject's mental states, whether or not accessible.","who":["Conee and Feldman (2001, 2004)","Pollock and Cruz (1999)"],"f":"F2"},{"t":"Evidentialism","s":"One should believe exactly what one's evidence supports, no more and no less.","who":["Clifford (1877)","Feldman and Conee (1985)","Conee and Feldman (2004)"],"f":"F2"},{"t":"Process reliabilism","s":"A belief is justified if produced by a process that reliably yields truth, whether or not the subject knows this.","who":["Goldman (1979, 1986)","Armstrong (1973)","Ramsey (1931)"],"f":"F2","q":"What are the standing objections?","kids":[{"t":"Generality problem","s":"Every belief-forming event belongs to many process types with different reliabilities; which one counts?","who":["Conee and Feldman (1998)","Feldman (1985)","Goldman (1986), reply","Comesaña (2006), reply"],"f":"F2"},{"t":"New evil demon","s":"A deceived twin with unreliable faculties seems as justified as we are, so reliability cannot be what justifies.","who":["Cohen (1984)","Lehrer and Cohen (1983)","Goldman (1988), normal worlds","Sosa (1991), reply"],"f":"F2"},{"t":"Clairvoyance case","s":"A reliable clairvoyant with no reason to trust himself seems unjustified, so reliability is not sufficient.","who":["BonJour (1980)","Lehrer (1990), Mr Truetemp","Goldman (2008), reply"],"f":"F2"}]},{"t":"Proper functionalism","s":"Warrant is belief produced by faculties functioning as designed in the environment they were designed for.","who":["Plantinga (1993)","Bergmann (2006)","Graham (2012)"],"f":"F2"},{"t":"Virtue epistemology","s":"Knowledge is belief that is true because of the believer's intellectual virtues.","who":["Sosa (1991, 2007)","Zagzebski (1996)","Greco (2010)","Baehr (2011)"],"f":"F2","q":"Virtues as faculties or as character?","kids":[{"t":"Virtue reliabilism","s":"Virtues are reliable faculties like sight and memory; knowledge is apt belief, accurate because adroit.","who":["Sosa (1991, 2007, 2015)","Greco (1999, 2010)","Pritchard (2012), anti-luck virtue"],"f":"F2","q":"Animal or reflective?","kids":[{"t":"Animal and reflective knowledge","s":"Animal knowledge is apt belief; reflective knowledge is apt belief aptly noted; only the second answers the skeptic.","who":["Sosa (2007, 2009)","Sosa (2011)"],"f":"F2"},{"t":"Credit view","s":"Knowledge is true belief for which the believer deserves credit; testimony and luck are the hard cases.","who":["Greco (2003, 2010)","Riggs (2002)","Lackey (2007), contra"],"f":"F2"}]},{"t":"Virtue responsibilism","s":"Virtues are character traits like open-mindedness and intellectual courage; knowledge is their fruit.","who":["Zagzebski (1996)","Code (1987)","Montmarquet (1993)","Baehr (2011)","Roberts and Wood (2007)"],"f":"F2"}]}]},{"t":"Analyses of knowledge","s":"What must be added to true belief to make knowledge, after the counterexamples to justified true belief.","who":["Gettier (1963)","Nozick (1981)","Williamson (2000)","Zagzebski (1994)"],"f":"F2","q":"What blocks luck?","kids":[{"t":"Gettier problem","s":"Justified true belief can be true by luck, so justification, truth and belief are not enough.","who":["Gettier (1963)","Russell (1948), stopped clock","Chisholm (1966), sheep in the field"],"f":"F0"},{"t":"No false lemmas","s":"Knowledge is justified true belief not inferred through any falsehood.","who":["Clark (1963)","Harman (1973)","Lycan (2006)"],"f":"F2"},{"t":"Defeasibility theory","s":"Knowledge is justified true belief whose justification no true proposition would defeat.","who":["Lehrer and Paxson (1969)","Klein (1971, 1981)","Swain (1974)"],"f":"F2"},{"t":"Causal theory","s":"You know p when the fact that p causes your belief in the right way.","who":["Goldman (1967)","Skyrms (1967)","Goldman (1976), later discriminationism"],"f":"F2"},{"t":"Sensitivity and tracking","s":"You know p if you would not believe p were it false, and would believe it were it true.","who":["Nozick (1981)","Dretske (1971), conclusive reasons","Roush (2005)"],"f":"F2","q":"Does knowledge close under implication?","kids":[{"t":"Closure denial","s":"Tracking fails closure: you can know you have hands without knowing you are not a brain in a vat.","who":["Nozick (1981)","Dretske (1970, 2005)","Hawthorne (2005), contra"],"f":"F2"},{"t":"Abominable conjunctions","s":"I know I have hands but do not know I am not a handless brain in a vat is unacceptable, so closure must hold.","who":["DeRose (1995)","Kripke (2011)","Vogel (1990)"],"f":"F2"}]},{"t":"Safety","s":"You know p if in nearby worlds where you believe p by the same method, p is true.","who":["Sosa (1999)","Pritchard (2005)","Williamson (2000)","Comesaña (2005), fake barns"],"f":"F2"},{"t":"Inescapability of Gettier","s":"Any analysis with a justification condition that does not entail truth will admit Gettier cases.","who":["Zagzebski (1994)","Floridi (2004)"],"f":"F2"},{"t":"Knowledge first","s":"Knowledge is unanalysable and prior; belief, evidence and justification are explained through it.","who":["Williamson (2000)","Williamson (1995)","Nagel (2013)"],"f":"F2","q":"What follows from taking knowledge as basic?","kids":[{"t":"Evidence equals knowledge","s":"Your evidence is exactly what you know, so evidence is not private appearance.","who":["Williamson (2000)","Littlejohn (2012)","Kelly (2008), contra"],"f":"F2"},{"t":"Anti-luminosity","s":"No non-trivial condition is such that whenever it holds one is in a position to know it holds; not even feeling cold.","who":["Williamson (2000)","Srinivasan (2015)","Berker (2008), contra"],"f":"FG"},{"t":"Knowledge norm of assertion","s":"Assert only what you know; that is why lottery assertions sound wrong.","who":["Williamson (2000)","Unger (1975)","Lackey (2007), contra","Weiner (2005), contra"],"f":"F2"}]}]},{"t":"Context and standards","s":"Whether the truth of a knowledge claim depends on the standards in play.","who":["DeRose (1992)","Cohen (1988)","Lewis (1996)","Stanley (2005)"],"f":"F2","q":"Who sets the standard?","kids":[{"t":"Attributor contextualism","s":"Knows shifts meaning with the conversational context of the person making the attribution.","who":["Cohen (1988, 1999)","DeRose (1992, 2009)","Lewis (1996)"],"f":"F2","q":"How does the standard move?","kids":[{"t":"Rule of attention","s":"Every possibility we are not properly ignoring must be eliminated; mentioning skepticism makes it uneliminable.","who":["Lewis (1996)","Lewis (1979), scorekeeping"],"f":"F2"},{"t":"Sensitivity-raising","s":"The skeptic raises standards by mentioning possibilities against which our beliefs are insensitive.","who":["DeRose (1995)","DeRose (2009)"],"f":"F2"}]},{"t":"Subject-sensitive invariantism","s":"Whether the subject knows depends on what is at stake for the subject, not on who is talking.","who":["Hawthorne (2004)","Stanley (2005)","Fantl and McGrath (2002, 2009), pragmatic encroachment"],"f":"F2"},{"t":"Assessment relativism","s":"Knowledge attributions are true or false only relative to a context of assessment.","who":["MacFarlane (2005, 2014)","Richard (2004)"],"f":"F2"},{"t":"Insensitive invariantism","s":"Knows has one fixed standard; apparent shifts are pragmatic or warranted-assertibility effects.","who":["Williamson (2005)","Rysiew (2001)","Brown (2006)","Unger (1975), skeptical version"],"f":"F2"},{"t":"Contrastivism","s":"Knowledge is three-place: one knows p rather than q; the contrast class does the shifting.","who":["Schaffer (2005)","Sinnott-Armstrong (2006)","Karjalainen and Morton (2003)"],"f":"F2"}]},{"t":"Pragmatist theories","s":"Truth and knowledge are tied to inquiry, practice and what works; certainty is replaced by fallible convergence.","who":["Peirce (1878)","James (1907)","Dewey (1938)","Rorty (1979)","Putnam (1981)"],"f":"F2","q":"What does truth come to?","kids":[{"t":"Convergence theory","s":"Truth is the opinion inquiry would settle on in the long run; reality is what that opinion represents.","who":["Peirce (1878, 1905)","Misak (1991)","Wright (1992), superassertibility"],"f":"F2"},{"t":"Warranted assertibility","s":"Knowledge is the settled outcome of inquiry, warranted by the process that produced it.","who":["Dewey (1938)","Dewey (1929)","Hookway (2000)"],"f":"F2"},{"t":"Will to believe","s":"Where evidence cannot decide and the option is live and forced, passional choice is legitimate.","who":["James (1896)","Pascal (1670), forerunner","Clifford (1877), contra"],"f":"F2"},{"t":"Epistemological behaviourism","s":"Justification is a social status, not a relation to the world; there is no mirror of nature.","who":["Rorty (1979)","Rorty (1989)","Brandom (1994), inferentialism"],"f":"F2"},{"t":"Internal realism","s":"Truth is idealised rational acceptability; there is no God's-eye view.","who":["Putnam (1981)","Putnam (1987)","Putnam (1994), later retreat"],"f":"F2"},{"t":"Fallibilism","s":"Every belief could be wrong, yet many are still knowledge; certainty is not required.","who":["Peirce (1897)","Popper (1963)","Reed (2002)","Cohen (1988)"],"f":"F2"}]},{"t":"Social epistemology","s":"Knowledge is produced and checked by groups, institutions and testimony, not by isolated minds.","who":["Goldman (1999)","Longino (1990)","Kitcher (1993)","Fricker (2007)"],"f":"F2","q":"How does knowing spread between people?","kids":[{"t":"Testimony","s":"Whether you may believe what you are told without independent check.","who":["Hume (1748)","Reid (1764)","Coady (1992)","Lackey (2008)"],"f":"F2","q":"Default trust or earned trust?","kids":[{"t":"Reductionism about testimony","s":"Testimony justifies only insofar as you have independent evidence that speakers are reliable.","who":["Hume (1748)","Fricker (1994)","Lyons (1997)"],"f":"F2"},{"t":"Anti-reductionism","s":"Testimony is a basic source; you may trust by default absent defeaters.","who":["Reid (1764)","Coady (1992)","Burge (1993)","Goldberg (2010)"],"f":"F2"},{"t":"Dualism about testimony","s":"Both the speaker's reliability and the hearer's positive reasons are needed.","who":["Lackey (2008)","Faulkner (2011), trust view"],"f":"F2"}]},{"t":"Peer disagreement","s":"What to do when an equally competent, equally informed person disagrees.","who":["Christensen (2007)","Kelly (2005)","Elga (2007)","Feldman (2006)"],"f":"F2","q":"Concede or hold firm?","kids":[{"t":"Conciliationism","s":"Peer disagreement is evidence you may be wrong; move your credence toward the peer.","who":["Christensen (2007, 2010)","Elga (2007), equal weight","Feldman (2006)"],"f":"F2"},{"t":"Steadfastness","s":"You may keep your view if your reasoning was good; disagreement is not evidence against the first-order case.","who":["Kelly (2005)","van Inwagen (1996)","Bergmann (2009)"],"f":"F2"},{"t":"Total evidence view","s":"Weigh the disagreement as one piece of evidence among all the others, with no fixed rule.","who":["Kelly (2010)","Lackey (2010), justificationist"],"f":"F2"}]},{"t":"Veritistic social epistemology","s":"Judge institutions by how well they raise the truth-content of beliefs in society.","who":["Goldman (1999)","Goldman (2010)"],"f":"F2"},{"t":"Contextual empiricism","s":"Objectivity comes from criticism within a diverse community, not from individual method.","who":["Longino (1990, 2002)","Solomon (2001)","Douglas (2009)"],"f":"F2"},{"t":"Division of cognitive labour","s":"Science works because scientists spread across rival approaches for partly selfish reasons; diversity is rational at the group level.","who":["Kitcher (1990, 1993)","Strevens (2003)","Zollman (2007, 2010), network epistemology","Weisberg and Muldoon (2009)"],"f":"F1"},{"t":"Standpoint epistemology","s":"Social position shapes what can be known; marginalised positions can see what dominant ones miss.","who":["Hartsock (1983)","Harding (1991)","Haraway (1988), situated knowledges","Collins (1990)"],"f":"F2"},{"t":"Epistemic injustice","s":"Prejudice can deny people credibility or the concepts to understand their own experience.","who":["Fricker (2007)","Dotson (2011)","Medina (2013)"],"f":"F2"},{"t":"Epistemic democracy","s":"Many diverse minds outperform a few experts when the problem is hard and the group is diverse.","who":["Condorcet (1785)","Anderson (2006)","Landemore (2013)","Hong and Page (2004)"],"f":"F1"},{"t":"Strong programme","s":"Scientific beliefs are to be explained by social causes symmetrically, whether true or false.","who":["Bloor (1976)","Barnes (1974)","Shapin and Schaffer (1985)","Laudan (1981), contra"],"f":"F2"}]},{"t":"Common sense and hinges","s":"Some certainties are the ground on which justification stands and cannot themselves be justified or doubted.","who":["Moore (1925, 1939)","Wittgenstein (1969)","Reid (1764)","Pritchard (2016)"],"f":"F2","q":"Can the ground be argued for?","kids":[{"t":"Moorean shift","s":"I know I have hands; this is more certain than any skeptical premise, so the skeptic's argument has a false premise.","who":["Moore (1939)","Lycan (2001)","Kelly (2005), Moorean facts","Pryor (2004)"],"f":"F2"},{"t":"Hinge epistemology","s":"Hinge commitments like there is an external world are not beliefs but the fixed points that let inquiry turn.","who":["Wittgenstein (1969)","Moyal-Sharrock (2004)","Pritchard (2016)","Coliva (2015), extended rationality"],"f":"F2"},{"t":"Common sense realism","s":"The principles of common sense are the first principles of knowledge and need no proof.","who":["Reid (1764, 1785)","Chisholm (1982), particularism","Lemos (2004)"],"f":"F2"}]},{"t":"Naturalised epistemology","s":"Epistemology is a chapter of psychology: study how beliefs are actually formed rather than how they ought to be.","who":["Quine (1969)","Kornblith (2002)","Goldman (1986)","Bishop and Trout (2005)"],"f":"F2","q":"How much normativity survives?","kids":[{"t":"Replacement naturalism","s":"Drop the normative project; describe the causal link from stimulus to theory.","who":["Quine (1969)","Kim (1988), critique"],"f":"F2"},{"t":"Knowledge as natural kind","s":"Knowledge is a natural kind studied by cognitive ethology; philosophy gets its concept from the world, not from intuition.","who":["Kornblith (2002)","Kornblith (1994)"],"f":"F2"},{"t":"Strategic reliabilism","s":"Epistemology should recommend the reasoning strategies that are reliable and cheap, as psychology shows they are.","who":["Bishop and Trout (2005)","Trout (1998)","Meehl (1954), clinical vs statistical"],"f":"F1"},{"t":"Evolutionary reliability","s":"Selection built faculties good enough to track truth in ordinary environments; this grounds trust in them.","who":["Quine (1969)","Sober (1994)","Plantinga (1993), evolutionary argument against naturalism","Stich (1990), contra"],"f":"F2"}]},{"t":"Formal theories of belief","s":"Mathematical models of how rational belief should be structured and revised.","who":["Ramsey (1926)","Hintikka (1962)","Alchourrón, Gärdenfors and Makinson (1985)","Spohn (1988)"],"f":"F2","q":"Degrees, ranks, or sets?","kids":[{"t":"Belief revision (AGM)","s":"Rational revision of a belief set is minimal change subject to consistency, captured by postulates.","who":["Alchourrón, Gärdenfors and Makinson (1985)","Gärdenfors (1988)","Hansson (1999)"],"f":"F2"},{"t":"Ranking theory","s":"Beliefs come in grades of disbelief on an ordinal scale, giving a qualitative parallel to probability.","who":["Spohn (1988, 2012)","Huber (2006)"],"f":"F2"},{"t":"Imprecise probability","s":"Rational credence can be a set of probability functions, not a single number, when evidence is thin.","who":["Levi (1974, 1980)","Walley (1991)","Joyce (2010)","Bradley (2019)"],"f":"F2"},{"t":"Dempster-Shafer belief functions","s":"Evidence assigns mass to sets of possibilities, allowing belief and plausibility to come apart.","who":["Dempster (1967)","Shafer (1976)","Halpern (2003)"],"f":"F2"},{"t":"Lockean thesis and the lottery","s":"Full belief is high credence above a threshold, which makes belief sets inconsistent in lottery cases.","who":["Kyburg (1961)","Foley (1993)","Leitgeb (2014), stability theory","Makinson (1965), preface paradox"],"f":"F2"},{"t":"Epistemic logic","s":"Knowledge and belief as modal operators; what agents know about each other's knowledge.","who":["Hintikka (1962)","Fagin, Halpern, Moses and Vardi (1995)","van Benthem (2011), dynamic epistemic logic","Aumann (1976), common knowledge"],"f":"F2"},{"t":"Accuracy-first epistemology","s":"The norms of credence follow from the goal of having accurate credences, measured by a scoring rule.","who":["Joyce (1998)","Pettigrew (2016)","Greaves and Wallace (2006)"],"f":"F2"}]},{"t":"Skepticism","s":"Positions holding that knowledge, or justified belief, is unavailable in some domain or everywhere.","who":["Sextus Empiricus (c. 200)","Descartes (1641)","Hume (1739)","Unger (1975)","Stroud (1984)"],"f":"F2","q":"Which skepticism?","kids":[{"t":"Pyrrhonian skepticism","s":"Suspend judgement on every non-evident matter; equal arguments on both sides leave tranquillity.","who":["Pyrrho (c. 300 BCE)","Aenesidemus (1st c. BCE)","Sextus Empiricus (c. 200)","Fogelin (1994)"],"f":"F2","q":"How does a skeptic live?","kids":[{"t":"Ten modes and five modes","s":"Catalogues of oppositions (relativity, disagreement, regress, hypothesis, circularity) that force suspension.","who":["Aenesidemus (1st c. BCE)","Agrippa (1st c.)","Sextus Empiricus (c. 200)"],"f":"F2"},{"t":"Following appearances","s":"The skeptic lives by appearances, custom and nature without assenting to anything as true.","who":["Sextus Empiricus (c. 200)","Frede (1979)","Burnyeat (1980)"],"f":"F2"},{"t":"Academic skepticism","s":"Nothing can be known, but some impressions are more persuasive than others and can guide action.","who":["Arcesilaus (3rd c. BCE)","Carneades (2nd c. BCE)","Cicero (45 BCE)"],"f":"F2"}]},{"t":"Cartesian skepticism","s":"If you cannot rule out a dream or a deceiver, you know nothing about the external world.","who":["Descartes (1641)","Stroud (1984)","Putnam (1981), brain in a vat","Bostrom (2003), simulation"],"f":"F2","q":"How is the demon answered?","kids":[{"t":"Cogito and God","s":"I cannot doubt that I think; a non-deceiving God guarantees clear and distinct ideas.","who":["Descartes (1641)","Arnauld (1641), Cartesian circle objection"],"f":"F2"},{"t":"Semantic externalism reply","s":"A brain in a vat could not refer to vats, so it could not truly think it is one.","who":["Putnam (1981)","Brueckner (1986), critique","Wright (1992)"],"f":"F2"},{"t":"Relevant alternatives","s":"Knowing requires ruling out only relevant alternatives; the demon is not relevant.","who":["Dretske (1970)","Austin (1946)","Stine (1976)"],"f":"F2"},{"t":"Simulation argument","s":"Either civilisations die before simulating minds, or they choose not to, or we are almost certainly simulated.","who":["Bostrom (2003)","Chalmers (2022)","Weatherson (2003), critique"],"f":"F2"}]},{"t":"Humean skepticism","s":"Reason cannot justify induction, the external world or the self; nature, not argument, makes us believe.","who":["Hume (1739, 1748)","Strawson (1985), naturalist reading","Garrett (1997)"],"f":"F2"},{"t":"Skepticism about the a priori","s":"There is no knowledge independent of experience; even logic is revisable.","who":["Quine (1951)","Devitt (2005)","BonJour (1998), contra"],"f":"F2"},{"t":"Skeptical theism","s":"We cannot judge whether God has reasons for permitting evil, because our grasp of goods and evils is too limited.","who":["Wykstra (1984)","Bergmann (2001)","Alston (1991)","Rowe (1979), the argument it answers"],"f":"F3"},{"t":"Skeptical invariantism","s":"Knowledge requires certainty, and we almost never have it, so we almost never know.","who":["Unger (1975)","Kripke (2011)"],"f":"F2"}]}],"q":"What makes a result count as known?"},{"t":"Testable soon","s":"Inside our reach, instrument not yet built or finished.","f":"F1","d":"Which correlates track reported experience. Whether emulation reproduces behavior. Lattice gauge theory and holographic toys on quantum computers.","kids":[{"t":"Confirmation theories","s":"How evidence bears on hypotheses.","who":["Carnap (1950)","Hempel (1945)","Popper (1959)","Howson and Urbach (1989)"],"f":"F2","q":"Probability, refutation, or explanation?","kids":[{"t":"Bayesianism","s":"Rational belief comes in degrees that obey the probability axioms and update by conditioning on evidence.","who":["Ramsey (1926)","de Finetti (1937)","Savage (1954)","Howson and Urbach (1989)","Earman (1992)"],"f":"F2","q":"Where do the priors come from?","kids":[{"t":"Subjective Bayesianism","s":"Any coherent prior is permitted; disagreement washes out with evidence.","who":["de Finetti (1937)","Savage (1954)","Jeffrey (1965)"],"f":"F2","q":"Why obey the axioms?","kids":[{"t":"Dutch book argument","s":"Credences that violate the axioms can be exploited by a set of bets you would accept and lose for sure.","who":["Ramsey (1926)","de Finetti (1937)","Lewis (1999), diachronic","Christensen (1991), critique"],"f":"F2","q":"What does the bet really show?","kids":[{"t":"Diachronic Dutch book","s":"An agent who updates by any rule other than conditionalisation can be booked across time, so conditionalisation is forced.","who":["Teller (1973), reporting Lewis","Lewis (1999)","van Fraassen (1984), reflection principle"],"f":"F2"},{"t":"Depragmatised Dutch book","s":"The argument is really about consistency of evaluations, not about losing money; strip the betting.","who":["Christensen (1996)","Howson and Urbach (1993)","Hájek (2008)"],"f":"F2"},{"t":"Dutch book is not compulsion","s":"Refusing to bet, or valuing money non-linearly, escapes the book; the argument shows less than claimed.","who":["Schick (1986)","Maher (1993)","Hájek (2005)"],"f":"F2"}]},{"t":"Representation theorems","s":"Preferences that satisfy plausible axioms are representable as expected utility with a unique probability.","who":["Savage (1954)","von Neumann and Morgenstern (1944)","Jeffrey (1965)"],"f":"FG"},{"t":"Washing out","s":"Agents with different priors converge as shared evidence grows, under conditions.","who":["Savage (1954)","Blackwell and Dubins (1962)","Earman (1992), on how weak the result is"],"f":"F2"}]},{"t":"Objective Bayesianism","s":"Priors are fixed by symmetry or maximum entropy; there is one right credence given the evidence.","who":["Keynes (1921)","Jaynes (1957, 2003)","Williamson (2010)","Carnap (1950)"],"f":"F2"},{"t":"Old evidence problem","s":"Evidence already known cannot raise the probability of a theory, yet Mercury's perihelion confirmed relativity.","who":["Glymour (1980)","Garber (1983)","Howson (1991)","Sprenger (2015)"],"f":"F2"},{"t":"Likelihoodism","s":"Evidence favours one hypothesis over another to the degree the likelihood ratio says; no priors, no absolute confirmation.","who":["Ha
