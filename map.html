 gives a compositional semantics.","who":["Mark Schroeder (2008)"],"f":"F2"},{"t":"Cognitivist expressivism","s":"Moral judgments are beliefs, but beliefs with no descriptive content.","who":["Terry Horgan and Mark Timmons (2006)"],"f":"F2"},{"t":"Hybrid expressivism","s":"Moral sentences express both a belief and an attitude.","who":["Michael Ridge (2006, 2014)","David Copp (2001)","Daniel Boisvert (2008)","Teemu Toppinen (2013)"],"f":"F2","q":"How are the two joined?","kids":[{"t":"Ecumenical expressivism","s":"Moral claims express a desire-like state and a belief that depends on it.","who":["Michael Ridge (2006, 2014)"],"f":"F2"},{"t":"Realist-expressivism","s":"Moral claims assert facts and conventionally imply attitudes, like slurs.","who":["David Copp (2001, 2009)"],"f":"F2"},{"t":"Expressive-assertivism","s":"Moral sentences both assert and express, by convention.","who":["Daniel Boisvert (2008)"],"f":"F2"},{"t":"Relational expressivism","s":"Moral judgment is a relation between belief and desire, not a single state.","who":["Teemu Toppinen (2013)","Mark Schroeder (2013)"],"f":"F2"},{"t":"Hybrid speech-act theory","s":"Moral utterance performs two speech acts at once.","who":["Stephen Barker (2000)","Guy Fletcher and Michael Ridge (2014)"],"f":"F2"}]},{"t":"Inferentialist expressivism","s":"Moral meaning is the inferential role of moral claims, not what they represent.","who":["Matthew Chrisman (2016)","Robert Brandom (1994), background"],"f":"F2"},{"t":"Expressivism about metaethics itself","s":"Realist-sounding metaethical claims are themselves expressions of attitude.","who":["Simon Blackburn (1998)","Allan Gibbard (2003)"],"f":"gate"}],"q":"What is expressed, and how does it earn truth-talk?"},{"t":"Constructing","s":"Agents build moral facts by reasoning or agreeing.","who":["Kant, on one reading","Rawls","Korsgaard","Scanlon"],"addr":"M2c","kids":[{"t":"Kantian constructivism","s":"Moral truths are what rational agents would legislate from the standpoint of practical reason.","who":["John Rawls (1980)","Christine Korsgaard (1996)","Onora O’Neill (1989)","Carla Bagnoli (2013)"],"f":"F2","q":"What constrains the construction?","kids":[{"t":"Rawls’s Kantian constructivism","s":"Principles are constructed by a conception of the person and a procedure.","who":["John Rawls (1980)"],"f":"F2"},{"t":"Korsgaard’s sources of normativity","s":"Reflective endorsement of our practical identities grounds obligation; humanity is the identity we all share.","who":["Christine Korsgaard (1996, 2009)"],"f":"F2"},{"t":"O’Neill’s constructions of reason","s":"Principles that all could follow are the test; Kant’s formula of universal law does the work.","who":["Onora O’Neill (1989, 1996)"],"f":"F2"},{"t":"Constitutivism","s":"Norms follow from what it is to be an agent at all.","who":["Christine Korsgaard (2009)","David Velleman (2009)","Michael Smith (2013)","Paul Katsafanas (2013)"],"f":"F2","q":"What is constitutive of agency?","kids":[{"t":"Self-constitution","s":"Acting at all commits you to the principles of unified agency.","who":["Korsgaard (2009)"],"f":"F2"},{"t":"Velleman’s aim of self-understanding","s":"Action aims at intelligibility to oneself; norms follow.","who":["David Velleman (2009)"],"f":"F2"},{"t":"Nietzschean constitutivism","s":"Agency aims at power, understood as overcoming resistance.","who":["Paul Katsafanas (2013)"],"f":"F2"},{"t":"Shmagency objection","s":"One can ask why be an agent, so constitutive norms do not bind.","who":["David Enoch (2006)"],"f":"gate","q":"Can the objection be answered?","kids":[{"t":"Inescapability reply","s":"Agency cannot be opted out of, since even deciding to quit is an act, so its norms bind.","who":["Luca Ferrero (2009)","Christine Korsgaard (2009)"],"f":"gate","q":"Does inescapability give reasons?","kids":[{"t":"Enoch’s rejoinder","s":"Being stuck in agency does not make its aims yours; inescapable is not the same as authoritative.","who":["David Enoch (2011)"],"f":"gate"}]},{"t":"Bootstrapping reply","s":"The question why be an agent is itself asked from within agency, so it already presupposes the norms.","who":["Matthew Silverstein (2015)"],"f":"gate"},{"t":"Self-effacing constitutivism","s":"Constitutive norms need not be recognized to bind; the demand for a reason is misplaced.","who":["Michael Smith (2015)","Paul Katsafanas (2018)"],"f":"gate"}]}]},{"t":"Kantian intuitionism","s":"Ross’s duties are grounded and unified by the humanity formula.","who":["Robert Audi (2004)"],"f":"F2"}]},{"t":"Humean constructivism","s":"Normative truths are what follows from within an agent’s actual evaluative standpoint.","who":["Sharon Street (2008, 2010)","James Lenman (2010)","Kate Manne (2014)"],"f":"F2","q":"Does any content follow?","kids":[{"t":"Street’s practical standpoint","s":"Truth about reasons is what withstands scrutiny from the agent’s own values; no substantive universal morality is guaranteed.","who":["Sharon Street (2008, 2010)"],"f":"F2"},{"t":"Lenman’s expressivist constructivism","s":"Constructing from within is compatible with expressivism about the results.","who":["James Lenman (2010)"],"f":"F2"},{"t":"Internal reasons theory","s":"A reason must connect to something in the agent’s motivational set.","who":["Bernard Williams (1981)","Mark Schroeder (2007)"],"f":"F2"}]},{"t":"Contractualist constructivism","s":"Principles no one could reasonably reject are the moral facts.","who":["T.M. Scanlon (1998)","Stephen Darwall (2006)","Nicholas Southwood (2010)","Rahul Kumar (2003)"],"f":"F2","q":"Rejectable by whom?","kids":[{"t":"Scanlon’s What We Owe","s":"Wrong means disallowed by principles no one could reasonably reject as a basis for unforced agreement.","who":["T.M. Scanlon (1998)"],"f":"F2"},{"t":"Darwall’s second-person standpoint","s":"Moral obligation is what we can demand of each other as equal accountable persons.","who":["Stephen Darwall (2006)"],"f":"F2"},{"t":"Deliberative contractualism","s":"Principles are those deliberative citizens would agree to under fair conditions.","who":["Nicholas Southwood (2010)"],"f":"F2"},{"t":"Parfit’s Kantian contractualism","s":"Everyone ought to follow the principles whose universal acceptance everyone could rationally will.","who":["Derek Parfit (2011)"],"f":"F2"}]},{"t":"Discourse ethics","s":"Norms are valid when all affected could accept them in rational discourse.","who":["Jürgen Habermas (1983)","Karl-Otto Apel (1973)","Seyla Benhabib (1992)","Rainer Forst (2007)"],"f":"F2","q":"What grounds the discourse rules?","kids":[{"t":"Habermas’s principle U","s":"A norm is valid if the consequences of general observance could be accepted by all affected.","who":["Jürgen Habermas (1983, 1991)"],"f":"F2"},{"t":"Apel’s transcendental pragmatics","s":"Anyone who argues has already accepted the norms of argument; denying them is a performative contradiction.","who":["Karl-Otto Apel (1973)"],"f":"F2"},{"t":"Benhabib’s interactive universalism","s":"Discourse must include the concrete other, not only the generalized other.","who":["Seyla Benhabib (1992)"],"f":"F2"},{"t":"Forst’s right to justification","s":"Every person has a basic right to demand reasons for norms that bind them.","who":["Rainer Forst (2007)"],"f":"F2"}]},{"t":"Pragmatist ethics","s":"Moral truth is what inquiry into how to live together keeps confirming.","who":["John Dewey (1922)","William James (1891)","Hilary Putnam (2004)","Cheryl Misak (2000)","Philip Kitcher (2011)"],"f":"F2","q":"What settles inquiry?","kids":[{"t":"Dewey’s growth","s":"The only moral end is growth; moral problems are solved, not deduced.","who":["John Dewey (1922, 1932)"],"f":"F2"},{"t":"James’s moral philosopher","s":"The best act satisfies the most demands with the least sacrifice.","who":["William James (1891)"],"f":"F2"},{"t":"Rorty’s ethnocentrism without foundations","s":"We can only justify from where we stand; solidarity replaces objectivity.","who":["Richard Rorty (1989)"],"f":"F2"},{"t":"Kitcher’s ethical project","s":"Ethics is a social technology that improves by remedying altruism failures.","who":["Philip Kitcher (2011)"],"f":"F2"}]},{"t":"Existentialist value creation","s":"There is no given morality; agents make values by choosing, and are responsible for them.","who":["Jean-Paul Sartre (1946)","Simone de Beauvoir (1947)","Friedrich Nietzsche (1883)","Albert Camus (1951)"],"f":"F2","q":"What constrains the choice?","kids":[{"t":"Sartrean radical freedom","s":"Choosing for oneself is choosing for all; bad faith is denying this.","who":["Jean-Paul Sartre (1943, 1946)"],"f":"F2"},{"t":"Beauvoir’s ethics of ambiguity","s":"Freedom is the value; willing oneself free requires willing others free.","who":["Simone de Beauvoir (1947)"],"f":"F2"},{"t":"Nietzsche’s creation of values","s":"The free spirit legislates new values beyond good and evil.","who":["Friedrich Nietzsche (1883, 1886)"],"f":"F2"},{"t":"Camus’s revolt","s":"Rebellion against the absurd affirms a shared human dignity.","who":["Albert Camus (1951)"],"f":"F2"},{"t":"Heidegger’s authenticity","s":"Owning one’s finitude is the measure, not a moral code.","who":["Martin Heidegger (1927)"],"f":"F2"}]},{"t":"Social constructivism","s":"Moral facts are what a society’s justified code says.","who":["David Copp (1995)","Ronald Milo (1995)","Gilbert Harman (1975), partly"],"f":"F2"}],"q":"Constructed from what standpoint?"},{"t":"Indexing","s":"True relative to a culture.","who":["Harman","Wong","Westermarck"],"addr":"M2d","kids":[{"t":"Cultural relativism","s":"Right means right by the standards of the agent’s culture.","who":["Edward Westermarck (1932)","Ruth Benedict (1934)","Melville Herskovits (1948)","William Graham Sumner (1906)"],"f":"F2","q":"What kind of relativism?","kids":[{"t":"Descriptive relativism","s":"Cultures in fact differ deeply in moral codes.","who":["Franz Boas (1911)","Ruth Benedict (1934)"],"f":"F1"},{"t":"Metaethical relativism","s":"There is no standard above cultures for judging codes.","who":["Herskovits (1948)","Westermarck (1932)"],"f":"F2"},{"t":"Normative relativism","s":"Because there is no higher standard, we ought to tolerate other codes.","who":["Herskovits (1948)","Bernard Williams (1972), critic"],"f":"gate"},{"t":"Westermarck’s emotivist relativism","s":"Moral judgments express retributive emotions and vary with the culture that trains them.","who":["Edward Westermarck (1906, 1932)"],"f":"F2"}]},{"t":"Harman’s agent relativism","s":"Inner-judgment oughts hold only for agents who share an implicit agreement.","who":["Gilbert Harman (1975, 1996)"],"f":"F2"},{"t":"Wong’s pluralistic relativism","s":"There are many adequate moralities, constrained by human nature and the functions morality serves.","who":["David Wong (1984, 2006)"],"f":"F2"},{"t":"Prinz’s constructive sentimentalism","s":"Moral values are grounded in sentiments that vary by culture; right is what one’s sentiments approve.","who":["Jesse Prinz (2007)"],"f":"F2"},{"t":"Velleman’s foundations for relativism","s":"Mores are ways of making oneself intelligible within a community; different communities, different moralities.","who":["David Velleman (2013)"],"f":"F2"},{"t":"Speaker relativism and contextualism","s":"Moral sentences are true relative to the speaker’s standards, by semantics.","who":["James Dreier (1990)","Gunnar Björnsson and Stephen Finlay (2010)","Frank Jackson (1998), partly"],"f":"F2"},{"t":"Assessment sensitivity","s":"Moral claims are true or false only relative to a context of assessment.","who":["John MacFarlane (2014)","Max Kölbel (2004)","Berit Brogaard (2008)"],"f":"F2"},{"t":"Appraiser vs agent relativism","s":"Right is relative to the judge’s group or to the agent’s group.","who":["David Lyons (1976)"],"f":"gate"},{"t":"Individual subjectivism","s":"Right means approved by the speaker.","who":["Protagoras (c. 440 BC)","Thomas Hobbes (1651), on one reading","Edward Westermarck (1932)"],"f":"F2"},{"t":"Relativism of distance","s":"Moral appraisal makes sense only for options that are real for us.","who":["Bernard Williams (1985)"],"f":"F2"},{"t":"Wittgensteinian forms of life","s":"Moral concepts belong to practices that cannot be judged from outside.","who":["Peter Winch (1964)","D.Z. Phillips (1970)","Cora Diamond (1991)"],"f":"F2"},{"t":"Historicism","s":"Moral standards belong to historical epochs and their needs.","who":["G.W.F. Hegel (1821)","Karl Marx (1846)","Wilhelm Dilthey (1883)"],"f":"F2"},{"t":"Traditions-based rationality","s":"Moral inquiry proceeds within traditions, but traditions can be rationally compared.","who":["Alasdair MacIntyre (1988)"],"f":"F2"}],"q":"Relative to whom?"},{"t":"Feeling","s":"Moral judgment rests on sentiment; theories differ on whether sentiment can be correct.","who":["Francis Hutcheson (1725)","David Hume (1751)","Adam Smith (1759)","Michael Slote (2010)","Shaun Nichols (2004)"],"f":"F2","q":"Can a sentiment be right or wrong?","kids":[{"t":"Moral sense theory","s":"A distinct sense perceives virtue as the eye perceives color.","who":["Francis Hutcheson (1725)","Shaftesbury (1711)"],"f":"F2"},{"t":"Humean sentimentalism","s":"Moral distinctions are derived from a sentiment of humanity that all share.","who":["David Hume (1739, 1751)"],"f":"F2"},{"t":"Smith’s impartial spectator","s":"We judge by imagining how an impartial spectator would feel.","who":["Adam Smith (1759)"],"f":"F2"},{"t":"Slote’s moral sentimentalism","s":"Empathy is the source and the standard of moral judgment.","who":["Michael Slote (2007, 2010)"],"f":"F2"},{"t":"Schopenhauer’s compassion","s":"Compassion is the sole basis of morality; reason cannot ground it.","who":["Arthur Schopenhauer (1840)"],"f":"F2"},{"t":"Scheler’s ordo amoris","s":"Feeling grasps a real hierarchy of values.","who":["Max Scheler (1913)"],"f":"F2"}]},{"t":"Nothing","s":"Moral talk has no work worth saving; it should be replaced by talk of will or interest.","who":["Max Stirner (1844)","Nietzsche, on one reading","Ayn Rand (1964), partly","Ragnar Redbeard (1896)"],"f":"F2","q":"What replaces it?","kids":[{"t":"Egoist nihilism","s":"The unique self owes nothing; morality is a spook.","who":["Max Stirner (1844)"],"f":"F2"},{"t":"Rational egoism","s":"Each should pursue their own interest; this is itself the moral standard.","who":["Ayn Rand (1964)","Henry Sidgwick (1874), as one of two methods","Thomas Hobbes (1651), partly"],"f":"F2"},{"t":"Amoralism","s":"One can understand moral claims fully and be unmoved; nothing is lost.","who":["David Brink (1986)","Richard Joyce (2001)"],"f":"F2"},{"t":"Legalist anti-moralism","s":"Order comes from rewards and punishments; moral talk is a ruler’s tool.","who":["Han Fei (c. 240 BC)","Shang Yang (c. 350 BC)"],"f":"F2"}]}]},{"t":"What makes an act right?","s":"Six standards that mix.","q":"Which standard?","kids":[{"t":"Outcomes","who":["Bentham","Mill","Sidgwick","Singer","Negative utilitarianism (Popper)","Effective altruism"],"addr":"N1","kids":[{"t":"Classical utilitarianism","s":"Right is whatever produces the most happiness for all affected.","who":["Jeremy Bentham (1789)","John Stuart Mill (1861)","Henry Sidgwick (1874)","William Godwin (1793)"],"f":"F2","q":"Whose happiness, measured how?","kids":[{"t":"Bentham’s hedonic calculus","s":"Sum pleasures and pains by intensity, duration, certainty, and extent.","who":["Jeremy Bentham (1789)"],"f":"F2"},{"t":"Mill’s qualitative hedonism","s":"Some pleasures are higher in kind; competent judges prefer them.","who":["John Stuart Mill (1861)"],"f":"F2"},{"t":"Sidgwick’s dualism of practical reason","s":"Egoism and universal benevolence are both rational and may conflict.","who":["Henry Sidgwick (1874)"],"f":"F2"},{"t":"Theological utilitarianism","s":"God wills human happiness, so his will is known by utility.","who":["William Paley (1785)","John Gay (1731)","Joseph Priestley (1768)"],"f":"F2"},{"t":"Mohist state consequentialism","s":"Right policy maximizes wealth, order, and population; impartial care is the rule.","who":["Mozi (c. 430 BC)","Later Mohists (c. 300 BC)"],"f":"F2"},{"t":"Hutcheson’s greatest happiness","s":"The best action procures the greatest happiness for the greatest numbers.","who":["Francis Hutcheson (1725)"],"f":"F2"}]},{"t":"What outcome counts as good","s":"The value theory a consequentialist plugs in.","who":["Bentham","Moore","Hare","Popper"],"f":"F2","q":"Which good?","kids":[{"t":"Hedonistic consequentialism","s":"Only pleasure and pain count.","who":["Bentham (1789)","Fred Feldman (2004)","Torbjörn Tännsjö (1998)","Roger Crisp (2006)"],"f":"F2"},{"t":"Preference consequentialism","s":"Satisfied preferences count, whatever they are for.","who":["R.M. Hare (1981)","John Harsanyi (1977)","Peter Singer (1979–2011)"],"f":"F2"},{"t":"Ideal or objective-list consequentialism","s":"Knowledge, beauty, friendship, and achievement count beyond pleasure.","who":["G.E. Moore (1903)","Hastings Rashdall (1907)","Thomas Hurka (1993)"],"f":"F2"},{"t":"Welfarism","s":"Only wellbeing counts, whatever wellbeing is.","who":["Wayne Sumner (1996)","Amartya Sen (1979), as critic","Roger Crisp"],"f":"F2"},{"t":"Negative utilitarianism","s":"Reducing suffering matters more than, or instead of, adding happiness.","who":["Karl Popper (1945)","R.N. Smart (1958), naming and objecting","David Benatar (2006)","Christoph Fehige (1998)"],"f":"F2","q":"How strong?","kids":[{"t":"Strong negative utilitarianism","s":"Only suffering counts; happiness has no positive weight.","who":["Popper (1945), on one reading","Bruno Contestabile"],"f":"F2"},{"t":"Antifrustrationism","s":"Satisfying a preference is only as good as not having it.","who":["Christoph Fehige (1998)"],"f":"F2"},{"t":"Suffering-focused ethics","s":"Preventing extreme suffering takes priority without denying other goods.","who":["Lukas Gloor (2016)","Magnus Vinding (2020)","Brian Tomasik"],"f":"F2","q":"How is priority structured?","kids":[{"t":"Lexical threshold view","s":"Suffering above a threshold cannot be outweighed by any amount of lesser goods.","who":["Magnus Vinding (2020)","Simon Knutsson (2016)"],"f":"F2"},{"t":"Hedonistic imperative","s":"Abolish suffering through biotechnology rather than weigh it.","who":["David Pearce (1995)"],"f":"F2"}]},{"t":"Tranquilism","s":"Pleasure is good only as absence of craving.","who":["Lukas Gloor (2017)","Epicurus (c. 300 BC), forerunner"],"f":"F2"},{"t":"Benatar’s asymmetry","s":"Absent pain is good, absent pleasure is not bad, so coming to exist is always a harm.","who":["David Benatar (2006)"],"f":"F2"}]},{"t":"Perfectionist consequentialism","s":"Promote human excellence, not happiness.","who":["Thomas Hurka (1993)","Nietzsche, on one reading"],"f":"F2"},{"t":"Consequentialism of rights","s":"Promote the state in which rights are most respected.","who":["Amartya Sen (1982)"],"f":"F2"},{"t":"Evaluator-relative consequentialism","s":"The good to promote can differ by who is evaluating.","who":["Amartya Sen (1983)","Douglas Portmore (2011)"],"f":"F2"}]},{"t":"How to aggregate across people","s":"Whether to add, average, prioritize, or protect the worst off.","who":["Sidgwick","Parfit","Temkin","Adler"],"f":"F2","q":"Which aggregation rule?","kids":[{"t":"Total view","s":"Maximize the sum of wellbeing.","who":["Sidgwick (1874)","Parfit (1984), as target","Gustaf Arrhenius (2000)"],"f":"F2","q":"What about the repugnant conclusion?","kids":[{"t":"Accept it","s":"A huge barely-good population is better; intuitions against it are unreliable.","who":["Torbjörn Tännsjö (2002)","Michael Huemer (2008)","Hilary Greaves and others (2021)"],"f":"F2"},{"t":"Reject the total view","s":"Adding lives cannot make things better without limit.","who":["Parfit (1984)"],"f":"gate"}]},{"t":"Average view","s":"Maximize average wellbeing.","who":["John Harsanyi (1955), partly","Thomas Hurka (1983), critic"],"f":"F2"},{"t":"Critical-level view","s":"Lives count positively only above a threshold.","who":["Charles Blackorby, Walter Bossert, David Donaldson (1997)","John Broome (2004)"],"f":"F2"},{"t":"Variable-value view","s":"Extra lives matter less as population grows.","who":["Thomas Hurka (1983)","Yew-Kwang Ng (1989)"],"f":"F2"},{"t":"Person-affecting view","s":"An outcome can be worse only if worse for someone.","who":["Jan Narveson (1967)","Melinda Roberts (1998)","Johann Frick (2020)"],"f":"F2","q":"What about the non-identity problem?","kids":[{"t":"Narveson’s asymmetry","s":"We have reason to prevent miserable lives, none to create happy ones.","who":["Jan Narveson (1967)"],"f":"F2"},{"t":"Wide person-affecting view","s":"Comparing different people’s lives across outcomes is allowed.","who":["Parfit (1984)","Melinda Roberts"],"f":"F2"},{"t":"Non-identity problem","s":"Acts that change who exists cannot be worse for anyone, yet seem wrong.","who":["Derek Parfit (1984)","David Boonin (2014)"],"f":"gate","q":"Which way out?","kids":[{"t":"Bite the bullet","s":"Such acts are not wrong after all.","who":["David Boonin (2014)"],"f":"gate"},{"t":"Impersonal principle","s":"It is bad if those who live are worse off than others who could have lived instead.","who":["Derek Parfit (1984), principle Q"],"f":"gate"},{"t":"De dicto harm","s":"The child, whoever it will be, is made worse off under that description.","who":["Caspar Hare (2007)"],"f":"gate"},{"t":"Wronging without harming","s":"One can wrong a person by failing a duty owed to them, even if they are not worse off.","who":["Rahul Kumar (2003)","Seana Shiffrin (1999)","James Woodward (1986)"],"f":"gate"}]}]},{"t":"Prioritarianism","s":"Benefits matter more the worse off the recipient.","who":["Derek Parfit (1991)","Matthew Adler (2012)","Nils Holtug (2010)"],"f":"F2"},{"t":"Egalitarian consequentialism","s":"Inequality is itself bad; promote equal distributions.","who":["Larry Temkin (1993)","Ingmar Persson"],"f":"F2","q":"Why is inequality bad?","kids":[{"t":"Telic egalitarianism","s":"Unequal outcomes are bad in themselves.","who":["Larry Temkin (1993)"],"f":"F2"},{"t":"Leveling down objection","s":"If equality matters in itself, making everyone worse off equally would be an improvement in one respect.","who":["Parfit (1991)"],"f":"gate"}]},{"t":"Sufficientarianism","s":"What matters is that everyone has enough.","who":["Harry Frankfurt (1987)","Roger Crisp (2003)","Liam Shields (2016)"],"f":"F2"},{"t":"Maximin and leximin","s":"Judge outcomes by the worst-off position.","who":["John Rawls (1971), for institutions","Amartya Sen (1970)"],"f":"F2"},{"t":"Harsanyi’s aggregation theorem","s":"Rational impartial choice under uncertainty yields weighted utilitarianism.","who":["John Harsanyi (1955)","John Broome (1991)"],"f":"F2"},{"t":"Anti-aggregation","s":"Numbers do not count; the many cannot outweigh the one.","who":["John Taurek (1977)","Elizabeth Anscombe (1967)"],"f":"F2"},{"t":"Limited aggregation","s":"Small benefits to many cannot outweigh a large harm to one, but comparable claims aggregate.","who":["T.M. Scanlon (1998)","Alex Voorhoeve (2014)","Joe Horton"],"f":"F2"}]},{"t":"Direct or indirect","s":"Whether acts, rules, motives, or whole lives are what get assessed.","who":["Smart","Brandt","Hooker","Adams"],"f":"F2","q":"What is evaluated by consequences?","kids":[{"t":"Act consequentialism","s":"Each act is right if it produces at least as much good as any alternative.","who":["J.J.C. Smart (1961)","Peter Singer (1972)","Shelly Kagan (1989)","Walter Sinnott-Armstrong"],"f":"F2"},{"t":"Rule consequentialism","s":"Right acts follow the code whose general acceptance would be best.","who":["Richard Brandt (1959, 1979)","Brad Hooker (2000)","John Harsanyi (1977)","Derek Parfit (2011)"],"f":"F2","q":"Ideal or actual acceptance?","kids":[{"t":"Hooker’s ideal code","s":"The code whose internalization by nearly everyone would have the best consequences.","who":["Brad Hooker (2000)"],"f":"F2"},{"t":"Brandt’s moral code","s":"A code a rational person would support for their society.","who":["Richard Brandt (1979)"],"f":"F2"},{"t":"Collapse objection","s":"Rule consequentialism either collapses into act consequentialism or worships rules.","who":["J.J.C. Smart (1956)","David Lyons (1965)"],"f":"gate"}]},{"t":"Motive consequentialism","s":"Right motives are those that produce the best results.","who":["Robert Adams (1976)"],"f":"F2"},{"t":"Virtue consequentialism","s":"Virtues are traits that systematically produce good.","who":["Julia Driver (2001)","Ben Bradley (2005)"],"f":"F2"},{"t":"Global consequentialism","s":"Evaluate everything, acts, rules, motives, and characters, by consequences.","who":["Philip Pettit and Michael Smith (2000)","Shelly Kagan (2000)","Toby Ord (2009)"],"f":"F2"},{"t":"Sophisticated consequentialism","s":"A consequentialist need not deliberate as one; dispositions are chosen for their results.","who":["Peter Railton (1984)"],"f":"F2"},{"t":"Two-level utilitarianism","s":"Intuitive rules for daily life, critical thinking to pick the rules.","who":["R.M. Hare (1981)"],"f":"F2"},{"t":"Esoteric morality","s":"The right theory may best be kept from most people.","who":["Henry Sidgwick (1874)","Katarzyna de Lazari-Radek and Peter Singer (2010)","Bernard Williams (1985), as critic"],"f":"gate"},{"t":"Cooperative utilitarianism","s":"Do your part in the best pattern of action among those who cooperate.","who":["Donald Regan (1980)"],"f":"F2"},{"t":"Consequentializing","s":"Any plausible deontic verdict can be recast as promoting a suitably relative good.","who":["Douglas Portmore (2011)","James Dreier (1993)","Campbell Brown (2011), as critic"],"f":"gate"}]},{"t":"How demanding","s":"Whether one must maximize or may do less.","who":["Kagan","Slote","Norcross","Mulgan"],"f":"F2","q":"Maximize, satisfice, or grade?","kids":[{"t":"Maximizing consequentialism","s":"Anything less than the best is wrong.","who":["Shelly Kagan (1989)","Peter Singer (1972)"],"f":"F2"},{"t":"Satisficing consequentialism","s":"Producing enough good is right even if not the most.","who":["Michael Slote (1984)","Philip Pettit (1984)","Ben Bradley (2006), critic"],"f":"F2"},{"t":"Scalar consequentialism","s":"Acts are better or worse; there is no line between right and wrong.","who":["Alastair Norcross (2006, 2020)","Michael Slote (1985)"],"f":"F2"},{"t":"Progressive consequentialism","s":"Right is making the world better than it was, not best possible.","who":["Dale Jamieson and Robert Elliot (2009)"],"f":"F2"},{"t":"Agent-centered prerogative","s":"One may weight one’s own projects more than impartial value allows.","who":["Samuel Scheffler (1982)"],"f":"F2"},{"t":"Combined consequentialism","s":"Different rules for the realm of necessity and the realm of reciprocity.","who":["Tim Mulgan (2001)"],"f":"F2"},{"t":"Demandingness accepted","s":"Morality really does require giving until marginal utility equals.","who":["Peter Singer (1972)","Peter Unger (1996)","Shelly Kagan (1989)"],"f":"F2"}]},{"t":"Actual or expected outcomes","s":"Whether rightness depends on what happens or on what was probable.","who":["Jackson","Zimmerman","Smart"],"f":"F2","q":"Objective or subjective?","kids":[{"t":"Objective consequentialism","s":"Right is what actually produces the most good.","who":["G.E. Moore (1912)","J.J.C. Smart (1961)"],"f":"F2"},{"t":"Decision-theoretic consequentialism","s":"Right is what maximizes expected value given the agent’s evidence.","who":["Frank Jackson (1991)","Michael Zimmerman (2008)"],"f":"F2"},{"t":"Prospectivism","s":"Obligation tracks the prospectively best option, not the actually best.","who":["Michael Zimmerman (2008)"],"f":"F2"},{"t":"Risk-weighted expected utility","s":"Agents may rationally be risk-averse in aggregation.","who":["Lara Buchak (2013)"],"f":"F2"},{"t":"Cluelessness","s":"Long-run effects swamp and are unknowable, so expected value is undefined.","who":["James Lenman (2000)","Hilary Greaves (2016)"],"f":"gate"}]},{"t":"Effective altruism and longtermism","s":"Use evidence and reason to do the most good, with heavy weight on the far future.","who":["Peter Singer (2015)","William MacAskill (2015, 2022)","Toby Ord (2020)","Nick Bostrom (2003)","Hilary Greaves and MacAskill (2021)"],"f":"F2","q":"How far does the future count?","kids":[{"t":"Strong longtermism","s":"Impact on the far future is the most important feature of our actions.","who":["Hilary Greaves and William MacAskill (2021)"],"f":"F2"},{"t":"Astronomical waste","s":"Delaying the spread of civilization forfeits vast value.","who":["Nick Bostrom (2003)"],"f":"F2"},{"t":"Existential risk priority","s":"Preventing extinction dominates because of the value it preserves.","who":["Toby Ord (2020)","Derek Parfit (1984), on extinction"],"f":"F2"},{"t":"Zero pure time discounting","s":"A future person’s welfare counts as much as a present one’s.","who":["Derek Parfit (1984)","Tyler Cowen and Parfit (1992)","Frank Ramsey (1928)"],"f":"F2"},{"t":"Person-affecting longtermism critique","s":"Future people who may not exist have no claims, so longtermism overreaches.","who":["Jan Narveson","Johann Frick (2020)","Emile Torres (2021)"],"f":"F2"},{"t":"Fanaticism problem","s":"Expected value forces tiny chances of huge value to dominate everything.","who":["Hayden Wilkinson (2022)","Nick Beckstead and Teruji Thomas (2021)"],"f":"gate"}]},{"t":"Agent-relative and egoistic consequentialism","s":"Promote the good from the agent’s own standpoint.","who":["Sidgwick (1874)","Sen (1983)","Portmore (2011)","Ayn Rand (1964)"],"f":"F2","q":"Whose good?","kids":[{"t":"Ethical egoism","s":"Each ought to maximize their own good.","who":["Ayn Rand (1964)","Henry Sidgwick (1874), as a method","Jesse Kalin (1970)"],"f":"F2"},{"t":"Ethical altruism","s":"Each ought to promote others’ good, not their own.","who":["Auguste Comte (1851)","Thomas Nagel (1970), partly"],"f":"F2"},{"t":"Yang Zhu’s egoism","s":"Preserve one’s own life and nature; the world is not one’s business.","who":["Yang Zhu (c. 370 BC)"],"f":"F2"}]}],"q":"Which outcomes, for whom, how strictly?"},{"t":"Duties and rights","who":["Kant","Ross","Nozick","Korsgaard"],"addr":"N2","kids":[{"t":"Kantian ethics","s":"Act only on maxims you could will as universal law, and treat humanity never merely as a means.","who":["Immanuel Kant (1785, 1797)","Christine Korsgaard (1996)","Onora O’Neill (1989)","Allen Wood (1999)","Barbara Herman (1993)"],"f":"F2","q":"Which formula is basic?","kids":[{"t":"Formula of Universal Law","s":"A maxim is permissible if it could be a universal law without contradiction.","who":["Kant (1785)","O’Neill (1989)","Korsgaard (1996)"],"f":"F2","q":"What is the contradiction?","kids":[{"t":"Logical contradiction","s":"The universalized maxim cannot even be conceived.","who":["Kant (1785)","Christine Korsgaard (1985)"],"f":"F2"},{"t":"Practical contradiction","s":"The universalized maxim defeats the agent’s own purpose.","who":["Korsgaard (1985)"],"f":"F2"},{"t":"Teleological contradiction","s":"The maxim conflicts with nature’s purposes.","who":["H.J. Paton (1947)"],"f":"F2"}]},{"t":"Formula of Humanity","s":"Treat persons always as ends in themselves.","who":["Kant (1785)","Allen Wood (1999)","Thomas Hill (1992)","Robert Audi (2004)"],"f":"F2"},{"t":"Formula of Autonomy and Kingdom of Ends","s":"Legislate as a member of a community of rational ends.","who":["Kant (1785)","Korsgaard (1996)","Andrews Reath (2006)"],"f":"F2"},{"t":"Kant’s doctrine of virtue","s":"Duties to oneself and others, perfect and imperfect, with latitude for the imperfect.","who":["Kant (1797)","Mary Gregor (1963)","Marcia Baron (1995)"],"f":"F2"},{"t":"Kantian moral worth","s":"Only acts from duty have moral worth; inclination is not enough.","who":["Kant (1785)","Barbara Herman (1981)"],"f":"F2"},{"t":"Kantian rule consequentialism","s":"Kant’s formula, properly applied, selects the optimific principles.","who":["Derek Parfit (2011)","R.M. Hare (1981)"],"f":"F2"},{"t":"Fichte’s ethics of striving","s":"Duty is the self’s drive to complete independence, realized through others.","who":["J.G. Fichte (1798)"],"f":"F2"}]},{"t":"Rossian pluralism","s":"Several prima facie duties, none reducible, are weighed in the case.","who":["W.D. Ross (1930)","Robert Audi (2004)","H.A. Prichard (1912)","Bernard Gert (1998)"],"f":"F2","q":"Which duties?","kids":[{"t":"Ross’s seven duties","s":"Fidelity, reparation, gratitude, justice, beneficence, self-improvement, non-maleficence.","who":["W.D. Ross (1930)"],"f":"F2"},{"t":"Gert’s common morality","s":"Ten rules that all rational persons would publicly advocate.","who":["Bernard Gert (1998, 2004)"],"f":"F2"},{"t":"Principlism","s":"Autonomy, beneficence, non-maleficence, and justice, balanced case by case.","who":["Tom Beauchamp and James Childress (1979)"],"f":"F2"},{"t":"Donagan’s theory of morality","s":"The Hebrew-Christian moral tradition reconstructed as respect for rational nature.","who":["Alan Donagan (1977)"],"f":"F2"}]},{"t":"Constraints on doing harm","s":"Some acts may not be done even to bring about the best results.","who":["Robert Nozick (1974)","Frances Kamm (2007)","Warren Quinn (1989)","Thomas Nagel (1986)"],"f":"F2","q":"What grounds the constraint?","kids":[{"t":"Side constraints","s":"Rights are boundaries around persons that no goal may cross.","who":["Robert Nozick (1974)"],"f":"F2"},{"t":"Doctrine of double effect","s":"Intended harm is worse than foreseen harm.","who":["Aquinas (1270)","Philippa Foot (1967)","Warren Quinn (1989)","Joseph Boyle"],"f":"F2","q":"Does intention really matter?","kids":[{"t":"Closeness problem","s":"Agents can redescribe what they intend, so the doctrine needs a limit on how close a foreseen effect can be.","who":["Philippa Foot (1967)","Jonathan Bennett (1995)","Warren Quinn (1989)"],"f":"gate"},{"t":"Quinn’s harmful direct agency","s":"What matters is whether the victim is involved in the plan, not what is intended.","who":["Warren Quinn (1989)"],"f":"F2"},{"t":"Intention-irrelevance view","s":"Intention bears on the agent’s quality, not on whether the act is permissible.","who":["Judith Jarvis Thomson (1999)","T.M. Scanlon (2008)"],"f":"F2"},{"t":"Means principle","s":"Using a person as a means is what the doctrine tracks, not intention as such.","who":["Alec Walen (2019)","Frances Kamm (2007)","Victor Tadros (2011)"],"f":"F2","q":"How strong is the claim not to be used?","kids":[{"t":"Restricting claims principle","s":"Claims not to be used as a means are stronger than claims not to be harmed as a side effect.","who":["Alec Walen (2019)"],"f":"F2"}]}]},{"t":"Doctrine of doing and allowing","s":"Doing harm is worse than allowing it.","who":["Warren Quinn (1989)","Philippa Foot (1984)","Fiona Woollard (2015)"],"f":"F2"},{"t":"Kamm’s principle of permissible harm","s":"Harm is permissible when it flows from the greater good itself, not from means to it.","who":["Frances Kamm (1996, 2007)"],"f":"F2"},{"t":"Trolley problem tradition","s":"Cases separating killing, letting die, and using as means.","who":["Philippa Foot (1967)","Judith Jarvis Thomson (1976, 1985)","Frances Kamm"],"f":"F2"},{"t":"Patient-centered deontology","s":"Constraints protect the victim’s status, not the agent’s purity.","who":["Frances Kamm (2007)","Warren Quinn (1989)","Eric Mack"],"f":"F2"},{"t":"Agent-centered deontology","s":"Constraints protect the agent from becoming a wrongdoer.","who":["Thomas Nagel (1986)","Bernard Williams (1973)"],"f":"F2"},{"t":"Threshold deontology","s":"Constraints hold until the stakes become catastrophic.","who":["Michael Moore (1997)","Larry Alexander (2000)","Michael Walzer (1977), supreme emergency"],"f":"F2"},{"t":"Absolutism","s":"Some acts are never permitted whatever the consequences.","who":["G.E.M. Anscombe (1958)","John Finnis (1983)","Charles Fried (1978)","Alan Donagan (1977)"],"f":"F2"},{"t":"Paradox of deontology","s":"If harming is bad, why not minimize harming by harming?","who":["Samuel Scheffler (1982)","Thomas Nagel (1986)"],"f":"gate"}]},{"t":"Rights-based theories","s":"Rights are the fundamental moral notion; duties follow from them.","who":["Ronald Dworkin (1977)","Judith Jarvis Thomson (1990)","Alan Gewirth (1978)","James Griffin (2008)"],"f":"F2","q":"What is a right and where does it come from?","kids":[{"t":"Rights as trumps","s":"Rights override collective goals.","who":["Ronald Dworkin (1977)"],"f":"F2"},{"t":"Thomson’s realm of rights","s":"Rights are claims whose infringement requires compensation and whose stringency varies.","who":["Judith Jarvis Thomson (1990)"],"f":"F2"},{"t":"Will theory","s":"Rights protect the holder’s choices.","who":["H.L.A. Hart (1955)","Hillel Steiner (1994)","Carl Wellman (1985)"],"f":"F2"},{"t":"Interest theory","s":"Rights protect the holder’s interests.","who":["Joseph Raz (1986)","Neil MacCormick (1977)","Matthew Kramer (1998)"],"f":"F2"},{"t":"Natural rights","s":"Persons have rights by nature, prior to any state.","who":["John Locke (1689)","Hugo Grotius (1625)","Samuel Pufendorf (1672)","Robert Nozick (1974)"],"f":"F2"},{"t":"Gewirth’s generic consistency","s":"Any agent must claim rights to freedom and wellbeing and so grant them to all agents.","who":["Alan Gewirth (1978)","Deryck Beyleveld (1991)"],"f":"F2"},{"t":"Personhood account of human rights","s":"Human rights protect normative agency.","who":["James Griffin (2008)"],"f":"F2"},{"t":"Basic rights","s":"Security and subsistence are rights because they are needed for all others.","who":["Henry Shue (1980)"],"f":"F2"},{"t":"Political conception of human rights","s":"Human rights are what justify international concern, not natural facts.","who":["John Rawls (1999)","Charles Beitz (2009)","Joseph Raz (2010)"],"f":"F2"},{"t":"Hohfeldian analysis","s":"Rights break into claims, liberties, powers, and immunities.","who":["Wesley Hohfeld (1913)"],"f":"F2"},{"t":"Kant’s innate right","s":"Each has one innate right to freedom compatible with everyone’s freedom.","who":["Kant (1797)","Arthur Ripstein (2009)"],"f":"F2"},{"t":"Animal rights","s":"Subjects-of-a-life have rights that cannot be traded for benefits.","who":["Tom Regan (1983)","Christine Korsgaard (2018)","Gary Francione (2000)"],"f":"F2"}]},{"t":"Special obligations","s":"Some duties bind because of who one is to whom.","who":["Samuel Scheffler (1997)","Michael Hardimon (1994)","Diane Jeske (2008)","Niko Kolodny (2010)"],"f":"F2","q":"Where do they come from?","kids":[{"t":"Role obligations","s":"Roles carry duties one need not have chosen.","who":["Michael Hardimon (1994)","F.H. Bradley (1876)"],"f":"F2"},{"t":"Relationship reasons","s":"Valuable relationships themselves give reasons for partiality.","who":["Samuel Scheffler (1997)","Niko Kolodny (2010)"],"f":"F2"},{"t":"Associative duties","s":"Membership in communities and nations grounds duties to fellow members.","who":["Ronald Dworkin (1986)","Yael Tamir (1993)","David Miller (1995)"],"f":"F2"},{"t":"Filial duty","s":"Children owe parents care and reverence.","who":["Confucius (c. 500 BC)","Classic of Filial Piety","Jane English (1979), as critic"],"f":"F2"},{"t":"Promissory obligation","s":"Promises bind by convention, expectation, or normative power.","who":["David Hume (1739)","John Rawls (1955)","T.M. Scanlon (1998)","David Owens (2012)","Seana Shiffrin (2008)"],"f":"F2"}]},{"t":"Duties of beneficence","s":"How much one owes to strangers in need.","who":["Kant","Singer","Murphy","Cullity"],"f":"F2","q":"How much?","kids":[{"t":"Imperfect duty","s":"Beneficence is required but leaves latitude about when and how much.","who":["Kant (1797)","Thomas Hill (1971)"],"f":"F2"},{"t":"Singer’s principle","s":"If you can prevent something bad without sacrificing anything of comparable importance, you must.","who":["Peter Singer (1972)"],"f":"F2"},{"t":"Fair share view","s":"One must do one’s share of what full compliance would achieve, no more.","who":["Liam Murphy (2000)"],"f":"F2"},{"t":"Cullity’s moderate demand","s":"Beneficence is limited by what a life of good projects requires.","who":["Garrett Cullity (2004)"],"f":"F2"},{"t":"Supererogation","s":"Some good acts are beyond duty; morality is not all requirement.","who":["J.O. Urmson (1958)","David Heyd (1982)","Alfred Archer (2018)"],"f":"F2"}]},{"t":"Contractualist deontology","s":"Duties are what principles no one could reasonably reject require.","who":["T.M. Scanlon (1998)","Rahul Kumar (2003)","Derek Parfit (2011)"],"f":"F2"},{"t":"Divine law deontology","s":"Duties are laws laid down by God; some hold absolutely.","who":["Anscombe (1958)","Peter Geach (1969)","Aquinas, decalogue","Halakhah","Fiqh"],"f":"F2"},{"t":"Generalism vs particularism","s":"Whether moral reasons behave like principles at all.","who":["Jonathan Dancy (2004)","Sean McKeever and Michael Ridge (2006)","Pekka Väyrynen (2009)"],"f":"gate","q":"Do principles have a role?","kids":[{"t":"Principled generalism","s":"Morality is codifiable by finite principles.","who":["McKeever and Ridge (2006)","Brad Hooker (2000)"],"f":"F2"},{"t":"Hedged principles","s":"Principles hold with a default that context can defeat.","who":["Pekka Väyrynen (2009)","Mark Lance and Margaret Little (2006)"],"f":"F2"},{"t":"Holism of reasons","s":"A feature that is a reason in one case may be none, or the opposite, in another.","who":["Jonathan Dancy (2004)"],"f":"F2"}]},{"t":"Contractarian deontology","s":"Constraints are the terms rational bargainers would accept.","who":["David Gauthier (1986)","Jan Narveson (1988)"],"f":"F2"},{"t":"Confucian ritual propriety","s":"Right is acting according to li, the rites that shape roles.","who":["Confucius (c. 500 BC)","Xunzi (c. 250 BC)","Herbert Fingarette (1972), reading"],"f":"F2"}],"q":"Where do duties and rights come from?"},{"t":"Character","who":["Aristotle","Confucius","Mencius","Stoics","Aquinas","MacIntyre","Nussbaum"],"addr":"N3","kids":[{"t":"Aristotelian virtue ethics","s":"Right action is what the person of practical wisdom would do; virtue is excellence of character aimed at flourishing.","who":["Aristotle (c. 340 BC)","Rosalind Hursthouse (1999)","Julia Annas (2011)","Philippa Foot (2001)","John McDowell (1979)"],"f":"F2","q":"What fixes the virtues?","kids":[{"t":"Aristotle’s function argument","s":"Human good is activity of soul in accordance with virtue, since reason is our function.","who":["Aristotle (c. 340 BC)"],"f":"F2","q":"Which life is best?","kids":[{"t":"Contemplative life","s":"Theoretical wisdom is the highest activity.","who":["Aristotle, Ethics X","Thomas Nagel (1972), reading"],"f":"F2"},{"t":"Inclusive life","s":"Flourishing includes all the virtues in a balanced life.","who":["J.L. Ackrill (1974)","Martha Nussbaum (1986)"],"f":"F2"}]},{"t":"Doctrine of the mean","s":"Virtue lies between excess and deficiency, as the wise person judges.","who":["Aristotle","Confucius, Zhongyong","Maimonides (1180)"],"f":"F2"},{"t":"Hursthouse’s qualified agent","s":"An action is right if a virtuous agent would characteristically do it.","who":["Rosalind Hursthouse (1999)"],"f":"F2"},{"t":"Annas’s skill analogy","s":"Virtue is like practical expertise, learned and intelligent.","who":["Julia Annas (2011)"],"f":"F2"},{"t":"McDowell’s uncodifiable virtue","s":"The virtuous person perceives what the situation requires; no rule captures it.","who":["John McDowell (1979)"],"f":"F2"},{"t":"MacIntyre’s practices and tradition","s":"Virtues are what sustain practices, whole lives, and traditions.","who":["Alasdair MacIntyre (1981)"],"f":"F2"},{"t":"Swanton’s target-centered view","s":"An act is virtuous if it hits the target of a virtue, whether or not the agent is virtuous.","who":["Christine Swanton (2003)"],"f":"F2"},{"t":"Russell’s practical intelligence","s":"Right action is what phronesis, as a genuine virtue, selects.","who":["Daniel Russell (2009)"],"f":"F2"},{"t":"Nussbaum’s fragility of goodness","s":"Flourishing is vulnerable to luck; tragedy is part of ethics.","who":["Martha Nussbaum (1986)"],"f":"F2"}]},{"t":"Agent-based virtue ethics","s":"Right acts are those that express good motives; motives are prior to acts.","who":["Michael Slote (2001)","Hume (1751), on one reading","James Martineau (1885)"],"f":"F2"},{"t":"Exemplarist moral theory","s":"Moral terms are anchored in admired exemplars, as natural kinds are anchored in samples.","who":["Linda Zagzebski (2017)"],"f":"F2"},{"t":"Adams’s theory of virtue","s":"Virtue is persisting excellence in being for the good.","who":["Robert Adams (2006)"],"f":"F2"},{"t":"Hurka’s recursive account","s":"Virtue is loving what is good and hating what is bad, as itself a good.","who":["Thomas Hurka (2001)"],"f":"F2"},{"t":"Perfectionism","s":"The good life develops human excellences; some lives are better in kind.","who":["Thomas Hurka (1993)","T.H. Green (1883)","Nietzsche (1886)","Joseph Raz (1986)","Steven Wall (1998)"],"f":"F2","q":"Excellence in what?","kids":[{"t":"Nietzschean perfectionism","s":"Greatness of a few justifies a culture; self-overcoming is the measure.","who":["Friedrich Nietzsche (1886)","John Rawls (1971), reading","Thomas Hurka (2007)"],"f":"F2"},{"t":"Idealist self-realization","s":"The good is realizing the self as part of a rational whole.","who":["T.H. Green (1883)","F.H. Bradley (1876)","Bernard Bosanquet (1899)"],"f":"F2"},{"t":"Perfectionist liberalism","s":"The state may promote autonomy and valuable options.","who":["Joseph Raz (1986)","George Sher (1997)","Steven Wall (1998)"],"f":"F2"},{"t":"Emersonian self-reliance","s":"Trust the self; conformity is the vice.","who":["Ralph Waldo Emerson (1841)","Stanley Cavell (1990), reading"],"f":"F2"}]},{"t":"Confucian ethics","s":"Cultivate ren through ritual, learning, and family roles; the sage is the standard.","who":["Confucius (c. 500 BC)","Mencius (c. 300 BC)","Xunzi (c. 250 BC)","Zhu Xi (c. 1180)","Wang Yangming (1527)"],"f":"F2","q":"Is human nature good?","kids":[{"t":"Confucius’s Analects","s":"Ren, li, and yi cultivated in the gentleman; the way of the sages.","who":["Confucius (c. 500 BC)"],"f":"F2"},{"t":"Mencius’s sprouts","s":"Nature is good; four sprouts grow into virtues if nourished.","who":["Mencius (c. 300 BC)","Bryan Van Norden (2007)"],"f":"F2"},{"t":"Xunzi’s ritual reform","s":"Nature is bad; ritual and teachers straighten it.","who":["Xunzi (c. 250 BC)","T.C. Kline (2000)"],"f":"F2"},{"t":"Neutral nature","s":"Nature is neither good nor bad; it takes the shape given.","who":["Gaozi (c. 350 BC)","Dong Zhongshu (c. 130 BC)"],"f":"F2"},{"t":"Neo-Confucian principle","s":"Human nature is li, obscured by qi; learning clears it.","who":["Zhu Xi (c. 1180)","Cheng Yi (c. 1090)"],"f":"F2"},{"t":"School of Mind","s":"Innate moral knowing suffices; act on it.","who":["Wang Yangming (1527)","Lu Xiangshan (c. 1180)"],"f":"F2"},{"t":"Confucian role ethics","s":"Persons are their roles and relations; there is no self apart.","who":["Roger Ames and Henry Rosemont (2011)"],"f":"F2"},{"t":"Contemporary Confucian virtue ethics","s":"Confucianism read as a virtue ethics of sagehood.","who":["Philip J. Ivanhoe (2000)","Stephen Angle (2009)","May Sim (2007)","Jiyuan Yu (2007)"],"f":"F2"},{"t":"Korean Neo-Confucianism","s":"Debate on whether the four sprouts and seven feelings share one origin.","who":["Yi Hwang, Toegye (1559)","Yi I, Yulgok (c. 1570)"],"f":"F2","q":"One origin or two?","kids":[{"t":"Toegye’s two-origins view","s":"The four sprouts issue from principle, the seven feelings from material force.","who":["Yi Hwang, Toegye (1559)","Ki Taesung (1559)"],"f":"F2"},{"t":"Yulgok’s one-origin view","s":"All feelings issue from material force with principle riding on it; the sprouts are the good ones among the seven.","who":["Yi I, Yulgok (c. 1572)","Song Siyol (c. 1680)"],"f":"F2"},{"t":"Horak debate","s":"Whether the unaroused mind and non-human nature are already good.","who":["Han Wonjin (c. 1715)","Yi Gan (c. 1715)"],"f":"F2","q":"Is the nature of things the same?","kids":[{"t":"Horon","s":"Human and animal natures differ; the unaroused mind can be bad.","who":["Han Wonjin (c. 1715)"],"f":"F2"},{"t":"Nakron","s":"All natures are one; the unaroused mind is wholly good.","who":["Yi Gan (c. 1715)"],"f":"F2"}]}]}]},{"t":"Hellenistic schools","s":"Virtue or tranquility as the end, with different views of what threatens it.","who":["Zeno","Epicurus","Diogenes","Pyrrho"],"f":"F2","q":"What is the end?","kids":[{"t":"Stoicism","s":"Virtue alone is good; externals are indifferent; live according to nature.","who":["Zeno (c. 300 BC)","Chrysippus (c. 240 BC)","Epictetus (c. 110)","Seneca (c. 60)","Marcus Aurelius (c. 170)"],"f":"F2","q":"Modern revivals?","kids":[{"t":"New Stoicism","s":"Stoic ethics rebuilt without Stoic physics.","who":["Lawrence Becker (1998)","Massimo Pigliucci (2017)"],"f":"F2"},{"t":"Stoic cosmopolitanism","s":"All rational beings are fellow citizens of one city.","who":["Zeno","Marcus Aurelius","Martha Nussbaum (1997)"],"f":"F2"}]},{"t":"Epicureanism","s":"Pleasure, understood as absence of pain and fear, is the end; virtue serves it.","who":["Epicurus (c. 300 BC)","Lucretius (c. 55 BC)","Philodemus"],"f":"F2"},{"t":"Cynicism","s":"Live according to nature, reject convention and possessions.","who":["Antisthenes (c. 400 BC)","Diogenes of Sinope (c. 350 BC)","Crates"],"f":"F2"},{"t":"Pyrrhonian ethics","s":"Suspend judgment on good and bad; tranquility follows.","who":["Pyrrho (c. 300 BC)","Sextus Empiricus (c. 200)"],"f":"F2"},{"t":"Cyrenaic hedonism","s":"Present bodily pleasure is the end.","who":["Aristippus (c. 400 BC)"],"f":"F2"},{"t":"Platonic virtue","s":"Justice is harmony of the soul’s parts under reason.","who":["Plato (c. 380 BC)","Plotinus (c. 250)"],"f":"F2"}]},{"t":"Thomist virtue ethics","s":"Cardinal and theological virtues perfect nature toward union with God.","who":["Thomas Aquinas (1270)","Josef Pieper (1954)","Servais Pinckaers (1985)","Jean Porter (1990)","Romanus Cessario (1991)"],"f":"F2","q":"What does grace add?","kids":[{"t":"Acquired and infused virtue","s":"Natural virtues are acquired by habit; theological ones are infused by grace.","who":["Aquinas (1270)","Jennifer Herdt (2008)"],"f":"F2"},{"t":"Christian virtue ethics","s":"The church’s narrative forms the virtues; ethics is not for anyone in general.","who":["Stanley Hauerwas (1981)","Alasdair MacIntyre (1981)"],"f":"F2"},{"t":"Augustinian ordered love","s":"Virtue is rightly ordered love; sin is disordered love.","who":["Augustine (c. 400)","Oliver O’Donovan (1980)"],"f":"F2"}]},{"t":"Islamic virtue ethics","s":"Refine the soul’s character toward the mean and toward God.","who":["Ibn Miskawayh (c. 1000)","al-Ghazali (c. 1100)","Nasir al-Din al-Tusi (1235)","al-Farabi (c. 940)"],"f":"F2"},{"t":"Situationist challenge","s":"Behavior depends on situations, not stable traits, so virtue ethics rests on a mistake.","who":["John Doris (2002)","Gilbert Harman (1999)","Christian Miller (2013), mixed traits reply","Nancy Snow (2010), reply"],"f":"F1"},{"t":"Feminist virtue ethics","s":"Virtues under oppression can be burdensome; care and trust are central.","who":["Lisa Tessman (2005)","Annette Baier (1986)","Robin Dillon"],"f":"F2"},{"t":"Sentimentalist virtue ethics","s":"Virtues are traits that a benevolent observer approves.","who":["David Hume (1751)","Michael Slote (2010)"],"f":"F2"},{"t":"Moral saints critique","s":"A life wholly devoted to moral virtue is not the best life.","who":["Susan Wolf (1982)","Bernard Williams (1981)"],"f":"F2"},{"t":"Nietzsche’s master morality","s":"Good is what the strong affirm; slave morality inverts it through ressentiment.","who":["Friedrich Nietzsche (1886, 1887)"],"f":"F2"}],"q":"What fixes the virtues?"},{"t":"Agreement","who":["Hobbes","Locke","Rousseau","Rawls","Gauthier","Scanlon"],"addr":"N4","kids":[{"t":"Hobbesian contractarianism","s":"Morality is the set of rules self-interested agents would agree to for mutual benefit.","who":["Thomas Hobbes (1651)","David Gauthier (1986)","Jan Narveson (1988)","Gregory Kavka (1986)","Jean Hampton (1986)"],"f":"F2","q":"How is compliance rational?","kids":[{"t":"Hobbes’s laws of nature","s":"Seek peace; keep covenants; a sovereign enforces them.","who":["Thomas Hobbes (1651)"],"f":"F2"},{"t":"Morals by agreement","s":"Constrained maximizers do better than straightforward ones, so rationality endorses morality.","who":["David Gauthier (1986)"],"f":"F2"},{"t":"Evolutionary contractarianism","s":"Fairness norms are equilibria selected by evolution and culture.","who":["Ken Binmore (1994, 2005)","Brian Skyrms (1996, 2004)","Robert Sugden (1986)","Peter Vanderschraaf (2019)"],"f":"F2"},{"t":"Multilevel contractarianism","s":"Different agreements for shared-values groups and for strangers.","who":["Michael Moehler (2018)"],"f":"F2"},{"t":"Buchanan’s constitutional contractarianism","s":"Rules are legitimate when unanimously agreeable at the constitutional stage.","who":["James Buchanan (1975)","Buchanan and Tullock (1962)"],"f":"F2"},{"t":"Epicurean compact","s":"Justice is a compact not to harm or be harmed.","who":["Epicurus (c. 300 BC)","Glaucon in Republic II"],"f":"F2"}]},{"t":"Kantian contractualism","s":"Principles are those free and equal persons could all accept.","who":["Jean-Jacques Rousseau (1762)","Immanuel Kant (1797)","John Rawls (1971)","T.M. Scanlon (1998)","Brian Barry (1995)"],"f":"F2","q":"What models fair agreement?","kids":[{"t":"Rousseau’s general will","s":"Legitimate law expresses the general will of citizens who legislate for themselves.","who":["Jean-Jacques Rousseau (1762)"],"f":"F2"},{"t":"Rawls’s original position","s":"Principles chosen behind a veil of ignorance are just.","who":["John Rawls (1971)"],"f":"F2","q":"What is chosen?","kids":[{"t":"Justice as fairness","s":"Equal basic liberties, fair equality of opportunity, and the difference principle.","who":["Rawls (1971)"],"f":"F2","q":"Which regime realizes it?","kids":[{"t":"Property-owning democracy","s":"Wide dispersal of capital, not welfare-state transfers, satisfies the principles.","who":["John Rawls (2001)","James Meade (1964)","Martin O’Neill and Thad Williamson (2012)"],"f":"F2"},{"t":"Liberal socialism reading","s":"Rawls’s principles rule out capitalism and require social ownership.","who":["William Edmundson (2017)"],"f":"F2"},{"t":"Welfare-state liberalism reading","s":"The principles are met by a regulated market with strong redistribution.","who":["Samuel Freeman (2007), partly","Brian Barry (1973)"],"f":"F2"}]},{"t":"Political liberalism","s":"Justice is justified by public reason to citizens with different comprehensive views.","who":["Rawls (1993)"],"f":"F2"},{"t":"Law of Peoples","s":"A second original position among peoples yields international justice.","who":["Rawls (1999)"],"f":"F2"}]},{"t":"Scanlon’s contractualism","s":"Principles that no one could reasonably reject.","who":["T.M. Scanlon (1998)"],"f":"F2"},{"t":"Barry’s justice as impartiality","s":"Rules no one could reasonably reject from a position of equality.","who":["Brian Barry (1995)"],"f":"F2"},{"t":"Kant’s original contract","s":"The idea of a contract tests law; actual consent is not needed.","who":["Kant (1793, 1797)","Arthur Ripstein (2009)"],"f":"F2"}]},{"t":"Lockean contract","s":"Natural rights precede the contract; government exists to secure them.","who":["John Locke (1689)","Robert Nozick (1974)","A. John Simmons (1993)"],"f":"F2","q":"What does the proviso require?","kids":[{"t":"Lockean proviso","s":"Appropriation is fine if enough and as good is left for others.","who":["John Locke (1689)","Nozick (1974)"],"f":"F2"},{"t":"Right-libertarianism","s":"Self-ownership and just acquisition; the minimal state.","who":["Robert Nozick (1974)","Murray Rothbard (1973)","Eric Mack"],"f":"F2"},{"t":"Left-libertarianism","s":"Self-ownership plus egalitarian ownership of natural resources.","who":["Hillel Steiner (1994)","Peter Vallentyne (2000)","Michael Otsuka (2003)"],"f":"F2"}]},{"t":"Rawls’s descendants","s":"Egalitarian theories that revise justice as fairness.","who":["Dworkin","Cohen","Anderson","Sen"],"f":"F2","q":"Equality of what?","kids":[{"t":"Luck egalitarianism","s":"Inequalities from choice are fine; those from luck are not.","who":["Ronald Dworkin (1981)","Richard Arneson (1989)","G.A. Cohen (1989)","John Roemer (1998)"],"f":"F2"},{"t":"Relational egalitarianism","s":"Equality is a relation between people, not a distribution.","who":["Elizabeth Anderson (1999)","Samuel Scheffler (2003)"],"f":"F2"},{"t":"Capabilities approach","s":"Justice secures real freedoms to do and be.","who":["Amartya Sen (1985)","Martha Nussbaum (2000)"],"f":"F2"},{"t":"Cohen’s rescuing justice","s":"Justice is a fact-insensitive principle; Rawls confused it with regulation.","who":["G.A. Cohen (2008)"],"f":"F2"},{"t":"Cosmopolitan justice","s":"The original position should be global.","who":["Charles Beitz (1979)","Thomas Pogge (1989)"],"f":"F2"},{"t":"Public reason liberalism","s":"Norms must be justified to each reasonable person from their own view.","who":["Gerald Gaus (2011)","Charles Larmore (1996)","Jonathan Quong (2011)","Kevin Vallier (2014)"],"f":"F2"}]},{"t":"Conventionalism","s":"Morality is a system of conventions that solve coordination problems.","who":["David Hume (1739)","David Lewis (1969)","Robert Sugden (1986)","J.L. Mackie (1977)"],"f":"F2","q":"Why do conventions bind?","kids":[{"t":"Hume’s conventions","s":"Justice arises from a sense of common interest, without promise.","who":["David Hume (1739)"],"f":"F2"},{"t":"Lewis on convention","s":"Conventions are self-perpetuating coordination equilibria.","who":["David Lewis (1969)"],"f":"F2"},{"t":"Mackie’s invented morality","s":"Morality is a device to be invented, since none is found.","who":["J.L. Mackie (1977)"],"f":"F2"},{"t":"Sophist conventionalism","s":"Justice is by nomos, not phusis; nature knows no justice.","who":["Antiphon (c. 420 BC)","Callicles in Gorgias","Thrasymachus in Republic I"],"f":"F2"}]},{"t":"Critical contract theories","s":"The classical contract excluded women, slaves, and dependents; justice must repair this.","who":["Carole Pateman (1988)","Charles Mills (1997)","Eva Kittay (1999)","Susan Moller Okin (1989)","Martha Nussbaum (2006)"],"f":"F2","q":"Who was left out?","kids":[{"t":"Sexual contract","s":"The social contract presupposed a prior contract subordinating women.","who":["Carole Pateman (1988)"],"f":"F2"},{"t":"Racial contract","s":"Actual contracts established white supremacy; the ideal theory hides this.","who":["Charles Mills (1997)"],"f":"F2"},{"t":"Dependency critique","s":"Contract theory forgets that everyone is cared for and some care.","who":["Eva Kittay (1999)"],"f":"F2"},{"t":"Frontiers of justice","s":"Disability, nationality, and species show the contract’s limits; capabilities do better.","who":["Martha Nussbaum (2006)"],"f":"F2"},{"t":"Justice, gender, and the family","s":"Justice must apply inside the family.","who":["Susan Moller Okin (1989)"],"f":"F2"}]},{"t":"Discourse and deliberation","s":"Legitimacy comes from actual deliberation among all affected.","who":["Jürgen Habermas (1992)","Joshua Cohen (1989)","Seyla Benhabib (1996)","Amy Gutmann and Dennis Thompson (1996)"],"f":"F2"},{"t":"Communitarianism","s":"Justice is rooted in shared understandings of a community.","who":["Michael Sandel (1982)","Charles Taylor (1989)","Michael Walzer (1983)","Alasdair MacIntyre (1981)"],"f":"F2"}],"q":"Who agrees, under what conditions?"},{"t":"Care and the particular case","who":["Gilligan","Noddings","Held","Dancy"],"addr":"N5","kids":[{"t":"Ethics of care","s":"Morality begins in relationships of care and responsiveness, not principles.","who":["Carol Gilligan (1982)","Nel Noddings (1984)","Virginia Held (2006)","Eva Kittay (1999)","Joan Tronto (1993)"],"f":"F2","q":"What is care, and how far does it reach?","kids":[{"t":"Gilligan’s different voice","s":"A care perspective coexists with the justice perspective and was missed by stage theories.","who":["Carol Gilligan (1982)"],"f":"F1"},{"t":"Noddings’s caring relation","s":"Ethics is the relation of one-caring and cared-for; obligation grows from natural caring.","who":["Nel Noddings (1984)"],"f":"F2"},{"t":"Held’s care as fundamental","s":"Care is a value and practice more basic than justice.","who":["Virginia Held (2006)"],"f":"F2"},{"t":"Kittay’s dependency work","s":"Dependency is universal; justice must support those who care for dependents.","who":["Eva Kittay (1999)"],"f":"F2"},{"t":"Tronto’s political care","s":"Care is a political ideal with phases: attentiveness, responsibility, competence, responsiveness.","who":["Joan Tronto (1993, 2013)"],"f":"F2"},{"t":"Maternal thinking","s":"Mothering is a practice with its own rationality and virtues.","who":["Sara Ruddick (1989)"],"f":"F2"},{"t":"Engster’s justice of care","s":"Care generates obligations to all who need it, proportional to ability and relation.","who":["Daniel Engster (2007)"],"f":"F2"},{"t":"Slote’s care ethics","s":"Empathic caring is the basis of all morality including justice.","who":["Michael Slote (2007)"],"f":"F2"},{"t":"Baier’s trust","s":"Trust, not obligation, is the central moral relation.","who":["Annette Baier (1986)"],"f":"F2"},{"t":"Confucian ren as care","s":"Humaneness is graded care rooted in family and extended outward.","who":["Li Chenyang (1994)","Mencius","Daniel Star (2002), critic"],"f":"F2"},{"t":"Buddhist compassion as care","s":"Karuna is the responsive concern from which right action flows.","who":["Śāntideva (c. 700)","Thich Nhat Hanh (1987)"],"f":"F2"}]},{"t":"Ethics of the other","s":"Morality begins in the face-to-face encounter that commands before any theory.","who":["Emmanuel Levinas (1961)","Knud Løgstrup (1956)","Martin Buber (1923)","Simone Weil (1942)","Iris Murdoch (1970)"],"f":"F2","q":"What does the other demand?","kids":[{"t":"Levinas’s face","s":"The other’s face imposes infinite responsibility prior to freedom.","who":["Emmanuel Levinas (1961, 1974)"],"f":"F2"},{"t":"Løgstrup’s ethical demand","s":"The other’s trust places a silent, radical, one-sided demand.","who":["Knud Løgstrup (1956)"],"f":"F2"},{"t":"Buber’s I-Thou","s":"Meeting the other as Thou, not It, is the ethical relation.","who":["Martin Buber (1923)"],"f":"F2"},{"t":"Murdoch’s attention","s":"Morality is just and loving attention to the real; unselfing.","who":["Iris Murdoch (1970)"],"f":"F2"},{"t":"Weil’s attention and decreation","s":"Attention to the afflicted is the substance of love and justice.","who":["Simone Weil (1942, 1947)"],"f":"F2"}]},{"t":"Moral particularism","s":"There are no true moral principles; reasons depend wholly on context.","who":["Jonathan Dancy (1993, 2004)","Margaret Little (2000)","John McDowell (1979)","Mark Lance"],"f":"F2","q":"What guides judgment without principles?","kids":[{"t":"Dancy’s holism","s":"Any feature can change its moral valence with context, so no finite principles hold.","who":["Jonathan Dancy (2004)"],"f":"F2"},{"t":"Little’s moral knowledge without principles","s":"Moral competence is a skill of seeing, not a rulebook.","who":["Margaret Little (2000)"],"f":"F2"},{"t":"Casuistry","s":"Reason from paradigm cases by analogy, not from principles.","who":["Albert Jonsen and Stephen Toulmin (1988)","Jesuit moral theology (c. 1600)"],"f":"F2","q":"What to do when the case is doubtful?","kids":[{"t":"Probabilism","s":"One may follow a solidly probable opinion even if the opposite is more probable.","who":["Bartolomé de Medina (1577)","Francisco Suárez (c. 1600)","Jesuit casuists"],"f":"F2","q":"How probable must it be?","kids":[{"t":"Equiprobabilism","s":"One may follow the freer opinion only when it is at least as probable as the stricter.","who":["Alphonsus Liguori (1762)"],"f":"F2"},{"t":"Laxism","s":"Any faint probability frees from the law.","who":["Juan Caramuel (c. 1650)","condemned by Innocent XI (1679)"],"f":"F2"}]},{"t":"Probabiliorism","s":"One must follow the more probable opinion.","who":["Daniele Concina (1743)","Dominican casuists"],"f":"F2"},{"t":"Tutiorism","s":"In doubt, follow the safer opinion always.","who":["Jansenists (c. 1650)","Antoine Arnauld"],"f":"F2"}]},{"t":"Literary particularism","s":"Novels train perception of particulars that theory misses.","who":["Martha Nussbaum (1990)","Cora Diamond (1991)","Raimond Gaita (1991)"],"f":"F2"},{"t":"Wittgensteinian moral philosophy","s":"Moral understanding is shown in what one can say and see, not in theory.","who":["Cora Diamond (1991)","Raimond Gaita (1991)","Rush Rhees (1969)","Peter Winch (1972)"],"f":"F2"},{"t":"Moral perception","s":"Seeing the morally salient is prior to reasoning.","who":["Lawrence Blum (1994)","Iris Murdoch (1970)"],"f":"F2"},{"t":"Anti-theory","s":"Ethical theory as such distorts; there is no place for it.","who":["Bernard Williams (1985)","Annette Baier (1985)","Stanley Clarke and Evan Simpson (1989)"],"f":"F2"},{"t":"Existentialist decision","s":"No rule decides the case; the agent must choose and own it.","who":["Jean-Paul Sartre (1946)","Søren Kierkegaard (1843)"],"f":"F2"}]},{"t":"Relational autonomy and ethics","s":"Selves are made in relations; autonomy and duty are relational.","who":["Catriona Mackenzie and Natalie Stoljar (2000)","Jennifer Nedelsky (2011)","Marilyn Friedman (2003)"],"f":"F2"},{"t":"Ethics of vulnerability","s":"Shared vulnerability grounds obligations of protection and care.","who":["Judith Butler (2004)","Alasdair MacIntyre (1999)","Catriona Mackenzie (2014)","Martha Fineman (2008)"],"f":"F2"}],"q":"Relationship, encounter, or the case itself?"},{"t":"Command","who":["Ockham","Adams"],"addr":"N6","kids":[{"t":"Divine command as normative theory","s":"An act is obligatory because God commands it, whatever the metaethics.","who":["William of Ockham (c. 1320)","Robert Adams (1979)","Philip Quinn (1978)","Stephen Evans (2013)","John Hare (2015)"],"f":"F2","q":"How is the command known?","kids":[{"t":"Scriptural command","s":"God’s will is read from revealed texts.","who":["Calvinist and Hanbali traditions","Karl Barth (1932)"],"f":"F2"},{"t":"Command through conscience","s":"God commands through the inner voice.","who":["Joseph Butler (1726)","John Henry Newman (1870)","Jean-Jacques Rousseau (1762)"],"f":"F2"},{"t":"Command through church or community","s":"Authoritative interpretation mediates the command.","who":["Catholic magisterium","Rabbinic halakhah","Islamic ijmaʿ"],"f":"F2"},{"t":"Evans’s divine commands and obligations","s":"Commands from a good God make the moral obligations that philosophers struggle to ground.","who":["Stephen Evans (2013)","John Hare (2001)"],"f":"F2"},{"t":"Mouw’s obedience","s":"Obedience itself is the virtue.","who":["Richard Mouw (1990)"],"f":"F2"}]},{"t":"Vedic injunction","s":"Right is what the authorless Veda enjoins; no other source of dharma exists.","who":["Jaimini (c. 200 BC)","Kumarila (c. 650)","Prabhakara (c. 650)"],"f":"F2"},{"t":"Halakhic command","s":"Obligation is what the commandments require as interpreted by rabbinic law.","who":["Yeshayahu Leibowitz (1975)","Joseph Soloveitchik (1944)","Moses Maimonides (1180)"],"f":"F2","q":"What do reasons for commandments add?","kids":[{"t":"Reasons for the commandments","s":"Commandments have reasons we can partly know.","who":["Saadia Gaon (933)","Maimonides (1190)","Sefer ha-Chinuch (c. 1300)"],"f":"F2"},{"t":"Commandments without reasons","s":"Some commandments are decrees to be obeyed without explanation.","who":["Rashi (c. 1100)","Leibowitz (1975)"],"f":"gate"},{"t":"Covenantal ethics","s":"Obligation flows from a mutual covenant, not bare command.","who":["David Hartman (1985)","Irving Greenberg (1988)","Jon Levenson (1985)"],"f":"F2"}]},{"t":"Islamic legal command","s":"Right is what the shariʿa commands, discovered by jurisprudence.","who":["al-Shafiʿi (c. 800)","al-Ghazali (c. 1100)","Ibn Taymiyya (c. 1310)"],"f":"F2","q":"How much can reason weigh?","kids":[{"t":"Textualist fiqh","s":"Text and analogy alone; reason does not legislate.","who":["Ibn Hazm (c. 1050)","Ibn Hanbal"],"f":"F2"},{"t":"Maqasid theory","s":"Law serves purposes such as life, religion, intellect, lineage, property; reason weighs them.","who":["al-Ghazali (c. 1100)","al-Shatibi (c. 1380)","Ibn Ashur (1946)"],"f":"F2"},{"t":"Istislah and public interest","s":"Unregulated cases are decided by benefit.","who":["Malik ibn Anas (c. 780)","Najm al-Din al-Tufi (c. 1310)"],"f":"F2"}]},{"t":"Command of the sovereign","s":"Right and wrong are what the lawgiver settles, since nothing settles them before.","who":["Thomas Hobbes (1651)","Jean Bodin (1576)","John Austin (1832), for law"],"f":"F2"},{"t":"Legal moralism","s":"Positive law may enforce the community’s morality.","who":["Patrick Devlin (1965)","James Fitzjames Stephen (1873)","H.L.A. Hart (1963), critic"],"f":"F2"},{"t":"Conscience as command","s":"The inner voice is the final authority whatever its source.","who":["Joseph Butler (1726)","Jean-Jacques Rousseau (1762)","Martin Heidegger (1927), call of conscience","Kant (1797)"],"f":"F2"},{"t":"Authority of tradition","s":"What has been handed down commands because it has been handed down.","who":["Edmund Burke (1790)","Hans-Georg Gadamer (1960)","Confucian transmission"],"f":"F2"}],"q":"Whose command, known how?"},{"t":"Compassion and non-harm","s":"Right action reduces suffering and springs from a mind free of craving and hatred.","who":["Buddha (c. 450 BC)","Śāntideva (c. 700)","Mahavira (c. 500 BC)","Gandhi (1909)","Schweitzer (1923)"],"f":"F2","q":"Is Buddhist ethics about outcomes, character, or neither?","kids":[{"t":"Theravāda ethics","s":"Skillful acts rooted in non-greed, non-hatred, non-delusion bear good karma and lead toward nibbana.","who":["Buddhaghosa (c. 430)","Pali Nikayas","Damien Keown (1992)","Peter Harvey (2000)"],"f":"F2","q":"Which reading?","kids":[{"t":"Virtue reading","s":"Buddhist ethics is a eudaimonist virtue ethics with nibbana as the end.","who":["Damien Keown (1992)","James Whitehill (1994)","Nicolas Bommarito (2020)"],"f":"F2"},{"t":"Consequentialist reading","s":"Buddhist ethics is universalist welfarism: reduce suffering wherever it is.","who":["Charles Goodman (2009)","Mark Siderits (2007)"],"f":"F2"},{"t":"Anti-theory reading","s":"Buddhist ethics is particularist and cannot be mapped onto Western theories.","who":["Christopher Gowans (2015)","Jay Garfield (2022)","Barbra Clayton"],"f":"F2"},{"t":"Karma and rebirth as the frame","s":"Acts are right as they lead to better rebirth and finally to release.","who":["Abhidhamma","Bhikkhu Bodhi"],"f":"F2"}]},{"t":"Mahāyāna bodhisattva ethics","s":"Vow to free all beings; compassion and wisdom together; skillful means may bend rules.","who":["Śāntideva (c. 700)","Asanga (c. 350)","Nagarjuna (c. 150)","Lotus Sutra"],"f":"F2","q":"How far does skillful means go?","kids":[{"t":"Śāntideva’s exchange of self and other","s":"Since self and other are equally empty, my suffering has no privilege over yours.","who":["Śāntideva, Bodhicaryāvatāra (c. 700)","Paul Williams (1998), critic"],"f":"F2"},{"t":"Madhyamaka two truths","s":"Conventionally, ethics holds fully; ultimately, nothing has a nature, including right and wrong.","who":["Nagarjuna (c. 150)","Candrakirti (c. 600)","Jay Garfield (2015)"],"f":"F2"},{"t":"Upāya and precept-breaking","s":"A bodhisattva may break precepts when compassion requires.","who":["Upāyakauśalya Sūtra","Asanga, Bodhisattvabhūmi"],"f":"gate"},{"t":"Yogācāra mind-only ethics","s":"Purifying the storehouse consciousness is the moral task.","who":["Vasubandhu (c. 350)","Asanga"],"f":"F2"},{"t":"Zen ethics","s":"Right action flows from awakened spontaneity beyond rules.","who":["Dogen (1231)","Hui-neng (c. 700)","Brian Victoria (1997), critic"],"f":"F2"},{"t":"Pure Land ethics","s":"Reliance on Amida’s vow, not one’s own merit; gratitude shapes action.","who":["Shinran (c. 1250)","Honen (c. 1200)"],"f":"F2"},{"t":"Tibetan lamrim","s":"Graded path from refuge to bodhicitta to emptiness.","who":["Tsongkhapa (1402)","Atisha (c. 1040)"],"f":"F2"}]},{"t":"Engaged Buddhism","s":"Buddhist principles applied to social and political suffering.","who":["Thich Nhat Hanh (1987)","Sulak Sivaraksa (1992)","B.R. Ambedkar (1956)","Dalai Lama (1999)"],"f":"F2"},{"t":"Buddhist modernism","s":"Buddhist ethics recast as secular, this-worldly, and compatible with science.","who":["Stephen Batchelor (1997)","Owen Flanagan (2011)","David McMahan (2008), historian"],"f":"F2"},{"t":"Jain ahiṃsā","s":"Non-harm to all living beings is the supreme duty; intention and care in every act.","who":["Mahavira (c. 500 BC)","Umasvati (c. 200)","Kundakunda (c. 200)","Hemacandra (c. 1150)"],"f":"F2","q":"How far does non-harm reach?","kids":[{"t":"Anekāntavāda","s":"Reality is many-sided; dogmatism is a form of violence.","who":["Mallisena (1292)","Jain logicians"],"f":"F2"},{"t":"Ascetic and lay codes","s":"Monks keep the great vows absolutely; laypeople keep lesser vows.","who":["Umasvati (c. 200)","Śrāvakācāra texts"],"f":"F2"},{"t":"Karma as matter","s":"Karma is subtle matter that binds the soul; ahimsa stops the inflow.","who":["Umasvati","Kundakunda"],"f":"F2"}]},{"t":"Gandhian satyagraha","s":"Truth and non-violence are one; means must be as pure as ends.","who":["Mohandas Gandhi (1909, 1927)","Leo Tolstoy (1894)","Martin Luther King Jr. (1958)"],"f":"F2"},{"t":"Reverence for life","s":"All life wills to live; ethics is responsibility toward all that lives.","who":["Albert Schweitzer (1923)","Paul Taylor (1986), biocentrism","Arne Naess (1973), deep ecology"],"f":"F2"},{"t":"Schopenhauer’s ethics of compassion","s":"Seeing through the illusion of separateness, compassion is the only moral incentive.","who":["Arthur Schopenhauer (1840)"],"f":"F2"}]},{"t":"Revealed traditions and their reasons","s":"Right is what a revealed tradition teaches, worked out by its own schools.","who":["Augustine","al-Ghazali","Maimonides","Śaṅkara","Guru Nanak"],"f":"F2","q":"How does each tradition relate reason to revelation?","kids":[{"t":"Islamic ethical schools","s":"Whether reason or revelation grounds obligation, and what the law is for.","who":["al-Ashʿari","Abd al-Jabbar","al-Ghazali","Ibn Rushd"],"f":"F2","q":"Which school?","kids":[{"t":"Ashʿarite ethics","s":"Good and evil are known only by revelation; God is not bound by them.","who":["al-Ashʿari (c. 930)","al-Baqillani (c. 1000)","al-Juwayni (c. 1080)","al-Razi (c. 1200)"],"f":"F2"},{"t":"Muʿtazilite ethics","s":"Good and evil are objective and rationally known; God must act justly.","who":["Abd al-Jabbar (c. 1000)","al-Nazzam (c. 830)","George Hourani (1971), historian"],"f":"F2"},{"t":"Maturidi ethics","s":"Reason knows good and evil; revelation makes them binding.","who":["al-Maturidi (c. 940)","Abu al-Muʿin al-Nasafi (c. 1100)"],"f":"F2"},{"t":"Falsafa virtue ethics","s":"Greek virtue ethics with the philosopher-prophet as perfected human.","who":["al-Farabi (c. 940)","Ibn Sina (c. 1020)","Ibn Miskawayh (c. 1000)","Ibn Rushd (c. 1180)"],"f":"F2"},{"t":"Sufi ethics","s":"Purification of the heart and stations of the path; adab and love of God.","who":["al-Ghazali (c. 1100)","Rumi (c. 1260)","al-Qushayri (c. 1050)","Ibn Arabi (c. 1230)"],"f":"F2"},{"t":"Ibn Taymiyya’s theistic naturalism","s":"Good is grounded in God’s wise purposes, which the law reveals and reason confirms.","who":["Ibn Taymiyya (c. 1310)","Ibn al-Qayyim (c. 1340)"],"f":"F2"},{"t":"Modern Islamic ethics","s":"Ethics recovered from the Qurʾan’s moral vision against legalism.","who":["Fazlur Rahman (1980)","Toshihiko Izutsu (1966)","Khaled Abou El Fadl (2014)","Tariq Ramadan (2009)"],"f":"F2"},{"t":"Shīʿi ethics","s":"Justice is intrinsic; the Imam is the moral exemplar; reason is a source of law.","who":["Nahj al-Balagha","Mulla Sadra (c. 1630)","Muhammad Baqir al-Sadr (1959)"],"f":"F2"},{"t":"Quranic ethical humanism","s":"The Qurʾan’s core is taqwa, justice, and mercy, prior to law.","who":["Toshihiko Izutsu (1966)","Fazlur Rahman (1980)","Muhammad Iqbal (1930)"],"f":"F2"}]},{"t":"Jewish ethical schools","s":"Whether the commandments have reasons, and how ethics relates to law.","who":["Saadia","Maimonides","Bahya","Salanter","Levinas"],"f":"F2","q":"Which school?","kids":[{"t":"Saadia’s rational and revealed laws","s":"Some commandments reason would find on its own; others are heard.","who":["Saadia Gaon (933)"],"f":"F2"},{"t":"Maimonidean ethics","s":"The Law aims at welfare of body and soul; virtue is the mean; the end is knowledge of God.","who":["Maimonides (1180, 1190)"],"f":"F2"},{"t":"Duties of the heart","s":"Inner duties of love, trust, and humility outrank outer ones.","who":["Bahya ibn Paquda (c. 1080)"],"f":"F2"},{"t":"Musar movement","s":"Ethical self-scrutiny and habit are the heart of piety.","who":["Israel Salanter (c. 1850)","Moshe Chaim Luzzatto (1740)"],"f":"F2"},{"t":"Kabbalistic tikkun","s":"Human acts repair the cosmos; every commandment mends a fracture.","who":["Isaac Luria (c. 1570)","Zohar (c. 1290)","Hasidic masters"],"f":"F3"},{"t":"Ethical monotheism","s":"Judaism’s essence is the moral law of a single God.","who":["Hermann Cohen (1919)","Leo Baeck (1905)"],"f":"F2"},{"t":"Halakhic man","s":"Obedience to the law is itself the religious and moral life.","who":["Joseph Soloveitchik (1944)","Yeshayahu Leibowitz (1975)"],"f":"F2"},{"t":"Covenantal and dialogical ethics","s":"Ethics is response to God and neighbor in relation.","who":["Martin Buber (1923)","Franz Rosenzweig (1921)","David Hartman (1985)"],"f":"F2"},{"t":"Levinasian Judaism","s":"Ethics precedes ontology; the other’s face is the trace of God.","who":["Emmanuel Levinas (1961, 1963)"],"f":"F2"},{"t":"Heschel’s prophetic ethics","s":"God’s pathos for the wronged demands justice from us.","who":["Abraham Joshua Heschel (1962)"],"f":"F2"},{"t":"Noahide universalism","s":"The seven Noahide laws make a rational morality binding on all humanity.","who":["David Novak (1998)","Menachem Meiri (c. 1300)"],"f":"F2"}]},{"t":"Christian ethical schools","s":"How grace, law, love, and nature order right action.","who":["Augustine","Aquinas","Luther","Barth","Niebuhr"],"f":"F2","q":"Which school?","kids":[{"t":"Augustinian ethics","s":"Rightly ordered love of God above all; the two cities.","who":["Augustine (c. 400)","Oliver O’Donovan (1980)"],"f":"F2"},{"t":"Thomist ethics","s":"Natural law plus infused virtue toward beatitude.","who":["Aquinas (1270)","Servais Pinckaers (1985)"],"f":"F2"},{"t":"Lutheran two kingdoms","s":"Faith alone justifies; works serve the neighbor in the world under law.","who":["Martin Luther (1520)","Helmut Thielicke (1951)"],"f":"F2"},{"t":"Reformed ethics","s":"God’s sovereignty and law govern all of life.","who":["John Calvin (1559)","Abraham Kuyper (1898)","Nicholas Wolterstorff (2008)"],"f":"F2"},{"t":"Agape ethics","s":"Neighbor-love is the single Christian norm.","who":["Anders Nygren (1930)","Paul Ramsey (1950)","Gene Outka (1972)","Søren Kierkegaard (1847)"],"f":"F2"},{"t":"Anabaptist pacifism","s":"Follow Jesus’s nonviolence as the church’s politics.","who":["Menno Simons (c. 1540)","John Howard Yoder (1972)","Stanley Hauerwas (1983)"],"f":"F2"},{"t":"Christian realism","s":"Sin limits politics; love needs justice and sometimes force.","who":["Reinhold Niebuhr (1932)"],"f":"F2"},{"t":"Barthian command","s":"Ethics is hearing God’s concrete command in Christ.","who":["Karl Barth (1932–67)","Dietrich Bonhoeffer (1949)"],"f":"F2"},{"t":"Catholic social teaching","s":"Human dignity, common good, subsidiarity, solidarity.","who":["Leo XIII (1891)","John Paul II (1991)","Francis (2015)"],"f":"F2"},{"t":"Liberation theology","s":"God sides with the poor; praxis for liberation is the test of faith.","who":["Gustavo Gutiérrez (1971)","Leonardo Boff (1978)","James Cone (1970)"],"f":"F2"},{"t":"Situation ethics","s":"Love decides each case; rules are guides only.","who":["Joseph Fletcher (1966)"],"f":"F2"},{"t":"Orthodox theosis","s":"Ethi
